<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>대장님 대화술</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1ede3; --card:#fffdf8; --ink:#1d2a2e; --sub:#5b6a6e; --line:#e3ddcf;
  --acc:#0b5563; --acc-soft:#dcebee; --acc-ink:#ffffff;
  --tip:#a85a08; --tip-soft:#fcefd9; --warn:#9a3412; --warn-soft:#fae8df;
  --ts:#8a969a; --shadow:0 6px 24px rgba(20,40,45,.10); --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --card:#1a2326; --ink:#e7ecec; --sub:#9fb0b4; --line:#2a3639;
    --acc:#6fc3d1; --acc-soft:#1e3a40; --acc-ink:#0c1a1d;
    --tip:#f0b25f; --tip-soft:#33291a; --warn:#f0997a; --warn-soft:#33201a;
    --ts:#78888c; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --card:#1a2326; --ink:#e7ecec; --sub:#9fb0b4; --line:#2a3639;
  --acc:#6fc3d1; --acc-soft:#1e3a40; --acc-ink:#0c1a1d;
  --tip:#f0b25f; --tip-soft:#33291a; --warn:#f0997a; --warn-soft:#33201a;
  --ts:#78888c; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:var(--fs);line-height:1.75;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.cards-app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

/* 목차 */
#home{overflow-y:auto;height:100%;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
.toplinks{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px 4px}
.toplinks a{font-size:13.5px;font-weight:700;text-decoration:none;color:var(--acc);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px}
.hero{padding:18px 4px 20px}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--acc);font-weight:700}
.hero h1{margin:6px 0 8px;font-size:38px;line-height:1.15;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--sub);font-size:15px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:6px 0 14px;padding:14px 16px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:14px;font-weight:700;text-align:left}
.resume small{display:block;font-weight:400;opacity:.85}
.intro{display:block;width:100%;margin:0 0 14px;padding:11px 14px;background:transparent;border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px;text-align:left}
.tile{display:flex;gap:14px;width:100%;margin:0 0 10px;padding:14px 14px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.tile:active{transform:scale(.99)}
.tile .no{flex:0 0 44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:900;font-size:18px}
.tile .tx{min-width:0;flex:1}
.tile b{display:block;font-size:17px;line-height:1.35}
.tile .s{display:block;color:var(--sub);font-size:13.5px;line-height:1.5;margin-top:2px}
.tile .m{display:block;color:var(--ts);font-size:12.5px;margin-top:6px}
.foot{margin:22px 4px 0;color:var(--sub);font-size:13px;line-height:1.7}

/* 본문 */
#deck{display:none;height:100%;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:5;background:var(--bg)}
.bar .back{border:0;background:transparent;padding:8px 10px;border-radius:10px;font-weight:700;color:var(--acc)}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:15px;text-align:center}
.bar .fs,.bar .lstb{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;font-weight:700}
.bar .fs{width:36px}.bar .lstb{padding:0 12px;font-size:13.5px}
.chnav{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:2px 12px 9px}
.chnav button{height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:700;color:var(--acc);padding:0}
.chnav button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.prog{height:3px;background:var(--line);margin:0 12px;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#stage{flex:1;overflow-y:auto;padding:14px 14px 18px;-webkit-overflow-scrolling:touch}
.page{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 18px 8px;box-shadow:var(--shadow)}
.chhead{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.chhead .no{font-size:13px;letter-spacing:.2em;color:var(--acc);font-weight:900}
.chhead h1{margin:6px 0 10px;font-size:28px;line-height:1.3;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.seg{padding:24px 0 26px;border-bottom:1px solid var(--line);scroll-margin-top:8px}
.seg:last-child{border-bottom:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--acc);color:var(--acc-ink);line-height:1}
.badge.k{background:var(--sub)}
.seg h2{margin:2px 0 14px;font-size:20px;line-height:1.45;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.page p{margin:0 0 .95em}
.page p.em{font-weight:700}
.page h4.lb{margin:22px 0 8px;font-size:12.5px;letter-spacing:.1em;color:var(--acc);font-weight:700}
.page h4.lb:first-child{margin-top:0}
.page ul{margin:0 0 1em;padding-left:1.2em}.page li{margin:0 0 .45em}
.page hr{display:none}
.talk{margin:4px 0 16px;padding:12px 14px;background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:4px 14px 14px 4px}
.talk p{margin:0 0 .4em}
.talk p.spk{margin:.7em 0 0;font-size:12.5px;font-weight:700;color:var(--acc)}
.talk p.spk:first-child{margin-top:0}
.talk p.qt{font-weight:500}
p.qt{font-weight:500}
p.spk{font-size:12.5px;font-weight:700;color:var(--acc);margin:.7em 0 0}
.tbl{overflow-x:auto;margin:10px 0 18px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:700;border-bottom:2px solid var(--line);padding:8px 10px}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
td:first-child{font-weight:700;white-space:nowrap}
.howto{padding:12px 14px;border-radius:12px;background:var(--tip-soft);font-size:14.5px;margin:0 0 16px}
.docsub{color:var(--sub)}
.endnav{display:flex;gap:10px;padding:18px 0 12px}
.endnav button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.endnav .nx{flex:1.7;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);padding:8px 12px;line-height:1.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:720px;max-height:78dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 8px 10px;font-size:15px}
.sheet button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:11px 10px;border:0;border-bottom:1px solid var(--line);background:transparent}
.sheet .k{flex:0 0 auto;font-size:11.5px;color:var(--acc);font-weight:700}
.sheet .tt{flex:1;min-width:0;font-size:14.5px;line-height:1.45}
@media (min-width:760px){ body{font-size:17px} }
.grp{margin:22px 4px 10px;font-size:13px;letter-spacing:.08em;color:var(--sub);font-weight:700}
.grp small{display:block;letter-spacing:0;font-weight:400;font-size:12.5px;margin-top:2px}
.tile .no.sym{font-size:20px}
.talk p b{color:var(--acc);margin-right:6px;font-size:.86em}
.talk p.pun{font-weight:700}
.page .note{font-size:.92em;color:var(--sub)}
.page .src{font-size:12.5px;color:var(--ts);margin:8px 0 0}
.page .src a,.page .lk a{font-weight:700;text-decoration:none}
.page video{display:block;width:100%;max-height:62vh;background:#000;border-radius:14px;margin:4px 0 6px}
.me label{display:block;font-size:13.5px;font-weight:700;color:var(--sub);margin:0 0 10px}
.me textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;line-height:1.5;padding:8px 10px;resize:vertical}
.copyme{display:block;width:100%;margin:14px 0 0;padding:11px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;color:var(--acc)}
.chnav.g8{grid-template-columns:repeat(8,1fr)}
/* 다글로식 실제 음성 (강의실 BMW 화면과 같은 모양) */
.dg{border:1px solid #2a2e34;border-radius:14px;background:#17191d;margin:8px 0 18px;overflow:hidden}
.dg-top{padding:12px 16px 9px;border-bottom:1px solid #2a2e34;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.dg-q{font-size:15px;font-weight:700;color:#e8eaed}
.dg-s{font-size:12.5px;color:#8f96a0}
.dg-body{max-height:min(520px,62vh);overflow-y:auto;padding:4px 0;position:relative}
.dg-turn{display:grid;grid-template-columns:30px 1fr;gap:0 10px;padding:8px 16px 4px}
.dg-av{width:28px;height:28px;border-radius:50%;position:relative;overflow:hidden;display:block}
.dg-av::before{content:"";position:absolute;left:50%;top:24%;width:36%;height:36%;margin-left:-18%;border-radius:50%;background:#fff;opacity:.92}
.dg-av::after{content:"";position:absolute;left:50%;bottom:-22%;width:76%;height:52%;margin-left:-38%;border-radius:50%;background:#fff;opacity:.92}
.dg-who{display:flex;align-items:baseline;gap:8px}
.dg-who b{font-size:13.5px;color:#e8eaed}
.dg-who time{font-size:12px;color:#8f96a0;font-variant-numeric:tabular-nums}
.dg-tx{font-size:15px;line-height:1.7;color:#cfd3d8;word-break:keep-all}
.dg-tx span{cursor:pointer;border-radius:4px}
.dg-tx span:hover{background:#262a30}
.dg-tx span.on{background:#3d3514;color:#fff}
.dg-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #2a2e34;background:#141619}
.dg-play{width:42px;height:42px;border-radius:50%;border:0;background:#7c5cf0;color:#fff;font-size:15px;flex:none}
.dg-seek{position:relative;flex:1;height:24px;cursor:pointer}
.dg-rail{position:absolute;left:0;right:0;top:10px;height:4px;background:#2a2e34;border-radius:2px}
.dg-fill{position:absolute;left:0;top:10px;height:4px;background:#a78bfa;border-radius:2px;width:0}
.dg-t{font-size:12.5px;color:#8f96a0;font-variant-numeric:tabular-nums;min-width:76px;text-align:right}
.dg-sp{border:1px solid #2a2e34;background:none;border-radius:8px;padding:4px 8px;font-size:12.5px;color:#cfd3d8}
.dg-more{border:0;background:none;color:#8f96a0;font-size:12px;padding:0 16px 10px;display:block;text-align:left;width:100%}
.dg.fold .dg-body{display:none}
.dg-back{display:none;width:100%;border:0;border-top:1px solid #2a2e34;background:#1f1b33;color:#cbbcff;font-size:13px;padding:8px}
.dg.free .dg-back{display:block}
.dg.fold .dg-back{display:none!important}


.dg{margin:8px 0 18px}
</style>
</head>

    <main id="stage"></main>
  </section>
</div>
<div class="sheet" id="sheet"><div class="box" id="sbox"></div></div>
<script>
const W = {"parts": [{"key": "intro", "group": "intro", "no": "", "title": "이 공부를 읽는 법", "meta": "", "lead": "\n<p class=\"docsub\">2026년 11월 3일 — 탁재훈론 실전 분석 및 위트·유머 복기<\/p>\n<div class=\"howto\">장면마다 <b>그날 실제 녹음<\/b>(__N__곳)을 붙였습니다. ▶ 를 누르면 그 장면만 들리고, 받아쓰기 문장을 누르면 그 부분부터 재생됩니다. 받아쓰기는 자동이라 화자·글자가 일부 틀릴 수 있습니다.<\/div>\n<p class=\"spk\">연구 목적<\/p>\n<p>대장님이 실제 대화에서 사용하는 위트와 유머를 기술적으로 분해하고, 그 구조를 익혀 나의 경직된 대화 태도를 개선하기 위한 공부 자료.<\/p>\n<p class=\"spk\">원본 대화록<\/p>\n<p><a href=\"https://okhyun304-dot.github.io/talk-261103/\" target=\"_blank\" rel=\"noopener\">https://okhyun304-dot.github.io/talk-261103/<\/a><\/p>\n<ul><li>날짜: 2026년 11월 3일<\/li><li>참석: 대장님, 오키님, 구슬님, 호나인님<\/li><li>분석 대상: 잠원동에서 시작해 엉클조, 덴큐 오뎅바, 밤길까지 이어진 6구간<\/li><li>원문은 자동 전사이므로 일부 대사와 화자 구분이 부정확할 수 있음<\/li><li>시간은 각 녹음 파일의 재생 위치를 기준으로 표기<\/li><\/ul>\n\n", "segs": []}, {"key": "t①", "group": "tech", "no": "①", "title": "소리 비틀기", "sub": "비슷한 소리의 다른 말로 받는다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t①-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>소리 비틀기가 가장 세게 터지는 때는 상대가 앞에서 한 말과 지금 한 말이 겹칠 때입니다. 노빠꾸탁재훈에서 게스트가 이상형을 &#x27;배울 점이 있고 존경할 수 있는 사람&#x27;이라고 모범답안을 냅니다. 탁재훈은 먼저 &quot;이거 내가 30년 전에 다 썼던 멘트를 그대로 쓰네.&quot;로 의심을 깔아 두고, 구체적으로 어떤 스타일이냐고 다시 묻습니다.<\/p><div class=\"talk\"><p><b><\/b>배우분으로 따지자면<\/p><p class=\"pun\"><b><\/b>배우를 좋아하네!<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/b59b3ab0bd9b.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/05_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_408.mp4\"><\/video><p class=\"src\">노빠꾸45분 06:48-07:17 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c2\" target=\"_blank\" rel=\"noopener\">탁재훈론 2장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/①\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 5개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t①-real", "badge": "현실 · 대장님", "title": "② 엉클조, 둘이서", "html": "<div class=\"talk\"> 때 네가 오면 이게 뭐, 커플이야 뭐야?<\/p><\/div><div class=\"dgslot\" data-c=\"c08\"><\/div><p class=\"lk\"><a href=\"#scene-6\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "t②-diff", "badge": "비교", "title": "방송과 현실의 차이", "html": "<p>구조는 같습니다. 대장님은 여기에 앞에서 나온 &#x27;가지&#x27;를 다시 불러와 콜백까지 겹쳤습니다.<\/p>"}, {"id": "t②-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk②.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk②.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk②.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk②.said", "상대의 직전 말"], ["sk②.mine", "내가 한 말 / 할 수 있었던 말"], ["sk②.next", "다음에 해 볼 것"]]}, {"key": "t③", "group": "tech", "no": "③", "title": "단정하고 한 번 더 묻기", "sub": "말하지 않은 빈칸을 엉뚱하게 단정하고, 세부를 하나 더 묻는다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t③-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>지침의 대표 예시가 이 장면입니다. 중국어를 하는 게스트와 얘기하는데 누군가 자기도 중국어를 좀 한다고 끼어듭니다.<\/p><div class=\"talk\"><p><b><\/b>저도 사실 중국어를 조금 할 줄 알거든요<\/p><p><b><\/b>아 중국집에 있었어요?<\/p><p><b><\/b>주방?<\/p><p><b><\/b>주방이야 홀이야<\/p><p><b><\/b>느낌이 아예 다른데?<\/p><p><b><\/b>이거는 뭐 딜러 때인가요?<\/p><p><b><\/b>자동차 딜러들 어디 계셨어요?<\/p><p class=\"pun\"><b><\/b>어느 매장에 계신 거예요?<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/6fec63e506f0.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/11_%EC%87%BC%EC%B8%A0TOP5_1.mp4\"><\/video><p class=\"src\">쇼츠TOP5 00:01-00:13,00:51-01:04 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c3\" target=\"_blank\" rel=\"noopener\">탁재훈론 3장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/③\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 11개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t③-real", "badge": "현실 · 대장님", "title": "④ 엉클조 후반", "html": "<p class=\"note\">엔딩 포즈 장면 안의 한 대목<\/p><div class=\"talk\"><p><b>대장님<\/b>왜 소녀처럼 먹지?<\/p><p class=\"pun\"><b>대장님<\/b>요새 춘천에서 이런 거 유행하나?<\/p><\/div><div class=\"dgslot\" data-c=\"c07\"><\/div><p class=\"lk\"><a href=\"#scene-5\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "t③-diff", "badge": "비교", "title": "방송과 현실의 차이", "html": "<p>방송은 질문을 두 번 이어 붙여 키웁니다. 대장님은 한 번 묻고, 나머지는 다른 참석자들이 받아서 키웠습니다.<\/p>"}, {"id": "t③-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk③.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk③.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk③.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk③.said", "상대의 직전 말"], ["sk③.mine", "내가 한 말 / 할 수 있었던 말"], ["sk③.next", "다음에 해 볼 것"]]}, {"key": "t④", "group": "tech", "no": "④", "title": "되물어 공 넘기기", "sub": "바로 대답하지 않고 가장 구체적인 부분을 되물어 주도권을 가져온다.", "meta": "방송 · 나 (대장님 장면 찾는 중)", "lead": "", "segs": [{"id": "t④-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>곤란한 양자택일에도 되묻기가 통합니다. 미운 우리 새끼에서 한 멤버가 탁재훈에게 이런 질문을 냅니다. 자기가 죽어야 천억이 생긴다면 자기를 살리겠냐 죽이겠냐는 것입니다.<\/p><div class=\"talk\"><p><b><\/b>그러면 나를 살리겠어, 죽이겠어?<\/p><p><b><\/b>더 살고 싶어?<\/p><p><b><\/b>가서 또 한 번 할 거야. 확인을 할 거야, 정말 진짜 죽었나.<\/p><p class=\"pun\"><b><\/b>너 살아 있어봐야 또 빚이야.<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/1a8f9cebe930.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/14_%EB%AF%B8%EC%9A%B0%EC%83%882022_667.mp4\"><\/video><p class=\"src\">미우새2022 11:07-11:47 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c3\" target=\"_blank\" rel=\"noopener\">탁재훈론 3장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/④\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 5개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t④-real", "badge": "현실 · 대장님", "title": "", "html": "<p>11월 3일 녹음에서는 아직 이 기술을 쓴 장면을 찾지 못했습니다.<\/p><p class=\"note\">다음 만남에서 누가 이 기술을 쓰면 아래 「나」 칸에 적어 두세요. 빈칸이 공부 거리입니다.<\/p>"}, {"id": "t④-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk④.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk④.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk④.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk④.said", "상대의 직전 말"], ["sk④.mine", "내가 한 말 / 할 수 있었던 말"], ["sk④.next", "다음에 해 볼 것"]]}, {"key": "t⑤", "group": "tech", "no": "⑤", "title": "설정 올라타기", "sub": "상대 말을 사실로 받아 그 설정의 언어로 말한다. 설정을 직접 만들 수도 있다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑤-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>설정은 내가 만들 수도 있습니다. 자숙 복귀 회차에서 멤버가 예전의 행복으로 돌아가고 싶지 않냐고 묻습니다. 감성적인 질문입니다.<\/p><div class=\"talk\"><p><b><\/b>다시 돌아가고 싶진 않아?<\/p><p><b><\/b>어디를?<\/p><p><b><\/b>전의 행복으로.<\/p><p><b><\/b>아니, 돌아가기 쉽지는 않아.<\/p><p><b><\/b>잘못 돌아가서 2년 전으로 돌아가면 안 돼.<\/p><p><b><\/b>타임머신 보면 가끔가다 잘못 내리잖아.<\/p><p class=\"pun\"><b><\/b>그냥 잘못 내려서 서초동에 내리면 안 돼?<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/548d1123906e.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/16_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_676.mp4\"><\/video><p class=\"src\">아형복귀 11:16-11:38 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c4\" target=\"_blank\" rel=\"noopener\">탁재훈론 4장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑤\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 8개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t⑤-real", "badge": "현실 · 대장님", "title": "⑤ 덴큐로, 덴큐 오뎅바", "html": "<div class=\"talk\"><p><b>대장님<\/b>여기는 오뎅이랑 술 안 먹으면 죽여버려요.<\/p><p class=\"pun\"><b>대장님<\/b>무조건 오뎅이랑 관련된 얘기를 해야 돼.<\/p><p><b>오키<\/b>오뎅 얘기로 연결해서 하겠군.<\/p><\/div><div class=\"dgslot\" data-c=\"c17\"><\/div><p class=\"lk\"><a href=\"#scene-10\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "t⑤-diff", "badge": "비교", "title": "방송과 현실의 차이", "html": "<p>방송은 설정이 미리 정해져 있습니다(경찰서, 학교). 술자리에서는 대장님이 그 자리에서 규칙을 만들고, 다른 사람이 따라 들어왔습니다.<\/p>"}, {"id": "t⑤-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑤.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑤.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑤.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑤.said", "상대의 직전 말"], ["sk⑤.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑤.next", "다음에 해 볼 것"]]}, {"key": "t⑥", "group": "tech", "no": "⑥", "title": "끝까지 부풀리기", "sub": "사실로 받은 뒤 한 단계씩 키운다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑥-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>칭찬도 부풀릴 수 있습니다. 미운 우리 새끼에서 체형 비율을 재는데 팔이 길다는 결과가 나옵니다.<\/p><div class=\"talk\"><p><b><\/b>팔이 긴, 길어요 다른 분들보다 많이 길어요<\/p><p><b><\/b>저는 여기서 사실 여기서 저기서 전화가 오잖아요 저것도 받을 수 있어요.<\/p><p><b><\/b>다리는 평균이에요.<\/p><p class=\"pun\"><b><\/b>길진 않나요?<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/4b82ade4513a.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/18_%EB%AF%B8%EC%9A%B0%EC%83%882023_24.mp4\"><\/video><p class=\"src\">미우새2023 00:24-00:53 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c4\" target=\"_blank\" rel=\"noopener\">탁재훈론 4장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑥\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 11개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t⑥-real", "badge": "현실 · 대장님", "title": "③ 엉클조, 일행 합류", "html": "<div class=\"talk\"><p><b>참석자<\/b>집에 고기가 있어가지고 삼겹살 좀 먹고.<\/p><p class=\"pun\"><b>대장님<\/b>부자네, 부자. 집에 삼겹살도 있고.<\/p><\/div><div class=\"dgslot\" data-c=\"c06\"><\/div><p class=\"lk\"><a href=\"#scene-4\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "t⑥-diff", "badge": "비교", "title": "방송과 현실의 차이", "html": "<p>탁재훈은 몸의 특징을, 대장님은 사소한 일상을 키웠습니다. 대장님 장면은 부풀린 뒤에도 원래 이야기(삼겹살 원산지)가 끊기지 않았습니다.<\/p>"}, {"id": "t⑥-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑥.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑥.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑥.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑥.said", "상대의 직전 말"], ["sk⑥.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑥.next", "다음에 해 볼 것"]]}, {"key": "t⑦", "group": "tech", "no": "⑦", "title": "틀 깨기", "sub": "질문의 전제를 문제 삼거나, 길게 쌓은 논리에 가장 당연한 한 문장을 댄다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑦-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>틀 깨기의 가장 짧은 형태는 길게 쌓은 논리에 가장 당연한 한 문장을 대는 것입니다. 제주도에 집을 두고 서울에서 일하는 탁재훈에게 한 출연자가 예능도 지역 주민 우선 채용을 해야 한다며 길게 논리를 폅니다.<\/p><div class=\"talk\"><p><b><\/b>아니, 돈은 서울에서 다 벌고 세금은 제주도에서 낸다? 이거는.<\/p><p class=\"pun\"><b><\/b>같은 나라잖아요.<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/3009a8bb585a.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/22_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_2139.mp4\"><\/video><p class=\"src\">아형모음 35:39-36:12 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">탁재훈론 5장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑦\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 11개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t⑦-real", "badge": "현실 · 대장님", "title": "② 엉클조, 둘이서", "html": "<div class=\"talk\"><p><b>오키<\/b>아니요, 저 원주 아니고 춘천입니다.<\/p><p class=\"pun\"><b>대장님<\/b>서울 사람이 뭐, 괜히 어쩌라고 그러지. 다 강원도잖아. 감자잖아.<\/p><\/div><div class=\"dgslot\" data-c=\"c05\"><\/div><p class=\"lk\"><a href=\"#scene-3\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "t⑦-diff", "badge": "비교", "title": "방송과 현실의 차이", "html": "<p>&quot;같은 나라잖아요&quot;와 &quot;다 강원도잖아&quot;는 거의 같은 문장입니다. 대장님은 대전·대구 이야기에서는 차이를 인정하며 한 발 물러났습니다.<\/p>"}, {"id": "t⑦-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑦.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑦.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑦.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑦.said", "상대의 직전 말"], ["sk⑦.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑦.next", "다음에 해 볼 것"]]}, {"key": "t⑧", "group": "tech", "no": "⑧", "title": "판 밖 재료", "sub": "주어진 선택지 안에 답이 없으면 밖에서 재료를 가져온다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑧-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>대장님이 말한 호롱불이 이것입니다. 주어진 선택지 안에 답이 없으면 선택지 밖을 봅니다. 미운 우리 새끼의 이구동성 게임에서 &#x27;네 글자 여자 아이돌 그룹&#x27;이 제시어로 나오는데 탁재훈은 아는 이름이 없습니다.<\/p><div class=\"talk\"><p><b><\/b>네 글자 여자아이돌그룹 … 아 나는 몰라 형 형 그거 있잖아 오마이줄리아<\/p><p class=\"pun\"><b><\/b>오마이 줄리아 빨리 틀어.<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/ae36a905bd7b.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/23_%EB%AF%B8%EC%9A%B0%EC%83%882023_326.mp4\"><\/video><p class=\"src\">미우새2023 05:26-06:06 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">탁재훈론 5장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑧\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 3개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t⑧-real", "badge": "현실 · 대장님", "title": "④ 엉클조 후반", "html": "<div class=\"talk\"><p><b>대장님<\/b>왜 소녀처럼 먹지?<\/p><p><b>다른 참석자<\/b>혼자 막 엔딩 포즈 이런 거.<\/p><p class=\"pun\"><b>대장님<\/b>혼자 갑자기... 엔딩 포즈 하는 것처럼.<\/p><\/div><div class=\"dgslot\" data-c=\"c07\"><\/div><p class=\"lk\"><a href=\"#scene-5\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "t⑧-diff", "badge": "비교", "title": "방송과 현실의 차이", "html": "<p>탁재훈은 답을 모를 때 밖을 봤고, 대장님은 눈앞의 표정을 보고 방송 장면을 가져왔습니다. 대장님 장면은 다른 사람이 &#x27;엔딩 포즈&#x27;를 보태며 완성됐습니다.<\/p>"}, {"id": "t⑧-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑧.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑧.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑧.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑧.said", "상대의 직전 말"], ["sk⑧.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑧.next", "다음에 해 볼 것"]]}, {"key": "t⑨", "group": "tech", "no": "⑨", "title": "같은 틀로 돌려주기", "sub": "상대가 쓴 문장의 틀을 그대로 써서 되돌려 준다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑨-tv", "badge": "방송 · 탁재훈", "title": "", "html": "<p>상대가 쓴 문장의 틀을 그대로 써서 되돌려 주는 기술입니다. 노빠꾸탁재훈에서 조사할 게 없으니 가도 된다는데 게스트가 일어나지 않고 생색을 냅니다.<\/p><div class=\"talk\"><p><b><\/b>하도 나와달라 나와달라고 해서 나왔지.<\/p><p><b><\/b>나와달라나와달라?<\/p><p class=\"pun\"><b><\/b>지금은 제발 가달라 가달라고 하는데 왜 앉아있는 거예요?<\/p><\/div><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/27ee2734fe96.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/24_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_2562.mp4\"><\/video><p class=\"src\">노빠꾸45분 42:42-43:14 · <a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">탁재훈론 5장 ↗<\/a><\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑨\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 7개 직접 풀어 보기 ↗<\/a><\/p>"}, {"id": "t⑨-real", "badge": "현실 · 대장님", "title": "④ 엉클조 후반", "html": "<div class=\"talk\"><p><b>오키<\/b>가지 아닙니다.<\/p><p><b>대장님<\/b>그 자체가 네가 가지라는 거야.<\/p><p class=\"pun\"><b>대장님<\/b>넌 지금 가지란 프레임에 빠졌어.<\/p><\/div><div class=\"dgslot\" data-c=\"c10\"><\/div><p class=\"lk\"><a href=\"#sce : "대장님 녹음 · 나", "lead": "", "segs": [{"id": "tB-real", "badge": "현실 · 대장님", "title": "⑤ 덴큐 오뎅바", "html": "<div class=\"talk\"><p><b>대장님<\/b>왜냐면 나는 먹어도 돼.<\/p><p><b>오키<\/b>왜요, 왜요?<\/p><p><b>다른 참석자<\/b>나니까.<\/p><p class=\"pun\"><b>대장님<\/b>나니까.<\/p><\/div><div class=\"dgslot\" data-c=\"c18\"><\/div><p class=\"lk\"><a href=\"#scene-11\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "tB-diff", "badge": "비교", "title": "방송에서 안 보이는 이유", "html": "<p>주인공 한 명이 웃기는 방송 편집에서는 잘려 나가기 쉬운 장면입니다.<\/p>"}, {"id": "tB-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"ownB.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"ownB.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"ownB.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["ownB.said", "상대의 직전 말"], ["ownB.mine", "내가 한 말 / 할 수 있었던 말"], ["ownB.next", "다음에 해 볼 것"]]}, {"key": "tC", "group": "own", "no": "C", "title": "발언권 분배", "sub": "말수를 줄이고 질문을 다른 사람에게 돌린다.", "meta": "대장님 녹음 · 나", "lead": "", "segs": [{"id": "tC-real", "badge": "현실 · 대장님", "title": "⑤ 덴큐 오뎅바", "html": "<div class=\"talk\"><p><b>대장님<\/b>이걸 돌려 돌려요.<\/p><p><b>오키<\/b>질문을 돌려요.<\/p><p class=\"pun\"><b>대장님<\/b>왜냐면 그게 되게 좋아.<\/p><\/div><div class=\"dgslot\" data-c=\"c20\"><\/div><p class=\"lk\"><a href=\"#scene-13\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "tC-diff", "badge": "비교", "title": "방송에서 안 보이는 이유", "html": "<p>방송은 말하는 장면만 남습니다. 술자리에서는 말을 넘기는 것도 기술입니다.<\/p>"}, {"id": "tC-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"ownC.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"ownC.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"ownC.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["ownC.said", "상대의 직전 말"], ["ownC.mine", "내가 한 말 / 할 수 있었던 말"], ["ownC.next", "다음에 해 볼 것"]]}, {"key": "tD", "group": "own", "no": "D", "title": "상대 읽기", "sub": "그 사람의 고민·불안·결핍을 알고, 사람마다 농담을 고른다.", "meta": "대장님 녹음 · 나", "lead": "", "segs": [{"id": "tD-real", "badge": "현실 · 대장님", "title": "④ 엉클조 후반", "html": "<div class=\"talk\"><p class=\"pun\"><b>대장님<\/b>그 사람이 갖고 있는 가장 고민과 불안과 결핍을 알고 있어야 되고, 그럼 그거를 역으로 뒤집어야 되는 거야.<\/p><\/div><div class=\"dgslot\" data-c=\"c01\"><\/div><p class=\"lk\"><a href=\"#p2\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "tD-diff", "badge": "비교", "title": "방송에서 안 보이는 이유", "html": "<p>모든 기술 앞에 오는 판단입니다. 같은 농담을 은호님 앞에서는 안 했을 거라는 말과 이어집니다.<\/p>"}, {"id": "tD-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"ownD.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"ownD.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"ownD.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["ownD.said", "상대의 직전 말"], ["ownD.mine", "내가 한 말 / 할 수 있었던 말"], ["ownD.next", "다음에 해 볼 것"]]}, {"key": "p1", "group": "study", "no": "1", "title": "대장님의 대화 방식을 공부해야 하는 이유", "meta": "1꼭지", "lead": "\n<p>탁재훈론을 공부하면서 알게 된 것은 위트가 단순한 말재주가 아니라는 점이다.<\/p>\n<p>상대가 어떤 말을 했는지 듣고, 그 말에 숨어 있는 다른 의미를 찾아낸다.<\/p>\n<p>상대의 표정이나 행동을 관찰해 다른 장면으로 연결하기도 한다.<\/p>\n<p>하나의 소재로 농담을 만들고, 시간이 지나 그 소재를 다시 불러오기도 한다.<\/p>\n<p>그리고 중요한 것은 이런 농담이 통하는 상대와 상황을 구분하는 능력이다.<\/p>\n<p>이번 대화록은 탁재훈론을 실제 대화에 적용해 공부하기에 적합한 자료다.<\/p>\n<p>탁재훈은 방송에서 위트를 사용하는 사람이다. 반면 대장님은 내가 직접 참여한 현실의 대화에서 위트를 사용하고 있다.<\/p>\n<p>그래서 이번에는 대장님의 말뿐 아니라 그 말을 듣는 나의 반응, 다른 참석자의 반응, 농담이 끝난 뒤 대화가 어떻게 이어지는지까지 관찰할 수 있다.<\/p>\n<p>특히 중요한 것은 <b>웃긴 말 하나를 잘하는 것과 여러 사람이 함께 대화할 수 있는 분위기를 만드는 것은 다른 능력<\/b>이라는 사실이다.<\/p>\n<p>이번 대화에서 대장님은 둘 다 보여주셨다.<\/p>\n", "segs": [{"id": "s20", "badge": "", "title": "공부할 세 가지 영역", "html": "\n<p class=\"spk\">① 위트<\/p>\n<p>상대의 말이나 상황을 빠르게 재해석해 예상 밖의 반응을 만들어내는 기술.<\/p>\n<p class=\"spk\">② 유머·코미디<\/p>\n<p>비유, 과장, 상상, 상황극, 반복 등을 이용해 웃음이 나올 만한 장면을 설계하는 기술.<\/p>\n<p class=\"spk\">③ 대화 운영<\/p>\n<p>사람들의 성향과 반응을 살피고, 어떤 말을 할지, 누구에게 말을 넘길지, 언제 농담을 멈출지 판단하는 기술.<\/p>\n<p>위트와 유머는 완전히 분리되는 개념은 아니다. 이 자료에서는 공부하기 쉽도록 각각의 작동 방식에 따라 구분한다.<\/p>\n\n"}]}, {"key": "p2", "group": "study", "no": "2", "title": "대장님이 직접 말씀하신 대화술의 원리", "meta": "2꼭지 · 녹음 2곳", "lead": "\n", "segs": [{"id": "s30", "badge": "1", "title": "상대의 고민과 불안, 결핍을 알아야 한다", "html": "\n<div class=\"dgslot\" data-c=\"c01\"><\/div>\n<p>대장님은 여러 사람이 있는 자리에서 누군가를 편하게 해주는 것도 기술이라고 설명하셨다.<\/p>\n<p>나는 대장님이 어떻게 그런 분위기를 만드는지 궁금했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;여성이 오는 게, 여성 자체도 어색하지 않게 해주는 게 또 기술이에요.&quot;<\/p>\n<p class=\"qt\">&quot;그게 중요해요.&quot;<\/p>\n<p class=\"spk\">참석자<\/p>\n<p class=\"qt\">&quot;어떻게 해요?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;저는 이런 걸 다 모니터링하잖아요.&quot;<\/p>\n<p class=\"qt\">&quot;다 편하게 말씀하시더라고요. 근데 아직까지 그게 파악이 안 돼요.&quot;<\/p>\n<p class=\"qt\">&quot;어떻게 해주시길래...&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그 사람이 갖고 있는 가장 고민과 불안과 결핍을 알고 있어야 되고, 그럼 그거를 역으로 뒤집어야 되는 거야.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;어느 타이밍이었지를 생각했는데 감이 안 잡혀요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그거는 순간에... 많이 있는 거지. 100% 이게 이래서 이렇게 됐다 설명하기는 어렵지.&quot;<\/p>\n<\/div><p>그리고 대장님은 구체적인 사례를 말씀하셨다.<\/p>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 가지 새끼 같은 얘기를 하잖아. 은호님 앞에서 안 했을 것 같아.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;아, 그때는 이런 거 없었어요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;왜냐면 은호님은 전혀 그걸 별로 안 좋아할 것 같은데.&quot;<\/p>\n<p class=\"qt\">&quot;그렇게 얘기했으면 좀 기분 나쁠 수도 있어.&quot;<\/p>\n<p class=\"qt\">&quot;사람마다 그걸 다 알아야지.&quot;<\/p>\n<p class=\"qt\">&quot;성별만 따지고는 간단하겠지만 아니지.&quot;<\/p>\n<\/div><h4 class=\"lb\">기술적 분석<\/h4>\n<p>대장님이 강조한 것은 웃긴 말을 아는 능력보다 먼저 상대를 이해하는 능력이었다.<\/p>\n<p>같은 농담도 누구에게 하느냐에 따라 완전히 다른 결과가 나올 수 있다.<\/p>\n<p>친밀감이 충분히 형성된 사람에게는 장난으로 받아들여질 말도, 처음 만난 사람에게는 무례하게 들릴 수 있다.<\/p>\n<p>또 어떤 사람은 과장된 농담을 좋아하고, 어떤 사람은 조용하고 진지한 대화를 더 편하게 느낀다.<\/p>\n<p>따라서 위트를 사용하기 전에 판단해야 할 것은 세 가지다.<\/p>\n<ul><li>이 사람은 어떤 성향과 경험을 가지고 있는가?<\/li><li>지금 어떤 감정 상태에 있는가?<\/li><li>이 말을 했을 때 상대가 편해질까, 불편해질까?<\/li><\/ul>\n<p>특히 은호님 앞에서는 같은 농담을 하지 않았을 것이라는 말씀이 중요하다.<\/p>\n<p>농담할 수 있는 능력과 <b>농담하지 않을 수 있는 판단력<\/b>이 함께 있어야 한다는 뜻이다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>상대를 웃기기 위해 무작정 기술을 꺼내는 것이 아니라, 먼저 상대가 어떤 사람인지 관찰해야 한다.<\/p>\n<p>그리고 상대의 불안이나 결핍을 이해했다면, 그것을 공격할 소재로 삼기보다 상대가 편안하게 말할 수 있는 방향으로 사용해야 한다.<\/p>\n\n"}, {"id": "s73", "badge": "2", "title": "생각다발이 많아야 즉각적인 반응이 가능하다", "html": "\n<div class=\"dgslot\" data-c=\"c02\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;판단이 빠른 사람이라는 거는 애초에 어떤 거를 판단할 때 그 생각을 빨리 떠올리는 능력이 아니야.&quot;<\/p>\n<p class=\"qt\">&quot;예전부터 많은 경험을 하면서 생각다발들이 많이 있어가지고 원래 있던 거를 그냥 꺼내오는 거에 가까운 거라는.&quot;<\/p>\n<p class=\"qt\">&quot;생각다발이 막 주머니가 많은데 주머니 예를 들어서 800개야.&quot;<\/p>\n<p class=\"qt\">&quot;얘기할 때 이 패턴 중에 뭐 하나 해서 그냥 하는 거지.&quot;<\/p>\n<p class=\"qt\">&quot;그래서 빠른 거지.&quot;<\/p>\n<\/div><h4 class=\"lb\">기술적 분석<\/h4>\n<p>대장님은 이것을 판단력에 대해 말씀하셨지만, 위트 공부에도 적용할 수 있다.<\/p>\n<p>순발력이 좋다는 것을 매번 완전히 새로운 생각을 만들어내는 능력으로만 볼 필요는 없다.<\/p>\n<p>과거에 본 장면, 들은 이야기, 사람들의 반응, 다양한 표현이 머릿속에 쌓여 있다면 현재 상황과 연결할 수 있는 재료가 많아진다.<\/p>\n<p>예를 들어 상대가 특이한 표정을 지었을 때 아이돌 엔딩 포즈를 떠올릴 수 있는 것도 관련된 장면을 알고 있기 때문이다.<\/p>\n<p>이렇게 보면 위트는 다음 구조로 나누어 공부할 수 있다.<\/p>\n<p class=\"em\">관찰 → 연상 → 선택 → 표현 → 반응 확인<\/p>\n<p>이는 실제 인간의 사고과정을 확정적으로 설명하는 공식이 아니라, 연습을 위해 만든 분석 틀이다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>탁재훈 영상을 보고 그 말을 외우는 것만으로는 부족하다.<\/p>\n<p>어떤 상황에서 어떤 방식의 반응을 할 수 있는지 사례를 쌓아야 한다.<\/p>\n<p>영화, 게임, 음악, 책, 실제 대화 등을 통해 다양한 장면과 표현을 알아두는 것도 중요하다.<\/p>\n\n"}]}, {"key": "p3", "group": "study", "no": "3", "title": "실제 위트 장면 분석", "meta": "장면 8개 · 녹음 8곳", "lead": "\n", "segs": [{"id": "scene-1", "badge": "장면 1", "title": "카스·테라를 카스테라로 받아버리다", "html": "\n<div class=\"dgslot\" data-c=\"c03\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님이 바이엔슈테판, 필스너 우르켈 같은 맥주를 설명하고 계셨다.<\/p>\n<p>나는 평소 비슷한 수입 맥주를 마셔본 경험이 많지 않았다.<\/p>\n<p>카스나 테라처럼 익숙한 맥주만 마셨다는 이야기를 하려던 상황이었다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;카스테라밖에 안 먹어가지고.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;카스테라는 빵 아니야?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;카스나 테라.&quot;<\/p>\n<\/div><p>이후 대장님은 다시 맥주 주문 이야기로 돌아가셨다.<\/p>\n<h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>내가 전달하려던 뜻은 카스와 테라였다.<\/p>\n<p>그런데 두 단어가 붙어 &#x27;카스테라&#x27;라는 하나의 단어처럼 들렸다.<\/p>\n<p>대장님은 이를 빵으로 받아들이셨다.<\/p>\n<p>&quot;카스랑 테라 말하는 거죠?&quot;라고 하면 원래 대화가 그대로 진행된다.<\/p>\n<p>반대로 &quot;카스테라는 빵 아니야?&quot;라고 하면 순간적으로 전혀 다른 의미가 생긴다.<\/p>\n<p>짧은 문장 하나로 예상하지 못한 반전이 만들어지는 것이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">소리 재분절 + 다의적 해석<\/p>\n<p>소리가 비슷하거나 이어지는 말을 다른 단어로 받아버리는 기술이다.<\/p>\n<h4 class=\"lb\">중요한 타이밍<\/h4>\n<p>농담을 길게 이어가지 않으셨다.<\/p>\n<p>한마디 던진 다음 다시 맥주 이야기로 돌아갔다.<\/p>\n<p>농담을 설명하지 않고 지나가는 것도 중요한 기술이다.<\/p>\n<h4 class=\"lb\">연습 방법<\/h4>\n<p>대화할 때 상대의 단어를 듣고 다음 가능성을 생각해본다.<\/p>\n<ul><li>두 단어를 붙이면 다른 단어가 되는가?<\/li><li>같은 발음에 다른 뜻이 있는가?<\/li><li>말을 다르게 끊으면 다른 장면이 떠오르는가?<\/li><\/ul>\n<p>억지로 웃기려고 하기보다 자연스럽게 떠오를 때 짧게 사용한다.<\/p>\n\n"}, {"id": "scene-2", "badge": "장면 2", "title": "평범한 설명을 상황극으로 바꾸다", "html": "\n<div class=\"dgslot\" data-c=\"c04\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님이 맥주 종류와 잔의 차이를 설명하고 계셨다.<\/p>\n<p>전문적으로 맥주를 다루는 식당과 일반 동네 맥줏집은 다르다는 설명이 이어졌다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;누가 일반 동네 맥줏집 가가지고 바이엔슈테판 헤페...&quot;<\/p>\n<p class=\"qt\">&quot;원조 어디 치킨집 가가지고 아버지가 하시잖아.&quot;<\/p>\n<p class=\"qt\">&quot;어떤 사람이 와가지고 바이엔슈테판 헤페 하나 주실래요?&quot;<\/p>\n<p class=\"qt\">&quot;그럼 싸대기 맞죠. 이거 나가라, 생맥이지.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>이건 상대의 말을 직접 받아친 장면은 아니다.<\/p>\n<p>설명 도중 대장님이 새로운 상황을 상상해서 만들어낸 것이다.<\/p>\n<p>동네 치킨집이라는 친숙한 장소에 고급 수입 맥주를 전문적으로 주문하는 손님을 등장시킨다.<\/p>\n<p>서로 어울리지 않는 두 세계가 충돌한다.<\/p>\n<p>거기에 사장님의 과장된 반응까지 붙였다.<\/p>\n<p>단순히 &quot;그런 주문을 하면 이상하겠죠&quot;라고 설명하는 것보다 훨씬 구체적인 장면이 된다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">상황의 부조화 + 상황극 + 과장<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>어떤 개념을 설명할 때 그 개념을 실제 인물과 장소가 있는 상황으로 바꿔볼 수 있다.<\/p>\n<p>특히 강의를 할 때 활용할 수 있겠다.<\/p>\n<p>다만 과격한 표현 자체를 따라 하기보다는 서로 맞지 않는 두 상황을 충돌시키는 구조를 익히는 것이 중요하다.<\/p>\n\n"}, {"id": "scene-3", "badge": "장면 3", "title": "상대가 중요하게 생각하는 차이를 일부러 뭉개버리다", "html": "\n<div class=\"dgslot\" data-c=\"c05\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>맥주 가격과 지역 이야기가 이어졌다.<\/p>\n<p>나는 춘천 이야기를 하면서 지역마다 서로 다르게 생각하는 부분이 있다는 점을 설명하려 했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;아니요, 저 원주 아니고 춘천입니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;제가 부산 사람한테 창원이라 그러면 &#x27;저 창원 아니고 부산이에요.&#x27;&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;서울 사람이 뭐, 괜히 어쩌라고 그러지. 다 강원도잖아. 감자잖아.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;창원이랑 부산이랑 뭐가 달라. 그냥 바다지, 회지.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;대전이랑 대구는 또 완전 다르죠.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;이건 좀 많이 다르긴 하지.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>상대는 지역의 차이를 중요하게 생각하고 있다.<\/p>\n<p>그런데 대장님은 그 구분을 일부러 무시한다.<\/p>\n<p>원주와 춘천의 차이를 설명하려는 사람에게 강원도는 다 감자라는 식으로 단순화하는 것이다.<\/p>\n<p>당연히 실제로 지역 차이가 없다는 뜻은 아니다.<\/p>\n<p>차이가 있다는 걸 알면서도 일부러 뭉개는 것이 장난의 구조다.<\/p>\n<p>이후 대전과 대구 이야기가 나오자 그 차이는 일부 인정하신다.<\/p>\n<p>즉, 하나의 입장을 완전히 고집하는 것이 아니라 대화가 이어지도록 조금씩 움직이는 것이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">의도적 단순화 + 과장 + 선택적 양보<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>상대가 굉장히 중요하게 생각하는 차이를 일부러 하나로 묶었을 때 예상 밖의 반응을 만들 수 있다.<\/p>\n<p>하지만 실제로 상대가 중요하게 여기는 정체성을 비하하면 불편함을 줄 수 있다.<\/p>\n<p>따라서 친밀감과 상황을 판단해서 사용해야 한다.<\/p>\n\n"}, {"id": "scene-4", "badge": "장면 4", "title": "평범한 사실을 과장된 칭찬으로 바꾸다", "html": "\n<div class=\"dgslot\" data-c=\"c06\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>점심에 무엇을 먹었는지 이야기하던 중 한 참석자가 집에 있던 삼겹살을 먹었다고 했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">참석자<\/p>\n<p class=\"qt\">&quot;집에 고기가 있어가지고 삼겹살 좀 먹고.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;부자네, 부자. 집에 삼겹살도 있고.&quot;<\/p>\n<\/div><p>이후 삼겹살의 원산지와 고기를 고르는 방법에 대한 이야기가 이어졌다.<\/p>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그러니까 그게 부자지. 고기로 배를 채운다는 거 있잖아.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>집에 삼겹살이 있다는 것은 특별한 이야기가 아닐 수 있다.<\/p>\n<p>그런데 대장님은 그것을 부자의 증거처럼 과장해서 받아들이셨다.<\/p>\n<p>평범한 사실을 필요 이상으로 대단하게 평가하는 것이다.<\/p>\n<p>흥미로운 점은 과장된 칭찬이 음식 이야기의 흐름을 끊지 않는다는 점이다.<\/p>\n<p>농담을 하고 나서도 삼겹살의 원산지와 품질에 관한 대화를 이어갈 수 있었다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">일상적인 사실의 과장된 의미 부여<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>누군가 사소한 행동을 말했을 때 그것을 지나치게 거창한 일처럼 받아들이는 방식이다.<\/p>\n<p>예를 들어 친구가 &quot;오늘 일찍 일어났어&quot;라고 하면 &quot;이제 새벽을 지배하는 사람이 됐네&quot;처럼 받을 수도 있다.<\/p>\n<p>단, 같은 과장 표현만 반복하면 진부해질 수 있다.<\/p>\n\n"}, {"id": "scene-5", "badge": "장면 5", "title": "상대의 표정을 아이돌 엔딩 포즈로 바꾸다", "html": "\n<div class=\"dgslot\" data-c=\"c07\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님이 모델 김원중과 그의 아내에 대한 이야기를 하고 계셨다.<\/p>\n<p>그러던 중 내가 무언가를 먹으면서 지은 표정과 행동에 주목하셨다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;왜 소녀처럼 먹지?&quot;<\/p>\n<p class=\"spk\">다른 참석자<\/p>\n<p class=\"qt\">&quot;사쿠라야?&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그때 마지막 카메라 잡을 때...&quot;<\/p>\n<p class=\"spk\">다른 참석자<\/p>\n<p class=\"qt\">&quot;혼자 막 엔딩 포즈 이런 거.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;혼자 갑자기... 엔딩 포즈 하는 것처럼.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;예의를 좀 갖추려고 했는데...&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;요새 춘천에서 이런 거 유행하나?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;예의를 차리려고 했는데 갑자기 질문 주셔가지고 당황해가지고.&quot;<\/p>\n<p class=\"spk\">다른 참석자<\/p>\n<p class=\"qt\">&quot;예쁜 표정이 나왔어요?&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>이 장면은 카스테라와 차이가 있다.<\/p>\n<p>카스테라는 상대의 말이 재료였다.<\/p>\n<p>이번에는 말이 아니라 표정과 행동이 재료였다.<\/p>\n<p>대장님은 내가 무언가를 먹는 모습을 보고 소녀 같은 표정이라고 표현하셨다.<\/p>\n<p>그런 다음 아이돌의 엔딩 포즈라는 방송 장면으로 연결했다.<\/p>\n<p>다른 참석자들도 엔딩 포즈라는 설정을 이해하고 말을 보탰다.<\/p>\n<p>결국 한 사람의 평범한 행동이 여러 사람이 함께 이야기할 수 있는 상황극으로 발전했다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">행동 관찰 → 유사한 장면 연상 → 상황극 확장<\/p>\n<h4 class=\"lb\">공부할 포인트<\/h4>\n<p>상대의 말을 듣는 것만이 아니라 눈앞의 행동과 표정도 관찰해야 한다.<\/p>\n<p>그리고 관찰한 장면과 유사한 영화, 방송, 음악, 일상의 모습을 떠올리는 것이다.<\/p>\n<p>이는 대장님이 말씀하신 생각다발과 연결된다.<\/p>\n<p>내가 본 영상과 장면이 많을수록 연결할 재료도 늘어난다.<\/p>\n<h4 class=\"lb\">중요한 차이<\/h4>\n<p>이 농담은 대장님 혼자 완성한 것이 아니다.<\/p>\n<p>다른 참석자들이 아이돌 엔딩 포즈라는 설정을 함께 받아주면서 발전했다.<\/p>\n<p>이것이 여러 사람이 하는 대화에서 중요한 부분이다.<\/p>\n\n"}, {"id": "scene-6", "badge": "장면 6", "title": "진지한 이야기를 하다가 호텔이라는 단어를 받아치다", "html": "\n<div class=\"dgslot\" data-c=\"c08\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님이 과거에 적게 주무시면서 굉장히 치열하게 일하던 시절을 이야기하셨다.<\/p>\n<p>나는 예전에 직접 대장님을 찾아가 밤새 대화했던 경험을 꺼내려 했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;그때 어디지? 그 성수... 아니, 아니야.&quot;<\/p>\n<p class=\"qt\">&quot;대장님, 예전에 모텔에서 일하실 때 제가 가가지고 밤새 얘기한 적...&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;모텔에서 일할 때 네가 오면 이게 뭐, 커플이야 뭐야?&quot;<\/p>\n<p class=\"qt\">&quot;뭔 소리야. 예전에... 가지 새끼야.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;그때 일하실 때... 23년 겨울에...&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>나는 대장님이 얼마나 치열하게 생활했는지 설명하려고 했다.<\/p>\n<p>그런데 &#x27;모텔&#x27;, &#x27;내가 찾아갔다&#x27;, &#x27;밤새 이야기했다&#x27;는 표현이 하나로 연결되면서 다른 장면으로 해석될 여지가 생겼다.<\/p>\n<p>대장님은 원래 이야기의 목적을 잠시 벗어나 엉뚱한 해석을 꺼내셨다.<\/p>\n<p>그러면서 앞에서 이미 사용했던 &#x27;가지&#x27;라는 소재까지 다시 불러왔다.<\/p>\n<p>즉, 두 가지 기술이 동시에 사용된 것이다.<\/p>\n<p class=\"em\">① 상대의 표현을 다른 상황으로 해석하기<\/p>\n<p class=\"em\">② 앞에서 사용한 농담을 다시 가져오기<\/p>\n<h4 class=\"lb\">주목할 점<\/h4>\n<p>전사에는 나도 &quot;오해할 거 아니야&quot;라는 취지로 말한 흔적이 있다.<\/p>\n<p>따라서 대장님이 모든 것을 혼자 만들어낸 것은 아니다.<\/p>\n<p>내가 열어놓은 표현의 가능성을 빠르게 확대하신 것으로 보는 것이 정확하다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>상대의 말에서 원래 의도와 다른 해석이 가능한 지점을 찾아보자.<\/p>\n<p>다만 원래 이야기가 중요한 순간에는 농담을 짧게 하고 본래 대화로 돌아와야 한다.<\/p>\n\n"}, {"id": "scene-7", "badge": "장면 7", "title": "새침한 표정을 애교로 전환하다", "html": "\n<div class=\"dgslot\" data-c=\"c09\"><\/div>\n<p>이번 사례는 대장님뿐 아니라 나의 반응을 분석하기 위해 특히 중요하다.<\/p>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>나는 내 체력과 자신감에 대한 이야기를 하고 있었다.<\/p>\n<p>그러다가 대장님과 다른 참석자가 내 표정에 주목했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;근데 그거 여자가 느껴야지. 네가 느끼는 게 뭐가 있어.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그렇게 새침한 표정을 쓰지 마세요.&quot;<\/p>\n<p class=\"spk\">구슬님 추정<\/p>\n<p class=\"qt\">&quot;금방 또 약간 예쁜 표정을 지었어요.&quot;<\/p>\n<p class=\"qt\">&quot;왜 그렇게 새침하게 토라지세요?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;새침하게 토라진 게 제가 할 때는 그거예요.&quot;<\/p>\n<p class=\"qt\">&quot;대장님께 대한 애교.&quot;<\/p>\n<p class=\"qt\">&quot;남자로서 애교는 이런 거일 수도 있겠다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;많이 늘었네. 능청이 많이 늘었어.&quot;<\/p>\n<p class=\"qt\">&quot;옛날 같았으면 이렇게 말 못 할 것 같은데.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>처음에 나는 놀림의 대상이 되었다.<\/p>\n<p>대장님은 내 표정을 새침하다고 표현하셨고 다른 참석자는 토라진 것 같다고 이야기했다.<\/p>\n<p>여기서 내가 선택할 수 있는 반응은 여러 가지였다.<\/p>\n<p>첫 번째는 부정하는 것이다.<\/p>\n<p class=\"qt\">&quot;아닙니다. 토라진 게 아닙니다.&quot;<\/p>\n<p>두 번째는 해명하는 것이다.<\/p>\n<p class=\"qt\">&quot;제가 당황해서 그렇게 표정이 나온 겁니다.&quot;<\/p>\n<p>그런데 나는 다른 선택을 했다.<\/p>\n<p class=\"em\">&quot;대장님께 대한 애교입니다.&quot;<\/p>\n<p>상대가 만든 설정을 완전히 부정하지 않으면서 의미를 이동시켰다.<\/p>\n<p>토라진 표정이 아니라 애교라는 새로운 해석을 붙인 것이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">프레임 전환 + 설정 인정하기 + 능청<\/p>\n<h4 class=\"lb\">대장님의 피드백<\/h4>\n<p class=\"qt\">&quot;능청이 많이 늘었어.&quot;<\/p>\n<p>이 말씀을 중요하게 생각한다.<\/p>\n<p>대장님은 단순히 내 말이 웃겼다고만 하신 것이 아니다.<\/p>\n<p>예전 같았으면 이런 말을 하지 못했을 것 같다고 말씀하셨다.<\/p>\n<p>이는 내가 과거보다 놀림에 대해 다른 방식으로 반응하고 있다는 뜻으로 해석할 수 있다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>내가 경직되는 순간은 주로 상대의 말을 진지하게 받아들이고, 정확하게 설명하려고 할 때인 것 같다.<\/p>\n<p>그런데 반드시 설명하거나 방어할 필요가 없는 상황도 있다.<\/p>\n<p>상대가 놀리면 다른 의미를 붙여볼 수 있다.<\/p>\n<p>그리고 중요한 것은 짧게 말하는 연습이다.<\/p>\n<p>이번에도 애교라고 말한 뒤 설명이 계속 이어졌다.<\/p>\n<p>앞으로는 <b>&quot;애교죠.&quot;<\/b> 하고 멈춰보는 것도 연습해볼 수 있겠다.<\/p>\n\n"}, {"id": "scene-8", "badge": "장면 8", "title": "부정할수록 오히려 농담의 프레임에 갇히다", "html": "\n<div class=\"dgslot\" data-c=\"c10\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>앞에서 만들어진 &#x27;가지&#x27;라는 농담이 여러 차례 반복되었다.<\/p>\n<p>대장님은 진지한 이야기를 하던 중에도 그 소재를 다시 꺼내셨다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;알겠어? 가지 새끼야.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;가지 아닙니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그 자체가 네가 가지라는 거야.&quot;<\/p>\n<p class=\"qt\">&quot;넌 지금 가지란 프레임에 빠졌어.&quot;<\/p>\n<p class=\"spk\">구슬님 추정<\/p>\n<p class=\"qt\">&quot;큰일 났네. 그거 너무 치명적인데?&quot;<\/p>\n<p class=\"qt\">&quot;만회를 어떻게 해야 되지?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;아, 네. 진정하겠습니다.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>나는 농담의 소재가 된 것을 부정했다.<\/p>\n<p>그런데 대장님은 그 부정 자체를 농담의 재료로 사용하셨다.<\/p>\n<p>&quot;가지가 아니다&quot;라고 말할수록 그 소재를 계속 의식하고 있다는 식으로 받아버린 것이다.<\/p>\n<p>이렇게 되면 &#x27;가지냐 아니냐&#x27;라는 문제를 설명하는 것 자체가 계속 농담의 소재가 된다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">상대의 부정을 다시 해석하기 + 프레임 고정<\/p>\n<h4 class=\"lb\">여기서 중요한 것<\/h4>\n<p>이 장면은 대장님이 말씀하신 총과 칼의 비유와도 연결된다.<\/p>\n<p>상대가 마련한 선택지 안에서만 대응하면 대화의 틀이 바뀌지 않는다.<\/p>\n<p>내가 가지가 아니라는 사실을 아무리 설명해도 계속 같은 주제 안에 머물게 되는 것이다.<\/p>\n<p>따라서 이 상황에서는 오히려 다른 이야기로 넘어가거나, 전혀 다른 의미를 붙이는 것이 도움이 될 수 있다.<\/p>\n<h4 class=\"lb\">주의할 점<\/h4>\n<p>이 기술은 상대방을 계속 곤란하게 만들 수도 있다.<\/p>\n<p>상대가 정말 싫어서 부정하는데도 그 부정을 다시 놀림으로 삼으면 관계를 해칠 수 있다.<\/p>\n<p>따라서 이 기술을 공격적으로 사용하는 것보다 <b>프레임에 갇히지 않는 사고방식<\/b>을 배우는 데 활용해야 한다.<\/p>\n\n"}]}, {"key": "p4", "group": "study", "no": "4", "title": "한 번 만든 농담을 다시 사용하는 기술 — 콜백", "meta": "장면 1개 · 녹음 6곳", "lead": "\n", "segs": [{"id": "scene-9", "badge": "장면 9", "title": "'가지'라는 하나의 소재가 하루 동안 계속 살아남았다", "html": "\n<p>이번 대화에서 가장 흥미로운 사례 중 하나다.<\/p>\n<p>대장님은 처음 만들어진 소재를 한 번 사용하고 끝내지 않으셨다.<\/p>\n<p>여러 사람이 그 소재를 받아주고, 다른 주제로 대화가 넘어간 뒤에도 다시 불러왔다.<\/p>\n<h4 class=\"lb\">1단계. 소재가 처음 만들어진다<\/h4>\n<div class=\"dgslot\" data-c=\"c11\"><\/div>\n<p>나이에 따른 체력 변화에 대한 이야기가 이어지고 있었다.<\/p>\n<p>대장님은 힘이 없는 가지를 비유로 사용하셨다.<\/p>\n<p>구슬님으로 추정되는 참석자가 &#x27;10일 말린 가지&#x27;라는 구체적인 이미지를 더했다.<\/p>\n<p>이를 통해 단순한 비유가 시각적인 이미지로 발전했다.<\/p>\n<h4 class=\"lb\">2단계. 이미지를 계속 반복한다<\/h4>\n<div class=\"dgslot\" data-c=\"c12\"><\/div>\n<p>대장님은 뒤이어 설명하는 과정에서도 앞에서 나온 가지 비유를 다시 사용하셨다.<\/p>\n<p>앞선 맥락을 기억하고 있는 사람들에게는 같은 이미지가 반복되면서 하나의 공통 소재가 된다.<\/p>\n<h4 class=\"lb\">3단계. 전혀 다른 이야기에서도 다시 꺼낸다<\/h4>\n<div class=\"dgslot\" data-c=\"c13\"><\/div>\n<p>호텔에서 밤새 대화했던 경험을 이야기하는 순간에도 대장님은 가지라는 소재를 다시 사용하셨다.<\/p>\n<p>원래 주제는 과거의 업무와 생활 방식이었다.<\/p>\n<p>그런데 앞에서 만들어진 농담이 다시 등장했다.<\/p>\n<h4 class=\"lb\">4단계. 내가 다시 그 소재를 살려낸다<\/h4>\n<div class=\"dgslot\" data-c=\"c14\"><\/div>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;가지, 가지는 자존심 상해요.&quot;<\/p>\n<p class=\"qt\">&quot;저는 가지 아닌데...&quot;<\/p>\n<\/div><p>내가 다시 그 단어에 반응하면서 소재가 살아났다.<\/p>\n<h4 class=\"lb\">5단계. 부정 자체를 농담으로 만든다<\/h4>\n<div class=\"dgslot\" data-c=\"c15\"><\/div>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;가지 아닙니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그 자체가 네가 가지라는 거야.&quot;<\/p>\n<p class=\"qt\">&quot;넌 지금 가지란 프레임에 빠졌어.&quot;<\/p>\n<\/div><h4 class=\"lb\">6단계. 장소를 바꿔서도 다시 등장한다<\/h4>\n<div class=\"dgslot\" data-c=\"c16\"><\/div>\n<p>대화가 아지트를 오래 유지한 이야기로 넘어갔다.<\/p>\n<p>그런데 대장님은 자신에 대해 설명하면서 다시 가지라는 비유를 불러왔다.<\/p>\n<h4 class=\"lb\">콜백의 구조<\/h4>\n<p class=\"em\">소재 등장 → 다른 사람의 참여 → 반복 → 화제 전환 → 재등장 → 새로운 변주<\/p>\n<p>이 과정을 하나의 기술로 분리해서 공부할 필요가 있다.<\/p>\n<h4 class=\"lb\">콜백의 특징<\/h4>\n<p>콜백은 처음 들었을 때보다 나중에 다시 등장했을 때 더 재미있게 느껴질 수 있다.<\/p>\n<p>이유는 사람들이 이전의 장면을 기억하기 때문이다.<\/p>\n<p>단어 하나만 등장해도 앞선 대화와 분위기가 함께 떠오른다.<\/p>\n<p>그리고 참여자들만 알고 있는 공통 언어가 생긴다.<\/p>\n<p>이는 함께 시간을 보내며 관계를 형성한 사람들 사이에서 활용하기 좋은 기술이다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>매번 새로운 농담을 만들 필요는 없다.<\/p>\n<p>앞서 사람들이 즐겁게 받아들인 소재가 있다면 나중에 다른 상황에서 다시 사용할 수 있다.<\/p>\n<p>다만 아무 맥락 없이 같은 단어만 반복하는 것은 콜백이 아니다.<\/p>\n<p>현재 상황과 연결되어 새로운 의미가 생겨야 한다.<\/p>\n<p>또한 상대가 불편해하거나 그만하길 원한다면 멈춰야 한다.<\/p>\n<p>이 사례에서는 특정인을 대상으로 한 성적인 놀림이 반복되었기 때문에, 표현 자체보다는 <b>반복과 변주의 구조<\/b>를 공부하는 것이 적절하다.<\/p>\n\n"}]}, {"key": "p5", "group": "study", "no": "5", "title": "여러 사람의 대화를 이끄는 기술", "meta": "장면 4개 · 녹음 4곳", "lead": "\n", "segs": [{"id": "scene-10", "badge": "장면 10", "title": "오뎅바에 황당한 규칙을 만들어버린다", "html": "\n<div class=\"dgslot\" data-c=\"c17\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>네 명이 오뎅바에 모여 식사와 술을 즐기기 시작했다.<\/p>\n<p>대장님은 오뎅바의 특징을 설명하다가 갑자기 황당한 규칙을 만드셨다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;여기는 오뎅이랑 술 안 먹으면 죽여버려요.&quot;<\/p>\n<p class=\"qt\">&quot;여기서 오뎅이랑 술 외에 다른 얘기하면 바로 죽어.&quot;<\/p>\n<p class=\"qt\">&quot;무조건 오뎅이랑 관련된 얘기를 해야 돼.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;오뎅 얘기로 연결해서 하겠군.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;오뎅이랑 무조건 연결돼야 되고.&quot;<\/p>\n<p class=\"spk\">다른 참석자<\/p>\n<p class=\"qt\">&quot;오뎅 얘기 안 했어.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>이건 한 문장의 재치보다는 <b>공통 설정을 만드는 기술<\/b>에 가깝다.<\/p>\n<p>실제로는 존재하지 않는 규칙을 만들었다.<\/p>\n<p>오뎅바에서는 무조건 오뎅 이야기만 해야 한다는 것이다.<\/p>\n<p>사람들이 이 설정을 받아들이면 이후 어떤 이야기를 하든 오뎅과 연결할 수 있다.<\/p>\n<p>설정 자체가 새로운 농담을 만드는 도구가 된다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">가상의 규칙 만들기 + 집단 설정 공유하기<\/p>\n<h4 class=\"lb\">중요한 점<\/h4>\n<p>대장님 혼자 계속 웃기는 것이 아니다.<\/p>\n<p>다른 참석자도 &quot;오뎅 얘기 안 했어&quot;라고 말하면서 설정에 참여한다.<\/p>\n<p>그 순간 농담은 개인의 소유가 아니라 여러 사람이 함께 사용하는 공통 놀이가 된다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>여러 명이 있는 자리에서는 반드시 내가 모든 농담을 만들어낼 필요가 없다.<\/p>\n<p>사람들이 함께 활용할 수 있는 가벼운 설정 하나를 만드는 것만으로도 대화가 이어질 수 있다.<\/p>\n\n"}, {"id": "scene-11", "badge": "장면 11", "title": "다른 사람이 준 말을 받아서 농담을 완성한다", "html": "\n<div class=\"dgslot\" data-c=\"c18\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>하이볼에 대한 이야기가 이어지고 있었다.<\/p>\n<p>대장님은 하이볼을 여성들이 좋아하는 술이라는 식으로 이야기하셨다.<\/p>\n<p>그런데 대장님 자신도 하이볼을 마시고 있었다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;하이볼은 여자들이 먹는 거야.&quot;<\/p>\n<p class=\"spk\">다른 참석자<\/p>\n<p class=\"qt\">&quot;근데 좀 짚고 넘어가야겠어요.&quot;<\/p>\n<p class=\"qt\">&quot;왜 이건 여자가 먹는 건데요?&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;왜냐면 나는 먹어도 돼.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;왜요, 왜요?&quot;<\/p>\n<p class=\"spk\">다른 참석자<\/p>\n<p class=\"qt\">&quot;나니까.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나니까.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>대장님이 먼저 하나의 설정을 만들었다.<\/p>\n<p>그런데 다른 참석자가 그 설정의 모순을 지적한다.<\/p>\n<p>대장님은 자신에게만 예외를 적용하는 방식으로 답한다.<\/p>\n<p>그리고 다른 참석자가 &quot;나니까&quot;라는 표현을 제안한다.<\/p>\n<p>대장님은 그 말을 그대로 받아서 사용하셨다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">설정 만들기 → 상대의 반박 → 예외 만들기 → 다른 사람의 말을 받아 완성하기<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>대화의 중심에 있다고 해서 모든 말을 스스로 만들어내야 하는 것은 아니다.<\/p>\n<p>오히려 다른 사람이 좋은 표현을 던졌다면 그것을 받아서 이어가는 능력이 필요하다.<\/p>\n<p>모두의 반응을 재료로 활용할 수 있어야 한다.<\/p>\n\n"}, {"id": "scene-12", "badge": "장면 12", "title": "술자리에서 자신이 중심 역할을 하는 이유를 설명하다", "html": "\n<div class=\"dgslot\" data-c=\"c19\"><\/div>\n<p>이 부분은 대장님의 대화 기술을 공부하면서 가장 중요하게 봐야 할 장면 중 하나다.<\/p>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>네 명의 술자리가 이어지고 있었다.<\/p>\n<p>나는 이전에 만났을 때보다 사람들이 훨씬 편하게 대화하는 모습을 관찰했다.<\/p>\n<p>그러면서 이런 자리가 사람들에게 얼마나 큰 즐거움이 될 수 있는지를 이야기했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;근데 여기가 왜냐면 내가 있어서 그래.&quot;<\/p>\n<p class=\"qt\">&quot;내가 없으면 이게 안 돼.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;그 자리에서 술 먹었어도 이렇게 안 됐을 것 같아.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 나름대로 취한 척하면서 안 취한 척하면서 조절해주고 있기 때문에...&quot;<\/p>\n<p class=\"qt\">&quot;이 중심이 L자거든.&quot;<\/p>\n<p class=\"qt\">&quot;그러면 L자에서 관절이 여기 있잖아.&quot;<\/p>\n<p class=\"qt\">&quot;이게 있어야지 되는 거지. 안 그러면 재미가 없다니까.&quot;<\/p>\n<p class=\"qt\">&quot;왜 재미가 없냐면 어느 정도 풀어질지 아닐지에 대해서 사람들이 판단을 못 해요.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;계산한다고.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 있으면 적어도 해도 돼.&quot;<\/p>\n<p class=\"qt\">&quot;왜냐면 거기서 내가 적절히 끊어줄 걸 안다는 믿음이 있기 때문에 갈 수 있어.&quot;<\/p>\n<p class=\"qt\">&quot;그리고 내가 더 가잖아. 내가 먼저 갈 텐데.&quot;<\/p>\n<\/div><h4 class=\"lb\">기술적 분석<\/h4>\n<p>여기서 대장님은 자신이 단순히 농담을 많이 하는 사람이 아니라 대화의 중심을 잡는 역할을 한다고 설명하셨다.<\/p>\n<p>사람들은 여러 사람이 있는 자리에서 어느 정도까지 편하게 말해도 되는지 판단하려 한다.<\/p>\n<p>친밀도가 낮거나 대화의 분위기가 불분명하면 조심스러워질 수 있다.<\/p>\n<p>그런데 누군가가 안전한 범위를 만들어주고, 대화가 불편해질 때 적절히 끊어줄 것이라는 믿음이 있다면 사람들은 더 편하게 참여할 수 있다.<\/p>\n<p>대장님은 자신이 그런 역할을 한다고 말씀하셨다.<\/p>\n<h4 class=\"lb\">대화 중심자의 네 가지 역할<\/h4>\n<p class=\"spk\">① 시작하기<\/p>\n<p>사람들이 말을 꺼내기 어려울 때 먼저 주제를 만들고 대화를 시작한다.<\/p>\n<p class=\"spk\">② 확장하기<\/p>\n<p>상대가 한 말을 다른 장면이나 비유로 바꿔 새로운 대화를 만든다.<\/p>\n<p class=\"spk\">③ 연결하기<\/p>\n<p>사람들이 함께 이야기할 수 있는 공통 소재를 만들고 서로 참여할 수 있도록 한다.<\/p>\n<p class=\"spk\">④ 조절하기<\/p>\n<p>농담이 너무 과해지거나 분위기가 불편해질 때 방향을 바꾼다.<\/p>\n<h4 class=\"lb\">중요한 발견<\/h4>\n<p>대화의 중심자가 된다는 것은 가장 많이 말하는 사람이 된다는 뜻이 아니다.<\/p>\n<p>여러 사람이 편하게 이야기할 수 있는 환경을 만드는 사람이라는 뜻에 더 가깝다.<\/p>\n<p>대장님은 자신의 경험과 관계를 바탕으로 그런 역할을 수행한다고 설명하셨다.<\/p>\n<p>다만 실제로 얼마나 분위기를 변화시켰는지는 대장님이 없는 자리와 비교해야 더 정확하게 판단할 수 있다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>나는 여러 사람 앞에서 말을 잘해야 한다는 생각을 할 때가 있다.<\/p>\n<p>그런데 중요한 것은 반드시 내가 가장 웃긴 말을 하는 게 아니라는 사실이다.<\/p>\n<p>다른 사람이 편하게 이야기할 수 있도록 질문을 던지고, 말을 받아주고, 분위기를 조절하는 것 역시 대화 능력이다.<\/p>\n\n"}, {"id": "scene-13", "badge": "장면 13", "title": "말수를 줄이고 질문을 다른 사람에게 넘긴다", "html": "\n<div class=\"dgslot\" data-c=\"c20\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나는 술을 많이 먹으면 먹을수록 말을 안 해.&quot;<\/p>\n<p class=\"qt\">&quot;술을 많이 먹은 상태에서 내 말을 많이 하면 실수할 수도 있고.&quot;<\/p>\n<p class=\"qt\">&quot;이걸 돌려 돌려요.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;질문을 돌려요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;왜냐면 그게 되게 좋아.&quot;<\/p>\n<p class=\"qt\">&quot;술을 먹은 상태에서는 질문하면 상대방이 웬만하면 다 많이 생각나고...&quot;<\/p>\n<p class=\"qt\">&quot;그러면서 내가 숨을 좀 돌리고 물 한 잔 마시고.&quot;<\/p>\n<\/div><h4 class=\"lb\">기술적 분석<\/h4>\n<p>대장님은 자신의 말수가 지나치게 많아지지 않도록 조절한다고 설명하셨다.<\/p>\n<p>그런데 단순히 입을 다물고 있는 것이 아니다.<\/p>\n<p>다른 사람에게 질문을 넘겨서 그 사람이 말하게 만든다.<\/p>\n<p>이렇게 하면 두 가지 효과가 있다.<\/p>\n<p>첫째, 대화를 한 사람이 독점하지 않는다.<\/p>\n<p>둘째, 다른 사람이 자신의 경험이나 생각을 이야기할 기회가 생긴다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">발언권 분배 + 질문으로 흐름 넘기기<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>여러 사람을 즐겁게 해주는 능력은 말하는 능력만으로 만들어지지 않는다.<\/p>\n<p>적절한 순간에 질문하고, 듣고, 다른 사람에게 대화를 넘겨주는 능력도 필요하다.<\/p>\n\n"}]}, {"key": "p6", "group": "study", "no": "6", "title": "대장님의 농담은 왜 계속 이어질 수 있었을까?", "meta": "4꼭지 · 녹음 2곳", "lead": "\n", "segs": [{"id": "s567", "badge": "1", "title": "대화의 재료가 많다", "html": "\n<p>대장님은 김원중, 패션, 음식, 맥주, 게임, 영화, 사업, 스포츠, 지역 문화 등을 계속 연결하셨다.<\/p>\n<p>하나의 주제에서 다른 주제로 이동할 수 있는 재료가 많은 것이다.<\/p>\n<div class=\"dgslot\" data-c=\"c21\"><\/div>\n<p>대장님은 모델 김원중을 보고 단순히 유명인을 만났다는 감상으로 끝내지 않았다.<\/p>\n<p>그 사람이 어떤 일을 해왔고, 어느 정도 수입이 있었을지, 왜 그곳에 거주할 수 있는지를 역산하는 방식으로 이야기를 발전시키셨다.<\/p>\n<p>그런데 나는 김원중이 누구인지 제대로 알지 못했다.<\/p>\n<p>그러다 보니 다음 이야기로 연결되기 어려웠다.<\/p>\n<p>이 장면은 그 자체로 위트라고 보기는 어렵지만, 위트가 만들어지는 기반을 이해하는 데 중요하다.<\/p>\n<p>상대의 말을 이해하고 다른 소재와 연결하려면 공통으로 알고 있는 지식이 필요하다.<\/p>\n"}, {"id": "s577", "badge": "2", "title": "설명 중에도 상황극을 만든다", "html": "\n<p>대장님은 진지하게 설명하다가도 짧은 상황극을 끼워 넣으셨다.<\/p>\n<p>예를 들어 돈이 부족해서 피자를 먹기 어려웠던 시절을 이야기하면서 직접 피자를 만드는 우스꽝스러운 모습을 상상하기도 하셨다.<\/p>\n<div class=\"dgslot\" data-c=\"c22\"><\/div>\n<p>이런 장면은 단순히 한 문장으로 받아치는 위트와는 조금 다르다.<\/p>\n<p>설명하고 있는 현실을 새로운 장면으로 바꾸는 것이다.<\/p>\n<p class=\"em\">현실의 문제 → 엉뚱한 가정 → 구체적인 행동 → 과장된 결과<\/p>\n<p>상황극이 끝나면 다시 원래 설명으로 돌아간다.<\/p>\n<p>이처럼 진지함과 우스꽝스러운 장면을 오갈 수 있다는 점이 중요하다.<\/p>\n"}, {"id": "s586", "badge": "3", "title": "과거의 대화도 현재의 재료로 사용한다", "html": "\n<p>가지라는 소재를 다시 사용하는 장면이 대표적이다.<\/p>\n<p>이것은 공통 경험이 많을수록 활용할 수 있는 소재가 많아진다는 뜻이기도 하다.<\/p>\n<p>한 번 공유한 경험이나 말이 이후의 대화에서도 새로운 의미를 만들어낼 수 있다.<\/p>\n"}, {"id": "s590", "badge": "4", "title": "사람에 따라 기술을 다르게 선택한다", "html": "\n<p>대장님은 은호님 앞에서는 같은 종류의 농담을 하지 않았을 것이라고 말씀하셨다.<\/p>\n<p>이것이 기술을 사용하는 사람과 단순히 웃긴 말을 따라 하는 사람의 차이일 수 있다.<\/p>\n<p class=\"em\">기술을 알고 있는 것과 그 기술을 언제 사용할지 판단하는 것은 다른 능력이다.<\/p>\n\n"}]}, {"key": "p7", "group": "study", "no": "7", "title": "위트에는 조절 능력도 필요하다", "meta": "장면 1개 · 녹음 1곳", "lead": "\n", "segs": [{"id": "scene-14", "badge": "장면 14", "title": "강한 언어가 오히려 상대에게 부담이 될 수 있다", "html": "\n<div class=\"dgslot\" data-c=\"c23\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 확신을 갖고 있는 것과 과하게 말하는 건 달라요.&quot;<\/p>\n<p class=\"qt\">&quot;답답한 마음 하나로 그렇게 얘기하면 사람들이 반감이 생길 수 있어.&quot;<\/p>\n<p class=\"qt\">&quot;본인이 맞더라도 나중에 본인한테 칼이 돼요.&quot;<\/p>\n<p class=\"qt\">&quot;아주 조심스럽게, 하지만 자신 있게 했을 때 그 말이 조금 더 생명력을 얻지 않을까.&quot;<\/p>\n<\/div><h4 class=\"lb\">기술적 분석<\/h4>\n<p>대장님은 앞선 대화에서 굉장히 강한 언어와 농담을 사용하셨다.<\/p>\n<p>그런데 후반에는 언어의 강도가 상대에게 어떻게 전달되는지에 대해 말씀하셨다.<\/p>\n<p>이것은 위트 공부에서도 중요하다.<\/p>\n<p>농담을 잘하는 것만큼 중요한 것이 그 농담의 강도를 조절하는 능력이기 때문이다.<\/p>\n<p>자신이 장난으로 한 말이 상대에게는 공격으로 들릴 수 있다.<\/p>\n<p>또 자신이 옳다고 생각하는 말이라고 해서 강하게 표현하는 것이 항상 좋은 결과를 만드는 것도 아니다.<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>위트는 상대를 몰아붙이는 데만 사용되는 기술이 아니다.<\/p>\n<p>오히려 굳은 분위기를 풀고, 상대가 체면을 잃지 않도록 돕고, 다시 대화를 이어가게 할 수도 있다.<\/p>\n<p>그러므로 앞으로는 웃긴 장면뿐 아니라 농담을 멈춘 장면, 상대를 배려한 장면, 말의 수위를 낮춘 장면도 함께 분석해야 한다.<\/p>\n\n"}]}, {"key": "p8", "group": "study", "no": "8", "title": "대장님 대화술의 기술 지도", "meta": "정리", "lead": "\n<p>이번 대화에서 관찰한 기술을 정리하면 다음과 같다.<\/p>\n<div class='tbl'><table><thead><tr><th>기술<\/th><th>대표 장면<\/th><th>원리<\/th><\/tr><\/thead><tbody><tr><td>소리 비틀기<\/td><td>카스·테라 → 카스테라<\/td><td>같은 소리를 다른 단어로 해석<\/td><\/tr><tr><td>의도적인 오해<\/td><td>호텔에서 밤새 이야기<\/td><td>원래 의도와 다른 상황을 상상<\/td><\/tr><tr><td>상황극<\/td><td>동네 치킨집에서 수입 맥주 주문<\/td><td>구체적인 인물과 장면을 생성<\/td><\/tr><tr><td>과장<\/td><td>집에 삼겹살 → 부자<\/td><td>평범한 사실을 과도하게 평가<\/td><\/tr><tr><td>단순화<\/td><td>원주·춘천 → 강원도 감자<\/td><td>상대가 강조하는 구분을 일부러 무시<\/td><\/tr><tr><td>이미지 연상<\/td><td>먹는 표정 → 아이돌 엔딩 포즈<\/td><td>현재 행동을 다른 장면과 연결<\/td><\/tr><tr><td>콜백<\/td><td>가지 농담의 반복<\/td><td>앞선 소재를 새 상황에 재사용<\/td><\/tr><tr><td>프레임 전환<\/td><td>새침함 → 애교<\/td><td>상대의 해석에 다른 의미 부여<\/td><\/tr><tr><td>부정의 재해석<\/td><td>가지 아닙니다 → 가지 프레임<\/td><td>상대의 반응을 다시 소재화<\/td><\/tr><tr><td>가상 규칙<\/td><td>오뎅바에서는 오뎅 얘기만<\/td><td>집단이 공유할 새로운 설정 만들기<\/td><\/tr><tr><td>합동 완성<\/td><td>하이볼 → 나니까<\/td><td>다른 참석자의 말을 받아 확장<\/td><\/tr><tr><td>분위기 조절<\/td><td>상대에 따라 농담 수위 변경<\/td><td>관계와 반응을 읽고 선택<\/td><\/tr><tr><td>발언권 분배<\/td><td>술자리에서 질문 돌리기<\/td><td>다른 사람이 대화에 참여하게 함<\/td><\/tr><\/tbody><\/table><\/div>\n<p>이 기술들은 각각 완전히 독립적으로 작동하는 것은 아니다.<\/p>\n<p>실제 대화에서는 여러 가지가 동시에 사용된다.<\/p>\n<p>예를 들어 호텔 이야기에서는 의도적인 오해와 콜백이 결합되었다.<\/p>\n<p>애교 장면에서는 프레임 전환과 능청이 결합되었다.<\/p>\n<p>오뎅바에서는 가상 규칙을 만들고 다른 사람의 참여를 이끌어내는 기술이 함께 사용되었다.<\/p>\n<p>따라서 탁재훈론을 공부할 때도 하나의 장면에 기술 하나만 대응시키기보다는 여러 기술이 어떤 순서로 결합되는지 관찰해야 한다.<\/p>\n\n", "segs": []}, {"key": "p9", "group": "study", "no": "9", "title": "실제로 어떻게 연습할 것인가?", "meta": "5꼭지", "lead": "\n", "segs": [{"id": "s627", "badge": "1단계", "title": "상대의 말에서 멈추기", "html": "\n<p>영상이나 대화록을 볼 때 웃긴 답변까지 곧바로 읽지 않는다.<\/p>\n<p>상대가 말을 마친 순간에 멈춘다.<\/p>\n<p>그다음 나라면 어떻게 대답했을지 생각해본다.<\/p>\n<p>가능하다면 입으로 직접 말한다.<\/p>\n<p>머릿속에서 생각하는 것과 실제로 입 밖으로 말하는 것은 다르기 때문이다.<\/p>\n"}, {"id": "s633", "badge": "2단계", "title": "세 가지 답변 만들기", "html": "\n<p>하나의 상황을 보고 최소 세 가지 반응을 만든다.<\/p>\n<p>예를 들어 상대가 이렇게 말했다고 해보자.<\/p>\n<p class=\"qt\">&quot;왜 그렇게 새침하게 토라지세요?&quot;<\/p>\n<p class=\"em\">첫 번째 — 평범한 반응<\/p>\n<div class=\"talk\"><p class=\"qt\">&quot;아니에요. 토라진 거 아닙니다.&quot;<\/p>\n<p class=\"spk\">두 번째 — 능청<\/p>\n<p class=\"qt\">&quot;애교입니다.&quot;<\/p>\n<p class=\"spk\">세 번째 — 과장<\/p>\n<p class=\"qt\">&quot;오늘 처음으로 보여드리는 특별한 표정입니다.&quot;<\/p>\n<\/div><p>이 세 가지 중 실제로 가장 적절한 것은 상황과 관계에 따라 달라질 수 있다.<\/p>\n<p>중요한 것은 정답을 찾는 것이 아니라 반응의 선택지를 넓히는 것이다.<\/p>\n"}, {"id": "s645", "badge": "3단계", "title": "실제 대사와 비교하기", "html": "\n<p>내 답변을 먼저 만든 다음 대장님이나 탁재훈의 실제 답변을 확인한다.<\/p>\n<p>이후 다음 내용을 비교한다.<\/p>\n<ul><li>나는 상대의 말을 어떻게 이해했는가?<\/li><li>상대는 어떤 새로운 의미를 발견했는가?<\/li><li>어떤 기술을 사용했는가?<\/li><li>왜 그 타이밍에 그 말을 했는가?<\/li><li>말을 길게 이어갔는가, 짧게 끝냈는가?<\/li><li>그다음 상대는 어떤 반응을 보였는가?<\/li><\/ul>\n"}, {"id": "s649", "badge": "4단계", "title": "농담의 길이까지 분석하기", "html": "\n<p>카스테라 장면은 한 문장으로 끝났다.<\/p>\n<p>반면 가지 농담은 상당히 오랫동안 반복되었다.<\/p>\n<p>호텔 이야기는 짧게 상황을 비튼 뒤 원래 이야기로 돌아갔다.<\/p>\n<p>오뎅바의 가상 규칙은 다른 사람들이 함께 사용할 수 있는 설정으로 발전했다.<\/p>\n<p>따라서 대화를 분석할 때는 단순히 어떤 기술을 사용했는지뿐 아니라 <b>그 기술을 얼마나 오래 이어갔는지<\/b>도 기록해야 한다.<\/p>\n"}, {"id": "s655", "badge": "5단계", "title": "실제 생활에서 실험하기", "html": "\n<p>처음부터 사람을 웃기려고 할 필요는 없다.<\/p>\n<p>우선 상대의 말을 다른 의미로 해석해보는 것부터 시작한다.<\/p>\n<p>그리고 상황이 적절할 때 짧게 한마디를 해본다.<\/p>\n<p>상대가 편하게 받아들이면 대화를 이어가고, 불편해하면 멈춘다.<\/p>\n<p>목표는 모든 대화에서 웃기는 사람이 되는 것이 아니다.<\/p>\n<p><b>상황에 맞는 반응을 선택할 수 있는 사람이 되는 것<\/b>이다.<\/p>\n\n"}]}, {"key": "p10", "group": "study", "no": "10", "title": "실전 복기 시트", "meta": "정리", "lead": "\n<p>앞으로 실제 대화를 하고 난 뒤 다음 항목을 기록한다.<\/p>\n<h4 class=\"lb\">① 당시 상황<\/h4>\n<p>언제, 어디서, 누구와 대화했는가?<\/p>\n<p>상대와의 친밀도와 분위기는 어땠는가?<\/p>\n<h4 class=\"lb\">② 상대의 직전 말<\/h4>\n<p>상대는 정확히 어떤 말을 했는가?<\/p>\n<p>가능하면 원문 그대로 기록한다.<\/p>\n<h4 class=\"lb\">③ 나의 실제 반응<\/h4>\n<p>나는 뭐라고 대답했는가?<\/p>\n<p>바로 대답했는가, 당황했는가, 길게 설명했는가?<\/p>\n<h4 class=\"lb\">④ 다른 반응의 가능성<\/h4>\n<p>지금 다시 생각한다면 어떤 답변을 할 수 있었을까?<\/p>\n<p>최소 세 가지를 작성한다.<\/p>\n<h4 class=\"lb\">⑤ 기술 분석<\/h4>\n<p>소리 비틀기, 프레임 전환, 과장, 상황극, 콜백 등 어떤 구조가 가능한가?<\/p>\n<h4 class=\"lb\">⑥ 상대의 반응<\/h4>\n<p>웃었는가?<\/p>\n<p>말을 이어갔는가?<\/p>\n<p>어색해졌는가?<\/p>\n<p>실제 관찰한 반응과 내가 추측한 반응을 구분한다.<\/p>\n<h4 class=\"lb\">⑦ 다음에 적용할 것<\/h4>\n<p>다시 비슷한 상황이 왔을 때 무엇을 다르게 해볼 것인가?<\/p>\n\n", "segs": []}, {"key": "p11", "group": "study", "no": "11", "title": "이번 대화에서 내가 발견한 나의 경직성", "meta": "정리", "lead": "\n<p>이번 대화록을 보면 나는 대장님께 무엇인가 설명할 때 상당히 진지하게 접근하는 경우가 많다.<\/p>\n<p>내가 어떤 경험을 했는지, 무엇을 배웠는지, 왜 그렇게 생각했는지를 충실하게 전달하려고 한다.<\/p>\n<p>그 자체가 잘못된 것은 아니다.<\/p>\n<p>하지만 모든 상황에서 정확하게 설명하려고 하면 다른 방식으로 반응할 가능성을 놓칠 수 있다.<\/p>\n<p>호텔 이야기에서도 나는 과거의 경험을 정확하게 설명하려고 했다.<\/p>\n<p>대장님은 그 말을 다른 의미로 받아쳤다.<\/p>\n<p>나는 다시 원래 상황을 설명하려고 했다.<\/p>\n<p>반면 새침한 표정 이야기에서는 달랐다.<\/p>\n<p>나는 단순히 부정하거나 해명하지 않고 애교라는 새로운 의미를 붙였다.<\/p>\n<p>그러자 대장님은 능청이 많이 늘었다고 말씀하셨다.<\/p>\n<p>여기에서 중요한 차이가 보인다.<\/p>\n<p class=\"em\">설명해야 하는 상황과 가볍게 받아쳐도 되는 상황을 구분하는 능력.<\/p>\n<p>앞으로는 누군가 예상하지 못한 말을 했을 때 곧바로 방어하거나 설명하기 전에 잠깐 다른 가능성을 찾아보려고 한다.<\/p>\n<p>상대가 농담을 던졌다면 그 설정 안에서 다른 의미를 만들어볼 수도 있다.<\/p>\n<p>상대가 진지한 이야기를 한다면 굳이 농담하지 않고 들어줄 수도 있다.<\/p>\n<p>내가 익혀야 할 것은 단순한 말재주보다 이런 선택 능력이다.<\/p>\n\n", "segs": []}, {"key": "p12", "group": "study", "no": "12", "title": "최종 정리 — 탁재훈론과 대장님 대화술을 함께 공부하는 이유", "meta": "정리", "lead": "\n<p>이번 분석을 통해 위트가 만들어지는 과정이 조금 더 구체적으로 보이기 시작했다.<\/p>\n<p>대장님은 상대의 말에서 다른 뜻을 찾아내셨다.<\/p>\n<p>눈앞의 표정과 행동을 새로운 장면으로 연결하셨다.<\/p>\n<p>진지한 설명을 우스꽝스러운 상황극으로 바꾸기도 하셨다.<\/p>\n<p>앞서 만든 소재를 다시 꺼내 사용하면서 공통의 농담을 만드셨다.<\/p>\n<p>다른 참석자가 던진 말을 받아서 새로운 대화를 이어가기도 하셨다.<\/p>\n<p>그리고 무엇보다 상대에 따라 어떤 농담을 할지 선택하고, 여러 사람이 있는 자리에서는 누가 얼마나 말할지를 조절한다고 설명하셨다.<\/p>\n<p>이것을 기술로 분해하니 막연했던 위트가 조금은 학습할 수 있는 대상으로 보인다.<\/p>\n<p>하지만 기술을 안다고 바로 자연스럽게 쓸 수 있는 것은 아니다.<\/p>\n<p>영상을 보며 구조를 이해하는 것과 실제 대화에서 그 구조를 꺼내 쓰는 것은 다르기 때문이다.<\/p>\n<p>앞으로의 공부는 세 가지를 연결하려고 한다.<\/p>\n<p class=\"em\">첫째, 탁재훈론으로 위트의 패턴을 익힌다.<\/p>\n<p>상대의 말을 어떤 방식으로 비틀고, 받아들이고, 확장하는지 공부한다.<\/p>\n<p class=\"em\">둘째, 대장님의 실제 대화에서 그 기술이 어떻게 사용되는지 관찰한다.<\/p>\n<p>한 문장을 받아치는 순간뿐 아니라 그 전의 상황과 다른 사람의 반응, 이후의 흐름까지 분석한다.<\/p>\n<p class=\"em\">셋째, 나의 실제 대화에서 직접 실험하고 복기한다.<\/p>\n<p>단순히 사람을 웃겼는지보다 이전에는 생각하지 못했던 반응을 찾아냈는지, 경직되지 않고 말할 수 있었는지, 상대가 편하게 대화할 수 있었는지를 살펴본다.<\/p>\n<p>특히 이번 대화에서 가장 기억하고 싶은 것은 대장님께서 나에게 하신 말씀이다.<\/p>\n<p class=\"em\">&quot;많이 늘었네. 능청이 많이 늘었어. 옛날 같았으면 이렇게 말 못 할 것 같은데.&quot;<\/p>\n<p>위트는 타고난 사람들만 사용할 수 있는 특별한 재능이라고 생각할 필요가 없다.<\/p>\n<p>연습으로 익힐 수 있는 패턴과 판단 능력이 분명히 있다.<\/p>\n<p>다만 그 기술을 익히는 목적은 상대를 이기거나 무조건 웃기는 데 있지 않다.<\/p>\n<p>상대를 이해하고, 대화의 다양한 가능성을 발견하고, 나와 상대 모두가 편안하게 이야기를 이어갈 수 있도록 하는 데 있다.<\/p>\n<p class=\"em\">결국 내가 공부하려는 것은 탁재훈의 웃긴 말이 아니라, 탁재훈과 대장님이 대화 속에서 발견하는 가능성을 나도 발견할 수 있게 되는 능력이다.<\/p>\n<p>그리고 그 능력을 실제 내 말과 태도로 만들어가는 것이 이번 탁재훈론 연구의 목표다.<\/p>", "segs": []}], "nclips": 23, "tak": "https://okhyun304-dot.github.io/tak-jaehoon-wit/"};

function go(ci, opt){
  opt = opt || {};
  document.querySelectorAll('audio').forEach(a=>a.pause());
  CI = ci;
  $('#home').style.display = 'none'; $('#deck').style.display = 'flex';
  const st = $('#stage'); st.innerHTML = pageHTML(ci); dgMount();
  $('#ttl').textContent = (LB(ci)?LB(ci)+' ':'') + W.parts[ci].title;
  const g = W.parts[ci].group;
  $('#chnav').className = 'chnav g8';
  $('#chnav').innerHTML = g === 'intro' ? '' : W.parts.map((p,i)=> (p.group!=='intro' && sameSet(p.group, g)) ? `<button data-go="${i}" class="${i===ci?'on':''}" title="${esc(p.title)}">${esc(p.no)}</button>` : '').join('');
  mountMe();
  let top = 0;
  if (opt.keep){ const s = store.get('wit.sc'); if (s && s.split('/')[0]===W.parts[ci].key) top = +s.split('/')[1] || 0; }
  st.scrollTop = top;
  if (opt.to){ const el = document.getElementById(opt.to); if (el) el.scrollIntoView({block:'start'}); }
  store.set('wit.key', W.parts[ci].key);
  try{ history.replaceState(null, '', '#' + encodeURIComponent(opt.to || W.parts[ci].key)); }catch(e){}
  document.title = W.parts[ci].title + ' · 대장님 대화술';
  upd();
}
function toHome(){
  document.querySelectorAll('audio').forEach(a=>a.pause());
  $('#deck').style.display = 'none'; $('#home').style.display = 'block'; renderHome();
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  document.title = '대장님 대화술';
}
function upd(){ const st = $('#stage'), m = st.scrollHeight - st.clientHeight; $('#pg').style.width = (m>0 ? Math.min(100, st.scrollTop/m*100) : 0) + '%'; }
let scT = 0;
$('#stage').addEventListener('scroll', () => { upd(); clearTimeout(scT); scT = setTimeout(() => store.set('wit.sc', W.parts[CI].key + '/' + Math.round($('#stage').scrollTop)), 300); }, {passive:true});
function openSheet(){
  const p = W.parts[CI];
  $('#sbox').innerHTML = `<h3>${LB(CI)?esc(LB(CI))+' ':''}${esc(p.title)}</h3>` + p.segs.map(s=>`<button data-to="${s.id}"><span class="k">${esc(s.badge||'')}</span><span class="tt">${esc(s.title||s.badge)}</span></button>`).join('');
  $('#sheet').classList.add('on');
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ const v = g.dataset.go; if (v==='home') toHome(); else go(+v, {keep: !!g.dataset.keep}); return; }
  const s = e.target.closest('#sbox button[data-to]');
  if (s){ $('#sheet').classList.remove('on'); const el = document.getElementById(s.dataset.to); if (el) el.scrollIntoView({block:'start'}); return; }
  if (e.target.id === 'sheet') $('#sheet').classList.remove('on');
});
$('#back').onclick = toHome;
$('#lst').onclick = openSheet;
const SIZES = [16, 18, 20];
let si = Math.max(0, SIZES.indexOf(+store.get('wit.fs') || 16));
function applySize(){ document.documentElement.style.setProperty('--fs', SIZES[si] + 'px'); }
$('#fs').onclick = () => { si = (si+1) % SIZES.length; store.set('wit.fs', SIZES[si]); applySize(); upd(); };
applySize();
/* 「나」 칸: 이 기기에만 저장 (예전 기술 사전과 같은 키) */
const MK = 'wit.me.';
function mountMe(){
  document.querySelectorAll('.me textarea').forEach(t=>{ t.value = store.get(MK + t.dataset.k) || ''; t.addEventListener('input', ()=> store.set(MK + t.dataset.k, t.value)); });
}
document.addEventListener('click', e => {
  if (e.target.id !== 'copyme') return;
  const out = [];
  W.parts.forEach(p => (p.me || []).forEach(([k, lab]) => { const v = (store.get(MK + k) || '').trim(); if (v) out.push(`[${p.no} ${p.title}] ${lab}: ${v}`); }));
  const msg = $('#copymsg');
  if (!out.length){ msg.textContent = '아직 적은 내용이 없습니다.'; return; }
  const txt = out.join('\n');
  const fb = () => { msg.textContent = '복사가 막혀 있습니다. 아래 글을 직접 복사하세요.'; const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'width:100%;height:160px;margin-top:8px'; msg.after(ta); ta.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=> msg.textContent = '복사했습니다. 메모나 대화창에 붙여 넣으세요.', fb); }catch(x){ fb(); }
});
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let m = h.match(/^p(\d+)$/);          // 예전 주소 #p3 = 전체 분석 3부
  if (m){ const i = idxOf('p' + m[1]); if (i >= 0) return go(i, {keep: true}); }
  const ki = h ? idxOf(h) : -1;
  if (ki >= 0) return go(ki, {keep: true});
  m = h.match(/^sk(.)$|^own(.)$/);       // 예전 기술 사전 주소
  if (m){ const i = idxOf('t' + (m[1] || m[2])); if (i >= 0) return go(i, {}); }
  if (h){ const i = W.parts.findIndex(p => p.segs.some(s => s.id === h)); if (i >= 0) return go(i, {to: h}); }
  toHome();
}
route();
window.addEventListener('hashchange', route);
</script>
</body>
</html>
