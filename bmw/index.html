<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMW 강의 · 진행 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{color-scheme:dark;--bg:#09090c;--card:rgba(20,20,25,.94);--line:#25252d;--line2:#34343f;--ink:#f4f4f7;--mut:#a6a6b2;--dim:#72727e;--ac:#a78bfa;--ac2:#7c5cf0;--acbg:rgba(139,92,246,.13)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(720px 420px at 80% -10%,rgba(124,58,237,.30),transparent 70%),radial-gradient(520px 340px at 105% 35%,rgba(76,29,149,.20),transparent 70%)}
button,a,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{position:relative;z-index:1;max-width:1280px;margin:auto;padding:18px 24px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-size:13px;color:var(--mut)}.brand b{color:var(--ink);font-weight:700;margin-right:6px}

.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:600}

.bar{background:none;border:0;padding:0;text-align:left;color:var(--dim)}

.bar.done i{background:#5b47b8}.bar.on i{background:var(--ac)}
.bar span{display:block;font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.on span{color:var(--ink);font-weight:600}.bar:hover span{color:var(--ink)}

.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.tab{background:#121217;border:0;border-right:1px solid var(--line2);padding:11px 6px;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px}
.tab:last-child{border-right:0}.tab em{font-style:normal;font-size:11px;color:var(--dim)}
.tab:hover{color:var(--ink)}.tab.on{background:var(--acbg);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ac)}.tab.on em{color:var(--ac)}

.sec{margin-top:30px}.sec:first-child{margin-top:0}
.sh{font-size:12px;color:var(--ac);font-weight:700;letter-spacing:.04em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.big{font-size:clamp(21px,2.4vw,30px);font-weight:750;line-height:1.45;letter-spacing:-.01em;margin:18px 0 0}

.media{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}

.gal{background:#0e0e12}.gal img{display:block;width:100%;height:auto}

.cap{font-size:12.5px;color:var(--mut);margin-top:7px}.credit{font-size:11px;color:var(--dim);margin-top:3px}

.aud .aq{font-size:21px;font-weight:700;line-height:1.5}.aud .as{font-size:12px;color:var(--mut);margin:4px 0 10px}.aud audio{width:100%;max-width:520px;height:36px}
.q{font-size:clamp(20px,2.3vw,28px);font-weight:750;line-height:1.45;margin:0 0 18px}

.qz{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.qb .ql{color:var(--ac);font-weight:800;margin-right:8px}
.qb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line2);border-radius:9px;padding:13px 14px;background:#16161c;font-size:15.5px;font-weight:600}
.qb:hover{border-color:var(--ac)}.qm{font-size:12px;font-weight:700;flex:none}
.qw{display:none;font-size:16.5px;line-height:1.7;color:#d8d8e0;padding:9px 4px 2px}
li.open .qw{display:block}
li.ok .qb{border-color:#22c55e;background:rgba(34,197,94,.12)}li.ok .qm{color:#4ade80}
li.no .qb{border-color:#f87171;background:rgba(248,113,113,.10)}li.no .qm{color:#fca5a5}
.qall{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.qsum{display:none;font-size:14.5px;font-weight:600;color:#c4b5fd}.qsum.show{display:inline}
.ex p{margin:0 0 18px;font-size:19.5px;line-height:1.8;color:#e4e4ea}
.ex .exi{margin:0 0 22px;padding:16px 20px;border-radius:12px;background:#15151b;border:1px solid var(--line)}
.ex .exi h4{margin:0 0 6px;font-size:22px;font-weight:800;color:#fff}.ex .exi h4 .n{color:var(--ac);margin-right:8px}.ex .exi p{margin:0}
.ex .exi.warn{background:none;border:0;border-left:3px solid #fcd34d;border-radius:0;padding:4px 0 4px 16px}.ex .exi.warn h4{font-size:16px;color:#fcd34d}.ex .exi.warn p{font-size:16.5px;color:var(--mut)}
.qt{color:#d8ccff;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#121217;border-radius:8px;padding:5px 10px 5px 5px;font-size:13.5px;color:var(--mut);text-align:left}
.chip img{width:54px;height:31px;object-fit:cover;border-radius:4px}.chip b{font-weight:600;color:var(--ink)}.chip small{font-size:11px;color:var(--dim);display:block}
.chip.on{border-color:var(--ac);background:var(--acbg)}.chip .k{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);margin-left:4px}.chip .k.v{color:#c4b5fd;border-color:#5b47b8}
.eprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mut)}
.mh{font-size:22px;font-weight:800;margin:0 0 8px}.mp{margin:0 0 14px;font-size:18.5px;line-height:1.8;color:#e0e0e8}
.mgrid{display:grid;gap:12px}

.sum li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:6px;background:var(--acbg);color:var(--ac);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.qs{margin:0;padding-left:20px}.qs li{margin:8px 0;font-size:18px}.qs small{color:var(--dim);font-size:12px}
.act{border:1px solid var(--line2);border-radius:10px;padding:14px 16px;margin-bottom:8px;background:#16161c;font-size:17.5px}.act small{display:block;color:var(--dim);font-size:11.5px}
.done-btn{width:100%;margin-top:22px;padding:12px;border-radius:9px;border:1px solid var(--line2);background:#16161b;font-weight:600;font-size:14px}
.done-btn.ok{background:var(--acbg);border-color:var(--ac);color:#ddd6fe}
.navrow{display:flex;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
/* 오른쪽 */
textarea{width:100%;min-height:140px;resize:vertical;background:#101014;border:1px solid var(--line2);border-radius:9px;padding:12px;font-size:14px;line-height:1.6;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--ac)}textarea::placeholder{color:var(--dim)}
.hint{font-size:11.5px;color:var(--dim);margin-top:8px}
.rc h3{margin:0 0 12px;font-size:15px}
.memo h5{margin:16px 0 4px;font-size:12px;color:var(--ac);font-weight:600}.memo h5:first-of-type{margin-top:0}
.memo p{margin:0;font-size:14px;color:#cfcfd8;white-space:pre-line}.memo .warn{color:#fcd34d}
.foot{font-size:12px;color:var(--dim);margin-top:18px}
.glance h3{color:var(--ac)}.gl-s{font-size:12px;color:var(--dim);font-weight:700;margin:14px 0 6px}.flow{margin:0;padding-left:20px}.flow li{font-size:14.5px;margin:5px 0;color:#d8d8e0}.keys{margin:0;padding-left:18px}.keys li{font-size:15px;margin:7px 0;font-weight:600}
@media(min-width:981px){.glance{position:sticky;top:16px}}
/* 크게 보기 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,4,6,.96);display:none;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.ov.open{display:flex}.modal{width:100%;max-width:1100px}

.modal img{display:block;width:min(100%,1000px);margin:auto}.modal .txt{background:#141419;border:1px solid var(--line);border-radius:10px;padding:22px;white-space:pre-line;font-size:15.5px;line-height:1.85}

.hide{display:none!important}
@media(max-width:980px){.grid{grid-template-columns:1fr}}

 .ex p{font-size:17px}.ex .exi h4{font-size:19px}.mp{font-size:16.5px}.chip img{display:none}
}

.eph .k{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--mut)}.eph .k.v{color:#c4b5fd;border-color:#5b47b8}
.eps{font-size:16px;color:var(--mut);margin:0 0 14px}
.deep{margin-top:22px}.dh{font-size:13px;color:var(--ac);font-weight:800;letter-spacing:.08em;margin-bottom:6px}

.deep p{font-size:19px;line-height:1.8;margin:0 0 14px;color:#e4e4ea}
.dx{margin-top:24px;padding:18px 20px;border-radius:12px;background:#15151b;border:1px solid var(--line)}.dx h4{margin:0 0 8px;font-size:20px;font-weight:800}.dx p{margin-bottom:12px}
.dsub{font-size:16px;font-weight:800;color:#d6d0f5;margin:28px 0 10px}
@media(max-width:600px){.eph{font-size:20px}.maxim{font-size:19px}.deep p{font-size:17px}}
.dg{border:1px solid #2a2e34;border-radius:14px;background:#1b1e22;margin-bottom:14px;overflow:hidden}
.dg-top{padding:16px 18px 10px;border-bottom:1px solid #2a2e34}.dg-q{font-size:20px;font-weight:750;line-height:1.5;color:#e8eaed}.dg-s{font-size:12.5px;color:#8f96a0;margin-top:3px}
.dg-body{max-height:300px;overflow-y:auto;padding:6px 0;position:relative}

.dg-who{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}.dg-who b{font-size:15px;color:#e8eaed}.dg-who time{font-size:13px;color:#8f96a0;font-variant-numeric:tabular-nums}

.dg-seek{position:relative;flex:1;height:22px;cursor:pointer}.dg-rail{position:absolute;left:0;right:0;top:9px;height:4px;background:#2a2e34;border-radius:2px}.dg-fill{position:absolute;left:0;top:9px;height:4px;background:#6f9bff;border-radius:2px;width:0}

.sum li b{display:block;font-weight:750}.sum li .sd{display:block;font-size:16.5px;color:var(--mut);font-weight:400;margin-top:4px;line-height:1.65}
.qs li{margin:10px 0}
.tabs{position:sticky;top:0;z-index:6;background:#121217}

.bar .bn{font-weight:700;margin-right:5px}
@media(max-width:600px){
 .progress{padding-bottom:0}.ph{margin-bottom:6px}
 .bars{display:flex;overflow-x:auto;gap:8px;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.bars::-webkit-scrollbar{display:none}

<div class="wrap">
<div class="top"><div class="brand"><b>BMW 강의</b>11월 3일, 대장님은 무엇을 보셨을까 · 2026.11.08</div><div class="tools"><a class="btn" href="https://okhyun304-dot.github.io/action-class/" target="_parent">강의 아카이브 ↗</a></div></div>

 <div class="col"><section class="card">
  <div class="ch"><h3 id="stageName"></h3><small id="stageTime"></small></div>

 </section></div>

  <section class="card rc glance"><h3>이 장 한눈에</h3><div class="gl-s">흐름</div><ol class="flow" id="flow"></ol><div class="gl-s">핵심</div><ul class="keys" id="keys"></ul></section>
 </div>

<script>
const ROOT='https://okhyun304-dot.github.io/action-class/';
const BOOK='https://okhyun304-dot.github.io/book-261103/';
const V=(id,title,sub)=>({id,t:'video',src:BOOK+'영상/'+id+'.mp4',poster:BOOK+'영상/'+id+'.jpg',title,sub,tag:'현장 영상'});
const AI=(id,title,sub)=>({id,t:'video',src:BOOK+'영상/'+id+'.mp4',poster:BOOK+'영상/'+id+'.jpg',title,sub,tag:'AI 낭독',grp:'d'});
const A=(id,quote,sub)=>({id,t:'audio',src:BOOK+'음성/'+id+'.m4a',title:quote,sub,tag:'현장 음성'});
const P=(ids,title,sub)=>({id:ids[0],t:'pics',src:ids.map(i=>'media/'+i+'.jpg'),thumb:'media/t_'+ids[0]+'.jpg',title,sub,tag:'사진 '+ids.length+'장'});
const D=(id,title,sub,tag)=>({id,t:'pics',src:['media/'+id+'.jpg'],thumb:'media/t_'+id+'.jpg',title,sub,tag:tag||'도해',grp:'d'});
const Y=(id,title,sub)=>({id,t:'yt',thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg',title,sub,tag:'유튜브',grp:'o'});
const O=(id,title,sub,credit)=>({id,t:'pics',src:['media/'+id+'.jpg'],thumb:'media/t_'+id+'.jpg',title,sub,credit,tag:'사진',grp:'o'});

  '④ 엔진과 하체 — 나를 위한다는 건 내 엔진이 좋아야 한다는 것 — 새벽에 일어나서 바로 튀어 나갈 정도의 체력입니다. 그래서 하체. “상체는 잘 큽니다. 마르면 금방 커요. 하체는 안 큽니다.” 하체를 키울 끈기가 있는 사람은 상체도 키울 수 있습니다.',
  '오키 정리: 몸을 만드는 건 나를 위해, 과정을 보여주는 건 남을 움직이기 위해. 보여주는 것 ≠ 보여주려고 사는 것.',
  '⑤ 힘이 남아서 일한다 — 체력이 남아야 일합니다. “일을 하기 위해서 힘을 내는 게 아니라, 힘이 나와서 일을 하는 겁니다.”',

  '③ 몸을 옮긴다 — 대장님 자신이 그랬습니다. “저는 어쨌든 제 몸을 계속 이동시킨 거예요.” 부산에 계속 있었다면 지금처럼 안 됐을 거라고.',
  '④ 그냥 낸다 — 버틴 방식: “저는 그런 걸로 흐물흐물해지는 사람이 아니에요. 그냥 낸 겁니다. 그냥.”',
  '⑤ 마음은 늦게 도착한다 — 서울 올라온 지 2년이 넘어서야 그 의미를 조금 알겠다는 제 말에: “마음이라는 건 원래 늦게 도착합니다.” 말은 빨리 도착하지만, 마음은 편지처럼 늦게 도착한다고.',
  '⑥ 체력이 짜증을 막는다 — “그럼 그 마음이 도착할 때까지 어떻게 버티느냐.” “체력이 좋아야만 그런 일에 짜증이 안 납니다.” 체력이 없으면 “내가 이렇게까지 투자했는데 왜 저 지랄이야” 하고 짜증이 납니다. “하체가 좋으면 짜증이 안 납니다. 왜냐하면 웬만한 것들은 그냥 크게 보고, 이 안에서 통째로 생각할 수 있는 힘이 생기거든요.”']},

때 안주 먹어요?"], [81.0, 85.4, "대장님", "우리는 치킨 먹을 때 맥주를 먹습니다."], [85.0, 88.0, "대장님", "맥주를 먹으려고 치킨을 먹는 게 아니고요."], [88.0, 93.3, "대장님", "치킨 먹고, 맥주로 입을 식힌다는 느낌이잖아요."], [94.0, 98.5, "대장님", "그러면 맥주의 용도가 외국이랑 한국이랑 전혀 다른 겁니다."], [98.0, 100.5, "대장님", "수제맥주는 너무 맛이 강해요."], [100.0, 103.3, "대장님", "맛이 있다 해도 강합니다."], [103.0, 106.9, "대장님", "그런데 한국 사람들은 맥주를 애초에 맛으로 소비하지 않아요."]], "A05": [[1.0, 6.0, "대장님", "사실 제가 아니까 여기를 오는 겁니다."], [6.0, 9.0, "대장님", "일반인이 본인 혼자 이 앞을 지나갔으면 여기 안 들어와요."], [19.0, 20.0, "대장님", "여기 부대찌개도 맛있어요."], [23.9, 27.9, "대장님", "원래 부대찌개를 잘하는 집이 햄, 소시지를 잘합니다."], [27.9, 31.9, "대장님", "옛날에 이태원 바다식당에 데려갔었잖아요."], [31.0, 35.3, "대장님", "거기가 햄, 소시지를 잘하잖아요."], [35.0, 37.0, "대장님", "그래서 따로 파는 겁니다."], [37.0, 41.7, "대장님", "왜냐하면 부대찌개에 그게 다 들어가잖아요."], [52.0, 54.2, "대장님", "햄, 소시지가 다 들어가는 음식이니까, 그걸 잘 다루는 식당은 소시지를 안 팔 수가 없습니다."], [71.0, 73.0, "대장님", "약간 그런 게 있어요."]], "A06": [[27.5, 33.1, "대장님", "예를 들어서 회사에서 보통 이렇게 합니다."], [35.8, 36.6, "대장님", "유명한 강사가 와서 강의를 해요."], [36.6, 41.4, "대장님", "실패가 중요한 조직이 돼야 됩니다."], [41.4, 44.2, "대장님", "실패를 두려워하지 않는 힘을 만드세요."], [69.3, 75.5, "대장님", "사실 중요한 건, 내가 어떤 조직에 속했을 때 \"나는 저 사람 말에 반대를 해도 돼."], [87.0, 89.0, "대장님", "저 리더라면 내가 반대하는 말을 해도 인정하고, 본인이 틀린 게 있으면 인정할 거야.\" 이게 있는 게 더 중요한 겁니다."], [89.0, 93.0, "대장님", "그게 안 된 상태에서 \"우리 오늘부터 실패 학습을 합시다."], [99.0, 102.0, "대장님", "그런데 형식이 바뀐다고 해서 팀원들이 실패에 강한 조직이 되는 게 아닙니다."]], "A07": [[1.0, 6.0, "대장님", "왜 그런지 모르니까 심연에 빠지는 겁니다."], [6.0, 10.0, "대장님", "내가 왜 이렇게 돈을 벌었는데도 불안하지?"], [10.0, 12.0, "대장님", "돈을 버는데도 왜 자유롭지 못하지?"], [12.0, 15.0, "대장님", "왜 돈을 벌면 더 우울하지?"], [35.8, 42.6, "대장님", "왜냐하면 그런 사람은 삶의 과정을 억지로 삭제당한 사람이거든요."]], "A08": [[1.0, 3.0, "대장님", "얘네가 그런 걸 되게 잘합니다."], [3.0, 6.0, "대장님", "예를 들어서 문 여는 것도 이렇게 천천히 열잖아요."], [7.0, 15.0, "대장님", "그게 원래는 캡콤이 초창기 때 기술이 안 되니까 로딩 시간이 너무 길었던 겁니다."], [22.0, 28.1, "대장님", "옛날에 컴퓨터 안 좋은 거 쓸 때 불러오기 하면 게이지가 막 올라가잖아요."], [28.0, 29.1, "대장님", "그게 싫은 거예요."], [29.0, 36.4, "대장님", "그런데 기술적 제약이 있고 로딩 시간은 확보해야 되는데, 어떻게 해야 될까?"], [40.0, 44.6, "대장님", "그게 생각보다 시간이 길잖아요."], [44.0, 49.0, "대장님", "근데 이게 시리즈의 어떤 문법처럼 굳어진 거예요."], [49.0, 52.5, "대장님", "지금은 사실 기술이 좋아졌는데도 이렇게 엽니다."], [64.2, 68.2, "대장님", "이렇게 한쪽으로 여는 문이 있고, 양문이 있잖아요."], [67.0, 71.0, "대장님", "양문은 되게 큰 어떤 전개가 열릴 때 열립니다."], [72.0, 76.2, "대장님", "이렇게 열 때가 있고, 저렇게 열 때가 있는데, 이 두 개는 완전히 다른 거예요."]], "A09": [[0.0, 6.1, "대장님", "러닝을 원래 하던 사람한테는 뛰는 건 어렵지 않습니다."], [1.0, 3.0, "대장님", "근데 사실 하는 거는 어렵지 않아요."], [7.4, 9.4, "대장님", "어려운 건 보여주는 거예요."], [9.0, 11.2, "대장님", "그런 사람들은 이걸 무시합니다."], [11.0, 19.9, "대장님", "난 잘하니까 언제든지 마음먹으면 사람들한테 매일매일 인증하고 보여줄 수 있다.\" 아니에요."], [21.0, 26.0, "대장님", "내가 잘하는 것일수록 사람들한테 인증하고 보여주는 게 귀찮습니다."], [25.4, 29.5, "대장님", "그게 지금 그 저주에 빠진 겁니다."], [29.5, 37.5, "대장님", "불이 붙었을 때 \"저 오늘 뜁니다, 이번 주에 더 뜁니다\" 이걸 보여주는 능력이 없는 거잖아요."], [37.0, 40.0, "대장님", "자기가 뛰는 건 잘하죠."], [40.0, 42.0, "대장님", "다른 사람들도 열심히 뛰고 있고요."], [53.0, 55.0, "대장님", "호나인님이 \"나 달려요\" 하고 매일 보여줘야 되는데, 이게 생각보다 달리기보다 어렵습니다."], [60.3, 62.3, "대장님", "근데 어렵다니까요."], [64.3, 67.0, "대장님", "하는 데는 오래 안 걸리는데, 심리적으로 이게 어려운 사람들한테는 되게 어려운 겁니다."], [70.0, 74.1, "대장님", "보여주는 거 자체에 대해서 생각을 너무 많이 하는 거예요."], [74.0, 79.6, "대장님", "이거 보여줬다가 사람들이 자랑한다고 생각할까?"], [81.0, 85.0, "대장님", "내가 보여주면 이 사람들 의지가 바뀌나?"], [83.3, 85.5, "대장님", "생각이 너무 많으면 못 합니다."], [85.5, 86.9, "대장님", "그러니까 이것도 능력이에요."], [86.9, 88.9, "대장님", "오히려 이게 더 능력입니다."], [94.0, 96.9, "대장님", "러닝을 덜 해도, 호나인님보다 러닝 능력이 한 30분밖에 안 돼도, 이 능력이 좋은 사람이 더 낫습니다."], [102.9, 104.9, "대장님", "생각이 너무 많아요."]], "A10": [[0.0, 14.0, "대장님", "단골 장사를 하면 단골들이 약간 그게 있어요."], [0, 1.0, "대장님", "왜냐면 손님들 중에 누가 그걸 알아요?"], [7.0, 9.0, "대장님", "유세 아닌 유세요."], [12.2, 20.0, "대장님", "단골이랑 관계가 좋아 보이지만, 어차피 사장 입장에서는 새로운 손님을 받아야 되잖아요."], [22.0, 24.0, "대장님", "그런데 단골이 자꾸 요구하는 게 있다니까요."], [27.0, 30.0, "대장님", "대우받기를 원하니까요."], [30.9, 34.1, "대장님", "정말 대우를 받으려면 단골로서 요구하지 않는 느낌을 줘야 됩니다."], [34.0, 36.1, "대장님", "반대로요."], [36.0, 40.4, "대장님", "진짜 내일이라도 안 올 사람처럼 하면 단골 대접을 해줍니다."], [51.5, 55.6, "대장님", "육갑도 여러분 데리고 한참 가다가 안 가니까, 저한테 대접을 해주는 거예요."], [58.0, 62.0, "대장님", "결국은 다 인간 심리라 그렇습니다."], [61.9, 64.6, "대장님", "제가 너무 알아서 가주잖아요?"], [66.0, 67.0, "대장님", "그런데 알아서 안 가잖아요?"], [69.0, 72.8, "대장님", "내가 뭘 잘못했나?"], [72.8, 75.0, "대장님", "자기는 변한 게 없는데 이 사람이 안 오니까요."], [75.0, 78.0, "대장님", "근데 거기에 대해서 제가 뭐라고 얘기할 필요가 없는 거잖아요."], [78.0, 80.0, "대장님", "그냥 해맑게 가면 되는 겁니다."], [80.0, 82.0, "대장님", "그 사람 입장에서 자기가 머리를 굴리는 거죠."]], "A11": [[0.0, 15.2, "대장님", "그 얘기는 뭐냐면, 인간이 무한정 열려 있는 오픈월드를 추구할 것 같지만, 생각보다 거기서는 더 공허함을 느낀다는 겁니다."], [15.2, 23.9, "대장님", "한정돼 있고, 내가 돌이킬 수 없는 것들이 많아질수록, 그 안에서 인간은 의미를 찾는 거예요."], [23.0, 31.4, "대장님", "그게 고통스러울지라도, 의미를 찾는 데서 오는 인생의 두터움이 더 만족감이 있다는 거죠."], [31.0, 35.1, "대장님", "즐겁다고 하지는 못해도 만족스러운 거예요."], [35.0, 41.7, "대장님", "그리고 거기서 느끼는 행복이라는 건 그 전의 행복과는 조금 다른 차원의 행복이 있거든요."], [41.0, 48.1, "대장님", "애를 보면 알겠지만, 힘들어도 그 애를 보면서 느끼는 행복은 조금 다른 느낌이에요."], [48.0, 52.5, "대장님", "그게 독신인 사람들이 느끼는 행복이랑은 좀 다릅니다."], [51.0, 54.0, "대장님", "질로 표현할 수 있을 것 같아요."], [54.0, 57.0, "대장님", "콘텐츠가 아니라 이건 퀄리티의 문제거든요."]], "A12": [[17.0, 20.0, "대장님", "여러분이 상대하는 건 부인이 아니고 장인 장모님이고, 여자라면 남편이 아니고 시아버지, 시어머니라고요."], [20.0, 21.0, "대장님", "그러니까 비욘드로 가는 겁니다."], [26.0, 28.0, "대장님", "그러면 이런 것들이 또 생겨요."], [29.0, 33.9, "대장님", "내가 이런 생각을 갖고 있어도, 이런 얘기를 하면 장인 장모님이 뭐라고 할 수도 있고, 시아버지, 시어머니가 뭐라고 할 수도 있는 거예요."], [35.0, 40.2, "대장님", "그런 것들이 문제가 생기니까 이게 복잡해지는 거거든요."], [40.0, 43.0, "대장님", "그 안에서 방어막을 잘 만들면서 부부끼리 공고하게 할 수 있게 하는 건, 제 생각에는 남자의 역할이라고 생각해요."], [50.0, 52.0, "대장님", "아이언돔 있잖아요."], [52.0, 54.6, "대장님", "그걸 남자가 좀 해줘야 돼요."], [54.6, 58.4, "대장님", "아이언돔을 쳐주는 건 남자 역할인 것 같아요."], [58.0, 61.0, "대장님", "왜냐면 융단폭격이 장인 장모보다는 시아버지, 시어머니 쪽이 훨씬 세거든요."]], "A13": [[0.0, 29.9, "대장님", "그 영화는, 처음에는 좌절 같았던 게 결국 행복을 줬다는 얘기거든요."], [0, 1.0, "대장님", "그게 중요한 거예요."], [1.0, 3.0, "대장님", "저기에 뭐가 있다는 걸 아는 거."], [3.0, 5.0, "대장님", "알면 그걸 밀어붙이는 거."], [5.0, 8.0, "대장님", "근데 일단 대부분 남자들은 그걸 몰라요."], [8.0, 9.0, "대장님", "저기에 뭔가 있다는 걸 몰라요."], [9.0, 12.0, "대장님", "그래서 \"야, 다 비슷한데?"], [12.0, 14.0, "대장님", "이게 삶인 줄 알아요."], [16.0, 19.0, "대장님", "어항끼리 물어보는 거잖아요."], [19.0, 83.0, "대장님", "바다로 가야 돼요."], [21.0, 23.0, "대장님", "「니모를 찾아서」 보면, 어항에 있다가 바다로 나가잖아요."], [29.0, 33.0, "대장님", "그 영화의 교훈을 저는 그렇게 생각해요."], [32.0, 40.0, "대장님", "처음에는 자기한테는 실망과 좌절이고, 어떻게 보면 탈락 같은 거였잖아요."], [48.0, 58.0, "대장님", "결국 그건, 예기치 못한 좌절이 사람한테 새로운 지평을 열어줄 수 있다는 걸 말하는 영화거든요."], [58.0, 67.5, "대장님", "그러니까 결국 어떤 사람이 깨지려면, 어항이든 작은 바다든, 작은 바다가 그 사람한테는 어항이죠, 거기서 깨져봐야 돼요."], [67.0, 71.0, "대장님", "그러면 이제 알게 돼요."], [68.9, 71.5, "대장님", "문제는 아무도 안 깨줘요."], [71.0, 75.0, "대장님", "근데 깰 생각을 못 해요."], [71.5, 73.1, "대장님", "내가 깨야 돼요."], [75.0, 76.0, "대장님", "어항 안에서 같이 얘기하니까요."], [76.0, 78.0, "대장님", "밖의 상황을 모르니까요."], [78.0, 79.3, "대장님", "어항에 있는 애들끼리 \"야, 저거 깨볼까?\" 이런 생각을 안 해요."], [81.0, 82.9, "대장님", "왜냐면 그게 어항으로 안 보여요."]], "A14": [[0.0, 29.5, "대장님", "싸우는 것도 정이 있어야 싸워요."], [1.0, 2.6, "대장님", "진짜 싸워요."], [3.0, 7.0, "대장님", "그래서 티격태격하는 부부가 낫다니까요."], [7.0, 9.0, "대장님", "정말 사이 안 좋은 부부는 안 싸워요."], [9.0, 10.0, "대장님", "말을 안 해요."], [10.0, 13.0, "대장님", "근데 그게 사이가 안 좋다고 말하기도 애매해요."], [13.0, 15.0, "대장님", "왜냐면 너무 심각하게 싸우지도 않거든요."], [15.0, 17.0, "대장님", "남들이 봤을 땐 그냥 평범해요."], [17.0, 20.5, "대장님", "하지만 둘은 이미 멀어져 있어요."], [22.0, 24.0, "대장님", "갈등이 있긴 한데, 싸울 정도도 아니에요."], [29.0, 31.4, "대장님", "격렬한 싸움, 봐요."], [32.2, 34.4, "대장님", "격렬이라는 말이 뭐예요."], [34.0, 37.3, "대장님", "격렬한 건 솟구치는 거예요."], [37.0, 39.7, "대장님", "서로 마음이 솟구쳐야 싸우고 있는 거예요."], [39.0, 41.6, "대장님", "근데 격렬하게 싸워지지도 않아요."], [41.0, 44.0, "대장님", "그러면 그 말은 뭐냐 하면, 꺼져 있는 불이에요."], [46.5, 48.1, "대장님", "그냥 들어가서 자요."], [48.1, 49.4, "대장님", "거의 남 아니에요?"], [49.4, 50.3, "대장님", "거의 남이죠."]], "B01": [[0.0, 15.8, "대장님", "내 일이 중요해서 운동을 하는 거지, 운동 때문에 내 일을 하는 게 아니란 말입니다."], [1.0, 6.6, "대장님", "하체 하는 사람들은 애초에 그런 게 없습니다."], [17.0, 28.0, "대장님", "BMW 하는 날, 저는 하체를 거의 스쿼트 500개 합니다."], [27.5, 30.5, "대장님", "일요일에 더 많이 하거든요."], [30.5, 50.0, "대장님", "200개, 300개 하잖아요?"], [38.8, 40.8, "대장님", "500개 하면 중량이 생깁니다."], [48.8, 50.8, "대장님", "무게를 안 들어도 부하가 걸려요."], [70.8, 77.0, "대장님", "BMW 할 때, 강의를 여러 번 할 때 있잖아요."], [78.0, 82.0, "대장님", "그 시간 시간 사이에 운동을 다 합니다."], [81.8, 85.0, "대장님", "그러니까 하체가 튼튼한 겁니다."]], "B02": [[5.0, 7.0, "대장님", "저는 예전부터, 20대부터 사실 그 얘기가 싫었습니다."], [9.0, 13.0, "대장님", "어렸을 때도 \"너도 내 나이 돼 봐라\" 했잖아요."], [19.0, 20.6, "대장님", "징글징글합니다."], [23.0, 27.0, "대장님", "그게 현실일 수도 있겠죠."], [27.6, 31.6, "대장님", "그런데 저한테 중요한 건 그 사람들이 그렇다는 게 아니라, 나는 그렇게 살지 않겠다는 거였습니다."], [33.6, 38.0, "대장님", "그렇게 될 수 있다고 하면, 저는 안 되는 방법을 찾았던 것 같습니다."], [39.6, 41.6, "대장님", "그런 사람들이 싫었습니다."], [41.0, 45.0, "대장님", "그 사람들 말이 맞을 수도 있잖아요."], [47.6, 52.0, "대장님", "그래서 제 사고방식은 그렇게 안 되는 방법을 찾는 거였습니다."], [51.6, 55.6, "대장님", "그러려면 운동을 해야 되고,"], [54.0, 59.6, "대장님", "하체 운동을 해야 되고,"], [55.0, 57.0, "대장님", "상체 운동을 해야 되고,"], [57.0, 60.0, "대장님", "발성을 연습해야 되고,"], [59.6, 62.6, "대장님", "언어도 좀 버티컬하게 써야 되고."], [62.0, 66.6, "대장님", "그걸 제가 그때부터 연구한 겁니다."], [70.0, 71.0, "대장님", "선배들이 그런 얘기를 할 때 욕만 하는 게 아니라, 욕을 하면서도 속으로 저렇게 되지 않으려면 어떻게 해야 하나, 그 방법을 혼자서 많이 연구했던 것 같습니다."], [76.6, 81.6, "대장님", "그렇게 연구를 많이 해서, 되고 나서는 그냥 그 모습으로 보여 줬습니다."], [81.6, 84.6, "대장님", "그렇다고 그걸 보여 주면서 통쾌함을 느낀 것도 아닙니다."]], "B03": [[0, 1.0, "대장님", "저는 오히려 이걸 안 하면 안 될 것 같은 느낌이 듭니다."], [19.9, 27.7, "대장님", "그리고 제가 여러분보다 어차피 나이가 많잖아요."], [32.0, 36.4, "대장님", "내가 애들 데리고 뭔 얘기를 해."], [36.4, 46.0, "대장님", "이런 사람이라면 기본적으로 할 말도 없을 거고, 술 먹으면 또 힘도 없을 거고, 그럼 이따가 \"나 먼저 갈게\" 하고 갈 거 아닙니까."], [46.0, 47.3, "대장님", "그런데 저는 그게 아니잖아요."], [47.0, 53.7, "대장님", "어쨌든 얘기를 많이 하고, 대화를 하고, 이 안에서 에너지를 막 꽂잖아요."], [53.0, 55.0, "대장님", "꽂는단 말입니다."], [55.0, 59.0, "대장님", "그런데 에너지를 꽂는 이유는 제가 에너지가 넘쳐서 그런 겁니다."], [59.0, 62.0, "대장님", "이걸 다 꽂아 주고 나서도 저는 남습니다."], [62.0, 64.0, "대장님", "솔직히 이렇게 해 주고 집에 가잖아요?"], [63.0, 67.0, "대장님", "여기서 가면 저 존나 뛸걸요."], [70.0, 74.0, "대장님", "힘이 남으니까 일하는 겁니다."], [74.0, 79.0, "대장님", "일을 하기 위해서 힘을 내는 게 아니라, 힘이 나와서 일을 하는 겁니다."], [79.0, 80.0, "대장님", "너무 재밌으니까."]], "B04": [[0.2, 6.3, "대장님", "이타적으로 살면서 이기적일 수도 있구나."], [6.0, 12.1, "대장님", "이기적으로 사는 게 이타적일 수 있구나."], [9.0, 11.0, "대장님", "그분이 하는 게 되게 풍족했습니다."], [12.1, 16.6, "대장님", "여러분, 베푸세요.\" 이런 게 아니었어요."], [20.0, 22.0, "대장님", "그 사건 알아요?"], [32.0, 34.0, "대장님", "그분 잘못이 아닌데요."], [34.0, 35.0, "대장님", "심장병 환자들을 돕는 일을 했는데 누가 음해를 했습니다."], [39.6, 45.6, "대장님", "그리고 그분 이름으로 된 재단이 있었는데, 그 재단을 순수하게 운영한 게 아니라 횡령했다고 누가 음해를 한 겁니다."], [45.0, 46.0, "대장님", "그런데 그분은 그런 게 전혀 없었습니다."], [46.0, 49.0, "대장님", "재단을 누구한테 맡겼던 거거든요."], [60.6, 65.6, "대장님", "오늘 여기 온 것도 여러분 위해서 하는 거다."], [61.0, 63.0, "대장님", "내가 정말 이게 좋아서 한다."], [65.0, 67.0, "대장님", "그렇게 에너지 있게 하시는 겁니다."], [67.0, 69.0, "대장님", "그런 일을 당하고 있어도 그건 내 잘못이 아니고, 밝혀질 거다."]], "B05": [[0.0, 6.8, "대장님", "어떤 애가 부산에서 올라왔어요."], [0, 1.0, "대장님", "그리고 아마 사회적 문제가 될 거예요."], [6.0, 8.0, "대장님", "부자인데 서울에 올라왔어요."], [14.0, 18.0, "대장님", "왜냐하면 애들은 계속 거기서 계급을 나누거든요."], [18.0, 20.0, "대장님", "애들은 더 그런 걸 합니다."], [21.0, 32.0, "대장님", "서울 사람들끼리 모여 있어요."], [23.0, 24.0, "대장님", "강남에 있어요."], [24.0, 27.2, "대장님", "근데 부자인 건 필요 없어요."], [24.0, 25.0, "대장님", "근데 한 애가 부산 애예요."], [27.0, 29.0, "대장님", "그 애가 사투리를 쓰잖아요."], [34.4, 35.9, "대장님", "사투리라는 게 뭡니까."], [38.0, 39.7, "대장님", "근데 걔가 사투리를 써요."], [40.0, 42.0, "대장님", "그러면 서울 사람 입장에서는 그 애를 차별하게 됩니다."], [47.0, 50.0, "대장님", "그게 태생을 가르는 거예요."], [50.0, 51.3, "대장님", "태생을 볼 수 있는 거죠."]], "B06": [[0.0, 6.2, "대장님", "제 생각엔 그래요."], [1.0, 16.0, "대장님", "하지만 그 마음은 늦게 도착해요."], [4.0, 6.0, "대장님", "편지 같은 거예요."], [6.0, 11.4, "대장님", "내가 이 사람을 좋다고 얘기할 때 말은 빠르지만, 편지는 늦게 도착하잖아요."], [11.0, 16.2, "대장님", "우체국 통에 넣어서 보내야 되잖아요."], [16.0, 18.2, "대장님", "월세 내는 것도 비슷한 것 같아요."], [18.2, 22.7, "대장님", "마음은 늦게 도착합니다."], [22.7, 27.0, "대장님", "흐름을 그렇게 보고 해야 된다고 봐요."], [45.0, 51.0, "대장님", "말과 마음은 다르니까, 마음이 부족할 때까지는 그냥 일해 보자, 그런 겁니다."], [58.0, 60.0, "대장님", "제 생각에는 그게 노력이고, 그게 체력인 것 같아요."], [60.0, 62.4, "대장님", "체력이 좋아야 돼요."], [62.0, 64.8, "대장님", "체력이 좋아야만 그런 일에 짜증이 안 납니다."], [64.0, 67.5, "대장님", "체력이 안 좋으면 짜증 날 거예요."], [67.0, 70.4, "대장님", "내가 이렇게까지 투자했는데 왜 저 지랄이야."], [70.0, 72.0, "대장님", "짜증 나겠지요."], [72.0, 74.7, "대장님", "하체가 좋으면 짜증이 안 납니다."], [83.0, 85.0, "대장님", "그게 운동이에요."], [85.0, 88.6, "대장님", "그래서 행동바디가 그렇게 중요한 겁니다."]], "B07": [[1.0, 5.3, "대장님", "저는 친구를 무(無)로 만드는 게 어렵다고 생각합니다."], [20.0, 24.0, "대장님", "친구를 무로 만든다는 건, 이 친구가 없었던 시절처럼 살아야 한다는 얘기예요."], [34.9, 44.0, "대장님", "왜냐하면 우리는 중학교, 고등학교, 대학교를 거치면서 많은 사람들을 만나고 접하고 친구를 만들잖아요."], [43.9, 52.9, "대장님", "제가 여러분한테 \"옛날 동네 친구 만날 필요 없다\" 이렇게 쉽게 얘기하지만, 저도 쉽지 않았어요."], [65.0, 71.9, "대장님", "모임을 하면서 느끼는 건, 사람들이 친구들이랑 끊지를 못한다는 거예요."], [72.0, 74.0, "대장님", "제가 말하는 건 끊으라는 겁니다."], [74.0, 75.0, "대장님", "근데 이것도 되게 조심스러운 게, 오해가 생겨요."]], "B08": [[0, 1.0, "대장님", "지금도 마찬가지예요."], [7.0, 10.5, "대장님", "제 생각 자체가, 화살표로 치면 우상향이에요."], [20.0, 23.0, "대장님", "저는 아직 여기인데, 여기서 그걸 하면 제가 그걸 어떻게, 저는 잘 못하겠어요."], [26.0, 28.5, "대장님", "저는 잃을 게 많아요."], [30.1, 34.0, "대장님", "앞으로 잃을 게 많다고 생각합니다."], [34.0, 38.0, "대장님", "근데 그게 이루어질지 안 이루어질지는 상관없어요."], [38.0, 41.0, "대장님", "그냥 그걸 추구하는 게 저한테 중요해요."], [41.0, 49.0, "대장님", "저는 그걸 추구하는 게 재밌는 거고, 그 추구가 그냥 삶의 목적인 겁니다."], [49.0, 55.0, "대장님", "뭘 해서 내가 부자야, 돈이 많아, 집에 뭐가 있어."], [54.0, 57.0, "대장님", "저는 그런 데서는 재미를 못 느끼겠어요."], [57.0, 61.0, "대장님", "그렇게 사는 사람들치고 재밌는 사람도 별로 없고요."]], "B09": [[0, 1.0, "대장님", "그게 잘됐다 잘못됐다를 떠나서, 결국은 그 상황 안에서 내가 내 인생의 주체로서 중심을 잡는 게 중요한 겁니다."], [1.0, 9.0, "대장님", "저는 인생에서 이렇게 생각해요."], [18.0, 22.8, "대장님", "그럼 얘는 피떡이 되잖아요."], [30.0, 32.5, "대장님", "그만큼 되게 잔혹합니다."], [40.0, 44.0, "대장님", "결혼할 때쯤 되면 대부분 그런 느낌이 들 정도의 선택을 하게 돼요."], [52.0, 58.8, "대장님", "그 안에서 내가 나로서의 주체성을 회복하는 거겠지요."], [66.6, 70.0, "대장님", "지금도 마찬가지예요."], [69.0, 74.5, "대장님", "오늘도 마찬가지고, 어제도 마찬가지고, 제 삶도 마찬가지예요."], [74.0, 78.6, "대장님", "저는 그걸 정확히 알아요."], [83.0, 86.0, "대장님", "제가 어떤 선택을 하면, 누군가는 거기서 코너에 몰려요."], [86.0, 88.0, "대장님", "정도의 차이예요."], [87.0, 90.3, "대장님", "근데 저는 그 생각을 하는 거예요."], [90.0, 93.6, "대장님", "내가 그 선택을 하는 이유가 있으니까."], [93.0, 103.6, "대장님", "그 선택이 조금 잘못됐다고 느껴질 수는 있겠지만, 만약에 내가 어떤 기준점을 갖고 한 거라면, 그것도 하나의 경험이 돼야 돼요."], [107.0, 112.1, "대장님", "그런 식으로 하면, 그 자체로 경험이 노련한 사람처럼 느껴지게 됩니다."]], "B10": [[0.0, 5.1, "대장님", "근데 저는 아버지, 어머니한테 그걸 해 드린 적이 없어요."], [17.0, 35.0, "대장님", "저는 여러분을 보면서 이걸 하는 게 좋고, 이런 걸 하는 게 좋은데, 정작 우리 아버지, 어머니한테 얼마나 하느냐를 보면, 당장 제 동생이랑 아버지, 어머니랑 가는 여행에서도 그 링크 하나를 만들어 드린 적이 없거든요."], [35.8, 44.7, "대장님", "제가 좀 되게, 제 능력 대비 잘못하고 있다."], [58.0, 60.8, "대장님", "참 제가 잘못하고 있는 것 같다는 생각을 많이 해요."], [68.0, 81.0, "대장님", "제가 사람들한테 말하는 것과 제 삶은 다른 거예요."], [76.0, 78.7, "대장님", "그걸 인정해야 되고, 인정하는 게 어려운 것 같아요."], [78.0, 80.3, "대장님", "근데 어쨌든 달라요."], [80.3, 83.0, "대장님", "제가 사람들한테 이렇게 얘기한다고 해서 제가 이렇게 살 수 있는 건 아니에요."], [83.0, 85.9, "대장님", "저는 그렇게 못 해요."]], "B11": [[8.0, 11  if(r.t==='video')return '<div class="media"><video controls playsinline preload="metadata" poster="'+esc(r.poster)+'" src="'+esc(r.src)+'"></video></div><div class="cap">'+esc(r.tag)+' · '+esc(r.title)+' — '+esc(r.sub)+'</div>';
 if(r.t==='yt')return '<div class="media"><iframe src="https://www.youtube-nocookie.com/embed/'+r.id+'?rel=0&modestbranding=1&playsinline=1" title="'+esc(r.title)+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div><div class="cap">유튜브 · '+esc(r.title)+' — '+esc(r.sub)+'</div>';
 return gal(r.src,r.title,r.credit)+(opt.nocap?'':'<div class="cap">'+esc(r.title)+(r.sub?' — '+esc(r.sub):'')+'</div>')}
function sayBox(t){return ''}

// ── 다글로식 실제 음성 (받아쓰기 + 재생) ──
const AVC={'대장님':'#9fb6d9','참석자 1':'#93cdb6','참석자 2':'#e8b7a2','참석자 3':'#c4b0e0','참석자 4':'#e6cf8f'};
const mmss=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
function dgHTML(r){const rows=(TR[r.id]||[]);let turns=[],cur=null;rows.forEach(x=>{if(!cur||cur.n!==x[2]){cur={n:x[2],s:x[0],segs:[]};turns.push(cur)}cur.segs.push(x)});
 return '<div class="dg"><div class="dg-top"><div class="dg-q">'+esc(r.title)+'</div><div class="dg-s">대장님 실제 녹음 · '+esc(r.sub)+'</div></div>'+
 (turns.length?'<div class="dg-body">'+turns.map(u=>'<div class="dg-turn"><i class="dg-av" style="background:'+(AVC[u.n]||'#b8c48e')+'"></i><div><div class="dg-who"><b>'+esc(u.n)+'</b><time>'+mmss(u.s)+'</time></div><div class="dg-tx">'+u.segs.map(x=>'<span data-s="'+x[0]+'" data-e="'+x[1]+'">'+esc(x[3])+'</span>').join(' ')+'</div></div></div>').join('')+'</div>':'')+
 '<div class="dg-bar"><button class="dg-play" aria-label="재생">▶</button><div class="dg-seek"><div class="dg-rail"></div><div class="dg-fill"></div></div><span class="dg-t">0:00</span><button class="dg-sp">1x</button></div>'+
 '<div class="dg-note">자동 받아쓰기 · 일부 틀릴 수 있음 · 문장을 누르면 그 부분부터 재생</div><audio preload="none" src="'+esc(r.src)+'"></audio></div>'}
function dgOf(n){return n&&n.closest?n.closest('.dg'):null}
function dgWhen(a,f){if(a.readyState<1){a.addEventListener('loadedmetadata',f,{once:true});a.load()}else f()}
document.addEventListener('click',e=>{const d=dgOf(e.target);if(!d)return;const a=d.querySelector('audio');
 if(e.target.closest('.dg-play')){a.paused?a.play():a.pause();return}
 const spb=e.target.closest('.dg-sp');if(spb){const L=[1,1.25,1.5,0.8];const i=(L.indexOf(a.playbackRate)+1)%L.length;a.playbackRate=L[i];spb.textContent=L[i]+'x';return}
 const sk=e.target.closest('.dg-seek');if(sk){const r=sk.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;dgWhen(a,()=>{a.currentTime=x*a.duration});return}
 const sp=e.target.closest('.dg-tx span');if(sp){const s=+sp.dataset.s;dgWhen(a,()=>{a.currentTime=s;a.play()})}});
document.addEventListener('play',e=>{const m=e.target;if(m.tagName!=='AUDIO'&&m.tagName!=='VIDEO')return;document.querySelectorAll('audio,video').forEach(x=>{if(x!==m)x.pause()});const d=dgOf(m);if(d)d.querySelector('.dg-play').textContent='❚❚'},true);
document.addEventListener('pause',e=>{const d=dgOf(e.target);if(d)d.querySelector('.dg-play').textContent='▶'},true);
document.addEventListener('timeupdate',e=>{const a=e.target;const d=dgOf(a);if(!d)return;const t=a.currentTime;d.querySelector('.dg-fill').style.width=(a.duration?t/a.duration*100:0)+'%';d.querySelector('.dg-t').textContent=mmss(t)+' / '+mmss(a.duration||0);
 let on=null;d.querySelectorAll('.dg-tx span').forEach(s=>{const k=t>=+s.dataset.s&&t<+s.dataset.e+0.2;s.classList.toggle('on',k);if(k)on=s});
 if(on){const b=d.querySelector('.dg-body');const y=on.offsetTop;if(y<b.scrollTop+10||y>b.scrollTop+b.clientHeight-40)b.scrollTop=y-60}},true);

// 칸별 내용
function paneOpen(c){return media(c.open.m)+'<div class="big">'+esc(c.open.line)+'</div>'+(c.open.more?'<div class="sec" style="margin-top:34px"><div class="sh">그날 걸었던 길 · 실제 사진</div><div class="mgrid">'+c.open.more.map(id=>media(id)).join('')+'</div></div>':'')}
function paneQuiz(c){const z=c.quiz;let h='<div class="sec"><div class="sh">퀴즈 · 보기를 눌러 보세요</div><div class="q">'+esc(z.q)+'</div>';
 if(z.ab)h+='<div class="cab">'+z.ab.map((x,i)=>'<div><b>'+'AB'[i]+'</b><p>'+esc(x)+'</p></div>').join('')+'</div>';
 h+='<ol class="qz">'+z.choices.map((x,i)=>'<li><button class="qb" onclick="pick(this)" data-ok="'+(x.ok?1:0)+'"><span><span class="ql">'+'abcdef'[i]+'.</span>'+esc(x.t)+'</span><span class="qm"></span></button><div class="qw">'+esc(x.why)+'</div></li>').join('')+'</ol>';
 h+='<div class="qall"><button class="btn" onclick="pickAll(this)">정답 모두 보기</button><span class="qsum">'+esc(z.all||'')+'</span></div>'+sayBox(z.say)+'</div>';
 h+='<div class="sec"><div class="sh">대장님 실제 음성</div>'+z.voices.map(v=>media(v)).join('')+'</div>';
 h+='<div class="sec ex"><div class="sh">설명 · 그날 이야기</div>'+z.explain.map(exP).join('')+'</div>';return h}
function hl(s){return esc(s).replace(/“([^”]+)”/g,'<span class="qt">“$1”</span>')}
function exP(p){let m=p.match(/^([①②③④⑤⑥⑦⑧⑨])\s*([^—]{1,14})\s+—\s+([\s\S]*)$/);if(m)return '<div class="exi"><h4><span class="n">'+m[1]+'</span>'+esc(m[2])+'</h4><p>'+hl(m[3])+'</p></div>';m=p.match(/^(주의|정리|오키 정리)\s*:\s*([\s\S]*)$/);if(m)return '<div class="exi'+(m[1]==='주의'?' warn':'')+'"><h4>'+esc(m[1])+'</h4><p>'+hl(m[2])+'</p></div>';return '<p>'+hl(p)+'</p>'}
function eps(){return STAGES[idx].main.map(n=>({n,main:1}))}
function deepHTML(m){const D=DEEP[m.no]||{};const sc=String(m.script||'').split('— 그날 나눈 말')[0].trim();let ps=sc?sc.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean):[];
 let maxim=D.maxim||'';if(!maxim&&ps.length&&ps[ps.length-1].includes('\n')){maxim=ps.pop()}const body=D.body||ps;
 let h='<div class="deep"><div class="dh">더 알아보기</div>';if(maxim)h+='<div class="maxim">'+esc(maxim)+'</div>';
 h+=body.map(p=>'<p>'+hl(p)+'</p>').join('');
 (D.x||[]).forEach(s=>{h+='<div class="dx"><h4>'+esc(s.h)+'</h4>'+(s.p?'<p>'+hl(s.p)+'</p>':'')+'<div class="mgrid">'+(s.m||[]).map(id=>media(id)).join('')+'</div></div>'});
 if(D.m&&D.m.length)h+='<div class="dsub">그날 현장 · 실제 촬영·녹음</div><div class="mgrid">'+D.m.map(id=>media(id)).join('')+'</div>';
 if(D.d&&D.d.length)h+='<div class="dsub">도해로 정리</div><div class="mgrid">'+D.d.map(id=>media(id,{nocap:1})).join('')+'</div>';
 return h+'</div>'}
function paneEps(){if(!loaded)return '<p class="mp">자료 불러오는 중…</p>';const L=eps();
 let h='<div class="chips">'+L.map(x=>{const m=find(x.n);if(!m)return '';const v=!isToon(m);return '<button class="chip" onclick="jumpEp('+x.n+')"><img src="'+ROOT+esc(m.thumb)+'" alt=""><span><b>'+m.no+'편 · '+esc(m.title)+'</b><small><span class="k'+(v?' v':'')+'">'+(v?'▶ 영상 '+esc(m.durstr):'만화')+'</span></small></span></button>'}).join('')+'</div>';
 L.forEach((x,i)=>{const m=find(x.n);if(!m)return;const v=!isToon(m);
  h+='<section class="epsec" id="ep'+m.no+'"><div class="eph"><span class="en">'+(i+1)+'</span>'+m.no+'편 · '+esc(m.title)+'<span class="k'+(v?' v':'')+'">'+(v?'▶ 영상 '+esc(m.durstr):'만화 '+m.notes.length+'장')+'</span></div><div class="eps">'+esc(m.sub||'')+'</div>';
  h+=v?'<div class="media"><video controls playsinline preload="metadata" poster="'+ROOT+esc(m.thumb)+'" src="'+esc(m.src)+'"></video></div>':gal(m.notes,m.no+'편 · '+m.title);
  h+=(m.script?'<div class="eprow"><span></span><button class="btn" onclick="openScript('+m.no+')">강의록 전문 보기</button></div>':'')+deepHTML(m)+'</section>'});
 return h}
function jumpEp(n){const e=el('ep'+n);if(e)e.scrollIntoView({block:'start',behavior:'smooth'})}
function paneMore(c){return c.more.map(s=>'<div class="sec"><div class="mh">'+esc(s.h)+'</div>'+(s.p?'<p class="mp">'+hl(s.p)+'</p>':'')+'<div class="mgrid">'+(s.m||[]).map(id=>media(id)).join('')+'</div></div>').join('')}
function paneSum(c){const S=SUMQ[idx],s=STAGES[idx];const d=done.includes(idx);
 return '<div class="sec"><div class="sh">요약 · 이 장에서 가져갈 것</div><ol class="sum">'+S.sum.map(x=>'<li><b>'+esc(x[0])+'</b><span class="sd">'+hl(x[1])+'</span></li>').join('')+'</ol></div>'+
 '<div class="sec"><div class="sh">강의 후 생각해 볼 것 3가지</div><ol class="qs">'+S.qs.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol></div>'+
 '<div class="sec"><div class="sh">오늘의 작은 행동</div><div class="act">'+esc(S.act)+'</div></div>'+
 '<button class="done-btn'+(d?' ok':'')+'" onclick="toggleDone()">'+(d?'✓ 이 장 완료 (다시 누르면 해제)':'이 장 완료 표시')+'</button>'}
function renderPane(){const c=CH9[idx];for(const k in GAL)delete GAL[k];
 el('pane').innerHTML=[paneOpen,paneQuiz,paneEps,paneSum][tab](c);
 el('tabs').innerHTML=TABS.map((t,i)=>'<button class="tab'+(i===tab?' on':'')+'" onclick="goTab('+i+')"><em>'+(i+1)+'</em>'+t+'</button>').join('');
 el('prevBtn').disabled=idx===0&&tab===0;el('nextBtn').textContent=tab===LAST?(idx===STAGES.length-1?'처음으로 ↺':'다음 장 →'):'다음: '+TXT(TABS[tab+1])+' →'}
function goTab(i){tab=i;renderPane();store.set('bmw-tab',tab);const t=el('tabs').getBoundingClientRect().top;if(t<0)el('tabs').scrollIntoView({block:'start'})}
function epGo(i){epSel=i;renderPane()}
function nav(d){closeBig();if(tab+d>LAST){if(idx===STAGES.length-1)go(0);else go(idx+1)}else if(tab+d<0){if(idx>0){go(idx-1);goTab(LAST)}}else goTab(tab+d)}
function pick(b){const li=b.parentElement;li.classList.add('open',b.dataset.ok==='1'?'ok':'no');b.querySelector('.qm').textContent=b.dataset.ok==='1'?'정답':'아니에요'}
function pickAll(b){const box=b.closest('.sec');box.querySelectorAll('.qb').forEach(x=>pick(x));box.querySelector('.qsum').classList.add('show')}

function renderBars(){el('bars').innerHTML=STAGES.map((s,i)=>'<button class="bar'+(i===idx?' on':'')+(done.includes(i)?' done':'')+'" onclick="go('+i+')"><i></i><span><b class="bn">'+(i+1)+'장</b>'+esc(s.name.replace(/^\d+장 · /,''))+'</span></button>').join('');{const b=el('bars'),o=b.children[idx];if(o&&b.scrollWidth>b.clientWidth)b.scrollLeft=o.offsetLeft-b.clientWidth/2+o.clientWidth/2}el('doneCount').textContent=done.length+' / '+STAGES.length+' 장 완료'}
function render(){const s=STAGES[idx];el('stageName').textContent=s.name;el('stageTime').textContent=s.time;el('stageTitle').textContent=s.title;
 el('flow').innerHTML=s.scene.split('→').map(x=>'<li>'+esc(x.trim())+'</li>').join('');el('keys').innerHTML=SUMQ[idx].sum.map(x=>'<li>'+esc(x[0])+'</li>').join('');
 renderBars();renderPane();store.set('bmw-current-stage',idx);window.scrollTo({top:0,behavior:'instant'})}
function go(n){closeBig();idx=Math.max(0,Math.min(STAGES.length-1,n));tab=0;epSel=0;render()}
function toggleMode(){publicMode=!publicMode;document.body.classList.toggle('public',publicMode);el('modeBtn').textContent=publicMode?'진행자 메모 보기':'발표 화면'}
function toggleDone(){done=done.includes(idx)?done.filter(x=>x!==idx):[...done,idx];store.set('bmw-done',JSON.stringify(done));renderBars();renderPane()}
// 크게 보기
function openBig(k){big=k;el('mText').classList.add('hide');el('mImg').classList.remove('hide');bigShow();el('ov').classList.add('open')}
function bigShow(){const g=GAL[big];if(!g)return;el('mTitle').textContent=g.title||'';el('mImg').src=g.srcs[g.i];el('mNav').classList.toggle('hide',g.srcs.length<2);el('mCount').textContent=(g.i+1)+' / '+g.srcs.length;el('ov').scrollTop=0}
function bigGo(d){if(GAL[big])galGo(big,d)}
function openScript(n){const m=find(n);if(!m||!m.script)return;big='text';el('mTitle').textContent=m.no+'편 · '+m.title+' — 강의록 (원문 기반)';el('mImg').classList.add('hide');el('mNav').classList.add('hide');el('mText').textContent=m.script;el('mText').classList.remove('hide');el('ov').classList.add('open');el('ov').scrollTop=0}
function closeBig(){el('ov').classList.remove('open');big=null}

document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
 if(big){if(e.key==='Escape')closeBig();else if(e.key==='ArrowRight')bigGo(1);else if(e.key==='ArrowLeft')bigGo(-1);return}
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();nav(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();nav(-1)}if(/^[1-9]$/.test(e.key))go(Number(e.key)-1)});
document.addEventListener('touchstart',e=>{const g=e.target.closest('.gal');if(g)g._x=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const g=e.target.closest('.gal');if(!g||g._x==null)return;const dx=e.changedTouches[0].clientX-g._x;if(Math.abs(dx)>40)galGo(g.id,dx<0?1:-1);g._x=null});
{const s=Number(store.get('bmw-current-stage','0'));if(Number.isInteger(s)&&s>=0&&s<STAGES.length)idx=s}
render();loadMaterials();
</script></body></html>
