<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMW 강의 · 진행 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{color-scheme:dark;--bg:#09090c;--card:rgba(20,20,25,.94);--line:#25252d;--line2:#34343f;--ink:#f4f4f7;--mut:#a6a6b2;--dim:#72727e;--ac:#a78bfa;--ac2:#7c5cf0;--acbg:rgba(139,92,246,.13)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(720px 420px at 80% -10%,rgba(124,58,237,.30),transparent 70%),radial-gradient(520px 340px at 105% 35%,rgba(76,29,149,.20),transparent 70%)}
button,a,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{position:relative;z-index:1;max-width:1280px;margin:auto;padding:18px 24px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-size:13px;color:var(--mut)}.brand b{color:var(--ink);font-weight:700;margin-right:6px}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line2);background:#16161b;color:var(--ink);padding:8px 13px;border-radius:8px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--ac)}.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:600}
/* 장 진행 */
.ph{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:9px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bar{background:none;border:0;padding:0;text-align:left;color:var(--dim)}
.bar i{display:block;height:4px;border-radius:2px;background:#2a2a33}
.bar.done i{background:#5b47b8}.bar.on i{background:var(--ac)}
.bar span{display:block;font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.on span{color:var(--ink);font-weight:600}.bar:hover span{color:var(--ink)}
/* 레이아웃 */
.grid{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(280px,.85fr);gap:20px;margin-top:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ch h3{margin:0;font-size:15px;font-weight:600;color:var(--ac)}.ch small{color:var(--dim);font-size:12px;text-align:right}
.title{font-size:clamp(21px,2.4vw,28px);font-weight:750;letter-spacing:-.02em;line-height:1.35;margin:6px 0 18px}
/* 5칸 메뉴 (모든 장 동일) */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:24px}
.tab{background:#121217;border:0;border-right:1px solid var(--line2);padding:11px 6px;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px}
.tab:last-child{border-right:0}.tab em{font-style:normal;font-size:11px;color:var(--dim)}
.tab:hover{color:var(--ink)}.tab.on{background:var(--acbg);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ac)}.tab.on em{color:var(--ac)}
/* 칸 내용 */
.sec{margin-top:30px}.sec:first-child{margin-top:0}
.sh{font-size:12px;color:var(--ac);font-weight:700;letter-spacing:.04em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.big{font-size:clamp(21px,2.4vw,30px);font-weight:750;line-height:1.45;letter-spacing:-.01em;margin:18px 0 0}
.say{margin-top:16px;padding:12px 14px;border-radius:9px;background:#15151a;border:1px dashed var(--line2)}
.say b{display:block;font-size:11.5px;color:var(--ac);font-weight:600;margin-bottom:3px}.say p{margin:0;font-size:14px;color:#cfcfd8}
.media{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.media video,.media iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.gal{background:#0e0e12}.gal img{display:block;width:100%;height:auto}
.gal .gz{position:absolute;top:0;bottom:44px;width:35%;background:none;border:0}.gal .gz.l{left:0}.gal .gz.r{right:0}
.gnav{display:flex;justify-content:center;align-items:center;gap:10px;padding:8px;background:#111116;font-size:13px;color:var(--mut)}
.gnav .btn{padding:5px 12px}
.cap{font-size:12.5px;color:var(--mut);margin-top:7px}.credit{font-size:11px;color:var(--dim);margin-top:3px}
.aud{border:1px solid var(--line2);border-radius:10px;padding:16px 18px;background:linear-gradient(135deg,rgba(124,58,237,.16),rgba(20,20,25,.6));margin-bottom:10px}
.aud .aq{font-size:18px;font-weight:700;line-height:1.5}.aud .as{font-size:12px;color:var(--mut);margin:4px 0 10px}.aud audio{width:100%;max-width:520px;height:36px}
.q{font-size:clamp(20px,2.3vw,28px);font-weight:750;line-height:1.45;margin:0 0 18px}
.cab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.cab div{border:1px solid var(--line2);border-radius:10px;padding:16px;background:#16161c}
.cab b{display:block;color:var(--ac);font-size:20px;margin-bottom:6px}.cab p{margin:0;font-size:16px;line-height:1.55}
.qz{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.qb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line2);border-radius:9px;padding:13px 14px;background:#16161c;font-size:15.5px;font-weight:600}
.qb:hover{border-color:var(--ac)}.qm{font-size:12px;font-weight:700;flex:none}
.qw{display:none;font-size:14px;line-height:1.6;color:#d8d8e0;padding:9px 4px 2px}
li.open .qw{display:block}
li.ok .qb{border-color:#22c55e;background:rgba(34,197,94,.12)}li.ok .qm{color:#4ade80}
li.no .qb{border-color:#f87171;background:rgba(248,113,113,.10)}li.no .qm{color:#fca5a5}
.qall{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.qsum{display:none;font-size:14.5px;font-weight:600;color:#c4b5fd}.qsum.show{display:inline}
.ex p{margin:0 0 12px;font-size:16px;line-height:1.75;color:#dcdce4}.ex p.warn{font-size:14px;color:var(--mut);border-left:2px solid #fcd34d;padding-left:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#121217;border-radius:8px;padding:5px 10px 5px 5px;font-size:13.5px;color:var(--mut);text-align:left}
.chip img{width:54px;height:31px;object-fit:cover;border-radius:4px}.chip b{font-weight:600;color:var(--ink)}.chip small{font-size:11px;color:var(--dim);display:block}
.chip.on{border-color:var(--ac);background:var(--acbg)}.chip .k{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);margin-left:4px}.chip .k.v{color:#c4b5fd;border-color:#5b47b8}
.eprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mut)}
.mh{font-size:18px;font-weight:700;margin:0 0 6px}.mp{margin:0 0 12px;font-size:15.5px;line-height:1.7;color:#d4d4dc}
.mgrid{display:grid;gap:12px}
.sum{margin:0;padding:0;list-style:none;counter-reset:s}.sum li{counter-increment:s;padding:10px 0 10px 40px;position:relative;font-size:16.5px;border-bottom:1px solid var(--line)}
.sum li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:6px;background:var(--acbg);color:var(--ac);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.qs{margin:0;padding-left:20px}.qs li{margin:6px 0;font-size:15.5px}.qs small{color:var(--dim);font-size:12px}
.act{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#16161c;font-size:15px}.act small{display:block;color:var(--dim);font-size:11.5px}
.done-btn{width:100%;margin-top:22px;padding:12px;border-radius:9px;border:1px solid var(--line2);background:#16161b;font-weight:600;font-size:14px}
.done-btn.ok{background:var(--acbg);border-color:var(--ac);color:#ddd6fe}
.navrow{display:flex;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
/* 오른쪽 */
textarea{width:100%;min-height:140px;resize:vertical;background:#101014;border:1px solid var(--line2);border-radius:9px;padding:12px;font-size:14px;line-height:1.6;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--ac)}textarea::placeholder{color:var(--dim)}
.hint{font-size:11.5px;color:var(--dim);margin-top:8px}
.rc h3{margin:0 0 12px;font-size:15px}
.memo h5{margin:16px 0 4px;font-size:12px;color:var(--ac);font-weight:600}.memo h5:first-of-type{margin-top:0}
.memo p{margin:0;font-size:14px;color:#cfcfd8;white-space:pre-line}.memo .warn{color:#fcd34d}
.foot{font-size:12px;color:var(--dim);margin-top:18px}
.public .speaker-only{display:none!important}
/* 크게 보기 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,4,6,.96);display:none;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.ov.open{display:flex}.modal{width:100%;max-width:1100px}
.mhd{position:sticky;top:-14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;background:rgba(4,4,6,.92);z-index:2}.mhd h3{margin:0;font-size:15px;font-weight:600}
.modal img{display:block;width:min(100%,1000px);margin:auto}.modal .txt{background:#141419;border:1px solid var(--line);border-radius:10px;padding:22px;white-space:pre-line;font-size:15.5px;line-height:1.85}
.mnav{position:sticky;bottom:-14px;display:flex;justify-content:center;gap:12px;align-items:center;padding:8px;background:rgba(4,4,6,.92);font-size:13px;color:var(--mut)}
.hide{display:none!important}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
@media(max-width:600px){
 .wrap{padding:12px 12px 40px}.card{padding:16px;border-radius:12px}.grid{gap:14px;margin-top:18px}.col{gap:14px}
 .bars{gap:4px}.bar span{display:none}.bar.on span{display:block;position:absolute;left:12px;right:12px;margin-top:6px}.progress{position:relative;padding-bottom:22px}
 .tab{flex-direction:column;gap:0;font-size:12px;padding:8px 2px}.cab{grid-template-columns:1fr}.brand{font-size:12px}.btn{padding:7px 10px;font-size:12.5px}
 .ex p{font-size:15px}.chip img{display:none}
}
</style></head><body>
<div class="wrap">
<div class="top"><div class="brand"><b>BMW 강의</b>11월 3일, 대장님은 무엇을 보셨을까 · 2026.11.08</div><div class="tools"><button class="btn" id="modeBtn" onclick="toggleMode()">발표 화면</button><a class="btn" href="https://okhyun304-dot.github.io/action-class/" target="_parent">강의 아카이브 ↗</a></div></div>
<div class="progress"><div class="ph"><span>7개 장</span><span id="doneCount"></span></div><nav class="bars" id="bars" aria-label="장 이동"></nav></div>
<div class="grid">
 <div class="col"><section class="card">
  <div class="ch"><h3 id="stageName"></h3><small id="stageTime"></small></div>
  <div class="title" id="stageTitle"></div>
  <nav class="tabs" id="tabs" aria-label="칸"></nav>
  <div id="pane"></div>
  <div class="navrow"><button class="btn" id="prevBtn" onclick="nav(-1)">← 이전</button><button class="btn pri" id="nextBtn" onclick="nav(1)">다음 →</button></div>
 </section></div>
 <div class="col">
  <section class="card rc"><h3>내 메모</h3><textarea id="memo" placeholder="멤버 대답, 떠오른 생각을 적어 두세요"></textarea><div class="hint" id="memoHint">이 기기에 자동 저장됩니다</div></section>
  <section class="card memo speaker-only"><p style="margin:0 0 12px;font-size:12px;color:var(--dim)">진행자 메모 · 발표 화면에서는 숨겨짐</p>
   <h5>상황 재연 (재구성 멘트 · 실제 발언 아님)</h5><p id="performance"></p>
   <h5>설명 흐름</h5><p id="scene"></p>
   <h5>다음 장으로 넘어가는 멘트</h5><p id="bridge"></p>
   <div id="privateBox"><h5 class="warn">진행 시 유의</h5><p id="privateNote"></p></div>
  </section>
 </div>
</div>
<div class="foot">← → 칸 넘기기 (⑤ 다음은 다음 장) · 숫자 1~7 장 바로 가기 · 영상은 끝나도 자동으로 넘어가지 않음 · 진행 멘트는 재구성 예시이며, “ ” 안은 강의록 원문·실제 녹음입니다.</div>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="modal"><div class="mhd"><h3 id="mTitle"></h3><button class="btn" onclick="closeBig()">✕ 닫기</button></div><img id="mImg" alt="" class="hide"><div class="txt hide" id="mText"></div><div class="mnav hide" id="mNav"><button class="btn" onclick="bigGo(-1)">← 이전</button><span id="mCount"></span><button class="btn" onclick="bigGo(1)">다음 →</button></div></div></div>
<script>
const STAGES=[{"time": "13:37~14:08 | 잠원 → 신사동", "name": "1장 · 걷기", "title": "같은 길을 걸었는데, 본 것이 달랐다", "topics": "90개 꼭지 3·4·5·6·7·9", "scene": "잠원과 반포의 이름 → 김원중이라는 모델 → 그 사람의 경력에서 소득 추론 → 건물의 밀도와 거리, 걸어봐야 알게 되는 땅의 가치", "performance": "신사동으로 걸어가는 자세로 시작한다. '제가 잠원동, 반포동을 그냥 비슷한 동네로 생각했는데, 대장님이 이름의 상징성부터 이야기하시는 거예요.' 김원중을 몰라 멈칫했던 자기 반응을 짧게 살린다.", "question": "똑같은 길을 걸어도 왜 대장님은 땅의 가치까지 추론할 수 있었을까요?", "answer": "관찰한 사실에 기존 지식과 비교 기준을 연결했기 때문. 단, 건물 높이와 밀도만으로 지가를 확정할 수는 없다.", "additional": "유명인 김원중을 알아보는 문화적 지식은 그 사람의 활동 경력과 소득을 추정하는 출발점이었다. 추정과 확인된 사실을 구분해서 설명하기.", "main": [16, 3], "extra": [], "action": "내가 매일 보지만 한 번도 이유를 생각해보지 않았던 현상은?", "bridge": "그렇게 걸어서 소시지집에 들어갔는데, 이번에는 맥주 한 잔에서 사업 이야기까지 이어졌습니다."}, {"time": "14:08~15:02 | 엉클조", "name": "2장 · 맥주와 가게", "title": "맥주를 시켰는데 사업 이야기가 시작됐다", "topics": "90개 꼭지 10·11·12·13·16·17·18", "scene": "소시지와 맥주잔 → 라거와 에일, 밀맥주 향 → 치맥과 수제맥주의 소비 목적 → 수요 없는 공급 → 소시지 전문점의 메뉴 확장 → 못하는 강의에서 배우는 방법", "performance": "맥주잔을 쥔 손짓. '저는 맥주가 그냥 시원하면 되는 줄 알았어요. 그런데 잔의 모양, 향, 맥주 종류까지 설명하시더라고요.' 잠시 멈춘 뒤 '그런데 갑자기 사업 이야기가 시작됩니다.'", "question": "세계에서 가장 맛있는 맥주를 만들면 한국에서도 반드시 잘 팔릴까요?", "answer": "품질뿐 아니라 고객이 맥주를 소비하는 상황과 목적이 맞아야 한다. 소비문화에 관한 대장님의 발언은 하나의 사업적 판단이지 모든 한국인에게 적용되는 사실은 아니다.", "additional": "맥주 사진 3장만 있으면 충분하다: 필스너·바이스비어·스타우트. 에일과 라거의 발효 차이, 효모가 만드는 향을 짧게 보충하고 수요 없는 공급으로 넘어간다.", "main": [11, 5], "extra": [29, 19, 22, 12, 28, 26], "action": "내 사업에서 고객은 제품 자체보다 어떤 상황과 목적을 구매할까?", "bridge": "그런데 대장님은 맥주만 세밀하게 보는 분이 아니었어요. 게임에서 문 하나를 여는 장면까지 유심히 보셨습니다."}, {"time": "15:02~15:35 | 엉클조", "name": "3장 · 게임과 보여주기", "title": "게임의 문 하나에도 이유가 있다", "topics": "90개 꼭지 20·21·22·23·24·26·29·30", "scene": "바이오하자드의 문 열기 연출 → 로딩을 숨긴 기술적 제약 → 좀비를 재난에 비유한 해석 → 메인·서브 퀘스트로 문제를 나누기 → 호나인님의 러닝: 하는 것과 보여주는 것의 차이", "performance": "손으로 문이 천천히 열리는 모습을 흉내 낸다. '문 하나 여는데 왜 이렇게 오래 걸릴까요?' 멤버 답을 듣고 이유 공개. 이어서 화면을 바꿔 퀘스트와 러닝 이야기로 전환한다.", "question": "바이오하자드에서 문을 여는 장면은 왜 그렇게 천천히 재생됐을까요?", "answer": "초기에는 기술적인 로딩 시간과 연결되어 있었고, 반복되면서 시리즈를 상징하는 표현으로 자리 잡았다. 제약이 연출의 언어가 된 사례.", "additional": "문 장면 영상이 없으면 기존 9편 영상으로 충분하다. 2편 퀘스트와 25편 보여주는 능력을 연달아 모두 틀기보다는 한 편만 선택하고 나머지는 오키님 설명으로 이어도 된다.", "main": [9, 2, 25], "extra": [8, 20, 15], "action": "내가 잘하지만 보여주지 않는 행동, 혹은 모든 일을 메인 퀘스트로 다루는 습관은?", "bridge": "게임을 하며 선택하는 이야기에서, 이번에는 실제 삶의 되돌릴 수 없는 선택으로 넘어갔습니다."}, {"time": "16:07~16:28 | 엉클조", "name": "4장 · 출산과 관계", "title": "경험하기 전의 저울로 경험 이후를 잴 수 있을까", "topics": "90개 꼭지 36·37·38·42", "scene": "출산의 비가역성 → 새로운 우주를 발견한다는 비유 → 육아의 어려움과 행복은 같은 저울이 아닐 수 있다는 대화 → 부부가 새로운 가족의 경계를 세우는 아이언돔", "performance": "양손을 저울처럼 들어본다. '대장님과 구슬님은 두 가지를 같은 저울에 올리기 어렵다고 말씀하셨어요.' 잠시 생각하게 한 뒤 《어바웃 타임》의 시간여행 설정을 연결한다.", "question": "어떤 선택은 왜 해보기 전의 가치관만으로 충분히 판단하기 어려울까요?", "answer": "경험 후 가치관과 우선순위 자체가 달라질 수 있다. 출산을 꼭 해야 한다거나 모든 부모가 똑같이 느낀다는 결론으로 일반화하지 않는다.", "additional": "지난주 BMLW의 《어바웃 타임》·《패밀리 맨》과 연결. 아이언돔은 결혼 이후 양가 부모와 부부 사이에서 경계를 세우는 문제로 설명한다. 다른 사람의 구체적인 사적 사정은 당사자 동의 범위에서만 전달.", "main": [31, 30], "extra": [24, 13], "action": "삶에서 되돌릴 수 없고, 그 후 내 기준이 달라진 경험이 있다면? 말하기 부담스러우면 답하지 않아도 된다.", "bridge": "그날 이야기는 다시 몸으로 이어졌습니다. 대장님께서는 왜 그렇게 하체를 강조하셨을까요?"}, {"time": "17:17~17:58 | 엉클조 후반", "name": "5장 · 몸과 체력", "title": "보여주라면서, 인정받으려고 하지는 말라고?", "topics": "90개 꼭지 54·55·56·57·58·59", "scene": "고등학교 시절 58kg → 집에서 오래 운동한 과정 → 상체와 하체를 바라보는 기준 → 스쿼트 500개 개인 경험 → 체력이 일이 끝난 뒤에도 남는 에너지라는 말씀", "performance": "A와 B를 나란히 손으로 가리키듯 말한다. '운동을 계속 보여주라' / '운동에는 인정욕구가 없어야 한다'. 모순처럼 보이는 순간에 청중의 답을 받는다. 체력 관련 개인 사정은 흉내 내지 말고 자신의 실제 느낌만 전한다.", "question": "'운동하는 모습을 보여줘야 한다'와 '운동에는 인정욕구가 없어야 한다'. 서로 모순일까요?", "answer": "행동의 목적과 행동을 사람들에게 전하는 방식은 다르다. 몸은 자신의 삶을 위해 관리하고, 과정 공유는 다른 사람의 행동을 돕는 데 활용할 수 있다.", "additional": "6편 또는 7편 영상 중 하나를 선택. 스쿼트 500개는 대장님의 개인 훈련 경험이지 회원들에게 시킬 과제가 아니다. 체력·회복·수면의 균형을 무시하지 않는다.", "main": [6, 7], "extra": [27, 25, 23], "action": "내가 몸을 관리하는 목적은 무엇이며, 내일부터 어떤 작은 행동을 할 수 있을까?", "bridge": "오랫동안 힘과 시간을 쌓아온 것이 운동만은 아니었습니다. 사람이 거의 오지 않던 아지트 이야기가 이어집니다.", "private": "건강·통증 관련 현장 일화는 대장님의 공유 허락을 확인한 경우에만 구두로 설명하세요. 공개 페이지에는 상세 내용을 넣지 않았습니다."}, {"time": "18:56~19:00 | 덴큐", "name": "6장 · // 미디어 한 덩어리
function gal(srcs,title,credit){const k='g'+(galN++);GAL[k]={srcs,i:0,title};return '<div class="media gal" id="'+k+'"><img src="'+esc(srcs[0])+'" alt="">'+(srcs.length>1?'<button class="gz l" aria-label="이전" onclick="galGo(\''+k+'\',-1)"></button><button class="gz r" aria-label="다음" onclick="galGo(\''+k+'\',1)"></button><div class="gnav"><button class="btn" onclick="galGo(\''+k+'\',-1)">←</button><span class="gc">1 / '+srcs.length+'</span><button class="btn" onclick="galGo(\''+k+'\',1)">→</button><button class="btn" onclick="openBig(\''+k+'\')">크게 보기</button></div>':'<div class="gnav"><button class="btn" onclick="openBig(\''+k+'\')">크게 보기</button></div>')+'</div>'+(credit?'<div class="credit">'+esc(credit)+'</div>':'')}
function galGo(k,d){const g=GAL[k];g.i=Math.max(0,Math.min(g.srcs.length-1,g.i+d));const box=el(k);box.querySelector('img').src=g.srcs[g.i];const c=box.querySelector('.gc');if(c)c.textContent=(g.i+1)+' / '+g.srcs.length;const t=box.getBoundingClientRect().top;if(t<0)box.scrollIntoView({block:'start'});if(big===k)bigShow()}
function media(id,opt){const r=M(id);if(!r)return '';opt=opt||{};
 if(r.t==='audio')return '<div class="aud"><div class="aq">'+esc(r.title)+'</div><div class="as">대장님 실제 녹음 · '+esc(r.sub)+'</div><audio controls preload="none" src="'+esc(r.src)+'"></audio></div>';
 if(r.t==='video')return '<div class="media"><video controls playsinline preload="metadata" poster="'+esc(r.poster)+'" src="'+esc(r.src)+'"></video></div><div class="cap">'+esc(r.tag)+' · '+esc(r.title)+' — '+esc(r.sub)+'</div>';
 if(r.t==='yt')return '<div class="media"><iframe src="https://www.youtube-nocookie.com/embed/'+r.id+'?rel=0&modestbranding=1&playsinline=1" title="'+esc(r.title)+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div><div class="cap">유튜브 · '+esc(r.title)+' — '+esc(r.sub)+'</div>';
 return gal(r.src,r.title,r.credit)+(opt.nocap?'':'<div class="cap">'+esc(r.title)+(r.sub?' — '+esc(r.sub):'')+'</div>')}
function sayBox(t){return t?'<div class="say speaker-only"><b>진행 멘트 (재구성 예시 · 발표 화면에서 숨김)</b><p>'+esc(t)+'</p></div>':''}

// 칸별 내용
function paneOpen(c){return media(c.open.m)+'<div class="big">'+esc(c.open.line)+'</div>'+sayBox(c.open.say)}
function paneQuiz(c){const z=c.quiz;let h='<div class="sec"><div class="sh">퀴즈 · 보기를 눌러 보세요</div><div class="q">'+esc(z.q)+'</div>';
 if(z.ab)h+='<div class="cab">'+z.ab.map((x,i)=>'<div><b>'+'AB'[i]+'</b><p>'+esc(x)+'</p></div>').join('')+'</div>';
 h+='<ol class="qz">'+z.choices.map(x=>'<li><button class="qb" onclick="pick(this)" data-ok="'+(x.ok?1:0)+'"><span>'+esc(x.t)+'</span><span class="qm"></span></button><div class="qw">'+esc(x.why)+'</div></li>').join('')+'</ol>';
 h+='<div class="qall"><button class="btn" onclick="pickAll(this)">정답 모두 보기</button><span class="qsum">'+esc(z.all||'')+'</span></div>'+sayBox(z.say)+'</div>';
 h+='<div class="sec"><div class="sh">대장님 실제 음성</div>'+z.voices.map(v=>media(v)).join('')+'</div>';
 h+='<div class="sec ex"><div class="sh">설명 · 그날 이야기</div>'+z.explain.map(p=>'<p'+(p.startsWith('주의')?' class="warn"':'')+'>'+esc(p)+'</p>').join('')+'</div>';return h}
function eps(){const s=STAGES[idx];return [...s.main.map(n=>({n,main:1})),...s.extra.map(n=>({n,main:0}))]}
function paneEps(){if(!loaded)return '<p class="mp">자료 불러오는 중…</p>';const L=eps();epSel=Math.min(epSel,L.length-1);
 let h='<div class="chips">'+L.map((x,i)=>{const m=find(x.n);if(!m)return '';const v=!isToon(m);return '<button class="chip'+(i===epSel?' on':'')+'" onclick="epGo('+i+')"><img src="'+ROOT+esc(m.thumb)+'" alt=""><span><b>'+m.no+'편 · '+esc(m.title)+'</b><small>'+(x.main?'핵심':'보충')+'<span class="k'+(v?' v':'')+'">'+(v?'▶ 영상 '+esc(m.durstr):'만화')+'</span></small></span></button>'}).join('')+'</div>';
 const m=find(L[epSel].n);if(!m)return h+'<p class="mp">이 편을 불러오지 못했습니다.</p>';
 h+=isToon(m)?gal(m.notes,m.no+'편 · '+m.title):'<div class="media"><video controls playsinline preload="metadata" poster="'+ROOT+esc(m.thumb)+'" src="'+esc(m.src)+'"></video></div>';
 h+='<div class="eprow"><span>'+m.no+'편 「'+esc(m.title)+'」 — '+esc(m.sub||'')+'</span>'+(m.script?'<button class="btn" onclick="openScript()">강의록 읽기</button>':'')+'</div>';return h}
function paneMore(c){return c.more.map(s=>'<div class="sec"><div class="mh">'+esc(s.h)+'</div>'+(s.p?'<p class="mp">'+esc(s.p)+'</p>':'')+'<div class="mgrid">'+(s.m||[]).map(id=>media(id)).join('')+'</div></div>').join('')}
function paneSum(c){const s=STAGES[idx];let qs=[s.action],acts=[];eps().filter(x=>x.main).forEach(x=>{const m=find(x.n);if(m&&m.reflect){(m.reflect.q||[]).forEach(q=>qs.push(q+'  ⟨'+m.no+'편⟩'));if(m.reflect.act)acts.push([m.reflect.act,m.no+'편'])}});
 const d=done.includes(idx);
 return '<div class="sec"><div class="sh">요약 · 이 장에서 가져갈 것</div><ol class="sum">'+c.sum.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'+
 '<div class="sec"><div class="sh">강의 후 생각해 볼 질문</div><ol class="qs">'+qs.map(q=>{const p=q.split('  ⟨');return '<li>'+esc(p[0])+(p[1]?' <small>'+esc('⟨'+p[1])+'</small>':'')+'</li>'}).join('')+'</ol></div>'+
 (acts.length?'<div class="sec"><div class="sh">오늘의 작은 행동</div>'+acts.map(a=>'<div class="act">'+esc(a[0])+'<small>'+esc(a[1])+'</small></div>').join('')+'</div>':'')+
 '<div class="sec"><div class="sh">대장님의 핵심</div><p class="mp">'+esc(s.answer)+'</p></div>'+
 '<button class="done-btn'+(d?' ok':'')+'" onclick="toggleDone()">'+(d?'✓ 이 장 완료 (다시 누르면 해제)':'이 장 완료 표시')+'</button>'}
function renderPane(){const c=CH[idx];for(const k in GAL)delete GAL[k];
 el('pane').innerHTML=[paneOpen,paneQuiz,paneEps,paneMore,paneSum][tab](c);
 el('tabs').innerHTML=TABS.map((t,i)=>'<button class="tab'+(i===tab?' on':'')+'" onclick="goTab('+i+')"><em>'+(i+1)+'</em>'+t+'</button>').join('');
 el('prevBtn').disabled=idx===0&&tab===0;el('nextBtn').textContent=tab===4?(idx===STAGES.length-1?'처음으로 ↺':'다음 장 →'):'다음: '+TABS[tab+1]+' →'}
function goTab(i){tab=i;renderPane();store.set('bmw-tab',tab);const t=el('tabs').getBoundingClientRect().top;if(t<0)el('tabs').scrollIntoView({block:'start'})}
function epGo(i){epSel=i;renderPane()}
function nav(d){closeBig();if(tab+d>4){if(idx===STAGES.length-1)go(0);else go(idx+1)}else if(tab+d<0){if(idx>0){go(idx-1);goTab(4)}}else goTab(tab+d)}
function pick(b){const li=b.parentElement;li.classList.add('open',b.dataset.ok==='1'?'ok':'no');b.querySelector('.qm').textContent=b.dataset.ok==='1'?'정답':'아니에요'}
function pickAll(b){const box=b.closest('.sec');box.querySelectorAll('.qb').forEach(x=>pick(x));box.querySelector('.qsum').classList.add('show')}

function renderBars(){el('bars').innerHTML=STAGES.map((s,i)=>'<button class="bar'+(i===idx?' on':'')+(done.includes(i)?' done':'')+'" onclick="go('+i+')"><i></i><span>'+esc(s.name)+'</span></button>').join('');el('doneCount').textContent=done.length+' / '+STAGES.length+' 장 완료'}
function render(){const s=STAGES[idx];el('stageName').textContent=s.name;el('stageTime').textContent=s.time;el('stageTitle').textContent=s.title;
 el('performance').textContent=s.performance;el('scene').textContent=s.scene;el('bridge').textContent=s.bridge;el('privateBox').style.display=s.private?'':'none';el('privateNote').textContent=s.private||'';
 el('memo').value=store.get('bmw-note-'+idx,'');el('memoHint').textContent='이 기기에 자동 저장됩니다';
 renderBars();renderPane();store.set('bmw-current-stage',idx);window.scrollTo({top:0,behavior:'instant'})}
function go(n){closeBig();idx=Math.max(0,Math.min(STAGES.length-1,n));tab=0;epSel=0;render()}
function toggleMode(){publicMode=!publicMode;document.body.classList.toggle('public',publicMode);el('modeBtn').textContent=publicMode?'진행자 메모 보기':'발표 화면'}
function toggleDone(){done=done.includes(idx)?done.filter(x=>x!==idx):[...done,idx];store.set('bmw-done',JSON.stringify(done));renderBars();renderPane()}
// 크게 보기
function openBig(k){big=k;el('mText').classList.add('hide');el('mImg').classList.remove('hide');bigShow();el('ov').classList.add('open')}
function bigShow(){const g=GAL[big];if(!g)return;el('mTitle').textContent=g.title||'';el('mImg').src=g.srcs[g.i];el('mNav').classList.toggle('hide',g.srcs.length<2);el('mCount').textContent=(g.i+1)+' / '+g.srcs.length;el('ov').scrollTop=0}
function bigGo(d){if(GAL[big])galGo(big,d)}
function openScript(){const L=eps();const m=find(L[epSel].n);if(!m||!m.script)return;big='text';el('mTitle').textContent=m.no+'편 · '+m.title+' — 강의록 (원문 기반)';el('mImg').classList.add('hide');el('mNav').classList.add('hide');el('mText').textContent=m.script;el('mText').classList.remove('hide');el('ov').classList.add('open');el('ov').scrollTop=0}
function closeBig(){el('ov').classList.remove('open');big=null}
let memoT;el('memo').addEventListener('input',e=>{clearTimeout(memoT);el('memoHint').textContent='저장 중…';memoT=setTimeout(()=>{store.set('bmw-note-'+idx,e.target.value);el('memoHint').textContent='저장됨 · 이 기기에만 보관'},400)});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
 if(big){if(e.key==='Escape')closeBig();else if(e.key==='ArrowRight')bigGo(1);else if(e.key==='ArrowLeft')bigGo(-1);return}
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();nav(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();nav(-1)}if(/^[1-7]$/.test(e.key))go(Number(e.key)-1)});
document.addEventListener('touchstart',e=>{const g=e.target.closest('.gal');if(g)g._x=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const g=e.target.closest('.gal');if(!g||g._x==null)return;const dx=e.changedTouches[0].clientX-g._x;if(Math.abs(dx)>40)galGo(g.id,dx<0?1:-1);g._x=null});
{const s=Number(store.get('bmw-current-stage','0'));if(Number.isInteger(s)&&s>=0&&s<STAGES.length)idx=s}
render();loadMaterials();
</script></body></html>
