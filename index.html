%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C5.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C6.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C7.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C8.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C9.jpg"], "script": "요즘 인공지능 이야기를 들어보면 대부분 노동 이야기입니다.\nAI가 어떤 직업을 없앨 것인지,\n몇 명의 일을 한 명이 하게 될 것인지,\n업무시간을 얼마나 단축할 수 있을지가 핵심이죠.\n저 역시 사업을 하는 사람이기 때문에 이 문제를 중요하게 봅니다.\nAI를 도입했을 때 비용이 얼마나 줄고 생산량이 얼마나 늘어나는지는 현실적인 문제입니다.\n그런데 최근 AI를 오래 사용하면서 조금 다른 생각을 하게 됐습니다.\n우리는 AI를 지나치게 노동의 언어로만 보고 있는 것은 아닐까.\n나는 오히려 AI가 인간에게 새로운 종류의 여행을 만들어줄 가능성에 관심이 생겼습니다.\n이건 몸이 움직이는 여행이 아니라 생각이 움직이는 여행입니다.\n사람은 평생 상당히 제한된 언어 안에서 살아갑니다.\n사업을 오래 하면 매출, 고객, 비용, 마케팅, 투자 같은 말을 반복하게 됩니다.\n어떤 직업이든 비슷합니다.\n자신이 사는 세계에서 자주 사용하는 단어가 생기고, 그 단어들로 세상을 해석하게 됩니다.\n문제는 삶의 언어가 고정되면 생각의 경로도 함께 고정된다는 겁니다.\n같은 문제를 만나면 같은 단어를 사용하고,\n같은 단어를 사용하면 비슷한 결론에 도달합니다.\n요즘 AI와 대화하면서 이 경계가 자주 깨지는 경험을 합니다.\n내가 익숙한 방식으로 어떤 문제를 던졌는데 AI가 전혀 다른 분야의 개념을 가져옵니다.\n처음에는 그저 낯선 단어들입니다.\n허나, 어떤 단어는 한 번 알고 나면 이전 세계로 돌아가기 어렵습니다.\n예를 들어 사람을 두고\n의지가 약하다\n고 말하는 것과\n이 환경에서는 그 사람에게 가능한 행동의 범위가 좁다\n고 말하는 것은 전혀 다른 세계관입니다.\n단어 하나가 인간을 보는 좌표를 바꿉니다.\n그 순간 우리는 단어 하나를 배운 것이 아닙니다.\n이전에는 들어가지 못했던 생각의 방에 들어간 겁니다.\n여행도 비슷하지 않은가.\n사람이 파리에 가는 이유가 에펠탑의 높이를 알아오기 위해서는 아닙니다.\n검색하면 몇 초면 알 수 있습니다.\n여행의 가치는 내가 익숙하게 살아온 공간 바깥에 나를 던지는 데 있습니다.\n낯선 골목을 걷고,\n처음 보는 건축물을 보고,\n다른 방식으로 살아가는 사람들을 만납니다.\n그 과정에서 자신이 당연하다고 생각했던 것들이 더 이상 당연하지 않게 됩니다.\n그래서,\n좋은 여행은 지식을 추가하는 것이 아니라 좌표를 흔듭니다.\nAI와의 대화에서도 이와 비슷한 일이 일어납니다.\n나는 책상 앞에 그대로 앉아 있습니다.\n그런데 하나의 질문에서 심리학으로 갔다가 수학으로 가고,\n중세 역사로 갔다가 철학을 거쳐 다시 사업으로 돌아오기도 합니다.\n나는 물리적으로는 단 한 걸음도 움직이지 않았습니다.\n그러나 정신의 이동거리는 상당합니다.\n그래서 나는 AI를 일종의 언어적 이동수단으로 볼 수도 있다고 생각하게 된 겁니다.\n특히 중요한 것은 내가 평소 사용하지 않는 단어를 만나는 경험입니다.\n사람은 자신이 알고 있는 단어로 질문합니다.\n검색엔진 시대에는 이미 알고 있는 세계를 더 깊게 파는 데 유리했습니다.\n무엇을 검색해야 하는지 어느 정도 알고 있어야 했기 때문입니다.\nAI는 조금 다릅니다.\n대화를 이어가다 보면 내가 검색할 생각조차 하지 못했던 개념을 끌어올 수 있습니다.\n내 지식 바깥에 무엇이 있는지조차 모르는 상태에서 다른 세계로 연결되는 겁니다.\n나는 이 기능이 AI의 생산성보다 장기적으로 더 중요할 수도 있다고 봅니다.\n생산성은 같은 일을 더 빨리 하는 능력입니다.\n하지만 정신적 이동은 애초에 다른 일을 생각할 수 있게 만드는 능력입니다.\n둘은 차원이 다른 거죠.\nAI가 보고서 작성시간을 세 시간에서 삼십 분으로 줄이면 효율이 높아집니다.\n반면 AI와 대화하다 내가 평생 생각해본 적 없던 관점을 하나 얻는다면,\n앞으로 십 년 동안 내 판단 자체가 달라질 수도 있습니다.\n그래서 AI를 사용하는 방식에도 차이가 생길 겁니다.\n한쪽에서는 AI에게 계속 자기 언어를 반복시킵니다.\n이 문장 다듬어줘.\n요약해줘.\n메일 써줘.\n물론 유용합니다.\n나도 그렇게 씁니다.\n하지만 그것만 사용한다면 AI는 매우 뛰어난 비서에 머뭅니다.\n다른 사용법도 있습니다.\n이 문제를 내가 평소 사용하지 않는 학문 세 개의 언어로 설명해봐.\n내가 지금 놓치고 있는 개념을 가져와봐.\n이 문제와 전혀 관계없어 보이는 역사적 사례를 연결해봐.\n이 순간부터 AI는 비서가 아니라 탐험선이 됩니다.\n나는 이 지점에서 힐링이라는 말도 다시 생각하게 됐습니다.\n우리가 휴식이라고 하면 보통 생각을 멈추는 것을 떠올립니다.\n여행을 가거나, 음악을 듣거나, 멍하니 쉬는 것이죠.\n그런데 생각에서 벗어나는 또 다른 방법이 있습니다.\n생각을 멈추는 것이 아니라 다른 생각으로 이동하는 겁니다.\n사업 때문에 머리가 가득 찬 사람이 고대 로마 이야기를 읽습니다.\n인간관계 때문에 답답했던 사람이 천문학 이야기를 합니다.\n현실 문제와 전혀 다른 단어 속으로 잠시 들어갔다가 돌아옵니다.\n문제는 그대로 남아 있습니다.\n하지만 문제와 나 사이에 거리가 생깁니다.\n여행도 결국 이 기능을 합니다.\n서울에서 해결되지 않던 고민이 낯선 도시의 카페에서는 조금 다르게 보입니다.\n장소가 바뀌면서 관점의 거리가 생겼기 때문입니다.\n언어도 똑같은 일을 할 수 있습니다.\n새로운 단어는 생각의 장소를 바꿉니다.\n그렇다면 AI 시대의 새로운 빈곤은 정보의 빈곤이 아닐지도 모릅니다.\n정보는 이미 넘칩니다.\n오히려 문제가 되는 것은 자신의 세계를 설명하는 단어가 몇 개밖에 없는 상태입니다.\n성과, 실패, 노력, 돈, 행복.\n이 몇 개의 단어만 가지고 인생 전체를 설명하려 하면 세계는 점점 납작해집니다.\n새로운 단어를 얻는다는 것은 새로운 구분을 얻는 일입니다.\n새로운 구분이 생기면 이전에는 하나로 보였던 것이 둘로 갈립니다.\n보이지 않던 차이가 보이고, 보이지 않던 선택지가 나타납니다.\n세계가 커지는 겁니다.\n앞으로 AI를 얼마나 잘 사용하느냐는 프롬프트 기술만으로 결정되지 않을 것 같습니다.\nAI를 이용해 얼마나 많은 일을 처리했는가도 중요하겠죠.\n하지만 하나를 더 봐야 한다고 생각합니다.\nAI와 대화한 뒤 내 언어가 달라졌는가.\n내가 이전에는 사용하지 않던 단어가 생겼는가.\n내가 이전에는 생각하지 못했던 방향으로 정신이 움직였는가.\n그렇다면 그 대화는 이미 하나의 여행입니다.\n인터넷이 인간에게 정보의 이동성을 주었다면,\nAI는 인간에게 사유의 이동성을 줄 수 있습니다.\nAI를 통해 일을 덜 하는 것보다 더 큰 변화는,\n평생 가지 못했을 정신의 장소에 가보는 것일지도 모릅니다.\n앞으로 AI를 그렇게 써보세요.\n답을 얻기 위한 기계가 아니라,\n내 언어 바깥으로 나를 데리고 나가는 여행 도구로 말입니다.\n", "reflect": {"q": ["내가 내 일과 인생을 설명할 때 반복해서 쓰는 단어 다섯 개는 무엇인가? 그 단어들이 내 결론을 어떻게 고정시키는가?", "최근 AI와 대화한 뒤 새로 생긴 단어나 개념이 하나라도 있는가? 없다면 나는 AI에게 무엇만 시키고 있는가?", "지금 나를 붙잡고 있는 문제를 전혀 다른 분야의 언어로 바꿔 말하면 어떻게 보이는가?"], "act": "오늘 AI에게 '이 문제를 내가 평소 쓰지 않는 학문 세 개의 언어로 설명해봐'라고 한 번 던지고, 새로 만난 단어 하나를 복기칸에 적기"}}, {"ch": "행동주의자", "no": 15, "unit": "강", "key": "이동성", "title": "어느 곳에서도 다시 움직일 수 있는 사람", "sub": "위치가 아니라 이동성 — 선택권의 축적", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%A7%8C%ED%99%94%EC%98%81%EC%83%81_%EC%9D%B4%EB%8F%99%EC%84%B1_260917.mp4", "dur": 209, "durstr": "3:28", "thumb": "thumbs/이동성.jpg", "chapters": [{"t": 3.0, "title": "30분이 의미 있으려면"}, {"t": 16.0, "title": "버티는 게 답이 아닐 때 — 탈출 준비"}, {"t": 43.0, "title": "사업도 마찬가지다"}, {"t": 62.0, "title": "선택권을 축적하라"}, {"t": 100.7, "title": "늦었다고 느껴질 때 볼 것"}, {"t": 154.0, "title": "문 하나를 여는 작은 행동"}, {"t": 181.6, "title": "움직일 수 없는 것이 문제다"}], "notes": [], "script": "회사에서 남보다 30분 더 일하는 것이 의미 있으려면 그 30분이 실력, 신뢰, 성과, 포트폴리오 가운데 하나로 전환돼야 합니다.\n아무것도 남지 않는 추가 노동은 미덕이 아닙니다.\n그냥 비용일 수 있습니다.\n상사가 당신을 착취하고 있고, 회사가 성과를 인정하지 않고, 그곳에서 더 배울 것도 없다면 더욱 열심히 버티는 것이 답이 아닙니다.\n그때부터 해야 할 일은 탈출 준비입니다.\n자격을 만들고, 포트폴리오를 쌓고, 사람을 만나고, 다른 회사에 지원하고, 필요하면 작은 부업이라도 시작해야 합니다.\n떠날 수 있는 사람만 협상할 수 있기 때문입니다.\n직장을 그만두라는 말이 아닙니다.\n직장을 그만두지 않아도 되는 상태와 언제든 그만둘 수 있는 상태는 완전히 다릅니다.\n사업도 마찬가지입니다.\n거래처 하나에 매출 대부분이 묶여 있으면 사장은 자유롭지 않습니다.\n플랫폼 하나에 고객이 전부 묶여 있으면 사업도 자유롭지 않습니다.\n직원 한 명이 빠졌다고 회사가 멈춘다면 대표 역시 그 직원에게 종속돼 있는 겁니다.\n선택지가 없는 사람은 결국 조건을 받아들일 수밖에 없습니다.\n나는 돈을 버는 것만큼이나 선택권을 축적하는 것이 중요하다고 봅니다.\n기술 하나를 배우는 것도 선택권입니다.\n현금을 쌓는 것도 선택권입니다.\n사람들에게 신뢰를 얻는 것도 선택권입니다.\n이 자산들의 특징은 당장 통장에 찍히지 않는다는 겁니다.\n그래서 사람들은 과소평가합니다.\n하지만 위기가 왔을 때 차이가 드러납니다.\n회사가 망했는데 다른 곳에서 찾는 사람이 있는 사람과 아무도 찾지 않는 사람은 다릅니다.\n사업 하나가 실패했는데 다른 사업을 시작할 고객과 경험과 자본이 남은 사람은 다릅니다.\n두 사람 모두 실패했지만 한 사람은 이동할 수 있고 한 사람은 이동할 수 없습니다.\n나는 이 차이가 삶에서 굉장히 크다고 생각합니다.\n가끔 사람들은 지금 자신이 너무 늦었다고 말합니다.\n서른인데 가진 것이 없고, 마흔인데 직장이 불안하고, 사업을 시작했는데 매출이 나오지 않는다고 합니다.\n그때 확인해야 할 것은 현재 가진 것의 양만이 아닙니다.\n지난 1년 동안 선택지가 늘었는지를 봐야 합니다.\n작년에는 할 수 없었던 일을 지금 할 수 있는가.\n작년에는 만나지 못했던 사람과 지금 거래할 수 있는가.\n작년에는 한 회사밖에 갈 곳이 없었는데 지금은 세 곳에 지원할 수 있는가.\n작년에는 한 상품밖에 팔지 못했는데 지금은 두 번째 상품을 만들 수 있는가.\n여기에서 변화가 있다면 아직 괜찮습니다.\n현재 위치가 낮더라도 기울기는 위를 향하고 있기 때문입니다.\n반대로 겉으로는 멀쩡해도 몇 년 동안 선택지가 계속 줄고 있다면 경계해야 합니다.\n좋은 회사, 높은 연봉, 안정된 사업이 사람을 안전하게 만드는 것이 아닙니다.\n밖으로 나갔을 때 다시 시작할 수 있는 능력이 사람을 안전하게 만듭니다.\n그래서 삶이 막혀 있다고 느껴질 때 나는 목표를 지나치게 크게 잡는 것을 좋아하지 않습니다.\n인생을 바꾸겠다는 목표보다 선택지 하나를 추가하는 게 낫습니다.\n자격 하나를 얻어도 됩니다.\n새로운 사람 한 명을 만나도 됩니다.\n이력서 한 장을 고쳐도 되고, 제품 하나를 만들어도 되고, 처음으로 다른 회사에 지원해도 됩니다.\n그 작은 행동의 의미는 그 행동 자체에 있지 않습니다.\n어제까지 닫혀 있던 문 하나를 여는 데 있습니다.\n희망은 막연하게 잘될 거라고 믿는 감정이 아닙니다.\n내가 움직이면 다음 수가 생긴다는 확신입니다.\n낮은 곳에 있는 것은 문제가 아닙니다.\n움직일 수 없는 것이 문제입니다.\n그러니 지금 자신의 위치만 보지 마십시오.\n내 행동이 내 선택지를 늘리고 있는지 보십시오.\n인생에서 결국 강한 사람은 높은 곳에 있는 사람이 아니라, 어느 곳에서도 다시 움직일 수 있는 사람입니다.\n", "reflect": {"q": ["지난 1년, 내 선택지는 늘었는가 줄었는가 — 작년에는 못 했지만 지금은 할 수 있는 일이 있는가?", "나는 지금 무엇 하나에 묶여 있는가? (회사, 거래처, 플랫폼, 사람)", "내가 지금 하는 노력은 실력·신뢰·성과·포트폴리오 중 무엇으로 전환되고 있는가?"], "act": "이번 주, 닫혀 있던 문 하나 열기 — 지원서 한 장, 새로운 사람 한 명, 제품 하나 중 하나를 실행"}}, {"ch": "행동주의자", "no": 16, "unit": "강", "key": "관계", "title": "관계는 출석률이다", "sub": "감정의 강도가 아니라, 필요한 순간에 나타나는 것", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EA%B4%80%EA%B3%84_260917.mp4", "dur": 259, "durstr": "4:18", "thumb": "thumbs/관계.jpg", "chapters": [{"t": 0.0, "title": "마음은 직접 볼 수 없다"}, {"t": 17.0, "title": "행동 → 패턴 → 신뢰"}, {"t": 31.0, "title": "출석률이란"}, {"t": 50.0, "title": "관계는 사건 이전에 무너진다"}, {"t": 81.2, "title": "기대할 수 없는 사람"}, {"t": 105.8, "title": "가까울수록 기록은 쌓인다"}, {"t": 130.5, "title": "관계의 비용"}, {"t": 147.5, "title": "갈등 이후를 봐라"}, {"t": 188.7, "title": "예측 가능한 사람이 되라"}, {"t": 205.4, "title": "반복이 나를 만든다"}, {"t": 227.3, "title": "현실적인 질문 하나"}], "notes": [], "script": "사람을 오래 만나보면 한 가지를 알게 됩니다.\n사람은 상대방의 마음을 직접 볼 수 없습니다.\n아무리 사랑한다고 말해도 그 사랑 자체를 확인할 방법은 없죠.\n머릿속에 들어갈 수도 없고, 진심을 측정하는 기계도 없습니다.\n그래서 인간은 다른 방식으로 상대방을 판단합니다.\n행동을 봅니다.\n연락해야 할 때 연락했는지, 힘들 때 옆에 있었는지, 일이 생겼을 때 도망가지 않았는지 봅니다.\n그리고 그 행동이 반복되면 하나의 패턴이 만들어집니다.\n우리는 그 패턴을 신뢰라고 부릅니다.\n관계에서 중요한 것은 감정의 강도가 아니라 출석률입니다.\n여기서 출석은 단순히 얼굴을 비추는 것을 말하는 게 아닙니다.\n상대의 인생에서 자신이 필요한 순간에 실제로 나타나는 겁니다.\n이런 행동들은 하나하나 보면 대단하지 않습니다.\n하지만 관계는 원래 이런 사소한 행동의 누적으로 만들어집니다.\n사람들은 관계가 무너질 때 거대한 사건을 찾습니다.\n배신, 외도, 큰 싸움, 돈 문제 같은 사건 말입니다.\n물론 그런 사건은 관계를 파괴할 수 있습니다.\n하지만 많은 관계는 그보다 훨씬 이전부터 무너지고 있습니다.\n전화하지 않았고, 중요한 순간에 자꾸 없었습니다.\n한 번의 부재는 별일 아닙니다.\n문제는 그것이 패턴이 되는 순간입니다.\n그때 상대방의 머릿속에는 하나의 예측 모델이 만들어집니다.\n이 사람은 내가 필요할 때 없을 가능성이 높다.\n이게 무서운 겁니다.\n관계에서 신뢰가 깨진다는 것은 상대방을 싫어하게 된다는 뜻이 아닙니다.\n상대방의 행동을 더 이상 긍정적으로 예측할 수 없게 되는 겁니다.\n사랑은 남아 있을 수도 있습니다.\n그런데 기대는 사라집니다.\n많은 관계는 사랑이 없어져서 끝나는 것이 아니라 기대할 수 없는 사람이 되어버렸기 때문에 끝납니다.\n인간은 결국 경험을 통해 상대방의 다음 행동을 예측합니다.\n그런데 여기서 사람들이 자주 착각합니다.\n가까운 관계일수록 마음을 알아줄 것이라고 생각합니다.\n가족이니까 이해하겠지.\n친구니까 알겠지.\n부부니까 굳이 말하지 않아도 알겠지.\n오히려 반대입니다.\n가까운 관계일수록 행동의 기록은 더 많이 쌓입니다.\n낯선 사람에게 약속 한 번 어겼다고 크게 실망하지 않습니다.\n아직 기대가 없으니까요.\n하지만 가까운 사람이 같은 행동을 반복하면 상처가 커집니다.\n이미 기대라는 자산이 쌓여 있기 때문입니다.\n그래서 관계에는 비용이 들어갑니다.\n시간을 써야 하고, 귀찮음을 견뎌야 하고, 때로는 내 기분보다 상대방을 먼저 고려해야 합니다.\n이 비용을 하나도 지불하지 않으면서 좋은 관계를 원한다면 경제적으로 말해 이상한 거래를 요구하는 것과 같습니다.\n투자 없이 수익만 원하는 겁니다.\n더 중요한 것은 갈등입니다.\n좋은 관계라고 해서 상처가 없는 것은 아닙니다.\n오히려 가까이 있는 사람일수록 서로를 더 많이 건드립니다.\n서로의 약점을 알고 있고, 기대가 높고, 인생의 많은 부분을 공유하기 때문입니다.\n관계의 수준을 갈등의 유무로 판단하면 안 됩니다.\n갈등 이후에 무엇을 하는지를 봐야 합니다.\n사라지는가.\n핑계를 대는가.\n상대방 탓으로 돌리는가.\n아니면 다시 나타나서 문제를 해결하는가.\n여기에서 신뢰가 결정됩니다.\n나는 사람을 볼 때 실패 자체보다 실패 이후의 행동을 중요하게 보는 편입니다.\n누구나 실수할 수 있습니다.\n하지만 사고가 난 뒤에도 나타나는 사람과 사고가 나면 사라지는 사람은 전혀 다른 사람입니다.\n관계에서도 마찬가지입니다.\n결국 쇼잉 업이라는 말의 핵심은 사랑을 열심히 하라는 이야기가 아닙니다.\n상대방의 인생에서 예측 가능한 사람이 되라는 뜻에 가깝습니다.\n기쁠 때만 등장하는 사람은 지인입니다.\n편할 때만 나타나는 사람은 동료일 수 있습니다.\n하지만 인생이 흔들릴 때도 나타나는 사람은 관계가 됩니다.\n그리고 이건 상대방을 위한 일만도 아닙니다.\n내가 반복해서 누군가의 삶에 나타날 때 나 역시 하나의 정체성을 얻게 됩니다.\n나는 약속을 지키는 사람.\n나는 중요한 순간에 도망가지 않는 사람.\n나는 누군가에게 기대할 수 있는 사람.\n사람은 자신이 반복해서 하는 행동으로 자신을 규정합니다.\n그래서 관계에 투자한다는 것은 결국 자기 자신을 만드는 일이기도 합니다.\n좋은 관계를 원한다면 감정을 확인하는 데 너무 많은 시간을 쓰지 않아도 됩니다.\n나는 이 사람을 얼마나 사랑하는가.\n이 질문보다 더 현실적인 질문이 있습니다.\n이 사람이 나를 필요로 할 때 나는 실제로 나타나고 있는가.\n그리고 반대도 봐야 합니다.\n내가 필요할 때 이 사람은 반복해서 나타나는가.\n관계는 마음속에서 만들어지는 것이 아닙니다.\n시간 속에서 만들어집니다.\n그리고 시간은 결국 그 행동만 기록합니다.\n", "reflect": {"q": ["내가 필요한 순간에 반복해서 나타나는 사람은 누구인가 — 그리고 나는 누구에게 그런 사람인가?", "최근 나의 부재가 패턴이 되어가는 관계는 없는가?", "갈등 이후 나는 사라지는 편인가, 다시 나타나 해결하는 편인가?"], "act": "오늘, 중요한 사람 한 명에게 용건 없이 먼저 연락하기"}}, {"ch": "행동주의자", "no": 17, "unit": "강", "key": "현실습관", "title": "현실 습관 — 왜 첫 번째인가", "sub": "현실을 잘못 보면, 열심히 할수록 멀어진다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%ED%98%84%EC%8B%A4%EC%8A%B5%EA%B4%80_260918.mp4", "dur": 299, "durstr": "4:59", "thumb": "thumbs/현실습관.jpg", "chapters": [{"t": 0.4, "title": "왜 현실 습관이 처음인가"}, {"t": 35.4, "title": "관념의 안경"}, {"t": 67.1, "title": "고민이 아니라 망상"}, {"t": 77.4, "title": "부딪히면 현실이 대답한다"}, {"t": 95.0, "title": "행동은 결과를 초래한다"}, {"t": 111.7, "title": "결과는 늦게, 복리로 온다"}, {"t": 167.0, "title": "타임 바인딩 — 남의 10년을 몇 시간에"}, {"t": 233.2, "title": "꿈보다 현실을 정확히"}, {"t": 266.0, "title": "모든 습관의 바닥, 두 가지 질문"}], "notes": [], "script": "백만장자 습관에는 태도 습관도 있고, 관점 습관도 있고, 행동 습관도 있습니다.\n그런데 이상합니다.\n행동 습관은 맨 마지막에 있고, 가장 처음 나오는 것이 현실 습관입니다.\n왜일까요?\n현실을 잘못 보고 있는 사람이 열심히 행동하면 어떻게 될까요?\n틀린 방향으로 더 빨리 갑니다.\n그래서 행동보다 먼저 현실을 제대로 보는 습관이 필요합니다.\n이 책에서도 현실 습관을 다른 모든 성공 습관의 토대라고 말합니다.\n우리는 머리로는 명확한 사실에 동의합니다.\n그런데 행동할 때가 되면 지성을 무시하고 감정적으로 움직입니다.\n현실보다 내가 믿고 싶은 것을 믿습니다.\n현실은 무엇입니까?\n내가 바라는 것이 현실입니까?\n내가 그렇게 느끼는 것이 현실입니까?\n아닙니다.\n현실은 있는 그대로 존재하는 것입니다.\n그런데 사람들은 세상은 이래야 해.\n나는 이 정도는 해야 해.\n저 사람은 원래 저래.\n라는 관념을 만들어놓고 그 관념을 통해 현실을 보기 시작합니다.\n책에서는 현실은 하나이고, 사람마다 다른 것은 현실 자체가 아니라 현실을 바라보는 인식이라고 말합니다.\n사실과 허구를 구분하고, 실제로 유효한 것과 유효하지 않은 것을 구분하는 능력.\n그게 현실을 보는 능력입니다.\n그래서 저는 해보지도 않는 것을 고민이라고 하지 않습니다.\n망상입니다.\n내가 잘할 수 있을까?\n사업이 될까?\n사람들이 좋아할까?\n머릿속에서 백 번 생각해봐야 모릅니다.\n하나 올려보십시오.\n한 명에게 팔아보십시오.\n전화해보십시오.\n물어보십시오.\n부딪혀보십시오.\n그러면 현실이 대답합니다.\n진짜 고민은 생각하고, 행동하고, 결과를 보고, 수정하는 것입니다.\n생각만 계속 반복하는 것은 현실과 접촉하지 않은 상태입니다.\n현실 습관에서 가장 중요한 원칙도 단순합니다.\n행동은 결과를 초래한다.\n내가 무엇을 하면 무언가는 반드시 일어납니다.\n좋은 의도가 있다고 해서 좋은 결과가 자동으로 오는 것도 아닙니다.\n현실은 내 마음을 봐주지 않습니다.\n같은 원인을 만들면 그에 따른 결과가 옵니다.\n더 무서운 것은 그 결과가 바로 나타나지 않을 수도 있다는 겁니다.\n오늘 약속 하나를 어겨도 별일 없을 수 있습니다.\n오늘 공부를 안 해도 당장 큰일은 없습니다.\n오늘 해야 할 일을 미뤄도 세상은 그대로 돌아갑니다.\n그래서 착각합니다.\n괜찮네.\n그런데 시간이 지나면 작은 행동들이 쌓입니다.\n작은 게으름이 실력이 되고, 작은 무책임이 신뢰가 되고, 작은 실천이 능력이 됩니다.\n책에서도 행동의 결과는 시간이 지나며 더 커질 수 있고, 반복된 행동의 대가가 복리처럼 불어날 수 있다고 이야기합니다.\n그래서 지금의 현실을 보면 됩니다.\n지금 내가 무엇을 반복하고 있는지 보면 미래가 어디로 가고 있는지도 어느 정도 볼 수 있습니다.\n하루만 보면 별 차이가 없습니다.\n질문 하나 더 한 사람.\n복기 한 줄 더 남긴 사람.\n한 번 더 실행한 사람.\n오늘만 보면 아무 차이도 없어 보입니다.\n그런데 시간이 지나면 기울기가 생깁니다.\n1도의 차이가 시간을 만나면 완전히 다른 곳에 도착합니다.\n그리고 현실을 정확히 보기 위해서는 지식과 지혜가 필요합니다.\n책에서는 지식보다 지혜를 더 중요하게 봅니다.\n지혜는 판단력이고, 경험을 통해 얻는 것입니다.\n문제는 경험이 비싸다는 겁니다.\n돈을 잃고 배울 수도 있고, 사람을 잃고 배울 수도 있고, 사업을 망쳐보고 배울 수도 있습니다.\n그런데 우리는 모든 고통을 직접 겪을 필요가 없습니다.\n이미 먼저 살아본 사람의 경험을 가져올 수 있습니다.\n책을 통해서, 강의를 통해서, 기록을 통해서.\n책에서는 이것을 타인의 경험을 통해 배우는 것, 타임 바인딩이라고 설명합니다.\n남이 10년 동안 실패하면서 얻은 지혜를 나는 몇 시간 만에 읽을 수도 있습니다.\n이게 얼마나 엄청난 일입니까?\n이미 불에 손을 넣어본 사람이 뜨겁다.\n라고 알려줬는데 굳이 나도 넣어보고 판단할 필요는 없습니다.\n물론 내 경험도 필요합니다.\n하지만 같은 실수를 반복하지는 말아야 합니다.\n내가 행동했고, 결과가 나왔고, 잘못됐다는 것을 알았다면 원인을 찾고, 수정하고, 다음 행동에 적용해야 합니다.\n책에서도 자신의 고통스러운 경험에서 교훈을 얻고, 그 지혜를 미래의 행동에 적용해야 한다고 말합니다.\n그래서 현실 습관은 비관적으로 살라는 이야기가 아닙니다.\n꿈꾸지 말라는 이야기도 아닙니다.\n꿈보다 현실을 더 정확히 보라는 이야기입니다.\n내가 원하는 것과 현재의 현실 사이에 얼마나 거리가 있는지 있는 그대로 보는 것입니다.\n그래야 움직일 수 있습니다.\n매사에 진지하라는 것도 저는 같은 말이라고 생각합니다.\n진지하다는 것은 무겁게 살라는 뜻이 아닙니다.\n망상하지 말라는 것입니다.\n현실을 외면하지 말라는 것입니다.\n현실을 보고, 행동하고, 결과를 보고, 배우고, 수정하고, 다시 행동하는 것.\n왜 현실 습관이 첫 번째인지 생각해보십시오.\n현실을 제대로 보지 못하면 태도도, 관점도, 행동도 전부 틀어질 수 있습니다.\n그래서 현실 습관은 첫 번째 챕터가 아니라 나머지 모든 습관을 세우는 바닥입니다.\n마지막으로 두 가지만 질문해보십시오.\n나는 지금 현실을 보고 있는가?\n아니면 내가 보고 싶은 것을 현실이라고 믿고 있는가?\n그리고 그 현실을 바꾸기 위해 나는 오늘 무엇을 했는가?\n망상은 생각 속에 있습니다.\n현실은 부딪히는 순간부터 시작됩니다.\n", "reflect": {"q": ["나는 지금 현실을 보고 있는가, 보고 싶은 것을 현실이라고 믿고 있는가?", "머릿속에서 백 번 생각만 하고 아직 부딪혀보지 않은 일은 무엇인가?", "지금 내가 매일 반복하는 행동은 어떤 미래를 복리로 쌓고 있는가?"], "act": "고민 중인 것 하나를 오늘 현실에 부딪혀보기 — 하나 올리거나, 한 명에게 팔거나, 전화 한 통"}}, {"ch": "행동주의자", "no": 18, "unit": "강", "key": "오스본", "title": "오스본 9가지 질문으로 프레임 깨기", "sub": "아이디어가 없는 게 아니라, 질문이 반복되고 있는 겁니다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%98%A4%EC%8A%A4%EB%B3%B8_260919.mp4", "dur": 323, "durstr": "5:22", "thumb": "thumbs/오스본.jpg", "chapters": [{"t": 2.4, "title": "아이디어가 없는 게 아니다"}, {"t": 14.6, "title": "같은 구멍을 더 깊게 파는 중"}, {"t": 31.8, "title": "오스본 — 질문의 도구"}, {"t": 52.2, "title": "질문을 뒤집어본다"}, {"t": 77.7, "title": "하나의 문제, 아홉 개의 방향"}, {"t": 91.3, "title": "엘든링 — 보스만 문제인가"}, {"t": 119.6, "title": "문제 자체를 메타인지"}, {"t": 153.8, "title": "먼저 나, 그다음 AI"}, {"t": 184.0, "title": "사고의 사각지대"}, {"t": 204.6, "title": "TOP3 — 현실에 내려놓기"}, {"t": 233.9, "title": "가장 중요한 마지막 질문"}, {"t": 272.6, "title": "프레임 밖에서 한 번"}], "notes": [], "script": "사람들은 자주 말합니다.\n\"아이디어가 없습니다.\"\n그런데 정말 아이디어가 없는 걸까요?\n대부분은 그렇지 않습니다.\n아이디어가 없는 게 아니라 같은 질문을 계속 반복하고 있는 겁니다.\n사업이 안 됩니다.\n그러면 묻습니다.\n\"어떻게 더 많이 팔지?\"\n한 시간 생각합니다.\n답이 안 나옵니다.\n하루 더 생각합니다.\n그런데 질문은 그대로입니다.\n그렇다면 사고가 넓어진 게 아닙니다.\n같은 구멍을 더 깊게 파고 있는 겁니다.\n때로는 답을 더 오래 고민할 것이 아니라 질문을 바꿔야 합니다.\n이번 주에는 오스본 매트릭스를 사용합니다.\n오스본은 답을 알려주는 도구가 아닙니다.\n하나의 문제를 평소와 다른 방향에서 강제로 바라보게 만드는 질문의 도구입니다.\n예를 들어보겠습니다.\n\"어떻게 고객을 더 늘릴까?\"\n계속 이것만 물으면 광고를 더 하거나, 영업을 더 하거나, 콘텐츠를 더 만드는 익숙한 답이 나옵니다.\n그런데 질문을 바꿔봅니다.\n고객을 늘리는 게 아니라 줄이면?\n상품을 더 만드는 게 아니라 절반으로 줄이면?\n가격을 내리는 게 아니라 열 배 올리면?\n내가 직접 하는 대신 다른 것으로 대체하면?\n경쟁사를 고객으로 만들면?\n처음에는 이상합니다.\n좋습니다.\n이상해야 합니다.\n오스본의 목적은 이상한 질문마다 좋은 답을 얻는 것이 아닙니다.\n내 생각이 늘 달리던 길에서 잠깐 벗어나는 겁니다.\n그래서 하나의 문제를 전용, 응용, 변경, 확대, 축소, 대체, 재배치, 역발상, 결합.\n아홉 개의 방향으로 다시 바라봅니다.\n문제는 그대로입니다.\n달라진 것은 질문입니다.\n이 사고방식은 엘든링과도 비슷합니다.\n보스를 못 잡는다고 해보겠습니다.\n같은 무기를 들고, 같은 길로 들어가고, 같은 타이밍에 공격하고, 계속 죽습니다.\n그러고는 말합니다.\n\"이 보스 너무 어렵다.\"\n그런데 정말 보스만 문제입니까?\n다른 무기를 쓰면?\n레벨을 먼저 올리면?\n소환을 쓰면?\n다른 길로 돌아가면?\n전투 순서를 바꾸면?\n아니면 지금 꼭 이 보스를 잡아야 합니까?\n보스는 그대로입니다.\n질문이 바뀌면 게임이 달라집니다.\n문제를 잘 푼다는 것은 눈앞의 문제에 무작정 달려드는 것이 아닙니다.\n내가 지금 어떤 방식으로만 문제를 보고 있는지를 한 발 떨어져서 보는 겁니다.\n문제 자체를 메타인지하는 겁니다.\n만다라트가 목표를 쪼개는 도구라면, SCAMPER는 기존의 것을 변형하는 도구입니다.\n오스본은 질문의 방향을 바꿔가며 내 사고의 범위를 넓히는 도구입니다.\n중요한 것은 이름을 외우는 게 아닙니다.\n핵심은 이것입니다.\n사람은 오래 생각한다고 자동으로 넓게 생각하지 않습니다.\n오히려 같은 질문을 가지고 오래 생각하면 익숙한 사고방식만 더 강화될 수도 있습니다.\n그래서 이번 과제에서는 처음부터 AI를 사용하지 않습니다.\n왜일까요?\n처음부터 AI에게 물어보면 답은 많이 나옵니다.\n그런데 내가 원래 어떻게 생각하는 사람인지는 알 수 없습니다.\n먼저 내가 직접 아홉 가지 질문에 답해봅니다.\n그다음 같은 문제를 AI에게 물어봅니다.\n그리고 비교합니다.\n\"AI는 생각했는데 나는 생각하지 못했던 것은 무엇인가?\"\n그리고 반대로\n\"나는 생각했는데 AI는 생각하지 못했던 것은 무엇인가?\"\n이 두 가지를 봐야 합니다.\nAI에게 생각을 대신 맡기는 것이 아닙니다.\nAI를 통해 내 사고의 사각지대를 보는 겁니다.\n나는 항상 무언가를 추가하려고만 하는 사람인지,\n줄이는 사고를 잘 하지 않는지,\n순서를 바꾸는 생각이 없는지,\n다른 사람이나 도구로 대체하는 생각을 못하는지,\n반대로 생각하는 것을 불편해하는지.\n좋은 아이디어보다 이걸 발견하는 것이 더 중요합니다.\n그다음에는 나와 AI가 만든 아이디어 전체에서 TOP3를 고릅니다.\n효과가 있는가.\n내가 통제할 수 있는가.\n7일 안에 해볼 수 있는가.\n시간과 돈과 에너지는 얼마나 드는가.\n이 네 가지 기준으로 아이디어를 다시 현실에 내려놓습니다.\n왜냐하면 재미있는 아이디어와 실제로 해볼 수 있는 아이디어는 다를 수 있기 때문입니다.\n그리고 TOP3 가운데 하나를 선택합니다.\n언제 할 것인지, 어떻게 할 것인지, 어디서부터 시작할 것인지.\n행동계획을 세웁니다.\n그런데 사실 이번 과제에서 이것보다 더 중요한 것이 있습니다.\n마지막 질문입니다.\n\"이번 과제를 통해 나는 내 사고에 대해 무엇을 발견했는가?\"\n나는 늘 같은 방식으로만 문제를 풀고 있지 않았는가.\n문제가 생기면 무조건 더하려고 했는가.\n사람이 부족하면 사람을 더 구하려고 했는가.\n매출이 떨어지면 고객을 더 모으는 생각부터 했는가.\n줄이거나, 뒤집거나, 순서를 바꾸거나, 아예 다른 용도로 쓰는 생각은 거의 하지 않았는가.\n이걸 발견해야 합니다.\n왜냐하면 이번에 해결할 문제 하나보다 앞으로 수없이 만날 문제를 내가 어떤 방식으로 바라보는지를 아는 것이 훨씬 중요하기 때문입니다.\n이번 과제의 목적은 오스본이라는 도구를 외우는 것이 아닙니다.\n내가 원래 어떤 프레임 안에서 문제를 보고 있었는지를 발견하고, 그 프레임 밖에서 한 번 생각해보는 것입니다.\n문제가 막힌 것이 아닐 수도 있습니다.\n내 질문이 막혀 있는 것일 수 있습니다.\n같은 질문을 가지고 더 오래 고민하지 마십시오.\n한 번 크게 보고, 한 번 작게 보고, 순서를 바꿔보고, 다른 것으로 바꿔보고, 반대로 보고, 다른 것과 합쳐보십시오.\n문제는 그대로인데 질문 하나가 바뀌는 순간 전혀 다른 길이 보일 수도 있습니다.\n이번 주에는 답을 잘 내는 연습보다 질문을 바꾸는 연습을 해보십시오.\n아홉 번 비틀어보고, 그중 하나를 실제로 움직일 준비를 해보십시오.\n그리고 마지막에는 이 질문 하나를 남겨보십시오.\n\"나는 지금까지 어떤 방식으로만 생각하고 있었는가?\"\n", "reflect": {"q": ["나는 문제가 생기면 무조건 더하려고만 하는가 — 줄이기·뒤집기·순서 바꾸기를 생각해본 적 있는가?", "지금 막혀 있는 문제 하나 — 문제가 막힌 건가, 내 질문이 막힌 건가?", "AI와 비교했을 때 나만 못 보는 사고의 사각지대는 어느 방향인가?"], "act": "막힌 문제 하나를 아홉 방향(전용·응용·변경·확대·축소·대체·재배치·역발상·결합)으로 한 줄씩 비틀어 적기"}}, {"ch": "행동주의자", "no": 19, "unit": "강", "key": "불신의벽", "title": "고객은 상품보다 먼저 당신을 의심합니다", "sub": "불신의 벽을 넘는 다섯 단계", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD_260925.mp4", "dur": 570, "durstr": "9:30", "thumb": "thumbs/불신의벽.jpg", "chapters": [{"t": 2.4, "title": "상품보다 먼저 당신을 의심한다"}, {"t": 26.2, "title": "불신의 벽을 넘는 다섯 단계"}, {"t": 48.5, "title": "1. 공감 — 방어하게 만들지 않기"}, {"t": 91.1, "title": "안심 또는 불안 — 목적은 '뭐지?'"}, {"t": 118.1, "title": "2. 공통의 적 — 같은 편이 되기"}, {"t": 188.2, "title": "3. 대역전 스토리 — 나도 안 됐다"}, {"t": 263.3, "title": "대역전의 기본 구조"}, {"t": 273.9, "title": "4. 주저하는 히어로 — 정보의 무게"}, {"t": 321.8, "title": "가짜 비밀은 신뢰를 잃는다"}, {"t": 354.3, "title": "5. 재능이 아니라 지식과 기술"}, {"t": 408.8, "title": "영웅이 아니라 고객이 주인공"}, {"t": 416.9, "title": "정리 — 의심에서 신뢰까지"}, {"t": 493.0, "title": "카피 기술로만 쓰면 안 된다"}, {"t": 535.8, "title": "실제로 도움이 되는 것"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%EC%BB%B700.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC% BB%B718.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%EC%BB%B719.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C05.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/33%ED%98%B8_%EB%B6%88%EC%8B%A0%EC%9D%98%EB%B2%BD/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C06.jpg"], "script": "아무리 좋은 상품을 가지고 있어도 고객이 처음부터 당신 말을 믿어주는 것은 아닙니다.\n오히려 반대입니다.\n\"이거 진짜 맞아?\"\n\"또 팔려고 하는 거 아니야?\"\n\"이 사람이 하는 말을 믿어도 되나?\"\n상품을 보기 전에 먼저 당신을 의심합니다.\n그러니까 상품을 잘 설명하는 것만으로는 부족합니다.\n그 전에 불신의 벽을 넘어야 합니다.\n저는 이 과정을 다섯 단계로 볼 수 있다고 생각합니다.\n공감.\n공통의 적.\n대역전 스토리.\n주저하는 히어로.\n그리고 재능이 아니라 지식과 기술.\n이 다섯 가지가 이어지면 처음에는 의심하던 사람이 조금씩 듣기 시작하고, 신뢰하기 시작하고,\n나중에는 \"이 사람한테 배우면 도움이 되겠다.\" 라고 생각하게 됩니다.\n첫 번째는 공감입니다.\n사람은 자기 잘못이라고 느끼는 순간 방어적으로 변하기 쉽습니다.\n예를 들어 사업이 안 되는 사람한테\n\"당신이 마케팅을 못해서 그렇습니다.\"\n라고 말한다고 해보겠습니다.\n틀린 말일 수도 있고 맞는 말일 수도 있습니다.\n그런데 중요한 건 그 순간부터 상대가 내 말을 듣기 어려워질 수 있다는 겁니다.\n자기를 지켜야 하기 때문입니다.\n그래서 처음에는 상대를 안심시키는 방식이 필요할 수 있습니다.\n\"당신이 완전히 잘못한 것이 아닙니다.\"\n\"지금까지 그렇게 될 수밖에 없었던 구조가 있습니다.\"\n\"당신이 아직 보지 못한 원인이 있을 수 있습니다.\"\n이렇게 시작하는 겁니다.\n물론 무조건 위로하라는 얘기는 아닙니다.\n반대로 갈 수도 있습니다.\n\"지금 중요한 걸 놓치고 있을 수도 있습니다.\"\n라고 불안을 건드릴 수도 있습니다.\n안심을 주는 방법도 있고, 놓치고 있는 것을 보여줘서 불안을 일으키는 방법도 있습니다.\n둘 다 목적은 같습니다.\n상대가 \"뭐지?\" 하고 다음 이야기를 듣게 만드는 겁니다.\n중요한 건 처음부터 \"너 잘못했어.\" 라고 몰아붙여서 감정이 판단을 방해하게 만들지 않는 겁니다.\n두 번째는 공통의 적입니다.\n앞에서 \"당신만의 잘못은 아닐 수 있습니다.\" 라고 말했다면 그다음 질문이 생깁니다.\n\"그러면 뭐가 문제인데?\"\n여기서 공통의 적이 나옵니다.\n그 적이 꼭 어떤 사람일 필요는 없습니다.\n업계의 잘못된 관행일 수도 있고,\n비효율적인 구조일 수도 있고,\n사람들이 당연하다고 믿는 방식일 수도 있고,\n기존 시장이 만들어놓은 문제일 수도 있습니다.\n예를 들어 프랜차이즈를 했다가 힘들었던 사람이 있다고 해보겠습니다.\n그 사람한테 \"당신이 장사를 못해서 망한 겁니다.\" 라고 하는 것과\n\"프랜차이즈 구조 안에서 당신이 통제할 수 없는 문제가 있었습니다.\" 라고 하는 것은 완전히 다릅니다.\n후자는 고객과 판매자의 관계를 조금 바꿉니다.\n나는 당신에게 무언가를 팔려는 사람이 아니라 당신과 함께 같은 문제를 바라보는 사람이 됩니다.\n공통의 적이 생기면 우리 둘 사이에는 동조가 생깁니다.\n\"아, 이 사람도 내가 답답했던 게 뭔지 아는구나.\"\n그 순간부터 판매자와 고객이 아니라 같은 편처럼 느껴지기 시작합니다.\n세 번째는 대역전 스토리입니다.\n여기서부터 내 이야기를 하는 겁니다.\n그런데 중요한 것은 \"내가 얼마나 대단한가\"를 자랑하는 이야기가 아닙니다.\n오히려 반대입니다.\n\"나도 처음에는 안 됐습니다.\"\n\"나도 해봤는데 실패했습니다.\"\n\"나도 이것저것 해봤지만 잘 안 됐습니다.\"\n이렇게 시작합니다.\n사람들이 역전 이야기나 영웅 이야기에 집중하는 이유가 있습니다.\n처음부터 잘된 사람보다 자기와 비슷하게 막히고, 실패하고, 고생했던 사람이 어떻게 거기서 빠져나왔는지가 더 궁금하기 때문입니다.\n예를 들어 자영업에 대한 내용을 쓴다고 하면 \"저는 자영업을 잘합니다.\" 부터 시작하는 게 아니라\n\"저도 처음에는 프랜차이즈도 해보고, 다른 방식도 해봤는데 잘 안 됐습니다.\"\n그리고 \"그러다가 직접 장사를 해보면서 이걸 알게 됐습니다.\" 라고 이어지는 겁니다.\n그러면 정보 하나가 단순한 지식이 아니라 내가 실제로 고생하고 실패하면서 얻은 지식이 됩니다.\n그래서 실패와 고생을 굳이 숨길 필요도 없습니다.\n오히려 그 과정이 신뢰를 만드는 재료가 될 수 있습니다.\n전에는 이랬다.\n안 됐다.\n그래서 이것저것 해봤다.\n그러다 어떤 것을 알게 됐다.\n그리고 지금은 이렇게 됐다.\n이게 대역전의 기본 구조입니다.\n네 번째는 주저하는 히어로입니다.\n이 표현이 조금 낯설 수 있습니다.\n쉽게 말하면 내가 가진 정보를 처음부터 너무 가볍게 툭 던지지 않는 겁니다.\n예를 들어\n\"사실 이 이야기는 공개하고 싶지 않았습니다.\"\n\"이걸 말하면 업계에서 싫어할 수도 있습니다.\"\n\"제가 오랫동안 시행착오를 겪으면서 알게 된 내용이라 쉽게 꺼내고 싶지는 않았습니다.\"\n이런 식입니다.\n왜 이렇게 말할까요?\n사람은 누구나 알고 있는 정보보다 쉽게 공개되지 않는 정보에 조금 더 집중합니다.\n\"왜 공개하기 싫었지?\"\n\"뭔데?\"\n\"그 정도로 중요한 건가?\"\n궁금해집니다.\n정보의 가치가 조금 더 크게 느껴지는 겁니다.\n물론 여기서 가짜 비밀을 만들면 안 됩니다.\n인터넷에 다 있는 내용을 가지고 \"아무도 모르는 비밀입니다.\" 라고 하면 잠깐은 후킹이 될 수 있어도 결국 신뢰를 잃습니다.\n정말 내가 시간과 돈을 쓰고, 실패하고, 직접 부딪히면서 얻은 정보라면\n왜 쉽게 공개하지 않았는지, 왜 지금 공개하는지 그 맥락을 이야기하면 됩니다.\n이 단계는 정보 자체보다 그 정보의 무게를 보여주는 과정입니다.\n그리고 다섯 번째.\n재능이 아니라 지식과 기술입니다.\n여기까지 이야기를 잘하면 사람이 이렇게 생각할 수 있습니다.\n\"저 사람은 대단하네.\"\n\"저 사람이니까 가능했겠지.\"\n그런데 그렇게 끝나면 안 됩니다.\n왜냐하면 고객이 원하는 것은 나를 존경하는 것에서 끝나는 게 아니기 때문입니다.\n자기도 변하고 싶습니다.\n그래서 마지막에는 다시 고객에게 가능성을 돌려줘야 합니다.\n\"제가 특별해서 된 게 아닙니다.\"\n\"타고난 재능이 있어서 가능했던 게 아닙니다.\"\n\"이건 지식이고, 기술이고, 방법입니다.\"\n\"배우고 적용하면 여러분도 할 수 있습니다.\"\n이렇게 연결합니다.\n처음에는 내 이야기를 듣고 신뢰하게 만들지만 마지막에는 \"그러면 나도 가능하겠네.\" 라는 생각이 들게 하는 겁니다.\n이게 중요합니다.\n내가 영웅으로 끝나는 게 아니라 고객이 자기 삶의 주인공이 될 수 있다는 쪽으로 이야기가 돌아가야 합니다.\n정리하면 이렇습니다.\n처음에는 고객이 의심합니다.\n그래서 공감합니다.\n\"당신만의 잘못은 아닐 수 있습니다.\" 혹은 \"당신이 놓치고 있는 것이 있을 수 있습니다.\"\n그다음 공통의 적을 보여줍니다.\n\"우리가 같이 해결해야 할 문제는 이겁니다.\"\n그리고 내 이야기를 합니다.\n\"나도 똑같이 겪어봤습니다.\"\n\"나도 안 됐습니다.\"\n\"그러다가 이걸 알게 됐습니다.\"\n그다음 정보의 가치를 보여줍니다.\n\"쉽게 얻은 내용이 아닙니다.\"\n\"오랫동안 시행착오를 겪으면서 얻은 것입니다.\"\n그리고 마지막.\n\"하지만 이건 나만 할 수 있는 일이 아닙니다.\"\n\"재능이 아니라 지식과 기술입니다.\"\n이 다섯 단계가 하나의 흐름으로 이어집니다.\n공감.\n공통의 적.\n대역전 스토리.\n주저하는 히어로.\n재능이 아닌 지식과 기술.\n결국 이 과정은 의심을 신뢰로 바꾸는 과정입니다.\n처음에는 \"이 사람 말 믿어도 돼?\" 라고 생각했다가\n조금 지나면 \"이 사람 내 상황을 이해하고 있네.\"\n그리고 \"이 사람도 이걸 직접 겪어봤구나.\"\n그리고 \"이 사람이 말하는 방법에는 이유가 있겠네.\"\n마지막에는 \"그럼 나도 한번 해볼 수 있겠는데?\" 까지 가는 겁니다.\n그런데 여기서 제일 중요한 것이 있습니다.\n이 다섯 가지를 카피 기술로만 쓰면 안 됩니다.\n공감하는 척하고, 억지로 적을 만들고, 없는 실패담을 만들고, 별것도 아닌 걸 비밀이라고 포장하고,\n마지막에 \"당신도 할 수 있습니다.\" 라고 말한다고 해서 좋은 마케팅이 되는 것은 아닙니다.\n본질은 실제로 도움이 되는가입니다.\n\"이 사람이 정말 나를 생각하고 있구나.\"\n\"이 사람에게 배우면 내 문제가 조금이라도 나아질 수 있겠구나.\"\n이 감각이 실제로 있어야 합니다.\n기술적으로 사람을 데려와도 상품이나 서비스가 도움이 되지 않으면 한 번 사고 끝납니다.\n그러니까 불신의 벽을 깨는 진짜 방법은 말을 잘하는 게 아닙니다.\n처음에는 고객의 마음을 이해하고,\n같이 해결할 문제를 보여주고,\n내가 먼저 겪어본 과정을 보여주고,\n내가 가진 정보의 맥락을 설명하고,\n마지막에는 그 가능성을 다시 고객에게 돌려주는 것.\n그리고 실제로 그 사람에게 도움이 되는 것.\n그게 불신을 신뢰로 바꾸는 가장 중요한 구조입니다.\n", "reflect": {"q": ["내 고객은 내 상품을 보기 전에 나를 어떻게 의심하고 있을까?", "나는 고객에게 '당신이 잘못해서 그렇다'는 말을 돌려서라도 하고 있지 않은가?", "내 실패와 고생 중에 고객에게 신뢰의 재료가 될 수 있는 이야기는 무엇인가?"], "act": "내 사업 소개를 공감 → 공통의 적 → 대역전 → 주저하는 히어로 → 지식과 기술 다섯 줄로 한 번 써보기"}}, {"ch": "행동주의자", "no": 20, "unit": "강", "key": "문제정의", "title": "그 문제, 정말 풀어야 합니까?", "sub": "문제해결보다 먼저, 문제정의", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%AC%B8%EC%A0%9C%EC%A0%95%EC%9D%98_260912.mp4", "dur": 306, "durstr": "5:06", "thumb": "thumbs/문제정의.jpg", "chapters": [{"t": 0.0, "title": "엘든링 초보자는 바로 싸운다"}, {"t": 11.8, "title": "질문이 달라진다"}, {"t": 32.1, "title": "문제로 볼지도 선택할 수 있다"}, {"t": 38.6, "title": "주어진 문제를 자기 문제로"}, {"t": 58.0, "title": "한 단계 위 — 질문 자체를 의심한다"}, {"t": 74.4, "title": "문제해결 vs 문제정의"}, {"t": 109.6, "title": "여섯 단계"}, {"t": 160.4, "title": "AI 시대 — 싸지는 것, 비싸지는 것"}, {"t": 181.7, "title": "좋은 질문"}, {"t": 202.1, "title": "이너게임과 연결"}, {"t": 240.0, "title": "거대한 보스를 삭제한다"}, {"t": 263.4, "title": "잘못 정의된 문제를 제거해라"}, {"t": 286.7, "title": "무엇을 문제라고 볼 것인가"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/11%ED%98%B8_%EB%AC%B8%EC%A0%9C%EC%A0%95%EC%9D%98/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/11%ED%98%B8_%EB%AC%B8%EC%A0%9C%EC%A0%95%EC%9D%98/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/11%ED%98%B8_%EB%AC%B8%EC%A0%9C%EC%A0%95%EC%9D%98/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC% 15.jpg"], "script": "엘든링을 처음 하면 이런 일이 자주 생깁니다.\n길을 가다가 말도 안 되게 강한 적을 만납니다.\n초보자는 보통 바로 싸우기 시작합니다.\n앞에 적이 있으니까 잡아야 한다고 생각합니다.\n그런데 게임에 조금 익숙해지면 질문이 달라집니다.\n저걸 어떻게 잡지?\n가 아니라,\n근데 내가 왜 지금 저걸 잡아야 하지?\n라고 묻게 됩니다.\n옆으로 돌아갈 수도 있습니다.\n말을 타고 그냥 지나갈 수도 있습니다.\n다른 지역에 가서 레벨을 올리고 나중에 다시 올 수도 있습니다.\n무기를 바꿀 수도 있고, 도움을 받을 수도 있습니다.\n그러니까 문제를 해결하는 방법만 여러 개인 게 아닙니다.\n애초에\n이걸 지금 문제로 봐야 하는가?\n도 선택할 수 있습니다.\n저는 이게 현실에서도 굉장히 중요한 능력이라고 봅니다.\n우리는 주어진 문제를 너무 쉽게 자기 문제로 받아들입니다.\n회사가 승진이 중요하다고 하면\n어떻게 승진하지?\n주변에서 집을 사야 한다고 하면\n어떻게 집을 사지?\n사업 매출이 떨어지면\n어떻게 매출을 올리지?\n직원이 일을 잘 안 하면\n어떻게 더 열심히 일하게 만들지?\n그런데 한 단계 위에서는 질문 자체를 의심할 수 있습니다.\n내가 정말 승진해야 하는가?\n지금 집을 사는 게 중요한가?\n우리 사업에서 정말 필요한 것이 매출인가? 아니면 순이익인가?\n직원의 의욕이 문제인가? 아니면 사람의 의지에 지나치게 의존하는 구조가 문제인가?\n여기서부터 문제해결이 아니라 문제정의가 시작됩니다.\n문제해결은 이미 만들어진 보스를 잘 잡는 능력에 가깝습니다.\n문제정의는 저게 정말 보스인지부터 확인하는 능력입니다.\n엘든링으로 치면 정확히 그렇습니다.\n초보자는 앞에 적이 나오면 싸웁니다.\n한 단계 위에서는\n저 적을 지금 잡아야 하나?\n를 봅니다.\n더 높은 단계에서는\n이 길 자체가 맞나?\n다른 지역으로 가면 안 되나?\n를 봅니다.\n현실도 똑같습니다.\n그래서 변화가 빠르고 불확실성이 큰 시대에는 문제를 빨리 푸는 능력만큼 어떤 문제를 풀어야 할지 정하는 능력이 중요해집니다.\n저는 이걸 여섯 단계로 볼 수 있다고 생각합니다.\n첫 번째는 감지입니다.\n지금 무슨 변화가 일어나고 있는지를 보는 겁니다.\n두 번째는 문제 정의입니다.\n사람들이 문제라고 부르는 것이 정말 핵심 문제인지 의심합니다.\n세 번째는 질문 생성입니다.\n다른 설명은 없는가?\n내가 당연하다고 생각한 전제가 틀린 것은 아닌가?\n를 묻습니다.\n네 번째는 선택지 생성입니다.\n해결할 수도 있고, 우회할 수도 있고, 잠시 보류할 수도 있고, 포기할 수도 있고, 아예 문제를 다시 정의할 수도 있습니다.\n다섯 번째는 작은 실험입니다.\n완벽한 정답을 기다리지 않고 작게 행동해서 데이터를 얻습니다.\n그리고 마지막은 업데이트입니다.\n결과를 보고 처음 던졌던 질문 자체를 다시 바꿉니다.\n요즘 말하는 sensemaking, problem framing, adaptive thinking 같은 것들도 이 흐름과 연결됩니다.\n그리고 AI 시대에는 이 차이가 더 커질 겁니다.\nAI는 이미 주어진 문제를 푸는 능력이 굉장히 강합니다.\n보고서 써줘.\n마케팅 문구 만들어줘.\n데이터 분석해줘.\n전략 10개 만들어줘.\n이런 일은 점점 더 싸집니다.\n반대로 더 비싸지는 능력은\n무엇을 물어야 하는가.\n무엇을 문제로 볼 것인가.\n어떤 전제를 버려야 하는가.\n이쪽일 가능성이 높습니다.\n좋은 질문이라는 것도 회의에서\n왜요?\n를 많이 던지는 것과는 다릅니다.\n팀 전체가 당연하다고 믿는 전제를 한 번 흔들 수 있는 질문입니다.\n어떻게 더 열심히 일하게 만들까?\n가 아니라,\n왜 이렇게까지 사람의 의지에 의존하는 구조를 만들었지?\n매출을 어떻게 더 올릴까?\n가 아니라,\n우리가 원하는 것은 매출인가, 순이익인가?\n이런 질문입니다.\n그리고 재미있는 것은 이게 얼마 전에 이야기했던 이너게임과도 연결된다는 겁니다.\n이너게임의 핵심 공식은\nPerformance = Potential - Interference.\n성과 = 잠재력 - 간섭입니다.\n우리는 보통 문제가 생기면 계속 더하려고 합니다.\n정신력이 부족하다.\n그러면 정신력을 키우자.\n성과가 부족하다.\n그러면 더 노력하자.\n문제가 있다.\n그러면 문제를 해결하자.\n그런데 한 단계 위에서는 묻습니다.\n정신력이 부족하다는 게 맞나?\n애초에 이게 문제인가?\n안 해도 되는 일을 붙잡고 있는 것은 아닌가?\n불필요한 규칙, 두려움, 비교, 마찰이 이미 있는 능력이 나오지 못하게 막는 것은 아닌가?\n예를 들어\n정신력이 약하다\n라는 거대한 보스를 만들 필요가 없을 수도 있습니다.\n실제 문제는 수면 부족일 수도 있고, 업무 시작 마찰일 수도 있고, 실패 이후 복귀 규칙이 없는 것일 수도 있고, 보고 구조가 없는 것일 수도 있습니다.\n그러면 정신력을 키운다는 거대한 퀘스트를 삭제하고,\n수면시간 고정, 다음 날 한 줄 보고, 업무를 10분 단위로 시작하기\n같은 작은 길로 우회할 수 있습니다.\n엘든링에서 보스를 더 잘 잡는 법만 찾는 게 아니라 그 보스를 지금 안 잡아도 되는지를 보는 것.\n이너게임에서 더 강한 자아를 만드는 게 아니라 과잉통제와 자기평가를 줄이는 것.\n사업에서 매출을 더 올리는 것만 보는 게 아니라 비용을 줄여 순이익을 높일 수도 있다는 것.\n전부 같은 구조일 수 있습니다.\n더 강해져라.\n보다\n덜 방해받아라.\n더 해결해라.\n보다\n잘못 정의된 문제를 제거해라.\n그래서 앞으로 중요한 사람은 정답을 가장 빨리 찾는 사람보다\n잘못된 문제를 가장 빨리 버릴 수 있는 사람일지도 모릅니다.\n무엇을 해결할 것인가보다 먼저, 무엇을 문제라고 볼 것인가.\n저는 이게 앞으로 점점 더 비싼 능력이 될 거라고 봅니다.\n", "reflect": {"q": ["내가 지금 풀고 있는 문제 중, '정말 풀어야 하는 문제'인지 의심해본 적 있는 것은?", "누가 준 질문을 그대로 받아서 풀고 있는 일은 무엇인가?", "AI가 문제해결을 싸게 만든다면, 나는 어떤 질문을 만들 수 있는 사람인가?"], "act": "지금 붙잡고 있는 문제 하나를 '풀지 않고 삭제하면 어떻게 되는지' 복기칸에 적어보기"}}, {"ch": "마케팅주의자", "no": 1, "unit": "강", "key": "마케팅구조", "title": "마케팅의 구조", "sub": "모객 → 잠재고객 팔로우 → 판매 → 고객화", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%A7%88%EC%BC%80%ED%8C%85%EA%B5%AC%EC%A1%B0_16x9.mp4", "dur": 526, "durstr": "8:46", "thumb": "thumbs/마케팅구조.jpg", "chapters": [{"t": 0.0, "title": "마케팅은 도구가 아니라 구조"}, {"t": 23.8, "title": "고객 상태 변화의 전체 흐름"}, {"t": 72.1, "title": "① 모객"}, {"t": 140.5, "title": "② 잠재고객 팔로우"}, {"t": 259.6, "title": "③ 판매"}, {"t": 300.1, "title": "④ 고객화"}, {"t": 352.4, "title": "전체 구조와 병목 진단"}, {"t": 454.0, "title": "채널보다 구조"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/01_%EB%8F%84%EA%B5%ACvs%EA%B5%AC%EC%A1%B0.png", "https://pub- E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/09_%ED%8C%90%EB%A7%A4%EB%B6%80%EB%8B%B4%EB%B9%84%EA%B5%90.png", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/10_%EA%B3%A0%EA%B0%9D%ED%99%94.png", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/11_%EC%A0%84%EC%B2%B4%EA%B5%AC%EC%A1%B0%EB%8F%84%EC%8B%9D.png", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/12_%EB%B3%91%EB%AA%A9%EC%A7%84%EB%8B%A8%EA%B3%BC%EB%8F%84%EA%B5%AC.png", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/13_%EC%B1%84%EB%84%90%EB%B3%B4%EB%8B%A4%EA%B5%AC%EC%A1%B0.png", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/1%ED%98%B8/%EB%8F%84%ED%95%B4%EC%BA%A1%EC%B3%90/14_%EC%97%94%EB%94%A9.png"], "script": "오늘은 마케팅의 구조에 대해서 이야기해보겠습니다.\n우리는 보통 마케팅이라고 하면 네이버 광고, 메타 광고, 인스타그램, 블로그, 릴스 같은 것을 떠올립니다.\n그런데 이것들은 마케팅 그 자체가 아닙니다.\n전부 도구입니다.\n중요한 것은 어떤 도구를 쓰느냐보다, 그 도구가 전체 구조 안에서 어떤 역할을 하고 있느냐입니다.\n마케팅을 크게 보면, 아직 고객이 아닌 사람을 발견하는 것에서 시작합니다.\n그 사람에게 우리를 알게 만들고,\n관심을 갖게 만들고,\n정보를 제공하고,\n신뢰를 형성합니다.\n그리고 어느 순간 그 사람이 우리의 상품이나 서비스를 구매하게 만듭니다.\n여기서 끝나는 것도 아닙니다.\n한 번 구매한 사람이 다시 구매하고,\n새로운 상품이 나왔을 때 또 구매하고,\n주변 사람에게 우리를 소개하고,\n결국 팬이 되도록 만드는 것.\n이 전체 흐름이 마케팅의 구조입니다.\n그리고 이 구조는 크게 네 단계로 나눌 수 있습니다.\n첫 번째, 모객.\n두 번째, 잠재고객 팔로우.\n세 번째, 판매.\n네 번째, 고객화.\n오늘은 이 네 가지를 머릿속에 넣어두시면 됩니다.\n먼저 모객입니다.\n모객은 우리 상품이나 서비스를 살 가능성이 있는 사람을 모으는 것입니다.\n여기서 중요한 것은 그냥 많은 사람을 데려오는 것이 아닙니다.\n우리 상품이 해결할 수 있는 문제를 가진 사람,\n실제로 그 문제를 해결하려고 움직이고 있는 사람.\n이런 사람들을 잠재고객이라고 합니다.\n예를 들어 발바닥 통증과 관련된 상품을 판매한다고 해보겠습니다.\n발에 아무런 불편이 없는 사람 만 명보다,\n아침 첫발이 아프고,\n오래 걸으면 뒤꿈치가 불편하고,\n실제로 해결 방법을 찾고 있는 사람 백 명이 더 중요할 수 있습니다.\n그러니까 조회수가 많다고 무조건 모객을 잘하고 있는 것은 아닙니다.\n내가 해결할 수 있는 문제를 가진 사람이 실제로 들어오고 있는가.\n이것을 봐야 합니다.\n그리고 이 사람들을 모으기 위해 네이버 광고를 쓸 수도 있고,\n블로그를 쓸 수도 있고,\n인스타그램이나 릴스를 쓸 수도 있습니다.\n하지만 채널은 그다음 문제입니다.\n먼저 봐야 하는 것은 우리는 잠재고객을 지속적으로 모을 수 있는 구조가 있는가입니다.\n두 번째는 잠재고객 팔로우입니다.\n저는 이 단계가 마케팅에서 굉장히 중요하다고 봅니다.\n왜냐하면 많은 사업자들이 모객 다음에 바로 판매로 넘어가기 때문입니다.\n광고를 보고 사람이 들어왔습니다.\n그러면 바로 구매하세요.\n상담 신청하세요.\n지금 결제하세요.\n이렇게 판매를 시작합니다.\n그런데 고객 입장에서 생각해보겠습니다.\n오늘 처음 이 회사를 봤습니다.\n이 회사가 어떤 곳인지도 모르고,\n상품이 정말 좋은지도 모르고,\n나에게 필요한지도 모르고,\n이 가격을 지불할 가치가 있는지도 모릅니다.\n그런데 바로 구매하라고 합니다.\n당연히 어렵습니다.\n그래서 모객과 판매 사이에는 하나의 과정이 필요합니다.\n고객이 우리에게 관심을 갖고,\n정보를 얻고,\n신뢰를 형성하고,\n구매 동기가 생기는 과정입니다.\n이게 잠재고객 팔로우입니다.\n예를 들어 블로그 글을 읽습니다.\n내가 왜 이런 문제를 가지고 있는지 알게 됩니다.\n다른 글을 하나 더 읽습니다.\n그동안 내가 알고 있던 방법이 틀렸을 수도 있다는 것을 알게 됩니다.\n고객 사례를 봅니다.\n나와 비슷한 사람이 어떤 문제를 가지고 있었고, 어떤 과정을 거쳤는지 봅니다.\n후기도 보고,\n이 회사가 어떤 기준으로 일하는지도 봅니다.\n그러면서 사람의 상태가 조금씩 바뀝니다.\n처음에는 여기는 뭐 하는 곳이지?\n였다가,\n여기 이야기가 조금 괜찮은데?\n가 되고,\n그다음에는 내 문제도 여기서 해결할 수 있지 않을까?\n가 됩니다.\n그리고 어느 순간 한번 상담받아보고 싶다.\n한번 사용해보고 싶다.\n라는 상태까지 갑니다.\n이것이 잠재고객 팔로우입니다.\n고객을 억지로 설득하는 것이 아니라,\n정보와 경험을 제공하면서 고객 스스로 구매하고 싶은 상태가 되도록 만드는 것입니다.\n세 번째는 판매입니다.\n앞의 두 단계가 제대로 만들어져 있다면 판매 단계에서 처음부터 모든 것을 설명하고 설득할 필요가 없습니다.\n이미 앞에서 문제를 이해했고,\n우리에게 관심이 생겼고,\n어느 정도 신뢰하고 있고,\n구매할 이유를 가진 사람이 들어오기 때문입니다.\n그러면 판매는 앞에서 만들어놓은 흐름의 결과가 됩니다.\n그래서 마케팅을 잘한다는 것은 마지막 순간에 말을 잘하는 것만을 의미하지 않습니다.\n판매가 일어나기 전에 어떤 조건을 만들어놓았느냐가 더 중요합니다.\n그리고 네 번째가 고객화입니다.\n여기에서도 많은 사업자가 구매가 일어나면 마케팅이 끝났다고 생각합니다.\n그런데 전체 구조에서 보면 구매는 끝이 아닙니다.\n한 번 구매한 사람이 다시 구매하게 만들 수 있는가.\n새로운 상품을 제안했을 때 다시 찾아오게 만들 수 있는가.\n더 나아가서 주변 사람에게 우리 상품을 소개하고, 우리를 추천하게 만들 수 있는가.\n여기까지가 고객화입니다.\n한 번 산 사람과 계속 사는 사람은 완전히 다릅니다.\n한 번 구매한 사람만 계속 만들면 사업은 매달 새로운 고객을 데려오는 비용을 계속 지불해야 합니다.\n반대로 한 번 구매한 사람이 다시 사고, 또 다른 사람까지 데려온다면 사업의 구조 자체가 달라집니다.\n그래서 고객화는 유저를 고객으로, 고객을 팬으로 만드는 과정이라고 볼 수 있습니다.\n이렇게 보면 마케팅의 구조는 명확합니다.\n잠재고객을 모읍니다.\n모은 사람에게 정보를 제공하고, 관심과 신뢰를 형성합니다.\n그 결과 판매가 일어납니다.\n그리고 한 번 구매한 사람을 다시 구매하고 추천하는 고객으로 만듭니다.\n모객.\n잠재고객 팔로우.\n판매.\n고객화.\n이 네 가지가 연결되어 있는 것이 마케팅의 구조입니다.\n그리고 이 구조를 알고 나면 마케팅을 바라보는 질문 자체가 달라집니다.\n블로그를 해야 할까?\n인스타그램을 해야 할까?\n네이버 광고를 해야 할까?\n메타 광고를 해야 할까?\n이런 질문부터 하는 것이 아닙니다.\n먼저 봐야 하는 것은 우리 사업의 마케팅 구조에서 지금 어디가 막혀 있는가?\n입니다.\n사람 자체가 들어오지 않는다면 모객의 문제일 수 있습니다.\n사람은 들어오는데 관심이나 신뢰가 생기지 않는다면 잠재고객 팔로우의 문제일 수 있습니다.\n문의는 많이 들어오는데 실제 구매가 일어나지 않는다면 판매의 문제일 수 있습니다.\n구매는 일어나는데 두 번 다시 찾아오지 않는다면 고객화의 문제일 수 있습니다.\n어디가 막혀 있는지를 알아야 그다음에 어떤 도구를 사용할지 결정할 수 있습니다.\n모객이 부족하다면 광고가 필요할 수 있습니다.\n잠재고객 팔로우가 부족하다면 블로그, 콘텐츠, 사례, 후기가 필요할 수 있습니다.\n판매가 부족하다면 상세페이지나 상담 과정, 제안 방식을 다시 봐야 합니다.\n고객화가 부족하다면 재구매 구조나 구매 이후의 소통을 다시 설계해야 합니다.\n그러니까 네이버 광고가 마케팅인 것이 아닙니다.\n블로그가 마케팅인 것도 아닙니다.\n인스타그램이 마케팅인 것도 아닙니다.\n이것들은 전부 마케팅 구조 안에서 각자의 역할을 하는 도구입니다.\n마케팅은 훨씬 더 큰 개념입니다.\n아직 고객이 아닌 사람을 발견하고,\n우리를 알게 만들고,\n관심을 갖게 만들고,\n정보를 제공하고,\n신뢰를 형성하고,\n구매하게 만들고,\n한 번 구매한 사람을 다시 구매하고 추천하는 고객으로 만드는 것.\n그 전체가 마케팅입니다.\n그래서 앞으로 어떤 사업을 보더라도 이 네 가지를 먼저 나눠서 보셨으면 좋겠습니다.\n모객.\n잠재고객 팔로우.\n판매.\n고객화.\n그리고 질문하는 겁니다.\n우리는 지금 어디가 잘되고 있는가.\n그리고 어디가 막혀 있는가.\n하나의 채널을 보기 전에 전체 구조를 보는 것.\n저는 그것이 마케팅을 이해하는 가장 중요한 출발점이라고 생각합니다.\n", "reflect": {"q": ["내 사업의 모객→팔로우→판매→고객화 중 어디가 막혀 있는가?", "나는 지금 도구(채널)를 고민하는가, 구조를 고민하는가?", "내 고객은 첫 만남에서 구매까지 실제로 어떤 경로를 지나는가?"], "act": "4단계에 내 사업을 대입해 각 단계에 뭐가 있는지 한 줄씩 적기"}}, {"ch": "마케팅주의자", "no": 2, "unit": "강", "key": "판매순서", "title": "판매의 순서", "sub": "고객의 마음이 움직이는 8단계", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%ED%8C%90%EB%A7%A4%EC%88%9C%EC%84%9C_260912.mp4", "dur": 346, "durstr": "5:45", "thumb": "thumbs/판매순서.jpg", "chapters": [{"t": 0.0, "title": "좋은 말을 해도 팔리지 않는다"}, {"t": 9.2, "title": "무엇을보다, 어떤 순서로"}, {"t": 28.8, "title": "고객의 마음이 움직이는 8단계"}, {"t": 38.1, "title": "① 일상"}, {"t": 66.5, "title": "② 문제"}, {"t": 84.0, "title": "③ 막힘"}, {"t": 113.8, "title": "④ 해방"}, {"t": 141.2, "title": "⑤ 초대"}, {"t": 169.1, "title": "⑥ 보증"}, {"t": 198.0, "title": "⑦ 교환"}, {"t": 231.7, "title": "⑧ 변용"}, {"t": 259.8, "title": "순서에 맞춰 건네는 일"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/2%ED%98%B8_%ED%8C%90%EB%A7%A4%EC%88%9C%EC%84%9C/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C1.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/2%ED%98%B8_%ED%8C%90%EB%A7%A4%EC%88%9C%EC%84%9C/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C2.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/2%ED%98%B8_%ED%8C%90%EB%A7%A4%EC%88%9C%EC%84%9C/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C3.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/2%ED%98%B8_%ED%8C%90%EB%A7%A4%EC%88%9C%EC%84%9C/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C4.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/2%ED%98%B8_%ED%8C%90%EB%A7%A4%EC%88%9C%EC%84%9C/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C5.jpg"], "script": "상품의 장점을 열심히 설명했습니다.\n후기도 보여줬습니다.\n가격도 설명했고, 혜택도 넣었습니다.\n그런데 고객은 사지 않습니다.\n왜 그럴까요?\n정보가 부족해서가 아니라, 정보의 순서가 잘못됐을 수도 있습니다.\n마케팅에서는 무엇을 말할 것인가도 중요하지만, 어떤 순서로 말할 것인가가 중요합니다.\n왜냐하면 고객은 한순간에 구매 상태가 되는 것이 아니기 때문입니다.\n고객의 마음에도 흐름이 있습니다.\n이 흐름을 크게 보면 여덟 단계로 나눌 수 있습니다.\n일상.\n문제.\n막힘.\n해방.\n초대.\n보증.\n교환.\n변용.\n하나씩 보겠습니다.\n첫 번째는 일상입니다.\n아직 고객이 상품을 찾고 있는 상태도 아닙니다.\n그냥 평소처럼 살아갑니다.\n그런데 어딘가 조금 불편합니다.\n아침에 일어났는데 몸이 개운하지 않거나, 러닝을 할 때마다 무릎이 신경 쓰이거나, 광고를 계속 돌리는데 매출은 그대로일 수 있습니다.\n아직 문제를 정확하게 정의하지는 못했습니다.\n그냥 뭔가 이상한데? 라는 위화감이 생기기 시작합니다.\n두 번째는 문제입니다.\n불편함이 반복되면서 이제 그냥 넘길 수 없는 문제가 됩니다.\n왜 계속 이러지?\n이거 해결해야 되는 거 아닌가?\n여기서부터 해결하고 싶은 욕구가 생깁니다.\n사람이 정보를 찾기 시작하는 것도 대부분 이 지점입니다.\n세 번째는 막힘입니다.\n문제를 알았다고 바로 해결되는 것은 아닙니다.\n검색도 해보고, 다른 상품도 보고, 혼자 해결해보기도 합니다.\n그런데 잘 안 됩니다.\n여기서 사람이 답답해집니다.\n그리고 이때 중요한 것이 하나 있습니다.\n나만 이런 게 아니구나.\n이 사람이 내 상황을 이해하고 있구나.\n라고 느끼는 것입니다.\n마케팅에서는 이 지점에서 고객의 문제를 정확하게 말해주는 것이 중요합니다.\n상품 이야기를 하기 전에 먼저 고객의 현재 상황을 이해해주는 겁니다.\n네 번째는 해방입니다.\n고객이 처음으로 이 문제에서 벗어날 수도 있겠구나 라는 가능성을 발견하는 단계입니다.\n여기서 중요한 것은 바로 상품을 미는 것이 아닙니다.\n먼저 문제를 해결할 방법이 있다는 것을 보여주는 것입니다.\n지금까지 하던 방법과 다른 기준을 알려줄 수도 있고, 고객이 모르고 있던 원인을 설명할 수도 있습니다.\n고객 입장에서는 막혀 있던 길에 처음으로 출구가 보이는 순간입니다.\n다섯 번째는 초대입니다.\n이제 고객에게 새로운 현실을 보여줍니다.\n예를 들어 통증 때문에 달리기를 포기했던 사람이라면, 다시 통증 걱정을 줄이며 달릴 수 있다.\n매출 때문에 계속 광고비만 올리던 사업가라면, 광고비를 늘리는 것이 아니라 마케팅 구조를 다시 볼 수 있다.\n이런 식으로 지금과 다른 미래를 보여주는 겁니다.\n상품은 이 새로운 현실로 가기 위한 수단으로 등장합니다.\n여섯 번째는 보증입니다.\n가능성을 보여줬다고 해서 고객이 바로 움직이는 것은 아닙니다.\n불안하기 때문입니다.\n정말 될까?\n나한테도 맞을까?\n돈만 버리는 건 아닐까?\n그래서 이 단계에서는 고객이 안심할 수 있는 근거가 필요합니다.\n사례.\n후기.\n실제 과정.\n데이터.\n보증.\n명확한 조건.\n이런 것들이 고객의 불안을 낮춰줍니다.\n일곱 번째는 교환입니다.\n이제 고객이 자신의 돈과 시간, 노력 같은 자원을 내놓고 상품이나 서비스를 선택하는 단계입니다.\n쉽게 말하면 구매입니다.\n그런데 여기서 중요한 것은 단순히 결제 버튼을 누르는 것이 아닙니다.\n고객 입장에서는 내가 이 선택을 해도 되는가 라는 마지막 판단이 일어납니다.\n그래서 가격, 조건, 구성, 신청 방법이 명확해야 합니다.\n행동하기 어렵게 만들면 여기까지 온 고객도 멈출 수 있습니다.\n그리고 마지막이 변용입니다.\n마케팅은 구매에서 끝나지 않습니다.\n고객이 상품을 구매했다면 실제로 이전과 다른 상태로 이동해야 합니다.\n통증 때문에 달리지 못했던 사람이 다시 움직이기 시작하고, 매출 구조를 몰랐던 사업가가 자기 사업의 문제를 스스로 보기 시작하고, 상품을 사용한 사람이 이전보다 더 나은 상태가 되어야 합니다.\n고객이 실제로 변화하는 단계입니다.\n이렇게 놓고 보면 왜 좋은 말을 많이 한다고 해서 반드시 팔리는 것이 아닌지 알 수 있습니다.\n고객은 일상에서 바로 구매로 뛰어가지 않습니다.\n일상에서 불편함을 느끼고, 문제를 발견하고, 막히고, 해결 가능성을 발견하고, 새로운 미래를 보고, 안심한 다음, 비로소 행동합니다.\n그리고 행동 이후에는 실제 변화가 있어야 합니다.\n그러니까 좋은 마케팅은 내가 하고 싶은 말을 전부 전달하는 것이 아닙니다.\n고객이 지금 어느 단계에 있는지를 보고, 그 사람이 지금 들을 수 있는 말을 그 순서에 맞게 전달하는 것입니다.\n일상, 문제, 막힘, 해방, 초대, 보증, 교환, 변용.\n이 흐름을 알고 있으면 블로그 글을 쓸 때도, 상세페이지를 만들 때도, 상담을 할 때도, 광고를 만들 때도 질문이 달라집니다.\n무슨 말을 넣을까 보다 먼저 이 고객은 지금 어느 단계에 있을까 를 묻게 됩니다.\n아직 문제도 느끼지 못한 사람에게 구매를 요구하면 너무 빠릅니다.\n이미 구매 직전인 사람에게 문제 설명만 계속하면 너무 느립니다.\n마케팅은 좋은 말을 많이 하는 일이 아니라, 고객의 마음이 움직이는 순서에 맞춰 필요한 말을 건네는 일입니다.\n", "reflect": {"q": ["내 상세페이지(또는 상담)는 지금 8단계 중 어느 단계의 고객에게 말하고 있는가?", "나는 문제도 못 느낀 사람에게 구매를 요구한 적이 없는가?", "고객의 막힘 단계에서, 나는 상품 얘기 전에 상황을 이해해주고 있는가?"], "act": "대표 상품 하나의 고객을 8단계 중 하나에 위치시키고, 그 단계에 맞는 첫 문장 써보기"}}, {"ch": "마케팅주의자", "no": 3, "unit": "강", "key": "영업", "title": "사람들이 영업을 싫어하는 진짜 이유", "sub": "영업의 시작은 설명이 아니라 이해", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%98%81%EC%97%85_260916.mp4", "dur": 249, "durstr": "4:09", "thumb": "thumbs/영업.jpg", "chapters": [{"t": 3.2, "title": "영업을 싫어한다고 말합니다"}, {"t": 21.2, "title": "정말 영업 자체를 싫어할까"}, {"t": 39.3, "title": "매출이 안 나옵니다 — 두 가지 대답"}, {"t": 60.1, "title": "먼저 물어볼 다섯 가지"}, {"t": 83.7, "title": "설명이 아니라 이해"}, {"t": 123.2, "title": "누구에게나 팔면 안 된다"}, {"t": 150.5, "title": "고객이 산 것은 변화"}, {"t": 190.0, "title": "좋은 영업의 3단계"}, {"t": 216.7, "title": "말하기보다 듣기"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C05.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C06.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C07.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C08.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C09.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C10.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/3%ED%98%B8_%EC%98%81%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C11.jpg"], "script": "사람들은 영업을 싫어한다고 말합니다.\n뭔가를 팔려고 다가오는 사람.\n계속 설명하는 사람.\n지금 사야 한다고 압박하는 사람.\n그래서 영업이라고 하면 조금 불편한 이미지부터 떠올립니다.\n그런데 정말 사람들은 영업 자체를 싫어하는 걸까요?\n저는 조금 다르게 봅니다.\n사람들이 싫어하는 것은 영업이 아니라\n자신에게 필요하지 않은 순간에,\n자신을 이해하지도 않은 사람이,\n갑자기 무언가를 팔려고 하는 상황에 가깝습니다.\n예를 들어 어떤 사람이 이렇게 말합니다.\n광고를 계속 돌리고 있는데 매출이 안 나옵니다.\n이 말을 듣자마자\n저희 광고 대행을 쓰시면 됩니다.\n라고 말한다면\n판매자의 관심은 고객의 문제보다 자기 상품에 있는 겁니다.\n좋은 영업이라면 조금 다르게 시작해야 합니다.\n광고를 얼마나 쓰고 있는지,\n클릭은 나오는지,\n고객은 어디에서 이탈하는지,\n문의는 있는데 구매가 안 되는 것인지,\n애초에 광고 이전의 상품 문제인지.\n먼저 물어봐야 합니다.\n왜냐하면 매출이 안 나온다는 한 문장 안에도 전혀 다른 문제가 숨어 있을 수 있기 때문입니다.\n영업의 시작은 설명이 아닙니다.\n이해입니다.\n이 고객은 지금 어떤 상황인지,\n무엇 때문에 막혀 있는지,\n어떤 시도를 이미 해봤는지,\n무엇을 두려워하는지를 알아야 합니다.\n그다음에야 이 사람에게 어떤 가능성을 보여줄 수 있는지가 나옵니다.\n저는 영업의 본질을 사람에게 억지로 무언가를 사게 만드는 것이라고 생각하지 않습니다.\n고객이 혼자서는 보지 못했던 새로운 가능성을 보여주고,\n그 가능성을 실제로 실현할 수 있도록 돕는 것에 더 가깝다고 봅니다.\n그런데 여기에는 중요한 조건이 있습니다.\n누구에게나 팔면 안 됩니다.\n도움이 필요하지 않은 사람에게 도움을 밀어붙일 필요도 없고,\n아직 움직일 준비가 되지 않은 사람에게 결정을 강요할 필요도 없습니다.\n좋은 영업은 사람을 붙잡는 기술이라기보다\n누가 지금 도움을 필요로 하는지를 구분하는 능력에 가깝습니다.\n그리고 판매가 끝났다고 영업이 끝나는 것도 아닙니다.\n고객은 상품을 사려고 돈을 낸 것이 아니라\n어떤 변화에 도달하기 위해 돈을 냈습니다.\n광고 대행을 샀다면 광고 계정을 운영받는 것 자체가 목적이 아닐 겁니다.\n고객을 더 만나고,\n매출 구조를 만들고,\n사업을 더 안정적으로 운영하고 싶어서 돈을 냈을 가능성이 높습니다.\n그렇다면 판매자의 책임도 결제 버튼을 누르게 하는 순간에서 끝나서는 안 됩니다.\n고객이 약속받은 상태에 실제로 가까워지고 있는지를 봐야 합니다.\n그래서 좋은 영업은\n판매 전에는 고객을 이해하고,\n판매할 때는 가능성을 보여주고,\n판매 후에는 그 가능성이 현실이 되도록 돕는 과정입니다.\n결국 사람들이 싫어하는 것은 영업 그 자체가 아닐지도 모릅니다.\n나를 이해하지 않은 채 무언가를 팔려고 하는 경험을 싫어하는 것입니다.\n그러니까 영업을 잘하려면\n말을 더 잘하는 것보다\n먼저 더 잘 들어야 합니다.\n설명하기 전에 묻고,\n팔기 전에 이해하고,\n결제받기 전에 이 사람이 정말 도움을 필요로 하는 사람인지부터 봐야 합니다.\n좋은 영업은 고객에게서 돈을 가져오는 기술이 아닙니다.\n고객에게 새로운 가능성을 보여주고,\n그 가능성까지 함께 가는 일입니다.\n", "reflect": {"q": ["최근에 무언가를 제안할 때, 나는 설명부터 시작했는가, 질문부터 시작했는가?", "내 고객이 정말 사려는 '변화'는 무엇인가? 상품이 아니라 도달하고 싶은 상태로 적어보면?", "내 제안을 거절한 사람은 '싫은 사람'이었나, '아직 준비가 안 된 사람'이었나?"], "act": "오늘 상담·제안 1건에서 설명 전에 질문 3개를 먼저 던져보기 — 달라진 점을 복기칸에"}}, {"ch": "마케팅주의자", "no": 4, "unit": "강", "key": "변화", "title": "고객은 상품이 아니라 변화를 삽니다", "sub": "드릴도, 구멍도 아니고 그 이후의 삶의 모습", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%B3%80%ED%99%94_260916.mp4", "dur": 341, "durstr": "5:41", "thumb": "thumbs/변화.jpg", "chapte 9f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/4%ED%98%B8_%EB%B3%80%ED%99%94/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C15.jpg"], "script": "사람들은 보통 고객이 상품을 산다고 생각합니다.\n그래서 판매할 때도 상품부터 설명합니다.\n이 제품은 이런 기능이 있습니다.\n이 서비스는 이런 방식으로 진행됩니다.\n저희는 이런 장점이 있습니다.\n물론 필요한 설명입니다.\n그런데 고객이 정말 원하는 것은 상품 그 자체일까요?\n조금 다르게 생각해볼 수 있습니다.\n고객은 상품을 사는 것이 아니라\n그 상품을 통해 지금과 다른 상태로 이동하기 위해 돈을 냅니다.\n예를 들어 매트리스를 사는 사람이 있다고 해보겠습니다.\n이 사람이 정말 원하는 것은 매트리스일까요?\n매트리스는 수단일 수 있습니다.\n고객이 원하는 것은\n아침에 일어났을 때 몸이 덜 불편한 것,\n밤에 편하게 자는 것,\n하루를 조금 더 좋은 컨디션으로 시작하는 것일 수 있습니다.\n광고 대행도 마찬가지입니다.\n고객이 정말 원하는 것이\n네이버 광고 계정을 관리해주는 것일까요?\n메타 광고를 대신 돌려주는 것일까요?\n아마 아닐 겁니다.\n고객이 원하는 것은 새로운 고객이 들어오고,\n매출이 생기고,\n사업이 조금 더 안정되는 상태일 겁니다.\n운동을 배우는 사람도 마찬가지입니다.\n운동 프로그램을 갖고 싶어서 돈을 내는 것이 아닐 수 있습니다.\n통증 없이 움직이고 싶거나,\n체력이 생기고 싶거나,\n자신의 생활을 다시 통제하고 싶은 겁니다.\n피부관리를 받는 사람도\n관리를 받는 행위 자체보다\n거울을 볼 때 느끼는 스트레스에서 벗어나고 싶을 수 있습니다.\n그러니까 판매자가 봐야 하는 것은\n우리가 무엇을 파는가?\n에서 끝나면 안 됩니다.\n고객은 이것을 통해 어디에서 어디로 가려고 하는가?\n까지 봐야 합니다.\n마케팅에서 자주 나오는 말이 있습니다.\n고객은 드릴을 원하는 것이 아니라 구멍을 원한다는 말입니다.\n그런데 저는 여기서 한 번 더 가봐야 한다고 생각합니다.\n고객은 정말 구멍을 원하는 걸까요?\n아마 아닐 수도 있습니다.\n벽에 구멍을 뚫고\n그곳에 액자를 걸고\n자기가 원하는 공간을 만들고 싶은 것일 수 있습니다.\n그렇다면 고객이 원하는 것은\n드릴도 아니고,\n구멍도 아니고,\n그 이후에 만들어질 삶의 모습입니다.\n여기서 판매자의 시선이 달라집니다.\n제품을 중심에 놓으면\n기능을 설명하게 됩니다.\n고객을 중심에 놓으면\n변화를 설명하게 됩니다.\n예를 들어 이렇게 말할 수 있습니다.\n이 매트리스는 이런 소재를 사용했습니다.\n이것도 필요합니다.\n그런데 고객 입장에서는\n그래서 제가 아침에 어떻게 달라지나요?\n가 더 중요할 수 있습니다.\n저희 광고 대행은 매주 리포트를 제공합니다.\n보다\n지금 어디에서 고객이 빠져나가는지 확인하고,\n그 지점을 하나씩 줄여갑니다.\n가 고객에게는 더 중요한 설명일 수 있습니다.\n그래서 좋은 마케팅은\n상품의 현재를 설명하는 것보다\n고객의 미래를 보여주는 일에 가깝습니다.\n지금 고객이 있는 상태가 있습니다.\n그리고 고객이 원하는 상태가 있습니다.\n현재 상태와 원하는 상태 사이에는 하나의 간격이 있습니다.\n고객은 그 간격을 줄이기 위해 돈을 냅니다.\n그래서 결국 상품의 가치는\n상품이 얼마나 대단한가만으로 결정되지 않습니다.\n고객을 얼마나 멀리 이동시킬 수 있는가,\n그리고 그 이동을 얼마나 현실적으로 만들어줄 수 있는가가 중요합니다.\n여기서 또 하나 중요한 것이 있습니다.\n변화를 너무 추상적으로 말하면 안 됩니다.\n당신의 삶을 바꿔드립니다.\n더 나은 미래를 만들어드립니다.\n이런 말은 커 보이지만 고객 입장에서는 잘 느껴지지 않습니다.\n변화는 구체적이어야 합니다.\n아침에 일어났을 때 어떻게 다른지,\n매장을 열었을 때 무엇이 달라지는지,\n고객 문의가 들어왔을 때 어떤 장면이 생기는지,\n운동을 시작한 뒤 일상이 어떻게 달라지는지.\n고객이 자기 삶 속에서 그 변화를 상상할 수 있어야 합니다.\n그래서 상품을 팔기 전에 먼저 물어봐야 합니다.\n이 고객은 지금 어디에 있는가?\n무엇이 불편한가?\n어디로 가고 싶은가?\n무엇이 바뀌면 이 돈을 쓰길 잘했다고 느낄까?\n이 질문에 답할 수 있어야\n상품 설명도 달라지고,\n콘텐츠도 달라지고,\n상세페이지도 달라지고,\n영업도 달라집니다.\n그리고 여기서 4번 영상의 이야기와도 연결됩니다.\n좋은 영업은 고객을 이해하는 것에서 시작합니다.\n왜 이해해야 할까요?\n그래야 이 고객이 원하는 변화가 무엇인지 알 수 있기 때문입니다.\n변화를 모르는데 상품부터 팔려고 하면\n판매자는 계속 기능을 말하게 됩니다.\n반대로 고객이 원하는 변화가 보이면\n무엇을 설명해야 하는지도 훨씬 선명해집니다.\n결국 고객은 상품을 사는 것이 아닙니다.\n지금의 나에서 조금 더 원하는 나로 이동하기 위해 돈을 냅니다.\n그러니까 상품을 설명할 때\n이 상품이 무엇인가?\n에서 멈추지 마세요.\n한 번 더 물어보세요.\n이 상품을 통해 고객은 어디에서 어디로 이동하는가?\n고객이 사고 싶은 것은\n상품 그 자체보다\n상품 이후의 자기 모습일 수 있습니다.\n", "reflect": {"q": ["내 상품을 산 고객은, 어디에서 어디로 이동하려고 돈을 냈는가?", "내 상품 설명은 기능을 말하고 있는가, 변화를 보여주고 있는가?", "내 고객이 '이 돈 쓰길 잘했다'고 느끼는 순간은 구체적으로 어떤 장면인가?"], "act": "내 상품 소개 문장 하나를 '고객의 달라진 하루' 문장으로 고쳐 써서 복기칸에"}}, {"ch": "마케팅주의자", "no": 5, "unit": "강", "key": "흐름", "title": "마케팅 채널을 늘리는데 왜 매출은 그대로일까?", "sub": "채널의 게임이 아니라 흐름의 게임", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%ED%9D%90%EB%A6%84_260923.mp4", "dur": 186, "durstr": "3:05", "thumb": "thumbs/흐름.jpg", "chapters": [{"t": 2.4, "title": "매출이 안 나오면 채널부터 늘린다"}, {"t": 23.7, "title": "채널 사이가 끊겨 있다"}, {"t": 32.3, "title": "그다음은 어디로?"}, {"t": 56.7, "title": "채널의 게임이 아니라 흐름의 게임"}, {"t": 68.1, "title": "모르는 사람이 다시 사고 소개하기까지"}, {"t": 93.2, "title": "숫자 하나만 보면 정지화면"}, {"t": 113.1, "title": "어디서보다 어디로"}, {"t": 121.5, "title": "채널보다 먼저 보는 다섯 질문"}, {"t": 141.1, "title": "그전에 전체 흐름"}, {"t": 161.9, "title": "내 고객은 어디에서 멈춰 있는가"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/5%ED%98%B8_%ED%9D%90%EB%A6%84/_%EA%B2%80%EC%88%98/%EC%BB%B700.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC% %BC%EC%9D%98%EC%9E%90/5%ED%98%B8_%ED%9D%90%EB%A6%84/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/5%ED%98%B8_%ED%9D%90%EB%A6%84/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/5%ED%98%B8_%ED%9D%90%EB%A6%84/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/5%ED%98%B8_%ED%9D%90%EB%A6%84/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C05.jpg"], "script": "사업을 하다 보면 매출이 안 나올 때 제일 먼저 하는 게 있습니다.\n채널을 늘립니다.\n블로그를 시작하고,\n인스타그램을 하고,\n유튜브도 하고,\n광고도 돌리고,\n쇼츠도 만듭니다.\n그런데 이상합니다.\n하는 건 많아졌는데 매출은 별로 달라지지 않습니다.\n왜 그럴까요?\n채널이 부족해서가 아닙니다.\n채널과 채널 사이가 끊겨 있기 때문입니다.\n블로그에서 사람을 데려왔습니다.\n그래서 그다음에는 어디로 갑니까?\n인스타에서 조회수가 나왔습니다.\n그래서 그 사람은 그다음에 뭘 합니까?\n광고를 클릭했습니다.\n그런데 왜 이 상품을 사야 하는지,\n왜 지금 사야 하는지,\n왜 여기서 사야 하는지 다음 단계가 없습니다.\n이게 문제입니다.\n마케팅은 채널을 많이 갖는 게임이 아닙니다.\n사람이 한 단계에서 다음 단계로 계속 이동하게 만드는 흐름의 게임입니다.\n예를 들어봅시다.\n처음에는 나를 모르는 사람이 있습니다.\n콘텐츠를 봅니다.\n문제를 인식합니다.\n조금 더 찾아봅니다.\n나를 알게 됩니다.\n상품을 봅니다.\n비교합니다.\n의심합니다.\n확신합니다.\n그리고 삽니다.\n끝일까요?\n아닙니다.\n사용합니다.\n만족합니다.\n다시 삽니다.\n누군가에게 소개합니다.\n이게 흐름입니다.\n그런데 대부분은 이 중에서 한 장면만 봅니다.\n\"블로그 조회수가 안 나옵니다.\"\n\"광고 클릭률이 낮습니다.\"\n\"인스타 팔로워가 안 늘어요.\"\n그런데 그 숫자 하나만 보는 순간 사업을 정지화면으로 보게 됩니다.\n중요한 것은 그 사람이 어디서 들어왔느냐가 아닙니다.\n들어온 다음 어디로 이동했느냐입니다.\n그래서 마케팅을 볼 때 저는 채널보다 먼저 이걸 봅니다.\n사람은 어디에서 들어오는가.\n들어온 사람은 다음에 무엇을 보는가.\n왜 거기서 멈추는가.\n무엇이 있으면 다음 단계로 넘어가는가.\n그리고 결국 어디까지 이동하는가.\n블로그가 문제일 수도 있습니다.\n광고가 문제일 수도 있습니다.\n상세페이지가 문제일 수도 있습니다.\n그런데 그전에 먼저 봐야 하는 것은 전체 흐름입니다.\n채널을 하나 더 만드는 것보다 끊어진 한 구간을 연결하는 것이 매출에는 더 큰 영향을 줄 수도 있습니다.\n그러니까 \"뭘 하나 더 해야 하지?\" 라고 묻기 전에 이 질문부터 해보십시오.\n\"내 고객은 지금 어디에서 멈춰 있는가?\"\n마케팅은 더 많이 하는 일이 아니라 사람이 멈추지 않도록 다음 길을 계속 만들어주는 일입니다.\n", "reflect": {"q": ["지금 내 사업에서 사람이 들어온 다음 가장 많이 멈추는 곳은 어디인가?", "최근에 새로 시작한 채널은 무엇이었나 — 그 채널에서 들어온 사람은 다음에 무엇을 보게 되는가?", "나는 조회수·클릭률 같은 숫자 하나만 보고 있지 않은가? 그 사람이 어디까지 이동했는지 본 적이 있는가?"], "act": "내 고객의 흐름을 모름→구매→재구매까지 한 줄로 적고, 끊어진 구간 하나에 표시해 복기칸에"}}, {"ch": "마케팅주의자", "no": 6, "unit": "강", "key": "판단기준", "title": "고객은 설득당해서 사는 게 아닙니다", "sub": "설명을 늘리는 대신 판단 기준을 준다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80_260924.mp4", "dur": 174, "durstr": "2:54", "thumb": "thumbs/판단기준.jpg", "chapters": [{"t": 2.4, "title": "안 팔리면 설명부터 늘린다"}, {"t": 17.4, "title": "그런데도 고객은 움직이지 않는다"}, {"t": 18.5, "title": "설명이 부족한 게 아니라 판단이 안 선다"}, {"t": 35.7, "title": "매트리스 — 스프링이 몇 개인지보다"}, {"t": 52.7, "title": "\"그래서 나한테 맞는 건 뭔데?\""}, {"t": 57.8, "title": "정보를 주는 게 아니라 판단하게 만드는 것"}, {"t": 68.7, "title": "판단 기준 네 가지"}, {"t": 82.6, "title": "대신 결정해주는 게 아니라 기준을 준다"}, {"t": 94.4, "title": "이 고객이 결정하지 못하는 이유는 무엇인가"}, {"t": 106.2, "title": "가격? 몰라서? 아니면 기준이 없어서?"}, {"t": 120.2, "title": "\"우리 제품이 좋습니다\"보다 강한 말"}, {"t": 127.0, "title": "고객은 자기가 내린 결론으로 산다"}, {"t": 142.7, "title": "설명을 하나 더 넣기 전에 해볼 질문"}, {"t": 156.7, "title": "설득이 아니라 판단 기준을 만드는 일"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80/_%EA%B2%80%EC%88%98/%EC%BB%B700.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80/_%EA%B2%80%EC%88%98/%EC%BB%B701.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80/_%EA%B2%80%EC%88%98/%EC%BB%B702.jpg", "h EC%9E%90/6%ED%98%B8_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80/_%EA%B2%80%EC%88%98/%EC%BB%B719.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%ED%8C%90%EB%8B%A8%EA%B8%B0%EC%A4%80/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C02.jpg"], "script": "상품이 안 팔리면 사람들은 설명을 더 많이 합니다.\n장점을 더 넣고, 기능을 더 설명하고, 후기를 더 붙이고, 할인을 더 강조합니다.\n그런데도 고객은 움직이지 않습니다.\n왜 그럴까요?\n설명이 부족해서가 아니라 판단이 안 서기 때문입니다.\n사람은 상품 설명을 많이 들었다고 사는 게 아닙니다.\n아, 이 정도면 내가 선택해도 되겠다. 라는 판단이 설 때 움직입니다.\n예를 들어 매트리스를 산다고 해봅시다.\n스프링이 몇 개인지, 소재가 뭔지, 몇 겹인지 계속 설명할 수 있습니다.\n그런데 고객 머릿속에는 다른 질문이 있습니다.\n그래서 나한테 맞는 건 뭔데?\n이 질문에 답이 없으면 정보가 아무리 많아도 결정을 못 합니다.\n마케팅에서 중요한 것은 정보를 많이 주는 것이 아니라\n고객이 판단할 수 있게 만드는 것입니다.\n무엇을 비교해야 하는지.\n어떤 경우에는 이 상품이 맞고, 어떤 경우에는 다른 상품이 더 맞는지.\n무엇을 먼저 확인해야 하는지.\n무엇을 기준으로 선택해야 하는지.\n이게 있어야 합니다.\n좋은 마케팅은 고객 대신 결정해주는 것이 아닙니다.\n고객이 자기 상황을 보고 스스로 결정할 수 있도록 판단 기준을 제공하는 것입니다.\n그래서 저는 상품을 설명하기 전에 먼저 묻습니다.\n이 고객이 지금 결정하지 못하는 이유는 무엇인가?\n가격 때문입니까?\n상품을 몰라서입니까?\n아니면 무엇이 자신에게 맞는지 판단할 기준이 없기 때문입니까?\n많은 경우 세 번째입니다.\n그래서 우리 제품이 좋습니다. 라는 말보다\n이런 상황이라면 이 기준부터 확인하십시오. 라는 말이 훨씬 강할 수 있습니다.\n고객은 내 말을 믿어서 사는 것이 아닙니다.\n내가 준 기준으로 자기 상황을 직접 판단해보고\n이건 나한테 필요하겠다. 라고 결론 내렸을 때 사는 겁니다.\n그러니까 상품이 안 팔릴 때\n설명을 하나 더 추가하기 전에 이 질문을 해보십시오.\n나는 지금 상품을 설명하고 있는가?\n아니면 고객이 판단할 수 있게 도와주고 있는가?\n마케팅은 사람을 억지로 설득하는 일이 아니라\n사람이 스스로 좋은 선택을 할 수 있도록 판단 기준을 만들어주는 일입니다.\n", "reflect": {"q": ["내 고객이 지금 결정하지 못하는 진짜 이유는 무엇인가 — 몰라서인가, 비싸서인가, 기준이 없어서인가?", "내 상품 설명은 정보를 주고 있는가, 판단할 수 있게 해주고 있는가?", "\"어떤 경우에는 이 상품이 맞고, 어떤 경우에는 맞지 않다\"를 내 상품으로 써볼 수 있는가?"], "act": "설명을 하나 더 추가하는 대신, 고객이 쓸 판단 기준 한 줄을 만들어 복기칸에"}}, {"ch": "마케팅주의자", "no": 7, "unit": "강", "key": "고객의언어", "title": "고객은 처음부터 당신의 상품을 찾지 않습니다", "sub": "상품의 언어가 아니라 고객의 언어로", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4_260924.mp4", "dur": 248, "durstr": "4:08", "thumb": "thumbs/고객의언어.jpg", "chapters": [{"t": 2.4, "title": "사업자는 상품부터 설명한다"}, {"t": 28.0, "title": "고객이 처음 찾는 건 자기 문제"}, {"t": 32.7, "title": "발이 아픈 사람은 무엇을 검색하나"}, {"t": 52.7, "title": "속눈썹도 마찬가지"}, {"t": 66.4, "title": "사업자는 자기 언어로 답한다"}, {"t": 94.7, "title": "하고 싶은 말보다, 이미 하고 있는 말"}, {"t": 117.3, "title": "콘텐츠 전에 고객의 말부터 본다"}, {"t": 137.1, "title": "제목이 달라진다"}, {"t": 158.6, "title": "\"이거 내 얘기인데?\""}, {"t": 166.3, "title": "표현이 아니라 그 뒤의 상황"}, {"t": 189.0, "title": "가장 위험한 순간"}, {"t": 207.5, "title": "내 상품의 언어인가, 고객의 언어인가"}, {"t": 224.5, "title": "고객은 자기의 하루에서 출발한다"}, {"t": 235.9, "title": "질문과 상품 사이에 길을 만드는 일"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%EC%BB%B700.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%EC%BB%B701.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%EC%BB%B702.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%EC%BB%B703.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%E
