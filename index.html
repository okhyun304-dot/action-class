<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행동주의자 강의실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'NanumPen';src:url('assets/NanumPenScript-Regular.ttf')}
/* ── 다크 테마 (261006, 아지트 LIBRARY와 같은 팔레트). 레이아웃은 그대로, 색만 검정 바탕·흰 글자 ── */
:root{--bg:#0e0f11;--panel:#17191d;--panel2:#1e2126;--line:#2a2e35;--ink:#e9ebee;--grey:#8b9099;--dim:#5d626b;--red:#e5534b;--green:#3ecf8e;--blue:#7b8cff;--paper:var(--bg);--faint:var(--line)}
html{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
a{color:inherit;text-decoration:none}
.topbar{display:flex;align-items:center;gap:18px;padding:0 28px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,15,17,.92);backdrop-filter:blur(10px);z-index:20}
.logo{font-size:18px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.logo em{font-style:normal;color:var(--red)}
.logo span{font-family:'NanumPen';color:var(--grey);font-size:16px;margin-left:10px;font-weight:400}
/* ── 홈 레이아웃: 사이드바 + 메인 ── */
.shell{display:flex}
.side{width:230px;min-width:230px;padding:18px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;border-right:1px solid var(--line)}
.sitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:2px;color:var(--grey)}
.sitem:hover{background:var(--panel2);color:var(--ink)}
.sitem.on{background:var(--panel2);color:var(--ink);font-weight:700}
.sitem .sic{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sitem.chB .sic{background:var(--red);color:#fff}
.sitem.chM .sic{background:var(--green);color:#0e0f11}
.sitem.chMu .sic{background:var(--blue);color:#fff}
.sitem.lnk2 .sic{background:transparent;color:var(--grey);border:1px solid var(--line)}
.sdiv{border-top:1px solid var(--line);margin:12px 8px}
.stitle{font-size:11px;color:var(--dim);padding:4px 14px 6px;letter-spacing:.12em}
.main{flex:1;min-width:0;padding:22px 30px 60px;max-width:1240px}
/* 칩 */
.chips{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 15px;font-size:13px;cursor:pointer;color:var(--grey)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
/* 히어로 (이어서 보기) */
.hero{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:26px;cursor:pointer}
.hero:hover{border-color:var(--grey)}
.hero .hth{position:relative;width:44%;min-width:300px;aspect-ratio:16/9;background:var(--panel2)}
.hero .hth img{width:100%;height:100%;object-fit:cover;display:block}
.hero .hth .pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12)}
.hero .hth .pb i{display:block;height:100%;background:var(--red)}
.hero .hin{flex:1;padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hero .hl{font-family:'NanumPen';color:var(--red);font-size:20px}
.hero .hin b{font-size:22px}
.hero .hin small{color:var(--grey);font-size:13px;line-height:1.5}
.hero .hbtn{margin-top:10px;background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;width:fit-content}
.hero .hbtn:hover{background:#fff}
/* 진도 요약 + 그리드 */
.overall{display:flex;align-items:center;gap:14px;margin:0 0 22px;max-width:460px}
.obar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.obar i{display:block;height:100%;background:var(--green);border-radius:99px}
.overall span{font-size:12px;color:var(--grey);white-space:nowrap}
h2.sec{font-size:16px;margin:26px 0 14px;font-weight:700}
h2.sec small{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--grey)}
.card .th{position:relative;aspect-ratio:16/9;background:var(--panel2)}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.card .th .doneb{position:absolute;left:8px;top:8px;background:var(--green);color:#0e0f11;font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;display:none}
.card.done .doneb{display:block}
.card .pb{height:3px;background:var(--line)}
.card .pb i{display:block;height:100%;background:var(--red)}
.card .info{display:flex;gap:11px;padding:12px 14px 14px}
.card .av{width:32px;height:32px;min-width:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.card .av.chB{background:var(--red)}.card .av.chM{background:var(--green);color:#0e0f11}
.av.chMu{background:var(--blue)}
.card .info b{display:block;font-size:15px;margin-bottom:3px;line-height:1.35}
.card .info small{color:var(--grey);font-size:12px;line-height:1.4;display:block}
/* Shorts */
.shorts-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.short{min-width:168px;width:168px;cursor:pointer}
.short .sth{aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);transition:transform .15s}
.short:hover .sth{border-color:var(--grey);transform:translateY(-3px)}
.short .sth img{width:100%;height:100%;object-fit:cover;display:block}
.short b{display:block;font-size:13px;margin-top:8px;line-height:1.3}
.short small{color:var(--grey);font-size:11px}
/* 쇼츠 모달 */
.smodal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:flex;align-items:center;justify-content:center}
.smodal video{height:88vh;max-width:92vw;border-radius:12px;background:#000}
.smodal .sx{position:absolute;top:22px;right:30px;color:#fff;font-size:26px;cursor:pointer;opacity:.8}
.smodal .sx:hover{opacity:1}
/* ── 시청 ── */
.watch{max-width:1440px;margin:0 auto;padding:24px 32px 60px}
.wgrid{display:flex;gap:26px;align-items:flex-start}
.pcol{flex:1;min-width:0}
video.mainv{width:100%;border-radius:10px;background:#000}
.vt{margin-top:16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vt h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.vt .pen{font-family:'NanumPen';color:var(--red);font-size:21px}
.vmeta{display:flex;align-items:center;gap:16px;margin-top:6px;flex-wrap:wrap}
.vdesc{color:var(--grey);font-size:14px}
.speed{display:flex;gap:6px}
.speed button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--grey)}
.speed button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.tabs{display:flex;gap:6px;margin:18px 0 10px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;color:var(--grey)}
.tabs button.on{background:var(--panel2);border-color:var(--grey);color:var(--ink);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.chaps{display:block}
.chap{display:flex;gap:10px;padding:11px 16px;cursor:pointer;align-items:baseline;border-left:3px solid transparent}
.chap:hover{background:var(--panel2)}
.chap.cur{border-left-color:var(--red);background:var(--panel2)}
.chap .ct{font-size:12px;color:var(--grey);width:40px;font-variant-numeric:tabular-nums}
.chap .cn{font-size:14px;flex:1}
.notes{padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:800px){.notes{grid-template-columns:1fr}}
.notes img{width:100%;border:1px solid var(--line);border-radius:6px}
.empty{color:var(--grey);font-size:13px;padding:24px;text-align:center}
.scr{padding:18px 20px;font-size:14px;line-height:2;white-space:pre-wrap;color:#cfd2d7;max-height:60vh;overflow-y:auto}
.reflect{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.reflect h3{font-size:15px;margin-bottom:10px}
.reflect h3 span{font-family:'NanumPen';color:var(--red);font-size:15px;font-weight:400;margin-left:8px}
.reflect ol{margin:0 0 4px 20px;padding:0}
.reflect ol li{font-size:14px;line-height:1.7;margin-bottom:8px;color:#cfd2d7}
.reflect .ract{margin-top:10px;background:rgba(62,207,142,.1);border-left:3px solid var(--green);border-radius:6px;padding:10px 14px;font-size:14px;color:var(--green);font-weight:700}
.reflect .ract span{font-weight:400;color:#cfd2d7}
.memo{margin-top:22px}
.memo h3{font-size:15px;margin-bottom:10px}
.memo h3 span{font-family:'NanumPen';color:var(--red);font-size:15px;font-weight:400;margin-left:8px}
.memo textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;font-size:14px;background:var(--panel);color:var(--ink);resize:vertical;outline:none}
.memo textarea:focus{border-color:var(--grey)}
.memo .mbtn{margin-top:8px;display:flex;justify-content:flex-end}
.memo .mbtn button{border:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer}
.memo .mbtn button:hover{background:#fff}
.mitem{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:10px;position:relative}
.mitem .md{font-size:11px;color:var(--grey);margin-bottom:5px}
.mitem .mt{font-size:14px;line-height:1.7;white-space:pre-wrap}
.mitem .mx{position:absolute;right:10px;top:8px;color:var(--dim);cursor:pointer;font-size:13px}
.mitem .mx:hover{color:var(--red)}
.rcol{width:360px;min-width:320px}
.rcol h3{font-size:13px;color:var(--dim);margin-bottom:10px;letter-spacing:.08em}
.mini{display:flex;gap:10px;padding:7px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.mini:hover{background:var(--panel2)}
.mini.cur{border-color:var(--line);background:var(--panel)}
.mini .mth{position:relative;width:150px;min-width:150px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--panel2)}
.mini .mth img{width:100%;height:100%;object-fit:cover;display:block}
.mini .mth .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.mini .mth .pb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.mini .mth .pb i{display:block;height:100%;background:var(--red)}
.mini .mi b{display:block;font-size:13px;line-height:1.35;margin-bottom:3px}
.mini .mi small{color:var(--grey);font-size:11px;display:block;line-height:1.35}
.mini .mi .dn{color:var(--green);font-size:11px}
@media(max-width:1020px){.wgrid{flex-direction:column}.rcol{width:100%}}
@media(max-width:860px){.side{display:none}}
</style></head><body>
<div class="topbar">
  <div class="logo" onclick="goHome()">행동<em>주의자</em> 강의실<span>판서로 배우는 생각의 도구</span></div>
</div>
<div id="home" class="shell">
  <aside class="side">
    <div class="sitem on" data-f="all" onclick="setF('all')"><span class="sic">⌂</span>홈</div>
    <div class="sitem" data-f="shorts" onclick="setF('shorts')"><span class="sic">▶</span>Shorts</div>
    <div class="sdiv"></div>
    <div class="stitle">채널</div>
    <div class="sitem chB" data-f="행동주의자" onclick="setF('행동주의자')"><span class="sic">행</span>행동주의자</div>
    <div class="sitem chM" data-f="마케팅주의자" onclick="setF('마케팅주의자')"><span class="sic">마</span>마케팅주의자</div>
    <div class="sitem chMu" data-f="음악" onclick="setF('음악')"><span class="sic">♪</span>음악</div>
    <div class="sdiv"></div>
    <div class="stitle">링크</div>
    <a class="sitem lnk2" href="https://okhyun304-dot.github.io/action100/" target="_blank"><span class="sic">↗</span>행동100</a><a class="sitem lnk2" href="https://blog.naver.com/guraud22" target="_blank"><span class="sic">↗</span>행동주의자 블로그</a>
  </aside>
  <main class="main">
    <div id="hero"></div>
    <div class="overall"><div class="obar"><i id="obar"></i></div><span id="otext"></span></div>
    <div id="sections"></div>
  </main>
</div>
<div id="watch" class="watch hide">
  <div class="wgrid">
    <div class="pcol">
      <video id="player" class="mainv" controls preload="metadata"></video>
      <div class="vt"><h1 id="vtitle"></h1><span class="pen" id="vpen"></span></div>
      <div class="vmeta"><span class="vdesc" id="vdesc"></span><div class="speed" id="speed"></div></div>
      <div class="tabs">
        <button id="tabC" class="on" onclick="tab('C')">챕터</button>
        <button id="tabN" onclick="tab('N')">판서 노트</button>
        <button id="tabS" onclick="tab('S')">강의록</button>
      </div>
      <div class="panel"><div id="paneC" class="chaps"></div><div id="paneN" class="notes hide"></div><pre id="paneS" class="scr hide"></pre></div>
      <div class="reflect hide" id="reflect">
        <h3>강의 후<span>생각해볼 것</span></h3>
        <ol id="refQ"></ol>
        <div class="ract" id="refA"></div>
      </div>
      <div class="memo">
        <h3>복기<span>배운 것을 내 언어로 남긴다</span></h3>
        <textarea id="memoIn" placeholder="이 강의에서 가져갈 한 가지는..."></textarea>
        <div class="mbtn"><button onclick="addMemo()">남기기</button></div>
        <div id="memoList"></div>
      </div>
    </div>
    <div class="rcol"><h3>다른 강의</h3><div id="others"></div></div>
  </div>
</div>
<div id="smodal" class="smodal hide" onclick="closeShort(event)">
  <span class="sx" onclick="closeShort()">✕</span>
  <video id="sv" controls playsinline></video>
</div>
<script>
const DATA=[{"ch": "행동주의자", "no": 1, "unit": "강", "key": "생각할틈", "title": "생각할 틈", "sub": "생각할 틈이 없는 사람은 같은 인생을 반복한다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%83%9D%EA%B0%81%ED%95%A0%ED%8B%88_16x9.mp4", "dur": 363, "durstr": "6:02", "thumb": "thumbs/생각할틈.jpg", "chapters": [{"t": 0.0, "title": "같은 인생을 반복하는 이유"}, {"t": 41.4, "title": "틈 없이 사는 하루"}, {"t": 87.8, "title": "생각 없음의 진짜 비용"}, {"t": 176.8, "title": "경험에도 소화 시간이 필요하다"}, {"t": 313.4, "title": "총량이 아니라 해석"}], "notes": [], "script": "생각할 틈이 없는 사람은 같은 인생을 반복한다\n사람들은 경험이 사람을 성장시킨다고 말합니다.\n나는 이 말의 절반만 믿습니다.\n경험 자체는 사람을 거의 성장시키지 않습니다.\n같은 일을 10년 해도 별로 나아지지 않는 사람이 있습니다.\n경험이 부족해서가 아닙니다.\n경험을 처리하지 않았기 때문입니다.\n사업을 생각해보면 이해하기 쉽습니다.\n회사는 매출이 많이 발생했다고 경영이 잘되는 것이 아닙니다.\n장부를 보고, 손익을 계산하고, 무엇 때문에 돈을 벌었고 무엇 때문에 돈을 잃었는지 결산해야 합니다.\n결산하지 않은 매출은 숫자의 흔적일 뿐입니다.\n인간의 경험도 비슷합니다.\n우리는 하루 종일 많은 일을 겪습니다.\n사람을 만나고, 일을 하고, 실수하고, 기분이 상하고, 좋은 이야기를 듣고, 새로운 정보를 봅니다.\n이상하게도 그것을 결산하는 시간은 거의 없습니다.\n우리는 회의가 끝나면 휴대폰을 봅니다.\n누군가와 헤어진 뒤 지하철에 타면 유튜브를 켭니다.\n책을 덮으면 메시지를 확인합니다.\n하루를 마치고 침대에 누우면 쇼츠를 봅니다.\n하나의 경험이 끝나자마자 다음 자극이 들어오는 겁니다.\n그러면 경험은 있었지만 해석은 남지 않습니다.\n나는 이것이야말로 스마트폰 시대의 큰 문제라고 생각합니다.\n사람들은 스마트폰이 시간을 빼앗는다고 말합니다.\n하루에 몇 시간을 SNS에 썼는지 계산하고 스크린타임을 줄이려고 합니다.\n그런데 더 중요한 비용은 따로 있습니다.\n스마트폰은 시간을 빼앗기 전에, 경험과 경험 사이를 없앴습니다.\n예전에는, 멍하니 앉아 있는 시간이 있었습니다.\n별것 아닌 것처럼 보이는 그 시간이 사실은 하루의 사건을 정리하는 시간이었습니다.\n아까 그 사람은 왜 그런 말을 했을까.\n나는 왜 그 말에 기분이 상했을까.\n오늘 회의가 이상했던 이유는 무엇일까.\n누가 시키지 않아도 이런 생각이 떠올랐습니다.\n뇌가 쉬고 있었던 것이 아닙니다.\n뒤에서 정리하고 있었던 겁니다.\n우리는 이 시간을 흔히 '지루함'이라고 부릅니다.\n그래서 지루함을 없애야 할 불편으로 생각합니다.\n하지만 나는 반대로 봅니다.\n지루함은 경험의 후처리 시간입니다.\n무언가를 겪는 것이 입력이라면, 지루함은 그 입력을 자기 판단으로 변환하는 과정입니다.\n이 과정이 없으면 인간은 점점 많은 정보를 소비하면서도 자기 생각은 줄어듭니다.\n여기서 중요한 구분이 하나 있습니다.\n정보와 생각은 같은 것이 아닙니다.\n유튜브를 세 시간 본 사람의 머릿속에는 정보가 많을 수 있습니다.\n뉴스를 계속 보는 사람도 세상 돌아가는 일을 많이 알고 있을 수 있습니다.\n그러나 자기 판단이 많다는 뜻은 아닙니다.\n정보가 너무 빨리 들어오면 생각이 만들어지기 전에 다음 정보가 덮어버립니다.\n먹는 것에 비유하면 하루 종일 음식을 밀어 넣으면서 소화할 시간을 주지 않는 것과 비슷합니다.\n정보에도 소화 시간이 필요합니다.\n경험에도 소화 시간이 필요합니다.\n사람에게도 자신이 겪은 것을 자기 것으로 만드는 시간이 필요합니다.\n그런데 우리는 그 시간을 생산성이 없는 시간이라고 생각합니다.\n여기서 역전이 일어납니다.\n계속 무언가를 보고 있는 사람은 열심히 사는 것처럼 느끼고, 아무것도 하지 않는 사람은 시간을 버리는 것처럼 느낍니다.\n실제로는 반대일 수도 있습니다.\n계속 입력만 하는 사람은 남이 만든 생각을 소비하고 있을 수 있고, 가만히 있는 사람은 자기 판단을 만들고 있을 수 있습니다.\n나는 그래서 휴대폰을 몇 시간씩 끄는 '디지털 디톡스'에 큰 관심이 없습니다.\n그것 역시 또 하나의 이벤트가 되기 쉽기 때문이죠.\n주말에 세 시간 휴대폰을 끄고 산책한다고 인간의 사고방식이 갑자기 바뀌지는 않습니다.\n더 중요한 것은 하루에 존재하는 작은 결산 시간을 지키는 것입니다.\n회의가 끝난 뒤 바로 휴대폰을 보지 않는 것.\n누군가와 중요한 대화를 한 뒤 잠깐 혼자 걷는 것.\n책을 덮자마자 다른 영상을 틀지 않는 것.\n식사를 마친 뒤 몇 분 그냥 앉아 있는 것.\n차 안에서 항상 무언가를 듣지 않는 것.\n이런 시간은 겉으로 보면 아무 일도 일어나지 않는 시간입니다.\n하지만 인간의 내부에서는 일이 일어나고 있습니다.\n경험이 판단으로 바뀝니다.\n판단이 기준으로 바뀝니다.\n기준이 다음 행동을 바꿉니다.\n이것이 학습의 본질입니다.\n그래서 같은 경험을 한 두 사람이 전혀 다른 사람이 됩니다.\n한 사람은 일을 겪습니다.\n다른 사람은 일을 겪고 그것을 해석합니다.\n5년이 지나면 차이가 벌어집니다.\n한 사람에게 5년은 사건의 누적이고, 다른 사람에게 5년은 판단의 누적이 되니까요.\n사람을 성장시키는 것은 경험의 양이 아닙니다.\n경험에서 얼마나 많은 판단을 추출했느냐입니다.\n그 판단을 추출하는 장소는, 우리가 그렇게 싫어하는 지루함일지도 모릅니다.\n기술이 제거한 것 가운데 일부는 원래 쓸모없는 시간이 아니었다는 겁니다.\n우리는 지루함을 제거하면서 삶의 마찰을 줄였습니다.\n그 과정에서 경험을 자기 것으로 만드는 시간까지 같이 없앴습니다.\n요즘 사람들은 과거보다 훨씬 많은 것을 봅니다.\n더 많은 장소에 가고, 더 많은 사람의 이야기를 듣고, 더 많은 지식을 소비합니다.\n그런데 많이 본 것과 많이 깨달은 것은 다른 문제입니다.\n인생은 경험의 총량으로 깊어지지 않습니다.\n결산된 경험의 총량으로 깊어집니다.\n그러니 휴대폰을 얼마나 오래 끌 것인지부터 정하지 마십시오.\n하루 중 어떤 경험 뒤에는 아무것도 넣지 않을 것인지를 정하는 편이 낫습니다.\n중요한 회의 뒤 10분.\n좋은 책을 읽은 뒤 10분.\n누군가와 크게 다툰 뒤 10분.\n하루 일을 끝낸 뒤 10분.\n그 시간에는 새로운 것을 넣지 않는 겁니다.\n생각하려고 애쓸 필요도 없습니다.\n그냥 다음 입력을 막아두면 됩니다.\n그러면 이미 들어와 있던 것들이 올라오기 시작합니다.\n기억하세요.\n지루함은 빈 시간이 아닙니다.\n아직 결산되지 않은 삶이 올라오는 시간입니다.\n해보시기 바랍니다.\n", "reflect": {"q": ["오늘 하루 중, 아무 자극 없이 비어 있던 시간은 몇 분이었나?", "나는 어떤 순간마다 반사적으로 휴대폰을 여는가? (회의 끝, 지하철, 화장실…)", "최근 경험 중 소화하지 못하고 넘어간 일은 무엇인가?"], "act": "오늘 10분, 휴대폰 없이 걷거나 앉아 있기 — 떠오른 생각 한 줄을 복기칸에"}}, {"ch": "행동주의자", "no": 2, "unit": "강", "key": "인간본성", "title": "인간 본성", "sub": "사업 공부의 시작은 인간 이해", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%9D%B8%EA%B0%84%EB%B3%B8%EC%84%B1_16x9.mp4", "dur": 329, "durstr": "5:28", "thumb": "thumbs/인간본성.jpg", "chapters": [{"t": 0.0, "title": "사업을 잘하려면 무엇을 공부할까"}, {"t": 85.5, "title": "같은 행동, 다른 해석"}, {"t": 172.3, "title": "본성 공부법"}, {"t": 308.1, "title": "공부의 목적"}], "notes": [], "script": "사업을 잘하려면 무엇을 공부해야 할까요?\n마케팅을 배우고, 영업을 배우고, 협상을 배우고, AI를 배우면 될까요?\n물론 필요합니다.\n그런데 저는 그보다 먼저 공부해야 할 것이 있다고 봅니다.\n인간입니다.\n사업이라는 것은 결국 사람을 상대하는 일이기 때문입니다.\n고객이 왜 구매하는지,\n직원은 왜 내 생각과 다르게 행동하는지,\n상대방은 왜 내 제안을 거절하는지,\n사람은 왜 알면서도 같은 실수를 반복하는지.\n이런 것을 이해하지 못하면 기술을 아무리 배워도 한계가 있습니다.\n기술은 사람에게 무언가를 전달하는 방법입니다.\n그러나 상대방이 무엇을 원하고, 무엇을 두려워하며, 어떤 말에 마음이 움직이는지는 인간에 대한 이해에서 나옵니다.\n그렇기 때문에 저는 로버트 그린의 《인간 본성의 법칙》을 중요하게 생각합니다.\n이 책 한 권만 해도 1년은커녕 3년은 공부해야 다 이해할까 말까 하다고 봅니다.\n그만큼 인간이라는 존재는 복잡합니다.\n그런데 우리는 사람을 너무 쉽게 안다고 생각합니다.\n고객이 구매하지 않으면 가격 때문이라고 생각하고,\n직원이 말을 듣지 않으면 의지가 부족하다고 생각하고,\n상대방이 내 의견을 반대하면 나를 이해하지 못한다고 생각합니다.\n하지만 정말 그럴까요?\n고객은 가격이 아니라 또 실패할까 봐 두려운 것일 수도 있습니다.\n직원은 의지가 없는 것이 아니라 무엇을 해야 하는지 제대로 이해하지 못한 것일 수도 있습니다.\n상대방은 내 의견을 싫어하는 것이 아니라 자신의 입장이 무시당한다고 느끼는 것일 수도 있습니다.\n같은 행동을 보고도 인간을 얼마나 이해하느냐에 따라 전혀 다른 해석이 나옵니다.\n그리고 해석이 달라지면 행동이 달라집니다.\n이것이 인간 본성을 공부해야 하는 이유입니다.\n블로그 글도 마찬가지입니다.\n저는 예전에 이런 이야기를 한 적이 있습니다.\n왜 여러분의 블로그 글은 숭늉처럼 밍숭맹숭하고, 제 글은 며칠간 푹 끓인 진한 육수 맛이 나는지 생각해보라고요.\n숭늉에 MSG를 넣는다고 깊은 육수가 되는 것은 아닙니다.\n근본이 다릅니다.\n좋은 글은 자극적인 문장을 몇 개 넣는다고 만들어지지 않습니다.\n세상을 보는 자기만의 시선이 있어야 합니다.\n그 시선이 있어야 같은 고객의 이야기를 듣고도 다른 글이 나옵니다.\n어떤 사람은 고객이 \"비싸네요\"라고 말한 것을 그대로 적습니다.\n다른 사람은 그 말 뒤에 있는 불안과 욕망을 생각합니다.\n왜 비싸다고 느꼈을까?\n이 사람은 무엇과 비교하고 있을까?\n돈을 잃는 것보다 더 두려워하는 것은 무엇일까?\n이런 질문을 할 수 있어야 글에 깊이가 생깁니다.\nPASONA를 알고, 카피라이팅을 배우고, AI를 활용하는 것도 좋습니다.\n하지만 인간에 대한 이해가 없는 상태에서 기술만 더하면 얕은 생각을 더 빠르게 생산할 수도 있습니다.\n반대로 인간에 대한 이해가 깊어지면 같은 기술도 전혀 다르게 사용됩니다.\n그래서 저는 로버트 그린 같은 책을 공부해야 좋은 블로그 글도 나온다고 봅니다.\n물론 인간 본성을 이해하는 데는 역사와 종교, 철학 등 공부해야 할 것이 한두 가지가 아닙니다.\n그러나 이 책은 그 출발점으로 삼기에 아주 강력합니다.\n인간관계와 사업에서 마주하는 문제들을 법칙으로 정리해두었기 때문입니다.\n다만 여기서 중요한 것이 하나 있습니다.\n책을 읽었다고 해서 그 법칙이 자기 것이 되는 것은 아닙니다.\n우리는 책을 읽고 나면 이해했다고 착각하기 쉽습니다.\n\"아, 맞는 말이네.\"\n\"이거 정말 좋은 내용이다.\"\n그렇게 밑줄을 긋고 다음 책으로 넘어갑니다.\n그런데 실제로 사람을 만나면 이전과 똑같이 행동합니다.\n고객이 거절하면 기분이 상하고,\n상대방이 반대하면 내 주장을 더 강하게 밀어붙이고,\n갈등이 생기면 상대방보다 내 억울함을 먼저 생각합니다.\n책은 읽었지만 삶은 바뀌지 않은 겁니다.\n그래서 저는 이 책을 한 번 읽고 끝내지 말라고 말씀드립니다.\n목차를 외울 정도로 반복해서 익혀야 합니다.\n왜 목차를 외워야 할까요?\n현실에서 필요한 순간에 법칙을 꺼내 쓸 수 있어야 하기 때문입니다.\n사람을 만나다가 문제가 생겼을 때,\n\"아, 이 상황에서는 그 법칙을 적용해볼 수 있겠구나.\"\n이렇게 떠올라야 합니다.\n책을 읽고,\n법칙을 기억하고,\n현실에서 하나를 사용해보고,\n상대방의 반응을 관찰하고,\n다시 복기하는 겁니다.\n처음에는 의심스러울 수도 있습니다.\n하지만 직접 해보면 알게 됩니다.\n내 주장부터 꺼내지 않고 상대방의 입장을 먼저 확인했더니 대화가 달라지는 경험.\n고객이 거절한 이유를 단정하지 않고 질문했더니 전혀 다른 고민이 나오는 경험.\n상대방이 중요하게 생각하는 것을 이해하고 제안했더니 협상의 흐름이 달라지는 경험.\n이런 경험이 쌓여야 책이 자기 것이 됩니다.\n읽어서 아는 지식과 사용해본 지식은 다릅니다.\n사용해본 지식은 다음 행동을 바꿉니다.\n그리고 그 행동이 반복되면 삶이 바뀝니다.\n저는 결국 사업이라는 것이 기술적 영역보다 인간에 대한 이해가 더 중요하다고 봅니다.\n사람을 이해하면 마케팅도 달라지고,\n영업도 달라지고,\n협상도 달라지고,\n함께 일하는 방식도 달라집니다.\n그래서 《인간 본성의 법칙》은 단순히 좋은 책 한 권을 읽는다는 생각으로 접근하면 아깝습니다.\n내 삶에서 계속 꺼내 써야 할 도구로 만들어야 합니다.\n이번 북퍼실에서도 책의 내용을 이해하는 데서 끝내지 않았으면 좋겠습니다.\n이번 주에 배운 법칙 중 하나를 실제 인간관계에서 사용해보십시오.\n고객을 만나든,\n직원과 대화하든,\n가족과 갈등이 생기든,\n한 번이라도 이전과 다르게 행동해보는 겁니다.\n그리고 무엇이 달라졌는지 관찰해보십시오.\n책을 많이 읽었다는 사실보다, 배운 법칙 하나로 실제 행동이 달라진 경험이 더 중요합니다.\n기억하세요.\n인간 본성을 공부하는 목적은 지식을 많이 쌓기 위해서가 아닙니다.\n사람을 더 깊이 이해하고, 그 이해를 통해 자신의 행동을 바꾸기 위해서입니다.\n책을 읽으십시오.\n법칙을 기억하십시오.\n그리고 현실에서 사용해보십시오.\n해봐야 내 것이 됩니다.\n", "reflect": {"q": ["최근 이해가 안 됐던 누군가의 행동 하나 — 그 사람 입장에서 보면 어떤 이유가 가능한가?", "나는 같은 행동을 보고 얕은 해석과 깊은 해석 중 어느 쪽으로 기우는 편인가?", "내 사업(일)에서 인간을 몰라서 생긴 문제는 무엇이었나?"], "act": "오늘 만난 사람 한 명의 행동 하나를 '왜 그랬을까' 두 가지 해석으로 적어보기"}}, {"ch": "행동주의자", "no": 3, "unit": "강", "key": "드릴론", "title": "드릴론", "sub": "얕게 여러 번이 아니라, 깊게 한 번", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%93%9C%EB%A6%B4%EB%A1%A0_16x9.mp4", "dur": 224, "durstr": "3:43", "thumb": "thumbs/드릴론.jpg", "chapters": [{"t": 0.0, "title": "배움이 늘 비슷했던 이유"}, {"t": 33.4, "title": "처음에는 세로로 판다"}, {"t": 75.2, "title": "깊이가 서로 만나는 지점"}, {"t": 116.8, "title": "게임도 마찬가지다"}, {"t": 153.2, "title": "파는 시간과 소화하는 시간"}], "notes": [], "script": "무언가를 처음 배울 때 늘 비슷했다.\n책을 읽을 때도 그랬고, 영화와 음악을 파고들 때도 그랬다.\n최근에는 게임이 그렇다.\n어느 시기에는 다른 사람이 보기엔 지나치다 싶을 정도로 한 분야를 계속 판다.\n하루 종일 보고, 듣고, 비교하고, 또 찾아본다.\n처음에는 이것을 단순한 몰입이라고 생각했다.\n그런데 돌이켜보니 조금 달랐다.\n나는 처음부터 넓게 배우지 않았다.\n한 점을 골라 아주 깊게 뚫었다.\n마치 드릴처럼.\n그래서 나는 이것을 '드릴론'이라고 부르기로 했다.\n드릴론의 구조는 단순하다.\n처음에는 세로로 판다.\n책이라면 한 작가, 한 철학, 한 주제를 연속해서 읽는다.\n음악이라면 같은 시대와 작곡가를 수십 번 듣는다.\n게임이라면 게임 하나만 하는 것이 아니라, 게임이라는 매체 자체가 보일 때까지 여러 작품의 세계관, 시스템, 역사, 제작자의 철학을 계속 비교한다.\n이 단계에서는 넓이가 중요하지 않다.\n깊이가 먼저다.\n문제는 많은 사람이 여기서 반대로 한다는 것이다.\n이것도 조금, 저것도 조금 본다.\n많이 안다고 생각하지만 어느 것도 일정 깊이 아래로 내려가지 않는다.\n드릴은 다르다.\n한 점을 충분히 깊게 파고 내려가면 어느 순간 지층을 만난다.\n게임을 파다가 역사와 만난다.\n역사를 파다가 정치와 만난다.\n정치에서 철학으로 가고, 철학에서 심리학으로 간다.\n음악을 파다가 미학과 기술과 산업으로 연결된다.\n이때부터 세로로 뚫던 구멍이 옆으로 퍼지기 시작한다.\n나는 이 현상을 중요하게 본다.\n깊이가 생기기 전의 확장은 산만함이지만, 깊이가 생긴 뒤의 확장은 연결이다.\n그리고 더 중요한 것이 있다.\n한 번 깊어진 분야는 완전히 예전으로 돌아가지 않는다.\n세부적인 지식은 잊어버릴 수 있다.\n하지만 보는 해상도는 남는다.\n클래식을 모르던 사람은 음악을 '좋다, 싫다'로 듣는다.\n한동안 깊게 파본 사람은 오랜만에 다시 들어도 악기, 구조, 시대, 연주와 해석의 차이를 듣는다.\n게임도 마찬가지다.\n예전에는 '재미있다, 재미없다'였다면 어느 순간부터는 월드 디자인, 이동의 설계, 실패 비용, 정보 제공 방식, 서사와 시스템의 결합이 보인다.\n지식이 남는 것이 아니다.\n눈이 바뀐다.\n나는 이게 드릴론의 핵심이라고 생각한다.\n나는 사람들이 흔히 말하는 '균형 있게 해라'라는 말을 항상 좋은 조언이라고 생각하지 않는다.\n어떤 시기에는 균형보다 편향이 필요하다.\n미친 듯이 한쪽으로 파고 들어가는 기간이 필요하다.\n다만 드릴론은 단순한 과몰입론도 아니다.\n계속 돌리기만 하면 드릴날은 탄다.\n천공, 휴식, 통합, 다시 천공.\n이 과정까지 포함해야 한다.\n깊게 파는 시간과, 파낸 것을 자기 것으로 만드는 시간이 같이 있어야 한다.\n최근 나는 이 생각을 꽤 오래 해보고 있다.\n딥워크, 몰입, 전문성, T자형 인재 같은 기존 개념들과 닮은 부분은 있지만, 내가 설명하고 싶은 것은 조금 다르다.\n왜 어떤 사람은 한 분야에 미친 듯이 빠진 뒤 다른 분야까지 빠르게 깊어지는가.\n왜 깊게 파본 사람의 관심은 시간이 지나면서 좁아지는 것이 아니라 오히려 넓어지는가.\n왜 처음부터 다양성을 추구한 사람보다 한 번 극단적으로 편향돼 본 사람이 나중에 더 넓은 연결을 만드는가.\n이것을 하나의 구조로 설명해보고 싶다.\n아마 조만간 BMW나 별도 강의에서 제대로 한번 이야기할 것 같다.\n아직 이름만 붙였지만, 꽤 오래 가지고 갈 개념이 될 것 같다.\n나는 일단 이것을 이렇게 정의한다.\n인간은 처음부터 넓어지는 것이 아니다.\n한 점을 집요하게 뚫어 깊이를 만든 뒤, 그 깊이에서 옆으로 퍼져나간다.\n그리고 한번 만들어진 깊이는 이후 세상을 보는 기준점으로 남는다.\n드릴론.\n적어도 내가 지금까지 본 학습론 중에서는 이 구조를 이 방식으로 설명한 말은 없었다.\n그래서 조금 더 파볼 생각이다.\n", "reflect": {"q": ["나는 지금 무엇을 얕게 여러 번 파고 있는가?", "하나를 깊게 판 경험에서, 다른 영역과 연결된 순간이 있었나?", "지금 깊게 팔 가치가 있는 단 하나를 고른다면?"], "act": "그 하나를 정해서, 이번 주 '깊게 파는 시간' 2시간을 캘린더에 박기"}}, {"ch": "행동주의자", "no": 4, "unit": "강", "key": "기울기", "title": "기울기론", "sub": "위치가 아니라 기울기가 미래를 결정한다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EA%B8%B0%EC%9A%B8%EA%B8%B0_16x9.mp4", "dur": 361, "durstr": "6:00", "thumb": "thumbs/기울기.jpg", "chapters": [{"t": 0.0, "title": "인생을 위치로 평가하는 습관"}, {"t": 45.2, "title": "위치 vs 기울기"}, {"t": 95.5, "title": "돌아보면 반대였다"}, {"t": 149.8, "title": "노력의 진짜 보상"}, {"t": 225.3, "title": "성과는 숫자로 쌓인다"}, {"t": 304.8, "title": "스스로에게 묻는 질문"}], "notes": [], "script": "사람들은 자신의 인생을 자꾸 위치로 평가합니다.\n연봉이 얼마인지, 직급이 무엇인지, 집이 있는지, 사업 매출이 얼마인지, 또래보다 앞서 있는지를 봅니다.\n그리고 지금 자신이 서열의 아래쪽에 있다고 판단하면 쉽게 절망하죠.\n그런데 사람을 실제로 버티게 만드는 것은 현재 위치가 아닙니다.\n기울기입니다.\n생각해 보세요.\n당신은 지금 아무것도 모르는 신입사원일 수 있습니다.\n돈도 없고 특별한 기술도 없고 사람들에게 인정받지도 못할 수 있습니다.\n그렇다고 반드시 절망적인 상태인 것은 아닙니다.\n어제보다 일을 조금 더 잘하게 됐고, 새로운 기술 하나를 익혔고, 누군가에게 신뢰를 얻었다면?\n다음 단계로 갈 수 있는 선택지가 하나씩 늘어나고 있다면 상황은 다릅니다.\n위치는 낮지만 기울기가 양수이기 때문입니다.\n반대로 현재 연봉이 높고 직함이 좋아도 배울 것이 사라지고, 시장에서 통하지 않는 일만 반복한다면?\n지금 자리를 잃는 순간 아무것도 남지 않는다면 위치는 높아도 기울기는 음수일 수 있습니다.\n그래서 젊을 때 낮은 곳에 있는 것은 그렇게 큰 문제가 아닙니다.\n움직이지 않는 것이 문제입니다.\n나는 30대에 중장비 무역으로 사업을 시작했습니다.\n처음부터 무언가를 잘 알고 시작한 것이 아닙니다.\n물건을 보는 법도, 거래를 만드는 법도, 사람을 상대하는 법도, 돈이 어디에서 새는지도 직접 겪으면서 배웠습니다.\n사업을 처음 시작할 때 가장 괴로운 것은 돈이 없는 것이 아닙니다.\n내가 무엇을 모르는지조차 모른다는 점입니다.\n거래 하나를 하려 해도 모르는 것이 뱀처럼 튀어나옵니다.\n시간과 돈을 헛쓰기도 합니다.\n당시에는 그런 실패가 내가 뒤처지고 있다는 증거처럼 느껴졌습니다.\n지금 돌아보면 반대였습니다.\n그때 나는 낮은 위치에 있었지만 계속 올라가고 있었습니다.\n어제 몰랐던 것을 오늘 알았고, 한 번 당한 실수는 두 번째에는 피할 수 있었고, 거래를 반복하면서 사람을 보는 기준이 생겼습니다.\n무엇보다 중요한 것은 하나의 결과가 아니라 축적되는 능력이었습니다.\n처음에는 거래 하나를 성사시키는 것이 전부입니다.\n조금 지나니 거래 구조를 볼 수 있게 됐습니다.\n그다음에는 사람을 볼 수 있게 됐고, 그다음에는 사업 자체를 보는 눈이 생겼습니다.\n그 경험은 중장비 무역에만 남지 않았습니다.\n이후 다른 사업을 할 때도 따라왔습니다.\n이커머스를 하든, 매장을 운영하든, 사람을 코칭하든 결국 반복해서 보게 되는 것은 비슷하더군요.\n사람은 어디에서 움직이고, 돈은 어디에서 새고, 어떤 인센티브가 행동을 만들고, 무엇을 반복해야 시스템이 돌아가는가.\n사업 하나가 끝나도 이런 능력은 남습니다.\n나는 그것이 노력의 진짜 보상이라고 생각합니다.\n많은 사람들이 노력의 보상을 결과에서 찾습니다.\n승진했는가.\n매출이 올랐는가.\n월급이 늘었는가.\n투자한 돈을 회수했는가.\n이것은 물론 중요합니다.\n하지만 그보다 더 중요한 것이 있습니다.\n내가 이전보다 더 큰 문제를 해결할 수 있는 사람이 되었는가입니다.\n사업을 오래 하면서 사람을 보면 이 차이가 선명하게 보입니다.\n처음에는 부족해도 시간이 갈수록 할 수 있는 일이 늘어나는 사람이 있습니다.\n문제가 생기면 도망가지 않고 처리하고, 한 번 배운 것은 다음번에 활용합니다.\n그 사람에게는 점점 더 큰 일을 맡길 수 있습니다.\n반대로 경력은 늘어나는데 할 수 있는 것은 거의 그대로인 사람도 있습니다.\n5년을 일했다고 하지만 사실은 1년짜리 경험을 다섯 번 반복한 경우입니다.\n둘의 현재 위치가 비슷해 보여도 몇 년 뒤에는 완전히 달라집니다.\n그래서 나는 노력 자체를 숭배하지 않습니다.\n오래 일한다고 능력이 생기는 것도 아닙니다.\n회사에 충성한다고 시장가치가 높아지는 것도 아닙니다.\n중요한 것은 내가 한 노력 중 무엇이 나에게 남는가입니다.\n일을 제대로 해보면 기술이 남습니다.\n문제를 해결하면 경험이 남습니다.\n약속을 지키면 평판이 남습니다.\n사람을 상대하면 관계가 남습니다.\n성과를 만들면 숫자가 남습니다.\n이것들이 쌓이면 한 가지 중요한 변화가 일어납니다.\n'여기 아니면 안 되는 사람'에서 '여기가 아니어도 되는 사람'으로 바뀝니다.\n'대체불가능', '스페셜원'이 되는 것이죠.\n나는 이게 노력의 가장 중요한 결과라고 봅니다.\n좋은 회사에 있다면 그 능력은 승진으로 이어질 수 있습니다.\n좋은 사업을 하고 있다면 매출로 이어질 수 있습니다.\n그런데 조직이 형편없거나 사업이 잘못된 방향으로 가고 있다면 어떻게 해야 할까요.\n그때 그동안 만든 능력을 들고 빠져나오면 됩니다.\n사업도 마찬가지입니다.\n나는 여러 사업을 해왔지만 모든 사업이 같은 방식으로 잘되는 것은 아닙니다.\n어떤 사업은 시장이 좋고, 어떤 사업은 구조가 나쁘고, 어떤 것은 내가 계속 붙잡고 있을 이유가 없습니다.\n중요한 것은 하나의 사업에 영원히 남는 것이 아닙니다.\n그 사업을 하면서 다음 사업에서도 쓸 수 있는 판단력과 실행력이 생겼는가입니다.\n그러면 실패도 전부 손실은 아닙니다.\n돈은 잃었어도 눈이 남습니다.\n시간은 썼어도 기준이 남습니다.\n사업은 접었어도 다음번에 같은 실수를 하지 않을 확률이 올라갑니다.\n여기서 희망이 생깁니다.\n현재 내가 어디에 있는지가 아니라, 시간이 갈수록 선택지가 늘어나고 있기 때문입니다.\n그래서 나는 젊은 사람들에게 너무 빨리 자신의 위치를 평가하지 말라고 말합니다.\n스물다섯에 밑바닥에 있는 것은 이상하지 않습니다.\n서른에도 늦었다고 할 수 없습니다.\n다만 하나는 반드시 확인해야 합니다.\n지난 1년 동안 내가 할 수 있는 일이 늘었는가.\n나를 신뢰하는 사람이 늘었는가.\n내가 해결할 수 있는 문제의 크기가 커졌는가.\n지금 있는 자리에서 나가더라도 다른 선택지가 작년보다 많아졌는가.\n그렇다면 당신은 올라가고 있는 겁니다.\n인생에서 희망은 어느 순간 갑자기 주어지는 감정이 아닙니다.\n기울기를 확인할 때 생깁니다.\n그래서 우리는 노력해야 합니다.\n회사에 충성하기 위해서가 아닙니다.\n상사에게 인정받기 위해서도 아닙니다.\n오늘보다 내일 더 많은 선택지를 가진 인간이 되기 위해서입니다.\n좋은 조직에 있다면 그 기울기는 승진이 됩니다.\n나쁜 조직에 있다면 탈출구가 됩니다.\n사업이 잘되면 확장이 되고, 사업이 무너지면 다음 시도의 자산이 됩니다.\n결과가 무엇이든 남아야 할 것은 있습니다.\n노력의 가장 큰 보상은 더 높은 자리가 아닙니다.\n언제든 다른 자리로 갈 수 있는 사람으로 변하는 것입니다.\n", "reflect": {"q": ["나는 나를 위치로 평가하는가, 기울기로 평가하는가?", "지난 1년, 내가 만든 기울기(변화량)는 무엇인가?", "위치는 낮지만 기울기가 가파른 사람을 나는 알아보는가?"], "act": "'1년 전의 나는 못 했지만 지 e059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/5%ED%98%B8_%EA%B2%8C%EC%9E%84%EC%A0%90/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/G15.jpg"], "script": "사람들은 아직도 게임을 생각의 반대편에 놓는다.\n책은 사유이고 게임은 오락이라는 식이다.\n나는 이 구분이 오래전에 무너졌다고 생각한다.\n좋은 게임은 생각을 설명하지 않는다.\n생각해야 하는 상황을 만든다.\n책을 읽으면 작가가 실패를 두려워하지 마라고 말할 수 있다.\n엘든 링은 그런 문장을 쓰지 않는다.\n대신 나보다 압도적으로 강한 적 앞에 세워놓고 스무 번 죽게 한다.\n처음에는 게임이 불합리하다고 욕한다.\n그러다가 공격 타이밍 하나를 발견하고, 장비를 바꾸고, 다른 지역을 돌아다니며 레벨을 올린다.\n어제까지 절대로 못 이길 것 같았던 적을 어느 순간 죽인다.\n그때 게임은 실패에 관한 책 한 권보다 훨씬 강한 문장을 몸으로 써준다.\n실패는 판정이 아니라 정보일 수 있다는 것이다.\n미야자키가 만든 것은 난이도가 아니라 세계관이다.\n그의 삶을 보면 이 점이 더욱 재미있다.\n그는 부유한 천재소년이 아니었다.\n가난해서 책을 사기 어려웠고 도서관에서 자기 수준보다 어려운 책들을 읽었다.\n이해할 수 없는 부분은 스스로 상상해서 채웠다.\n나중에 그가 만든 게임에서도 모든 것을 설명해주지 않는다.\n세계가 왜 이렇게 됐는지, 이 인물이 누구인지, 무엇을 해야 하는지조차 플레이어가 조각을 모아 해석해야 한다.\n그리고 그의 게임은 사람을 계속 넘어뜨린다.\n그런데 중요한 것은 괴롭히는 데 있는 게 아니다.\n미야자키는 초기작부터 높은 난이도의 목적을 분명하게 갖고 있었다.\n플레이어가 실패와 학습을 거친 뒤 극복했을 때 얻는 성취감을 설계한 것이다.\n경영진이 너무 어렵다고 걱정했을 정도였지만 개발진은 그 난이도가 게임의 의도라고 밀어붙였다.\n나는 이게 삶과 꽤 비슷하다고 생각한다.\n삶도 튜토리얼을 충분히 주지 않는다.\n사업을 시작했다고 시장이 친절하게 공략법을 알려주지 않고,\n사람을 만났다고 그 사람 머리 위에 성향과 배신확률이 표시되지 않는다.\n실패한 뒤에야 전에 보이지 않던 패턴이 보이는 경우가 훨씬 많다.\n좋은 게임은 바로 이 구조를 압축해서 보여준다.\n책점은 문장을 이용한다.\n게임점은 상황을 이용한다.\n이 차이가 있다.\n엘든 링에서 같은 보스에게 계속 죽고 있다면 게임이 인내하라는 신탁을 내려준다는 이야기가 아니다.\n중요한 것은 내가 그 상황에서 무엇을 하고 있는지를 보는 것이다.\n계속 같은 방법으로 덤비고 있는지, 장비를 바꾸는지,\n그냥 다른 지역으로 떠나는지,\n도움을 부르는지에 따라 내가 현실의 문제를 처리하는 방식까지 드러날 수 있다.\n여기서 게임은 점쟁이가 아니다.\n거울이 된다.\n이 점에서 책점도 사실 마찬가지다.\n책을 아무 데나 펼쳤다고 우주가 나에게 정답을 보내주는 것은 아니다.\n수많은 문장 가운데 지금 내가 어떤 문장을 붙잡았느냐가 내 상태를 보여준다.\n심리학적으로 말하면 일종의 투사다.\n나는 이것을 미신이라기보다 생각을 꺼내는 장치라고 본다.\n레드 데드 리뎀션 2를 하면서는 전혀 다른 생각을 하게 된다.\n엘든 링이 실패와 극복을 압축한다면 레드 데드 리뎀션 2는 시간과 결과를 보여준다.\n이 게임은 이상할 정도로 느리다.\n말을 타고 이동해야 하고, 동물을 잡아 가죽을 벗기고, 사람들과 쓸데없어 보이는 대화를 나눈다.\n요즘 게임처럼 모든 것을 가장 빠른 동선으로 압축해주지 않는다.\n그런데 오래 하다 보면 그 느림 때문에 세계가 생긴다.\n내가 효율이라고 부르던 것 가운데 상당수가 사실은 경험을 삭제하는 기술일 수도 있다는 생각이 든다.\n아서 모건의 선택도 한순간에 끝나지 않는다.\n앞에서 한 행동들이 관계와 명예와 이야기의 결말에 쌓인다.\n인간도 그렇다.\n인생은 결정적인 선택 한 번으로 만들어진다기보다 별것 아닌 행동이 오랫동안 축적된 결과에 가깝다.\n게임은 이것을 설명하지 않고 경험시킨다.\n게임을 단순히 시간을 죽이는 매체라고 부르는 것은, 영화가 움직이는 사진이고, 소설이 종이에 찍힌 잉크라고 말하는 것과 비슷하다.\n매체의 외형만 본 것이다.\n요즘 내가 강조하는 붉은사막도 마찬가지다.\n나 역시 며칠 동안 이 게임을 하며 욕을 꽤 했다.\n기중기를 움직이고,\n퍼즐을 풀고,\n엉뚱한 곳으로 돌아다닌다.\n막히면 짜증이 난다.\n그런데 오픈월드의 좋은 점은 하나의 길이 막혔다고 세계 전체가 끝나지 않는다는 것이다.\n안 되면 다른 지역으로 가면 된다.\n그동안 전혀 관심 없었던 마을에 들어가고, 우연히 다른 사건을 만나고, 거기서 또 새로운 경험이 열린다.\n이건 꽤 중요한 구조다.\n현실에서도 우리는 특정 목표 하나가 막히면 인생 전체가 막혔다고 착각하기 쉽다.\n하지만 실제로 막힌 것은 지도 위의 길 하나일 가능성이 있다.\n오픈월드는 그 착각을 눈으로 보여준다.\n막힌 길과 막힌 세계는 다르다.\n나는 이런 순간을 게임점이라고 부르고 싶다.\n게임의 훌륭한 점은 내가 선택해야 한다는 것이다.\n책에서는 햄릿이 결정한다.\n영화에서는 마이클 콜레오네가 결정한다.\n게임에서는 내가 결정한다.\n그래서 게임은 다른 예술과 독특하게 갈라진다.\n게임의 메시지는 화면 안에만 존재하지 않는다.\n플레이어의 행동이 들어가야 비로소 작품이 완성된다.\n엘든 링에서 강한 적을 피하는 것도 내 결정이고, 열 번 더 덤비는 것도 내 결정이다.\n레드 데드 리뎀션 2에서 사람을 돕거나 죽이는 것 역시 내가 선택한다.\n같은 게임을 해도 사람마다 기억하는 장면이 다른 이유가 여기 있다.\n게임에는 작가가 만든 세계와 내가 만든 경험이 동시에 존재한다.\n그렇다면 충분히 생각 도구가 될 수 있다.\n오히려 어떤 사람에게는 책보다 강하다.\n책에서는 남의 생각을 읽지만 게임에서는 내 선택을 본다.\n내가 말하는 게임점은 공략법이 아니다.\n게임에서 삶의 정답을 찾자는 이야기도 아니다.\n오늘 내가 게임 안에서 무엇 때문에 화가 났는지,\n어떤 상황에서는 포기했고 어떤 상황에서는 이상할 정도로 집착했는지,\n무엇을 발견했을 때 즐거웠는지를 현실의 나와 연결해보라는 것이다.\n그러면 게임 시간이 단순한 소비에서 경험으로 바뀐다.\n나는 책의 가치가 책장 수에 있지 않다고 생각한다.\n한 문장이 사람에게 새로운 생각을 열어주면 그 책은 이미 역할을 했다.\n게임도 같다.\n100시간을 플레이했다고 100시간 동안 통찰해야 하는 것은 아니다.\n어느 보스에게 스무 번 죽다가 문득 자기 사업의 문제를 이해했다면 그것으로 충분하다.\n좋은 예술은 정답을 주는 것이 아니라 기존의 생각에 균열을 만든다.\n그런 의미에서 엘든 링도 책이고, 레드 데드 리뎀션 2도 책이며, 붉은사막도 누군가에게는 책이 될 수 있다.\n다만 종이를 넘기는 대신 내가 그 세계 안으로 들어갈 뿐이다.\n책점이 어렵다면 게임점을 쳐봐라.\n게임 화면에서 미래를 점치라는 뜻이 아니다.\n가상의 세계에서 움직이고 있는 나를 보라는 뜻이다.\n어쩌면 내가 현실에서 어떻게 살아가고 있는지는 현실의 나보다 그곳의 내가 더 솔직하게 보여주고 있을지도 모른다.\n", "reflect": {"q": ["나는 실패를 정보로 받는 영역(게임처럼)과 상처로 받는 영역이 각각 어디인가?", "막힌 길을 만났을 때, 나는 세계를 탓하는가 경로를 바꾸는가?", "책이 아니라 상황으로 배운 것 중 가장 오래 남은 건 무엇인가?"], "act": "지금 하는 일 하나를 게임의 퀘스트로 다시 써보기 (목표/제약/보상)"}}, {"ch": "행동주의자", "no": 6, "unit": "강", "key": "감정서사", "title": "감정보다 서사", "sub": "『나를 지키는 감정, 나를 살리는 감정』을 읽는 이유", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC_260911.mp4", "dur": 373, "durstr": "6:13", "thumb": "thumbs/감정서사.jpg", "chapters": [{"t": 3.6, "title": "이 책을 읽어야 하는 이유"}, {"t": 25.7, "title": "빠른 판단과 범주화"}, {"t": 53.1, "title": "같은 사건, 다른 감정"}, {"t": 101.8, "title": "서사를 알면 행동이 달리 보인다"}, {"t": 143.4, "title": "코칭과 공격적 경청"}, {"t": 200.2, "title": "감정과 행동 사이의 공간"}, {"t": 252.9, "title": "감정 지도 — 나쁨과 좋음이 아니라"}, {"t": 318.4, "title": "사람을 이해하는 시작"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E05.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E06.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E07.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E08.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/6%ED%98%B8_%EA%B0%90%EC%A0%95%EC%84%9C%EC%82%AC/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/E09.jpg"], "script": "오늘은 나를 지키는 감정, 나를 살리는 감정이라는 책을 이야기해보겠습니다.\n이 책을 읽어야 하는 이유는 단순히 분노가 무엇인지, 불안이 무엇인지, 슬픔이 무엇인지 감정의 이름을 외우기 위해서가 아닙니다.\n오히려 그 반대입니다.\n사람의 감정을 너무 쉽게 정의하지 않기 위해서입니다.\n우리는 사람을 만나면 굉장히 빠르게 판단합니다.\n저 사람은 왜 이렇게 예민하지?\n왜 저렇게 불안이 많지?\n왜 저 사람은 별것도 아닌 일에 화를 내지?\n원래 내성적인 사람이야.\n원래 짜증이 많은 사람이야.\n이렇게 사람을 하나의 성격이나 패턴으로 묶어버립니다.\nMBTI도 그렇고,\n심리검사도 그렇고,\n우리는 복잡한 사람을 이해하기 쉽게 범주화하려는 경향이 있습니다.\n그런데 사람이 정말 그렇게 단순할까요?\n똑같은 사건이 일어나도 사람마다 느끼는 감정은 완전히 다릅니다.\n회사에서 기획안이 반려됐다고 해보겠습니다.\n누군가는 화가 날 수 있습니다.\n누군가는 슬플 수 있습니다.\n누군가는 불안할 수도 있습니다.\n오히려 잘됐다고 생각하는 사람도 있을 수 있습니다.\n사건은 같습니다.\n그런데 감정은 다릅니다.\n왜 그럴까요?\n그 사람에게는 그 사건 이전까지 살아온 시간이 있기 때문입니다.\n어떤 경험을 했는지,\n어떤 관계를 맺어왔는지,\n무엇을 중요하게 생각하는지,\n누구에게 인정받고 싶어 하는지,\n최근 어떤 상태였는지,\n그리고 하필 그 일이 어떤 타이밍에 일어났는지.\n이 모든 것이 합쳐진 뒤에 하나의 감정이 만들어집니다.\n그래서 사람을 이해하려면 지금 눈앞에서 일어난 사건 하나만 보면 안 됩니다.\n점을 보지 말고,\n흐름을 봐야 합니다.\n그 사람의 서사를 봐야 합니다.\n예를 들어 주변에 돈을 지나치게 아끼는 사람이 있다고 해보겠습니다.\n겉으로만 보면\n왜 저렇게 짠돌이지?\n라고 생각하기 쉽습니다.\n그런데 그 사람이 어릴 때 돈이 없어서 가족이 큰 어려움을 겪었을 수도 있습니다.\n중요한 사람을 지켜주지 못했던 경험이 있을 수도 있고,\n돈이 없으면 사람이 무너진다는 것을 아주 강하게 경험했을 수도 있습니다.\n그 서사를 알게 되면 지금의 행동이 다르게 보이기 시작합니다.\n그 행동이 옳다는 뜻은 아닙니다.\n이해와 동의는 다릅니다.\n내 경험으로는 이해되지 않더라도\n이 사람에게는 이런 반응이 나올 만한 맥락이 있겠구나.\n라고 인정할 수는 있습니다.\n저는 이 부분이 코칭에서도 굉장히 중요하다고 생각합니다.\n사람을 이해하지 못하면 우리는 금방 가르치려고 합니다.\n답답하니까 답을 줍니다.\n그냥 이렇게 하세요.\n그렇게 생각하면 안 돼요.\n마음 편하게 가지세요.\n긍정적으로 생각하세요.\n그런데 코칭은 내가 알고 있는 정답을 상대에게 넣어주는 일이 아닙니다.\n오히려 듣는 일에 가깝습니다.\n왜 저 말을 했을까.\n왜 이 부분에서 유독 감정이 커졌을까.\n왜 비슷한 상황이 반복될까.\n계속 듣다 보면 그 사람이 지금까지 만들어온 맥락이 조금씩 보이기 시작합니다.\n그래서 공격적 경청이 필요한 겁니다.\n잘 들어야 좋은 질문을 할 수 있기 때문입니다.\n좋은 질문을 받으면 상대방도 처음 생각해보는 답을 하게 됩니다.\n말을 하다가\n아, 내가 사실 이것 때문에 그랬구나.\n라고 스스로 발견하기도 합니다.\n코치는 그 사람에게 답을 주는 사람이 아니라,\n그 사람이 자기 안에 있는 답을 발견할 수 있도록 옆에서 돕는 사람에 더 가깝습니다.\n여기서 또 하나 중요한 것은 감정을 없애려고 하지 않는 것입니다.\n불안하면 안 된다.\n화가 나면 안 된다.\n슬프면 안 된다.\n이런 식으로 접근하면 감정 자체를 문제로 보게 됩니다.\n그런데 화가 날 상황에서 화가 나는 것은 이상하지 않습니다.\n차 사고가 났다면 화가 날 수 있고,\n누군가에게 모욕을 당했다면 분노할 수 있고,\n중요한 것을 잃으면 슬플 수 있습니다.\n중요한 것은 감정을 느끼느냐가 아닙니다.\n그 감정에 완전히 파묻혀서 행동까지 끌려가느냐입니다.\n화가 난다고 반드시 싸울 필요는 없습니다.\n불안하다고 반드시 도망갈 필요도 없습니다.\n슬프다고 모든 것을 포기할 필요도 없습니다.\n감정을 인지하고,\n그 감정이 왜 생겼는지 알고,\n그다음 행동은 내가 선택할 수 있어야 합니다.\n그래서 감정을 이해한다는 것은 감정을 제거하는 기술을 배우는 것이 아닙니다.\n감정과 행동 사이에 선택할 수 있는 공간을 만드는 일에 가깝습니다.\n그리고 이 책에는 분노, 공포, 불안, 수치심, 열등감, 원망, 무기력, 외로움 같은 감정뿐만 아니라\n기쁨, 행복, 사랑, 감사, 호기심, 감동, 존경, 용기 같은 감정들도 함께 다뤄집니다.\n여기에서 중요한 것은 부정적 감정은 나쁘고, 긍정적 감정은 좋다고 단순하게 나누는 것이 아닙니다.\n각 감정이 왜 발생하고,\n그 감정이 나에게 무엇을 알려주고 있으며,\n나는 그것을 어떻게 다룰 것인가를 보는 겁니다.\n이 책을 읽으면서 자기 감정을 하나씩 공부해보셨으면 좋겠습니다.\n나는 어떤 상황에서 불안해지는가.\n나는 어떤 상황에서 유독 화가 나는가.\n왜 그 사람 앞에서는 작아지는가.\n왜 같은 말을 들어도 어떤 사람에게 들었을 때 더 상처받는가.\n그리고 동시에 주변 사람에게도 같은 질문을 해볼 수 있습니다.\n왜 저 사람은 저렇게 행동할까.\n그 질문의 답을 성격 하나로 끝내지 않는 겁니다.\n그 사람 앞에는 내가 아직 듣지 못한 이야기가 있을 수 있으니까요.\n사람을 이해한다는 것은 심리학 용어를 많이 아는 것이 아닐지도 모릅니다.\n사람을 너무 빨리 판단하지 않는 것.\n내가 모르는 서사가 있다는 것을 인정하는 것.\n그리고 답을 주기 전에 조금 더 오래 듣는 것.\n저는 그것이 사람을 이해하는 시작이라고 생각합니다.\n나를 지키는 감정, 나를 살리는 감정을 읽으면서 감정을 외우기보다, 하나씩 자신의 경험과 사람들에게 연결해서 읽어보셨으면 좋겠습니다.\n내 감정을 이해하는 데에도 도움이 되겠지만,\n사업을 하며 고객을 이해할 때,\n직원을 이끌 때,\n누군가를 코칭할 때,\n그리고 내가 이해할 수 없는 사람을 만났을 때도 분명히 다른 시야를 만들어줄 수 있습니다.\n점을 보지 말고,\n흐름을 보는 것.\n감정을 보지 말고,\n그 감정이 만들어지기까지의 서사를 보는 것.\n이 책을 읽어야 하는 가장 큰 이유가 저는 거기에 있다고 생각합니다.\n", "reflect": {"q": ["최근 나를 화나게 한 사람 — 그의 서사를 나는 얼마나 아는가?", "같은 사건에 나와 전혀 다른 감정을 느낀 사람이 있었나? 왜였을까?", "감정과 행동 사이의 공간에서, 나는 보통 몇 초를 버는가?"], "act": "오늘 거슬렸던 감정 하나를 '사건→해석→감정'으로 분해해 적기"}}, {"ch": "행동주의자", "no": 7, "unit": "강", "key": "이너게임", "title": "이너게임과 사업", "sub": "성과 = 잠재력 - 간섭", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84_260911.mp4", "dur": 369, "durstr": "6:09", "thumb": "thumbs/이너게임.jpg", "chapters": [{"t": 0.0, "title": "판단하지 말고 관찰하라"}, {"t": 30.0, "title": "결과와 나를 연결하는 순간"}, {"t": 50.0, "title": "성과 = 잠재력 - 간섭"}, {"t": 78.2, "title": "간섭의 실제 사례"}, {"t": 117.0, "title": "ACT — 인식·선택·신뢰"}, {"t": 183.4, "title": "준비할 때는 분석, 수행할 때는 신뢰"}, {"t": 240.0, "title": "질문이 바뀐다"}, {"t": 266.0, "title": "추가하기보다 덜 방해하기"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P05.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P06.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P07.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P08.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P09.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P10.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P11.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P12.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P13.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EC%9D%B4%EB%84%88%EA%B2%8C%EC%9E%84/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/P14.jpg"], "script": "오늘은 이너게임을 사업에 어떻게 적용할 수 있는지 이야기해보겠습니다.\n예를 하나 들어보겠습니다.\n광고비는 500원이었습니다.\n클릭률은 0.8%였고,\n구매 전환율은 0.5%였습니다.\n첫 3초 이탈률은 높았습니다.\n여기까지입니다.\n이 안에는 자존심도 없고,\n잘했다, 못했다는 평가도 없습니다.\n그냥 데이터만 있습니다.\n이게 이너게임에서 말하는 중요한 태도 중 하나입니다.\n판단하지 말고,\n관찰하는 것입니다.\n그런데 사업을 하다 보면 우리는 데이터를 이렇게 보지 않습니다.\n광고가 안 나왔습니다.\n그러면 바로 생각합니다.\n내가 마케팅 감각이 없나?\n역시 나는 사업을 잘 못하나?\n내 판단이 틀렸나?\n일의 결과를 내 정체성과 연결해버립니다.\n그러는 순간부터 문제를 제대로 볼 수가 없습니다.\n이너게임에서 중요한 공식이 하나 있습니다.\n성과는 잠재력에서 간섭을 뺀 것입니다.\n성과 = 잠재력 - 간섭.\n우리는 보통 성과가 안 나오면 잠재력을 더 높이려고 합니다.\n마케팅을 더 배우고,\n책을 더 읽고,\n강의를 더 듣고,\n새로운 기술을 하나 더 붙입니다.\n물론 배워야 할 때도 있습니다.\n그런데 어느 순간부터는 문제가 능력 부족이 아닐 수 있습니다.\n이미 가지고 있는 능력이 있는데,\n내가 그 능력의 출력을 막고 있는 겁니다.\n예를 들어 광고를 5일 동안 테스트하기로 했다고 해보겠습니다.\n그런데 하루 돌렸는데 반응이 별로 없습니다.\n그러면 바로 생각하기 시작합니다.\n소재가 잘못됐나?\n타겟을 바꿔야 하나?\n내가 잘못 선택했나?\n그냥 멈출까?\n그리고 하루 만에 바꿉니다.\n다음 날 또 불안해서 바꿉니다.\n그렇게 계속 바꾸다 보면 결국 아무 데이터도 얻지 못합니다.\n능력이 없어서 실패한 것이 아니라,\n불안과 자기평가가 수행을 방해한 겁니다.\n이게 간섭입니다.\n그래서 중요한 것은 내가 잘했나 못했나를 판단하는 것이 아니라,\n실제로 무슨 일이 벌어지고 있는지를 정확하게 보는 것입니다.\n이 지점에서 갤웨이가 이야기하는 ACT를 사업에 적용해볼 수 있습니다.\nAwareness.\nChoice.\nTrust.\n인식.\n선택.\n신뢰입니다.\n먼저 인식입니다.\n사업에서 인식은 데이터라고 볼 수 있습니다.\n매출이 떨어졌다.\n이건 아직 너무 뭉뚱그린 말입니다.\n조금 더 정확하게 봐야 합니다.\n재구매율이 35%에서 21%로 떨어졌다.\n이건 데이터입니다.\n해석이 아니라,\n실제로 벌어진 일을 보는 겁니다.\n그다음은 선택입니다.\n데이터를 봤다면 내가 무엇을 할지 결정해야 합니다.\n예를 들어\n이번 주에는 신규 고객을 더 모으는 것보다 고액 고객이 왜 이탈했는지를 확인한다.\n이렇게 선택합니다.\n중요한 것은 외부가 선택해주는 것이 아니라 내가 선택하는 것입니다.\n마지막이 신뢰입니다.\n이게 사업에서 굉장히 중요합니다.\n한 번 선택했다면 실행하는 동안 지나치게 간섭하지 않는 겁니다.\n오늘 결정하고 내일 불안하다고 뒤집지 않습니다.\n정해진 기간 동안 실행하고,\n그다음 데이터를 봅니다.\n인식하고,\n선택하고,\n그 선택을 일정 시간 신뢰하는 것.\n이게 ACT입니다.\n이너게임을 잘못 이해하면\n생각하지 말라는 이야기인가?\n라고 생각할 수도 있습니다.\n그런데 그런 이야기가 아닙니다.\n배울 때는 생각해야 합니다.\n분석해야 하고,\n공부해야 하고,\n피드백도 받아야 합니다.\n그런데 수행할 때는 그만 생각해야 합니다.\n예를 들어 발표를 준비한다고 해보겠습니다.\n발표 전에는 문장을 수정할 수 있습니다.\n슬라이드를 바꿀 수도 있고,\n숫자를 다시 검증할 수도 있습니다.\n철저하게 준비해야 합니다.\n그런데 무대에 올라간 다음\n오른손을 어디에 두지?\n지금 목소리가 이상한가?\n방금 문장 틀렸나?\n이것만 생각하기 시작하면 오히려 수행이 무너집니다.\n그래서 저는 이걸 이렇게 기억하면 좋다고 생각합니다.\n준비할 때는 분석.\n수행할 때는 신뢰.\n사업도 같습니다.\n사업을 시작하기 전에는 분석을 해야 합니다.\n결정할 때는 냉정하게 선택해야 합니다.\n그리고 실행하기로 했다면 일정 기간은 신뢰해야 합니다.\n이 관점이 중요한 이유는 사업을 바라보는 질문 자체가 바뀌기 때문입니다.\n성과가 안 나오면 우리는 자꾸 묻습니다.\n나는 무엇을 더 배워야 하지?\n그런데 이너게임을 이해하면 그 전에 다른 질문을 할 수 있습니다.\n내가 이미 가지고 있는 능력 중 지금 제대로 출력되지 않는 것은 무엇인가?\n그리고 한 번 더 묻습니다.\n그 능력의 출력을 막고 있는 간섭은 무엇인가?\n사업을 하려는 사람들은 대체로 배우는 것을 좋아합니다.\n마케팅도 배우고,\n세일즈도 배우고,\n경영도 배우고,\n계속 무언가를 추가합니다.\n그런데 사업은 더 많이 안다고 무조건 잘되는 것은 아닙니다.\n어느 시점부터는 추가하는 것보다 덜 방해하는 것이 더 중요해질 수 있습니다.\n내가 무엇을 두려워하고 있는지.\n왜 결정을 미루고 있는지.\n실제 데이터가 아니라 내 해석을 사실이라고 믿고 있지는 않은지.\n이런 간섭을 발견해야 합니다.\n그래서 이너게임에서 제가 중요하게 보는 것은 단순히 더 잘하는 방법이 아닙니다.\n자기 자신을 불필요하게 방해하지 않는 방법입니다.\n능력이 부족하면 배우면 됩니다.\n그런데 이미 능력이 있는데 자기 자신이 그 능력의 출력을 막고 있다면 무엇을 더 배우는 것만으로는 해결되지 않습니다.\n판단하지 말고 관찰하는 것.\n데이터를 보고,\n선택하고,\n선택했으면 신뢰하는 것.\n그리고 문제가 생겼을 때 나라는 사람 전체를 평가하지 않고,\n어떤 조건이 잘못됐지?\n라고 다시 보는 것.\n성과는 잠재력에서 간섭을 뺀 것입니다.\n그래서 사업을 잘하기 위해 계속 무언가를 더 넣는 것만큼이나,\n내 안에서 무엇이 이미 가진 잠재력의 출력을 막고 있는지를 찾아내는 것도 중요합니다.\n이너게임은 바로 그 간섭을 바라보는 방법을 알려주는 책입니다.\n그래서 이 책을 읽으실 때\n나는 무엇을 더 배워야 하지?\n라는 질문만 하지 마시고,\n한 가지를 더 물어보셨으면 좋겠습니다.\n나는 지금,\n내가 가진 능력을 얼마나 방해하지 않고 사용하고 있는가?\n", "reflect": {"q": ["성과 = 잠재력 - 간섭. 지금 내 출력을 막는 간섭 1순위는 무엇인가?", "나는 어디서 판단하고 있고, 어디서 관찰하고 있는가?", "결과를 내 정체성에 붙였던 최근 사례는?"], "act": "이번 주 지표 하나를 정해 판단 없이 숫자만 3일 기록하기"}}, {"ch": "행동주의자", "no": 8, "unit": "강", "key": "잠", "title": "잠은 신뢰다", "sub": "의식이 퇴근하면, 몸이 야간작업을 시작한다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%9E%A0_260912.mp4", "dur": 120, "durstr": "2:00", "thumb": "thumbs/잠.jpg", "chapters": [{"t": 0.0, "title": "몸의 야간작업"}, {"t": 6.0, "title": "낮과 밤 — 누가 일하는가"}, {"t": 29.0, "title": "적극적 휴식의 극치"}, {"t": 46.0, "title": "잠의 역설"}, {"t": 65.0, "title": "CEO가 자리를 비워야 하는 이유"}, {"t": 73.0, "title": "작은 죽음과 재탄생"}, {"t": 98.0, "title": "휴식이 아니라 신뢰"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%EC%9E%A0/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%EC%9E%A0/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%EC%9E%A0/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%EC%9E%A0/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%EC%9E%A0/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S05.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%EC%9E%A0/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S06.jpg"], "script": "잠은 아무것도 하지 않는 시간이 아니라, 의식이 퇴근한 뒤 몸이 야간작업을 시작하는 시간에 가깝다.\n낮에는 우리가 일을 한다.\n밤에는 몸이 우리를 수리한다.\n뇌는 낮 동안 받아들인 정보를 정리하고 기억을 재배치한다.\n필요 없는 연결은 약하게 만들고 중요한 흔적은 남긴다.\n면역계와 호르몬, 대사 기능도 수면 리듬에 맞춰 조정된다.\n그래서 잠에서 깨어난 인간은 단순히 몇 시간 전의 인간이 아니다.\n밤새 내부 시스템을 한 차례 정비하고 나온 인간이다.\n그래서 잠은 적극적 휴식의 극치다.\n운동을 쉬는 것도 훈련의 일부지만,\n잠은 그보다 더 강하다.\n내가 개입하지 않을수록 제대로 작동한다.\n이를 악물고 잘 수도 없고, 노력해서 잠들 수도 없다.\n오히려 잠을 통제하려 할수록 멀어진다.\n근데 잠에는 이상한 역설이 있다.\n인간은 깨어 있을 때 무언가를 해야만 삶이 전진한다고 믿는다.\n책을 읽고, 사업을 하고, 운동하고, 사람을 만나야 생산적이라고 생각한다.\n그런데 하루 중 가장 생산적인 몇 시간은 내가 아무것도 하지 못하는 시간일 수도 있다.\n몸은 내가 가만히 있어야만 할 수 있는 일이 있다.\n사업에서도 비슷하다.\n계속 개입하는 경영자가 좋은 경영자가 아니듯, 인간의 몸에도 CEO가 잠시 자리를 비워줘야 돌아가는 부서가 있다.\n이런 말하는 나 자신도 잠을 잘 못 잔다는 게 재미있는 역설이다.\n내가 잠의 중요성을 몰라서 못 자는 게 아니다.\n오히려 해야 할 일과 보고 싶은 것과 생각할 것이 많은 인간일수록 깨어 있는 시간을 쉽게 놓지 못한다.\n삶을 많이 움켜쥐려다 다음 날의 삶을 만드는 시간을 깎아먹는다.\n나는 그래서 수면을 건강관리의 한 항목이라기보다 작은 죽음과 재탄생에 가깝게 본다.\n하루의 나를 잠시 포기해야 내일의 내가 만들어진다.\n결국 잠은 이런 행위다.\n내가 나를 고치는 것을 잠시 포기하고, 몸이 나를 고치도록 맡기는 일.\n인간에게 가장 어려운 휴식은 아무것도 하지 않는 것이고,\n가장 완전한 휴식은 아무것도 할 수 없는 상태다.\n그래서 잠은 휴식이라기보다 신뢰에 가깝다.\n나한테 하는 말이다.\n제발 잠 좀 자라.\n", "reflect": {"q": ["나는 잠을 줄여서 무엇을 지키려 하는가? 그건 실제로 지켜지는가?", "내가 자리를 비워줘야 돌아가는 부서는 몸 말고 어디에 또 있는가?", "통제하려 할수록 멀어지는 것이 내 삶에 또 무엇이 있나?"], "act": "오늘 취침 시각을 지금 정해서 복기칸에 적기 — 내일 지켰는지 체크"}}, {"ch": "행동주의자", "no": 9, "unit": "강", "key": "종이", "title": "종이와 펜", "sub": "생각이 도망가기 전에 한 번 붙잡는다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%A2%85%EC%9D%B4_260912.mp4", "dur": 80, "durstr": "1:20", "thumb": "thumbs/종이.jpg", "chapters": [{"t": 0.0, "title": "흐르는 화면, 위치가 있는 종이"}, {"t": 17.0, "title": "오래된 노트를 펼치면"}, {"t": 29.4, "title": "지우기의 자유"}, {"t": 38.3, "title": "종이는 흔적이 남는다"}, {"t": 49.0, "title": "사고의 화석"}, {"t": 55.1, "title": "펜으로 쓰는 행위의 진짜 가치"}, {"t": 65.6, "title": "키보드와 펜은 같은 글쓰기가 아니다"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/9%ED%98%B8_%EC%A2%85%EC%9D%B4/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/9%ED%98%B8_%EC%A2%85%EC%9D%B4/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/9%ED%98%B8_%EC%A2%85%EC%9D%B4/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/9%ED%98%B8_%EC%A2%85%EC%9D%B4/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C04.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC% 기 전에 한 번 붙잡아 보게 만드는 데 있습니다.\n키보드는 생각을 빠르게 세상으로 내보냅니다.\n펜은 생각이 세상으로 나오기 전에 잠시 나와 같이 있게 합니다.\n둘은 같은 글쓰기가 아닌 것입니다.\n", "reflect": {"q": ["내 생각의 흔적은 지금 어디에 남는가? 다시 꺼내볼 수 있는가?", "지운 문장들과 함께 사라진 과정이 아깝다고 느낀 적 있나?", "키보드로 쓸 때와 손으로 쓸 때, 내 생각의 속도는 어떻게 다른가?"], "act": "오늘 고민 하나를 종이에 펜으로 10분 써보기 — 지우지 말고"}}, {"ch": "행동주의자", "no": 10, "unit": "강", "key": "오픈월드", "title": "오픈월드", "sub": "길을 벗어나야 다음 퀘스트가 열린다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C_260912.mp4", "dur": 344, "durstr": "5:43", "thumb": "thumbs/오픈월드.jpg", "chapters": [{"t": 0.0, "title": "현실을 닮아서가 아니다"}, {"t": 10.0, "title": "노란 마커 밖의 세계"}, {"t": 30.9, "title": "게임의 구조 vs 현실의 공식"}, {"t": 58.2, "title": "exploitation과 exploration"}, {"t": 103.3, "title": "① 레데리2 — 길을 벗어나도 된다"}, {"t": 125.1, "title": "② 붉은사막 — 세계에 손을 대라"}, {"t": 154.4, "title": "③ 젤다 — 정답 경로가 없다"}, {"t": 178.6, "title": "④ 엘든링 — 막히면 다른 데 가도 된다"}, {"t": 215.9, "title": "우연은 확률이다"}, {"t": 256.8, "title": "사회의 메인퀘스트"}, {"t": 288.5, "title": "센스 — 정답 밖에도 세계가 있다"}, {"t": 320.9, "title": "길을 벗어나야 다음 퀘스트가 열린다"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C02.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/C03.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED EA%B2%80%EC%88%98/S05.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S06.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S07.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S08.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S09.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S10.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S11.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S12.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/10%ED%98%B8_%EC%98%A4%ED%94%88%EC%9B%94%EB%93%9C/_%ED%8C%90%EC%84%9C%EA%B2%80%EC%88%98/S13.jpg"], "script": "특히 레데리2, 붉은사막 같은 오픈월드가 좋은 이유는 현실을 닮아서가 아닙니다.\n오히려 핵심은 반대입니다.\n인생이 생각보다 게임처럼 작동한다는 걸 보여줍니다.\n메인퀘스트만 따라가면 세계의 대부분을 못 봅니다.\n레데리2에서 노란 마커만 따라가도 엔딩은 볼 수 있습니다.\n그런데 그렇게 하면 레데리2의 절반도 못 봅니다.\n길을 잘못 들었더니 낯선 사람이 말을 겁니다.\n산에 올라갔더니 이상한 집이 나옵니다.\n사냥하다가 사건을 만납니다.\n우연히 들어간 마을에서 새로운 인물이 열립니다.\n즉 게임의 구조가 이렇습니다.\n목표 → 이동 → 이탈 → 발견 → 새로운 목표\n우리는 현실에서 보통 반대로 배웁니다.\n목표 설정 → 최단거리 → 달성\n학교도 그렇고 회사도 그렇습니다.\n그런데 실제 인생의 큰 변화는 자주 이 공식 밖에서 나옵니다.\n새로운 사업. 새로운 사람. 배우자. 취미. 직업. 도시.\n처음부터 목표였던 경우보다 다른 일을 하다가 발견한 경우가 많습니다.\n필요한 감각은 경로이탈보다 탐색입니다.\n이걸 단순히\n가끔 딴짓하세요\n라고 표현하고 싶지 않습니다.\n좀 더 정확하게는 exploration입니다.\nExploitation은 이미 좋은 것을 계속합니다.\nExploration은 아직 모르는 것을 시험합니다.\n삶도 이 둘의 균형입니다.\n20년 동안 exploitation만 하면 효율은 올라갑니다.\n그런데 새로운 세계는 안 열립니다.\n사업으로 치면 기존 고객에게 기존 상품을 더 잘 파는 것은 exploitation입니다.\n전혀 다른 업종 사람을 만나고, 다른 나라를 가보고, 낯선 기술을 만지는 것은 exploration입니다.\n당장은 ROI가 없어 보입니다.\n그런데 새로운 퀘스트는 거의 이쪽에서 생깁니다.\n이 감각을 가장 잘 가르치는 게임은, 크게 네 종류로 봅니다.\n첫째, 레데리2.\n길을 벗어나도 됩니다.\n이 게임의 핵심입니다.\n효율적으로 하면 오히려 손해입니다.\n말 타고 목적지에 최대한 빨리 가면 세계를 놓칩니다.\n중간에 사람을 만나고, 사건을 보고, 사냥하고, 이상한 곳에 들어갈수록 게임이 커집니다.\n현실에서 가장 필요한 감각도 이것입니다.\n목적지보다 이동 중에 생기는 일이 더 중요할 수 있습니다.\n둘째, 붉은사막.\n세계에 손을 대세요.\n레데리2가 관찰에 가깝다면 붉은사막은 상호작용 쪽입니다.\n어디를 가고, 누구를 만나고, 무엇을 건드리느냐에 따라 다음 행동이 달라집니다.\n인생에서도 마찬가지입니다.\n가만히 생각한다고 퀘스트가 생성되는 게 아닙니다.\n무언가를 눌러봐야 합니다.\n사람에게 연락하고, 가게에 들어가고, 제품을 사보고, 도시에 가보고, 돈을 조금 써보고, 작게 사업을 시작합니다.\n행동을 해야 다음 선택지가 보입니다.\n셋째, 젤다.\n정답 경로가 없습니다.\n이건 더 노골적입니다.\n저 산에 올라갈 수 있을까요?\n올라가면 됩니다.\n저 강 건너에는 뭐가 있을까요?\n가면 됩니다.\n개발자가 여기로 가시오라고 하지 않습니다.\n호기심 자체가 인터페이스입니다.\n이 게임이 주는 가장 좋은 교육은\n궁금하면 확인해도 됩니다.\n라는 감각입니다.\n현실에서는 이상하게 어른이 될수록 이것을 잃습니다.\n넷째, 엘든링.\n막히면 다른 데 가도 됩니다.\n저는 이것도 중요하다고 봅니다.\n보스가 너무 강합니다.\n그러면 40번 박을 수도 있습니다.\n하지만 그냥 다른 곳으로 갈 수도 있습니다.\n동굴 하나 돌고, 무기 하나 먹고, 레벨을 올리고, 전혀 다른 지역을 탐험하다가 돌아오면 문제가 쉬워져 있습니다.\n이건 인생에서 굉장히 중요한 전략입니다.\n해결되지 않는 문제를 계속 해결하려 하지 말고, 다른 퀘스트를 수행해 자신을 바꾼 뒤 돌아오세요.\n사람들은 너무 자주 문제와 정면충돌합니다.\n직업이 안 풀리면 직업만 팝니다.\n사업이 안 되면 그 사업만 팝니다.\n관계가 안 되면 그 사람하고만 씨름합니다.\n때로는 다른 지역을 열어야 합니다.\n그래서 오픈월드가 주는 가장 큰 교육은 우연을 시스템으로 받아들이는 것입니다.\n우리는 우연을 운이라고 생각합니다.\n그런데 좋은 오픈월드를 오래 하면 조금 다른 감각이 생깁니다.\n우연도 확률입니다.\n마을 밖으로 안 나가면 사건을 만날 확률이 0입니다.\nNPC에게 말을 안 걸면 사이드퀘스트가 열릴 확률이 0입니다.\n산에 안 올라가면 숨겨진 장소를 찾을 확률이 0입니다.\n그러니까 현실에서 운을 늘리는 방법도 비슷합니다.\n더 많은 사람, 더 많은 장소, 더 많은 경험, 더 많은 작은 시도에 노출되는 것입니다.\n운은 통제할 수 없지만, 운과 만나는 면적은 늘릴 수 있습니다.\n이게 오픈월드가 가르치는 꽤 중요한 삶의 기술입니다.\n인간은 자꾸 지도에 없는 길을 위험이라고 생각합니다.\n학교, 취업, 결혼 등.\n사회가 만들어놓은 메인퀘스트입니다.\n나쁜 것은 아닙니다.\n문제는 이게 유일한 퀘스트라고 믿는 순간입니다.\n게임에서는 누구나 압니다.\n노란 마커가 세상의 전부가 아니라는 것을.\n현실에서는 이상하게 잊습니다.\n저는 그래서 아이든 청년이든 오픈월드 게임을 해볼 가치가 있다고 봅니다.\n게임을 잘하기 위해서가 아닙니다.\n세계에는 내가 아직 모르는 선택지가 있다는 감각을 몸으로 익히기 위해서입니다.\n결국 센스라는 것도 이것과 연결됩니다.\n센스는 결국 기존 규칙을 정확하게 아는 것에서 끝나지 않습니다.\n규칙을 알다가\n여기서 조금 벗어나면 뭐가 생기지?\n를 느끼는 능력입니다.\n예술가도 그렇고, 사업가도 그렇고, 여행자도 그렇습니다.\n남들이 모두 가는 길에서 조금 옆으로 빠집니다.\n그곳에서 새로운 패턴을 발견합니다.\n그리고 다시 돌아와 자기 언어로 만듭니다.\n즉, 삶의 센스란 정답을 빨리 찾는 능력이 아니라, 정답 밖에도 세계가 있다는 것을 감지하는 능력입니다.\n레데리2와 붉은사막이 좋은 이유도 바로 그것입니다.\n현실 같아서가 아닙니다.\n오히려 현실보다 노골적으로 보여줍니다.\n길을 벗어나야 다음 퀘스트가 열립니다.\n그리고 실제 인생도 꽤 자주 그렇습니다.\n메인퀘스트만 성실하게 완료한 사람이 반드시 가장 많은 삶을 사는 것은 아닙니다.\n", "reflect": {"q": ["나는 지금 메인 퀘스트(남이 준 목표)만 따라가고 있지 않은가?", "최근 길을 벗어나서 발견한 것이 있었나?", "내 지도에서 아직 안 가본 회색 지역은 어디인가?"], "act": "이번 주 평소라면 안 할 선택 하나를 일부러 해보기 — 결과를 복기칸에"}}, {"ch": "행동주의자", "no": 11, "unit": "강", "key": "실패", "title": "실패는 정보다", "sub": "성공하면 수익, 실패하면 정보", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%8B%A4%ED%8C%A8_260914.mp4", "dur": 296, "durstr": "4:55", "thumb": "thumbs/실패.jpg", "chapters": [{"t": 0.0, "title": "성공 가능성만 계산하는 사람"}, {"t": 11.3, "title": "계산식에 정보를 추가하면"}, {"t": 26.0, "title": "게임에서는 실패가 데이터"}, {"t": 52.4, "title": "현실에서는 존재에 붙인다"}, {"t": 89.3, "title": "실패를 피하는 사람의 위험"}, {"t": 135.2, "title": "운이 아니라 시행 횟수"}, {"t": 177.9, "title": "무엇을 회수하느냐"}, {"t": 201.2, "title": "실패와 나의 분리"}, {"t": 243.1, "title": "작게 실패하는 구조"}, {"t": 278.6, "title": "실패를 데이터로"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/13%ED%98%B8_%EC%8B%A4%ED%8C%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C1.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/13%ED%98%B8_%EC%8B%A4%ED%8C%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C2.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/13%ED%98%B8_%EC%8B%A4%ED%8C%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C3.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/13%ED%98%B8_%EC%8B%A4%ED%8C%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C4.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/13%ED%98%B8_%EC%8B%A4%ED%8C%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C5.jpg"], "script": "보통 사람은 뭔가를 시작하기 전에 성공 가능성을 계산합니다.\n될까?\n망하면 어떡하지?\n남들이 뭐라고 하지?\n그래서 성공할 가능성이 충분히 높아 보여야 행동하려고 합니다.\n그런데 계산식에 한 가지를 추가하면 이야기가 달라집니다.\n정보입니다.\n성공하면 큰 수익을 얻습니다.\n실패하면 정보를 얻습니다.\n이렇게 생각하면 완전한 손실 시나리오가 생각보다 많이 줄어듭니다.\n게임에서는 이게 너무 자연스럽습니다.\n처음 가보는 맵에 들어갔다가 죽습니다.\n그러면 손해만 본 걸까요?\n아닙니다.\n어디에 적이 있는지 알게 됩니다.\n길이 어디에서 막히는지 알게 됩니다.\n어디까지 갈 수 있는지도 알게 됩니다.\n보스에게 한 대 맞아 죽었습니다.\n그러면 최소한 공격 범위 하나는 알게 됩니다.\n이상한 선택지를 골랐다가 망했습니다.\n다음에는 그 선택지를 안 고르면 됩니다.\n게임에서는 실패가 데이터가 됩니다.\n그런데 현실에서는 실패에 너무 큰 의미를 붙입니다.\n사업 하나가 안 됐습니다.\n나는 사업가로 실패한 사람인가 봐.\n관계 하나가 끝났습니다.\n나는 인간관계가 안 되는 사람인가 봐.\n보고를 며칠 못 했습니다.\n나는 역시 의지가 약해.\n결과를 자기 존재에 붙여버립니다.\n그런데 게임처럼 보면 조금 다르게 볼 수 있습니다.\n이번 선택의 결과값은 이랬다.\n이 정도입니다.\n이 선택은 잘 안 됐습니다.\n이 방법은 먹히지 않았습니다.\n이 사람과는 이런 방식으로 관계가 움직였습니다.\n이 상품에는 시장 반응이 없었습니다.\n그럼 다음 선택에서 업데이트하면 됩니다.\n이 관점에서 보면 실패를 피하는 사람이 오히려 위험할 수도 있습니다.\n왜냐하면 자기 인생의 데이터를 거의 못 모으기 때문입니다.\n항상 안전한 선택만 합니다.\n잘 아는 사람만 만납니다.\n잘 아는 일만 합니다.\n실패 가능성이 낮은 것만 선택합니다.\n그러면 큰 실패는 적을 수 있습니다.\n그런데 동시에\n내가 어디까지 할 수 있는지,\n어떤 일을 좋아하는지,\n시장은 어떻게 반응하는지,\n사람은 어떤 식으로 움직이는지,\n나는 어떤 상황에서 무너지는지\n이런 것도 잘 모르게 됩니다.\n반대로 실패를 허용하는 사람은 계속 정보를 얻습니다.\n사람을 만나봅니다.\n작게 사업을 해봅니다.\n글을 올려봅니다.\n상품을 내봅니다.\n모임을 만들어봅니다.\n안 되면 왜 안 됐는지 봅니다.\n그리고 다시 해봅니다.\n이게 계속 누적되면 나중에는 겉으로 보기에 저 사람은 운이 좋네 처럼 보일 수 있습니다.\n그런데 실제로는 시행 횟수가 많고, 실패에서 회수한 데이터가 많은 사람일 수도 있습니다.\n처음부터 큰 그림을 정확히 맞힌 게 아니라\n작은 시도 하나 던지고, 반응을 보고, 틀리고, 고치고, 사람을 보고, 구조를 바꾸고, 다시 해본 결과\n나중에 하나의 형태가 된 겁니다.\n사업도 그렇습니다.\n처음부터 완벽한 사업모델을 맞히는 경우보다\n작게 시작하고, 고객 반응을 보고, 가격을 바꾸고, 상품을 바꾸고, 메시지를 바꾸고, 채널을 바꾸면서\n정보량을 쌓는 과정에서 사업이 만들어지는 경우가 많습니다.\n그러니까 실패에서 중요한 것은 실패하지 않는 것이 아니라\n실패한 뒤 무엇을 회수하느냐입니다.\n그냥 다음부터 조심해야지 로 끝내면 똑같은 일이 또 생길 수 있습니다.\n무엇이 반복됐는가.\n어떤 조건에서 이런 일이 생겼는가.\n내가 놓친 신호는 무엇이었는가.\n다음에는 무엇을 다르게 해볼 수 있는가.\n여기까지 가야 실패가 정보가 됩니다.\n그리고 이건 자존감과도 연결됩니다.\n실패를 나와 분리할 수 있어야 합니다.\n실패한 사업과 실패한 인간은 다릅니다.\n잘못된 선택과 잘못된 사람도 다릅니다.\n오늘 행동하지 못한 것과 평생 의지가 약한 사람이라는 판단도 다릅니다.\n결과는 하나의 데이터이고, 나는 그 데이터를 다음 선택에 사용하는 사람입니다.\n게임에서는 죽어도 다시 시작합니다.\n왜냐하면 죽는 순간조차 정보를 얻었기 때문입니다.\n현실도 조금 그렇게 볼 수 있습니다.\n성공하면 수익을 얻고,\n실패하면 정보를 얻습니다.\n물론 실패에는 비용이 있습니다.\n돈을 잃을 수도 있고, 시간을 쓸 수도 있고, 상처를 받을 수도 있습니다.\n그러니까 무모하게 실패하자는 이야기는 아닙니다.\n대신 작게 실패할 수 있는 구조를 만드는 겁니다.\n큰돈을 한 번에 거는 대신 작은 테스트를 합니다.\n1년을 걸기 전에 일주일 해봅니다.\n상품 1,000개를 만들기 전에 10명에게 먼저 팔아봅니다.\n완벽한 답을 기다리는 대신 작은 실험으로 정보를 얻습니다.\n그러면 실패는 끝이 아니라 업데이트가 됩니다.\n그리고 어느 순간 인생이 조금 게임처럼 보이기 시작합니다.\n이 선택이 틀렸다면 다른 선택을 하면 됩니다.\n이 길이 막혔다면 다른 길을 확인하면 됩니다.\n보스에게 맞았다면 패턴 하나를 배운 겁니다.\n그래서 중요한 것은 실패를 피하는 능력만이 아니라,\n실패에서 정보를 회수하는 능력입니다.\n실패를 피하지 마세요.\n대신 실패를 그냥 실패로 버리지는 마세요.\n데이터로 바꾸십시오.\n", "reflect": {"q": ["최근 3개월의 실패 하나에서 내가 회수한 정보는 무엇인가?", "나는 지금 결과를 나에 붙이고 있는 일이 있는가?", "내 인생에서 데이터가 가장 안 쌓인(안전한 선택만 한) 영역은 어디인가?"], "act": "1년 걸 일 말고, 일주일짜리 테스트 하나를 오늘 설계해 적기"}}, {"ch": "행동주의자", "no": 12, "unit": "강", "key": "조인트사업", "title": "조인트 사업의 실제 가치", "sub": "낮은 비용으로 받은 사업의 옵션", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EC%A1%B0%EC%9D%B8%ED%8A%B8%EC%82%AC%EC%97%85_260914.mp4", "dur": 177, "durstr": "2:56", "thumb": "thumbs/조인트사업.jpg", "chapters": [{"t": 0.0, "title": "돈을 빌리는 비용"}, {"t": 15.3, "title": "사업은 비용부터 지불한다"}, {"t": 32.9, "title": "조인트 사업의 설계"}, {"t": 54.0, "title": "손실은 제한, 상승은 열림"}, {"t": 61.3, "title": "비용은 옮겨간 것이다"}, {"t": 77.2, "title": "가장 위험한 구간을 건너뛴다"}, {"t": 98.4, "title": "공짜로 여기는 함정"}, {"t": 118.8, "title": "먼저 계산해야 할 질문"}, {"t": 143.8, "title": "채무 대신 실행"}, {"t": 160.7, "title": "감사가 아니라 실행"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/14%ED%98%B8_%EC%A1%B0%EC%9D%B8%ED%8A%B8%EC%82%AC%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C1.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/14%ED%98%B8_%EC%A1%B0%EC%9D%B8%ED%8A%B8%EC%82%AC%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C2.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/14%ED%98%B8_%EC%A1%B0%EC%9D%B8%ED%8A%B8%EC%82%AC%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C3.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/14%ED%98%B8_%EC%A1%B0%EC%9D%B8%ED%8A%B8%EC%82%AC%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C4.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/14%ED%98%B8_%EC%A1%B0%EC%9D%B8%ED%8A%B8%EC%82%AC%EC%97%85/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C5.jpg"], "script": "돈을 빌리는 비용이 높아질수록 사업가가 버틸 수 있는 시간은 줄어듭니다.\n금리 1%포인트는 숫자로 보면 작아 보이지만, 1000억원을 빌린 기업에는 매년 10억원의 추가 비용입니다.\n아직 매출이 발생하지 않아도 이자는 날짜를 세며 쌓입니다.\n사업은 대개 수익을 얻기 전에 비용부터 지불합니다.\n보증금, 시설비, 재고, 인건비, 광고비를 먼저 넣어야 합니다.\n자기 돈이 부족하면 대출을 받고, 사업이 실패해도 원금과 이자는 남습니다.\n일반적인 창업자는 사업 가능성을 실험하는 순간부터 자신의 자산과 신용을 함께 겁니다.\n이런 관점에서 보면 제가 멤버들에게 만들어드리는 조인트 사업의 가치는 단순히 같이 돈을 벌 기회가 아닙니다.\n대부분의 사업을 자기자본 투입이 거의 없고, 별도의 채무와 개인보증이 없으며, 고정비도 먼저 부담하지 않는 형태로 설계합니다.\n이미 만들어진 법인, 브랜드, 고객, 운영체계와 사업 기반을 활용하면서 성과가 나면 수익에는 참여합니다.\n손실 가능성은 제한하면서 상승 가능성은 열어둔 구조입니다.\n금융적으로 표현하면 낮은 비용으로 사업의 옵션을 받은 것과 같습니다.\n중요한 것은 비용이 없어진 것이 아니라는 사실입니다.\n자본비용과 실패 위험이 멤버의 장부에서 빠져 조직과 제 장부로 옮겨온 것입니다.\n멤버에게 무료로 보이는 이유는 사업에 비용이 들지 않기 때문이 아니라 다른 사람이 먼저 그 비용을 부담했기 때문입니다.\n사업가에게 가장 귀한 자산은 돈을 벌 기회만이 아닙니다.\n실패해도 인생이 무너지지 않는 상태에서 실제 시장을 경험할 기회입니다.\n대부분의 창업자는 이 경험을 얻기 위해 자기 돈을 잃고 빚을 갚습니다.\n멤버들은 같은 경험을 채무 없이 얻습니다.\n이것은 작은 혜택이 아닙니다.\n사업가가 되는 과정에서 가장 위험한 구간을 건너뛰게 해주는 일입니다.\n문제는 비용을 내지 않은 기회를 사람이 쉽게 가볍게 여긴다는 것입니다.\n투자금이 들어가지 않았으니 천천히 해도 된다고 생각하고, 채무가 없으니 보고와 실행을 미뤄도 된다고 여깁니다.\n그러나 시장가격은 내가 지불한 금액으로 결정되지 않습니다.\n내가 부담하지 않게 된 손실까지 포함해야 실제 가치를 알 수 있습니다.\n따라서 조인트 사업에 참여하는 멤버들은 다음 질문을 먼저 계산해야 합니다.\n이 사업을 혼자 시작했다면 초기자본이 얼마였는가.\n6개월 동안 발생할 고정비는 얼마였는가.\n필요한 대출과 금융비용은 얼마였는가.\n실패했을 때 남을 채무는 얼마였는가.\n지금 그 위험을 누가 대신 부담하고 있는가.\n이 차액이 제가 제공한 조인트 사업의 실제 가치입니다.\n채무가 없다는 것은 책임도 없다는 뜻이 아닙니다.\n돈으로 부담할 책임을 실행과 성과로 바꾸어준 것입니다.\n대출이 없는 대신 속도를 내야 하고, 고정비가 없는 대신 결과를 기록해야 하며, 실패 비용을 대신 부담하지 않는 대신 정해진 기간 안에 시장의 답을 받아와야 합니다.\n멤버들에게 주어진 것은 공짜 사업이 아닙니다.\n실패로 인생을 훼손하지 않으면서 사업가가 될 수 있는 드문 실전 기회입니다.\n그 가치를 인식하는 방법은 감사가 아니라 실행입니다.\n", "reflect": {"q": ["이 사업을 혼자 시작했다면, 초기자본·고정비·대출은 각각 얼마였을까? 지금 숫자로 계산해봤는가?", "나는 비용을 내지 않은 기회를 어디서 가볍게 다루고 있는가?", "돈으로 지지 않는 책임을, 나는 무엇(실행·기록·속도)으로 지고 있는가?"], "act": "내가 참여한(하려는) 일 하나의 '혼자 했다면 비용'을 항목별로 계산해 복기칸에 적기"}}, {"ch": "행동주의자", "no": 13, "unit": "강", "key": "늦었다", "title": "늦었다고 생각할 때 이미 늦어있습니다", "sub": "도구는 민주화됐지만, 사고는 아니다 — 사고의 복리", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%8A%A6%EC%97%88%EB%8B%A4_260913.mp4", "dur": 390, "durstr": "6:29", "thumb": "thumbs/늦었다.jpg", "chapters": [{"t": 0.0, "title": "새 %BC%EC%9D%98%EC%9E%90/15%ED%98%B8_%EB%8A%A6%EC%97%88%EB%8B%A4/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C7.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/15%ED%98%B8_%EB%8A%A6%EC%97%88%EB%8B%A4/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C8.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/15%ED%98%B8_%EB%8A%A6%EC%97%88%EB%8B%A4/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C9.jpg"], "script": "사람들은 새로운 기술이 등장할 때마다 세상이 조금 더 평등해질 것이라고 생각했습니다.\n계산기가 나오면 수학이 쉬워질 것이라고 생각했습니다.\n엑셀이 나오면 회계가 쉬워질 것이라고 생각했습니다.\n인터넷이 나오면 모두가 더 똑똑해질 것이라고 생각했습니다.\n검색엔진이 나오면 정보 격차가 사라질 것이라고 생각했습니다.\n그런데 결과는 어땠을까요?\n도구는 모두에게 열렸지만,\n그 도구를 잘 쓰던 사람들은 오히려 더 빠르게 앞으로 갔습니다.\n왜 그랬을까요?\n도구는 민주화됐지만, 사고까지 민주화된 것은 아니었기 때문입니다.\n인공지능도 마찬가지라고 생각합니다.\n많은 사람들이 이렇게 말합니다.\n이제 GPT가 있으니까 전문가가 필요 없는 것 아닌가요?\n그런데 실제로는 반대가 될 가능성이 높습니다.\n좋은 질문을 할 수 있는 사람.\n좋은 데이터를 가진 사람.\n좋은 판단력을 가진 사람.\n이런 사람들의 생산성이 AI를 만나면서 훨씬 더 크게 올라갑니다.\n그러니까 AI는 격차를 없애는 기술이 아니라,\n오히려 기존의 격차를 더 크게 확대하는 기술이 될 수도 있습니다.\n세상은 원래 복잡합니다.\n인간도 복잡하고,\n시장도 복잡하고,\n욕망도 복잡합니다.\n그런데 사람은 자꾸 세상을 단순하게 나누고 싶어 합니다.\n좋은 사람과 나쁜 사람.\n성공과 실패.\n진보와 보수.\n맞는 것과 틀린 것.\n하지만 현실은 그렇게 단순하게 움직이지 않습니다.\n그래서 AI가 어려운 이유도 AI 자체가 복잡해서만은 아닙니다.\nAI에게 질문하는 대상인 인간과 세상이 원래 복잡하기 때문입니다.\n여기서 중요한 문제가 하나 생깁니다.\n앞으로 많은 사람들이\nGPT가 그렇게 말했는데요?\n라고 말하게 될 겁니다.\n그런데 AI는 설명할 수는 있어도,\n그 설명이 현실에서 참인지 자동으로 증명해주는 존재는 아닙니다.\n결국 검증은 사람이 해야 합니다.\nAI가 만든 결과를 다시 AI에게 확인시키는 것만 반복한다면\n같은 정보와 같은 전제를 계속 순환시키는 위험도 생길 수 있습니다.\n그래서 AI 시대일수록 오히려\n비판적으로 생각하는 능력,\n출처를 확인하는 능력,\n1차 자료를 직접 보는 능력,\n현실과 비교해 판단하는 능력,\n이런 것들의 가치가 올라갈 가능성이 높습니다.\n재미있는 것은 인공지능 시대가 될수록 오히려 인간다운 능력이 더 중요해진다는 점입니다.\n연결하는 능력.\n질문하는 능력.\n관찰하는 능력.\n기록하는 능력.\nAI는 답을 굉장히 잘 만듭니다.\n하지만 무엇을 물을지는 사람이 결정합니다.\nAI는 패턴을 찾을 수 있습니다.\n하지만 수많은 패턴 중에서 무엇을 중요하게 볼 것인지,\n그 패턴을 어떻게 해석할 것인지는 결국 사람이 결정해야 합니다.\n그래서 앞으로 중요한 사람은 자격증을 가장 많이 가진 사람보다,\n서로 다른 분야를 연결할 수 있는 사람일 가능성이 높습니다.\n생물학을 알고,\n경제를 알고,\n철학을 알고,\n기술을 알고,\n사람을 이해하면서\n서로 상관없어 보이던 것들을 하나의 구조로 연결하는 사람입니다.\n그런데 여기까지는 이미 많이 들어본 이야기일 수도 있습니다.\n더 중요한 문제는 따로 있습니다.\n이미 격차가 벌어지고 있다는 것입니다.\nAI 사용은 단순히 새로운 프로그램 하나를 배우는 일이 아닙니다.\n누적 자산에 가깝습니다.\n예를 들어 5년 전부터 AI를 꾸준히 사용한 사람이 있다고 해보겠습니다.\n이 사람은 단순히 AI를 5년 먼저 사용한 것이 아닙니다.\n그동안 질문하는 방식이 달라졌습니다.\n생각을 정리하는 구조가 달라졌습니다.\n자료를 관리하는 방법이 달라졌습니다.\n글을 쓰는 속도가 달라졌습니다.\n사업 아이디어를 검증하는 방식이 달라졌습니다.\n학습하는 리듬 자체가 달라졌습니다.\n즉, AI라는 도구를 5년 사용했다기보다\n자기 뇌의 운영체제를 5년 동안 계속 업데이트한 것에 가깝습니다.\n그래서 단순히 5년이라는 시간 차이로 계산하면 안 됩니다.\nAI는 가속 장치입니다.\n매일 AI를 이용해\n질문하고,\n생각하고,\n만들고,\n검증하고,\n수정했다면\n그 사람은 5년 동안 경험만 쌓은 것이 아니라,\n매일 자신의 사고를 증폭시킨 것입니다.\n그래서 실제 체감 격차는 단순한 5년보다 훨씬 크게 느껴질 수도 있습니다.\n문제는 지금 시작하는 사람입니다.\n나도 이제 GPT 좀 써봐야겠다.\n라고 생각합니다.\n그런데 많은 사람이 며칠 사용하고 그만둡니다.\n요약 몇 번 시켜봅니다.\n문장 몇 개 다듬어봅니다.\n궁금한 것 몇 번 물어봅니다.\n그리고 말합니다.\n생각보다 별거 없네.\n그런데 정말 AI가 별거 없었던 걸까요?\n아니면\nAI에게 던질 자기 질문과,\nAI와 함께 해결할 자기 작업과,\n계속 반복할 자기 프로젝트가 없었던 것은 아닐까요?\nAI를 제대로 사용하려면 자기 질문이 있어야 합니다.\n자기 일이 있어야 합니다.\n자기 반복이 있어야 합니다.\n오늘 질문하고,\n내일 결과를 보고,\n다시 수정하고,\n그다음 작업에 적용하고,\n그 과정에서 생긴 데이터를 다시 넣어야 합니다.\n그래야 AI가 내 작업 안으로 들어오기 시작합니다.\n그래서 2026년의 AI 격차는 앞으로 벌어질 격차라기보다\n이미 벌어지고 있는 격차에 가깝습니다.\n먼저 시작한 사람들은 이미 자기 데이터를 쌓고 있습니다.\n자기 프롬프트를 쌓고 있습니다.\n자기 사고방식을 만들고 있습니다.\n자기 자동화를 만들고 있습니다.\n자기 콘텐츠 구조를 만들고 있습니다.\n자기 사업 모델 안에 AI를 넣기 시작했습니다.\n그러니까 지금 시작하는 사람은 단순히 앱 하나를 켜서 같은 출발선에 서는 것이 아닙니다.\n이미 몇 년 동안 축적된 다른 사람의 운영체제와 경쟁하기 시작하는 것입니다.\n그런데도 아직 많은 사람이 AI를 검색창 정도로 생각합니다.\n궁금한 것 물어보고,\n답 하나 받고,\n끄는 도구라고 생각합니다.\n하지만 AI는 검색창에 가까운 도구가 아닙니다.\n생산수단에 가깝습니다.\n조금 더 정확하게 말하면 사고의 생산수단입니다.\n내가 생각하는 속도,\n배우는 속도,\n실험하는 속도,\n만드는 속도,\n수정하는 속도를\n동시에 끌어올릴 수 있는 도구입니다.\n그래서 격차가 무서운 것입니다.\n돈에도 복리가 있지만,\n사고에도 복리가 있습니다.\n오늘 AI와 함께 만든 질문 하나가 내일 더 좋은 질문을 만들고,\n그 질문이 더 좋은 데이터를 만들고,\n그 데이터가 더 좋은 판단을 만들고,\n그 판단이 다시 더 나은 작업을 만들어냅니다.\n이게 몇 달, 몇 년씩 반복되면\n처음에는 보이지 않던 차이가 어느 순간 굉장히 크게 벌어집니다.\n그래서\nAI를 언제 시작해야 할까요?\n라는 질문에 대한 답은 생각보다 단순할지도 모릅니다.\n가능하면 지금입니다.\n중요한 것은 GPT를 한 번 써보는 것이 아닙니다.\n내 질문과,\n내 일과,\n내 기록과,\n내 반복 속에\nAI를 넣기 시작하는 것입니다.\n늦었다고 생각할 때 이미 조금 늦어 있을 수 있습니다.\n그렇다고 시작하지 않을 이유는 없습니다.\n오히려 그렇기 때문에 더 빨리 내 사고의 복리를 만들기 시작해야 합니다.\n", "reflect": {"q": ["나는 AI를 검색창처럼 쓰고 있는가, 내 작업 안에 넣어 반복하고 있는가? 최근 일주일의 사용을 떠올려보라.", "지금 내 일에서 '자기 질문·자기 작업·자기 프로젝트' 세 가지 중 없는 것은 무엇인가?", "5년 뒤의 나와 경쟁할 사람은 지금 무엇을 쌓고 있을까? 나는 오늘 무엇을 쌓았는가?"], "act": "내 일 하나를 골라 'AI에게 던질 질문 1개'를 적고, 오늘 안에 실제로 던진 뒤 결과를 복기칸에 한 줄 기록하기"}}, {"ch": "행동주의자", "no": 14, "unit": "강", "key": "마음의이동수단", "title": "AI는 생산성 도구가 아니라 마음의 이동수단이다", "sub": "몸이 아니라 생각이 움직이는 여행 — 사유의 이동성", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8_260914.mp4", "dur": 377, "durstr": "6:17", "thumb": "thumbs/마음의이동수단.jpg", "chapters": [{"t": 0.0, "title": "AI 이야기는 왜 노동 이야기뿐인가"}, {"t": 29.6, "title": "생각이 움직이는 여행"}, {"t": 38.6, "title": "제한된 언어 안에서 산다"}, {"t": 65.5, "title": "단어 하나가 좌표를 바꾼다"}, {"t": 102.8, "title": "여행은 좌표를 흔든다"}, {"t": 132.0, "title": "책상 앞에서 정신의 이동거리"}, {"t": 156.3, "title": "검색엔진과 AI의 차이"}, {"t": 184.5, "title": "생산성 vs 정신적 이동"}, {"t": 212.4, "title": "비서가 아니라 탐험선"}, {"t": 245.4, "title": "힐링 — 문제와 나 사이의 거리"}, {"t": 294.6, "title": "새로운 빈곤은 단어의 빈곤"}, {"t": 326.3, "title": "AI를 잘 쓴다는 것 — 세 가지 질문"}, {"t": 351.5, "title": "사유의 이동성"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C1.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96%89%EB%8F%99%EC%A3%BC%EC%9D%98%EC%9E%90/16%ED%98%B8_%EB%A7%88%EC%9D%8C%EC%9D%98%EC%9D%B4%EB%8F%99%EC%88%98%EB%8B%A8/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C10.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%ED%96
