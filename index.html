C%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%EC%BB%B720.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%EC%BB%B721.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C01.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/7%ED%98%B8_%EA%B3%A0%EA%B0%9D%EC%9D%98%EC%96%B8%EC%96%B4/_%EA%B2%80%EC%88%98/%ED%8C%90%EC%84%9C02.jpg"], "script": "사업을 하다 보면 자꾸 상품부터 설명하게 됩니다.\n우리 제품은 이런 기능이 있고, 이런 기술이 들어가 있고, 이런 장점이 있고,\n다른 제품과는 이런 차이가 있습니다.\n그런데 문제가 있습니다.\n고객은 처음부터 당신의 상품을 찾고 있지 않을 수도 있습니다.\n고객이 처음 찾는 것은 상품이 아니라 자기 문제입니다.\n예를 들어 발이 아픈 사람은 처음부터 어떤 특정 제품명을 검색하는 게 아닙니다.\n오래 걸으면 발바닥이 아픈 이유.\n아침에 일어나면 뒤꿈치가 아파요.\n깔창을 써도 계속 아픈데 왜 이러죠?\n이런 식으로 자기가 겪고 있는 상황을 먼저 말합니다.\n속눈썹도 마찬가지입니다.\n처음부터 제품의 소재나 기술 이름을 검색하기보다\n속눈썹 붙이면 자꾸 떨어져요.\n초보인데 혼자 붙일 수 있나요?\n풀 없이 붙이는 속눈썹 없나요?\n자기 언어로 문제를 말합니다.\n그런데 사업자는 자꾸 자기 언어로 답하려고 합니다.\n기술명. 제품명. 전문용어. 우리가 중요하다고 생각하는 장점.\n그래서 좋은 상품인데도 고객과 대화가 안 되는 겁니다.\n고객은 자기 문제를 말하고 있는데\n사업자는 자기 상품을 말하고 있기 때문입니다.\n마케팅은 내가 하고 싶은 말을 잘하는 일이 아닙니다.\n고객이 이미 하고 있는 말을 먼저 듣는 일에 가깝습니다.\n사람들은 어디에서 불편해하는지.\n무슨 표현을 반복하는지.\n어떤 순간에 검색하는지.\n무엇이 무서운지. 무엇이 헷갈리는지.\n그걸 알아야 합니다.\n그래서 저는 콘텐츠를 만들기 전에 먼저 고객의 말을 봅니다.\n카페를 보고, 댓글을 보고, 후기를 보고, 질문을 봅니다.\n거기에는 사업자가 만든 문장이 아니라\n실제로 문제가 생긴 사람이 사용하는 문장이 있습니다.\n그 문장을 보면 콘텐츠 제목도 달라집니다.\n우리 제품의 세 가지 장점이 아니라\n깔창을 써도 계속 아픈 이유가 되고,\n새로운 속눈썹 기술이 아니라\n속눈썹 붙이고 십 분 만에 떨어지는 이유가 됩니다.\n상품이 먼저가 아니라 상황이 먼저 오는 겁니다.\n그리고 고객이 이거 내 얘기인데, 라고 느끼는 순간\n그때부터 내 말을 듣기 시작합니다.\n여기서 중요한 것은 고객의 표현을 그냥 베껴 쓰라는 것이 아닙니다.\n그 말 뒤에 있는 상황을 봐야 합니다.\n왜 저 말을 했는지. 무슨 일이 있었는지.\n그 순간 무엇이 필요했는지.\n그래야 표현만 따라 하는 게 아니라\n고객이 있는 자리까지 들어갈 수 있습니다.\n마케팅에서 가장 위험한 순간은\n고객보다 내 상품을 더 많이 보고 있을 때입니다.\n상품을 오래 만든 사람일수록 상품이 너무 잘 보입니다.\n그런데 고객에게는 상품보다 자기 문제가 훨씬 크게 보입니다.\n그러니까 콘텐츠를 만들기 전에 이 질문부터 해보십시오.\n나는 지금 내 상품의 언어로 말하고 있는가?\n아니면 고객이 실제로 사용하는 언어에서 대화를 시작하고 있는가?\n고객은 당신의 상품에서 출발하지 않습니다.\n자기의 하루에서 출발합니다.\n그 하루 안에서 문제가 생기고, 질문이 생기고, 검색이 시작됩니다.\n마케팅은 그 질문과 내 상품 사이에 길을 만드는 일입니다.\n", "reflect": {"q": ["내 고객은 내 상품을 검색하는가, 자기 문제를 검색하는가?", "최근 내가 쓴 제목은 상품의 언어인가, 고객의 언어인가?", "고객이 실제로 쓰는 문장을 마지막으로 읽어본 건 언제인가 — 카페·댓글·후기·질문 중 어디에서?"], "act": "고객이 쓴 문장 3개를 그대로 옮겨 적고, 그중 하나로 콘텐츠 제목을 고쳐 복기칸에"}}, {"ch": "마케팅주의자", "no": 8, "unit": "강", "key": "행동의도기능", "title": "고객의 말을 그대로 믿으면 안 되는 이유", "sub": "행동 · 의도 · 기능으로 한 번 더 들어간다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EA%B0%95%EC%9D%98%EC%98%81%EC%83%81_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5_260924.mp4", "dur": 347, "durstr": "5:47", "thumb": "thumbs/행동의도기능.jpg", "chapters": [{"t": 2.4, "title": "고객언어를 모았는데 카피가 안 써진다면"}, {"t": 16.5, "title": "\"음식물 쓰레기 버리기 싫어요\""}, {"t": 32.4, "title": "같은 말 뒤에 있는 네 가지 이유"}, {"t": 54.6, "title": "말은 같아도 막고 있는 이유는 다르다"}, {"t": 74.2, "title": "바로 상품으로 가지 않는다"}, {"t": 84.2, "title": "행동 — 실제로 하고 있는 것"}, {"t": 94.4, "title": "의도 — 왜 미루는가"}, {"t": 113.7, "title": "기능 — 그 행동이 지켜주는 것"}, {"t": 131.1, "title": "\"그냥 버리세요\"가 통하지 않는 이유"}, {"t": 150.2, "title": "이유가 다르면 상품이 다르다"}, {"t": 189.3, "title": "상품의 언어와 고객의 언어"}, {"t": 219.5, "title": "두 문장은 무엇이 다른가"}, {"t": 234.2, "title": "단어를 복사하는 게 아니다"}, {"t": 240.3, "title": "\"싫어요\" 뒤에서 한 번 더 묻는 질문"}, {"t": 271.1, "title": "표면의 말 뒤 — 행동, 의도, 기능"}, {"t": 292.2, "title": "사업가는 감정을 문제로 바꾸는 사람"}, {"t": 315.9, "title": "그 말 뒤에 한 번 더 들어가 보십시오"}], "notes": ["https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C1.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C2.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C3.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C4.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C5.jpg", "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%85%B8%ED%8A%B8/%EB%A7%88%EC%BC%80%ED%8C%85%EC%A3%BC%EC%9D%98%EC%9E%90/8%ED%98%B8_%ED%96%89%EB%8F%99%EC%9D%98%EB%8F%84%EA%B8%B0%EB%8A%A5/_%ED%8C%90%EC%84%9C%EB%85%B8%ED%8A%B8/%ED%8C%90%EC%84%9C6.jpg"], "script": "고객언어를 열심히 모았는데도 카피가 안 써지고, 상품 아이디어도 안 나온다면\n이걸 놓치고 있을 가능성이 큽니다.\n고객이 하는 말을 너무 그대로 믿고 있는 겁니다.\n예를 들어 고객이 이렇게 말합니다.\n음식물 쓰레기 버리기 싫어요.\n그러면 우리는 쉽게 생각합니다.\n아, 음식물 쓰레기 버리는 걸 싫어하는구나.\n그런데 정말 그럴까요?\n어쩌면 이 사람은 음식물 쓰레기를 버리는 게 싫은 게 아닐 수도 있습니다.\n봉투를 들었을 때 손에 묻는 촉감이 싫은 걸 수도 있고,\n국물이 바닥에 흐를 것 같은 게 싫은 걸 수도 있고,\n냄새가 올라오는 게 싫을 수도 있고,\n엘리베이터에서 누군가 마주치는 게 민망한 걸 수도 있습니다.\n겉으로 나오는 말은 똑같습니다. 버리기 싫어요.\n그런데 실제로 행동을 막고 있는 이유는 완전히 다를 수 있습니다.\n이 차이를 못 보면 고객언어를 아무리 많이 모아도\n카피는 얕아지고, 상품도 뻔해집니다.\n그래서 저는 고객의 말을 들었을 때 바로 상품으로 가지 않습니다.\n먼저 세 가지를 봅니다. 행동. 의도. 기능.\n먼저 행동입니다.\n이 사람이 실제로 하고 있는 행동은 무엇인가?\n음식물 쓰레기를 바로 버리지 않고 미루고 있습니다.\n그다음은 의도입니다. 왜 미루고 있을까요?\n냄새를 피하고 싶어서. 축축한 촉감을 피하고 싶어서.\n국물이 샐 것 같은 불안을 피하고 싶어서.\n사람을 마주치는 민망함을 피하고 싶어서.\n그러면 마지막으로 이 행동은 이 사람에게 어떤 기능을 하고 있을까요?\n버리지 않으면 당장은 불쾌한 경험을 하지 않아도 됩니다.\n즉, 미루는 행동이 지금의 편안함을 지켜주고 있는 겁니다.\n그러니까 이 사람에게 귀찮아도 그냥 버리세요, 라고 말해봐야\n별 의미가 없습니다.\n그 사람도 버려야 한다는 건 이미 알고 있습니다.\n몰라서 안 하는 게 아닙니다.\n그 행동을 하는 과정에서 생기는 불편 때문에 움직이지 못하고 있는 겁니다.\n여기서부터 사업이 시작됩니다.\n냄새가 문제라면 밀폐를 더 잘하면 됩니다.\n촉감이 문제라면 손으로 직접 만지지 않아도 되는 구조를 만들 수 있습니다.\n국물이 흐르는 게 문제라면 누수를 막거나 흡수하는 구조를 만들 수 있습니다.\n사람을 마주치는 게 싫다면 비대면 수거나 배출 방식 자체를 다르게 만들 수도 있습니다.\n같은 음식물 쓰레기 버리기 싫어요, 라는 한 문장에서\n완전히 다른 상품과 서비스가 나올 수 있는 겁니다.\n카피도 마찬가지입니다.\n예를 들어 냄새를 막아주는 음식물 쓰레기통, 이라고 말할 수 있습니다.\n틀린 말은 아닙니다. 그런데 이런 카피는 상품의 언어입니다.\n반대로 음식물 쓰레기를 버리기 싫었던 게 아니라\n봉투를 들었을 때 흘러내릴 국물이 싫었던 분께.\n이렇게 말하면 고객이 실제로 겪고 있는 장면으로 들어갑니다.\n앞의 문장은 우리 상품에는 이런 기능이 있습니다, 라고 말합니다.\n뒤의 문장은 당신이 왜 이 행동을 미루고 있는지 알고 있습니다, 라고 말합니다.\n그래서 고객언어는 고객이 쓴 단어를 그대로 복사하는 것이 아닙니다.\n고객이 싫어요, 라고 말했으면 한 번 더 들어가야 합니다.\n왜 싫은가? 정확히 어떤 순간에 싫은가?\n무엇을 피하고 싶은가?\n그 행동을 하지 않으면 당장은 무엇을 얻는가?\n그리고 그 행동을 계속 미루면 나중에는 어떤 비용을 치르는가?\n여기까지 가야 고객언어가 상품이 되고, 서비스가 되고, 카피가 됩니다.\n그래서 코칭이나 NLP처럼 사람의 행동을 이해하는 공부가 마케팅과도 연결됩니다.\n표면에 나온 말만 듣는 게 아니라 그 말 뒤에 있는 행동, 의도, 기능을 보는 것입니다.\n사업가는 고객의 감정을 무시하는 사람이 아니라\n막연한 감정을 해결할 수 있는 문제로 바꿀 수 있어야 합니다.\n그리고 고객이 해야 하지만 하지 못하고 있는 행동을\n조금 더 쉽게 할 수 있도록 상품과 서비스로 구조를 만들어야 합니다.\n다음에 고객이 싫어요, 귀찮아요, 불편해요, 라고 말하면\n거기서 멈추지 마십시오.\n그 말 뒤에 한 번 더 들어가 보십시오.\n왜? 정확히 뭐가? 어떤 순간에? 무엇을 피하려고?\n그 질문 끝에 상품이 있고, 서비스가 있고, 카피가 있습니다.\n", "reflect": {"q": ["내 고객이 \"싫어요\"라고 말한 그 순간, 정확히 무엇이 싫었던 것인가?", "고객이 해야 하는 걸 알면서도 못 하고 있는 행동은 무엇인가 — 그 행동을 미루면 지금 무엇이 편해지는가?", "그 이유 하나하나가 서로 다른 상품이 될 수 있는가?"], "act": "고객의 말 한 문장을 골라 행동·의도·기능 세 칸으로 쪼개 적고, 각 칸에서 나오는 상품을 하나씩 적어 복기칸에"}}, {"ch": "음악", "no": 1, "unit": "곡", "key": "인생의겨울", "title": "인생의 겨울", "sub": "겨울의 판단은 겨울의 시야를 반영할 뿐", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%9D%B8%EC%83%9D%EC%9D%98%EA%B2%A8%EC%9A%B8_260914.mp4", "dur": 199, "durstr": "3:18", "thumb": "thumbs/인생의겨울.jpg", "chapters": [{"t": 9.0, "title": "우리는 어디에서 왔는가"}, {"t": 22.4, "title": "겨울의 판단"}, {"t": 68.0, "title": "은인과의 인연"}, {"t": 119.6, "title": "봄이 오면"}, {"t": 156.0, "title": "판단해서는 안 되는 계절"}], "notes": [], "script": "100년 전에 우리는 아무도 없었죠.\n100년 후에 우리 중 누구도 이 세상엔 없을 겁니다.\n제가 지금까지 살면서 가장 잘했다고 생각하는 일이 뭘까.\n인생의 겨울에 성급한 선택과 판단을 멈춘 것입니다.\n겨울에 만들어진 판단은 종종 겨울의 시야를 반영할 뿐, 삶 전체의 사실을 반영하지는 않습니다.\n그래서 저는 인생의 겨울이라고 느껴질 때마다, 당장 하지 않아도 되는 최종 판단은 가능한 한 미뤘습니다.\n시간이 지나면 봄이 온다는 것을 믿었습니다.\n여기서 봄이 온다는 말은 아무것도 하지 않고 기다리면 모든 문제가 저절로 해결된다는 뜻이 아닙니다.\n물론 겨울에도 해야 할 일은 해야 합니다.\n다만 겨울의 감정으로 인생 전체를 판결하지 않았다는 뜻입니다.\n현재 나의 피로를 평생의 무능력으로 해석하지 않았습니다.\n현재의 사업 위기를 사업가로서의 최종 실패로 규정하지 않았습니다.\n해야 할 행동은 계속하되, 되돌리기 어려운 결론은 계절이 바뀔 때까지 유보했습니다.\n저는 그 방식으로 수많은 은인과의 인연을 끊지 않을 수 있었습니다.\n어려운 시기에 서운함이나 수치심, 열등감만을 기준으로 관계를 정리했다면 지금 제 곁에 남아 있지 않았을 사람들도 많습니다.\n당시에는 그 관계가 끝난 것처럼 보였지만, 시간이 지나고 제 상황과 시야가 달라지면서 전혀 다르게 이해하게 된 일도 있었습니다.\n제가 먼저 최종 결론을 내리지 않았기 때문에 다시 대화할 수 있었고, 다시 도움을 주고받을 수도 있었습니다.\n사업에서도 마찬가지였습니다.\n겨울마다 이 사업은 끝났다, 나는 여기까지다, 이제는 방법이 없다고 단정했다면 저는 이미 오래전에 시장에서 사라졌을 것입니다.\n내가 그랬다면, 여기서 여러분을 만나서 이런 이야기를 하는 현실 자체도 없었겠죠.\n저는 사업의 겨울에 사업 전체에 대한 판결보다, 약속을 지키고, 다음 계절까지 생존하는 일을 우선했습니다.\n봄이 오면 겨울에는 보이지 않던 사람이 나타나기도 하고, 새로운 거래가 생기기도 하며, 이전에는 이해하지 못했던 문제의 원인이 보이기도 하더군요.\n그 경험이 반복되면서 알게 되었습니다.\n인생의 겨울에는 미래를 정확히 예측하는 능력보다, 미래를 성급하게 닫지 않는 능력이 더 중요할 때가 있다는 것을.\n결정하지 않으면 안 되는 일과, 지금 결정할 필요가 없는 일을 구분하라는 뜻입니다.\n오늘 처리할 문제는 처리하되, 오늘 알 수 없는 미래까지 함부로 확정하지 마세요.\n종종 인생의 많은 것들은, 시간에 맡겨도 되는 거더군요.\n좋은 판단이란 언제나 빠르게 결론을 내리는 것이 아닐 겁니다.\n판단해서는 안 되는 계절을 알아보는 것도 판단력이지요.\n", "reflect": {"q": ["지금 내 계절은 무엇인가? 겨울이라면, 유보해야 할 판단은 무엇인가?"], "act": null}}, {"ch": "음악", "no": 2, "unit": "곡", "key": "시절인연", "title": "시절인연", "sub": "인연도 노력이라는 물을 주면 가꿀 수 있다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%8B%9C%EC%A0%88%EC%9D%B8%EC%97%B0_260915.mp4", "dur": 280, "durstr": "4:40", "thumb": "thumbs/시절인연.jpg", "chapters": [{"t": 30.0, "title": "시절인연이란"}, {"t": 62.3, "title": "만나야 아는 것들"}, {"t": 80.6, "title": "마음껏 헤어져 보라"}, {"t": 139.3, "title": "눈이 마주치면 말을 거세요"}, {"t": 193.3, "title": "인연은 오늘도 기다린다"}], "notes": [], "script": "시절인연에 대해 생각해 봅니다.\n시절인연은 불교에서 쓰는 용어이긴 하지만 말입니다.\n보통 그렇게 이야기합니다.\n시절인연이 맞으면 아무리 거부해도 인연을 만들게 되며, 시절인연이 맞지 않으면 아무리 애를 써도 인연을 맺을 수 없게 됩니다.\n이 말이 사실일까요?\n애초에 만남이 없으면 헤어짐이 없을 텐데.\n그렇다면 노력으로는 아무리 해도 시절인연이 없는 것일까요.\n저는 백 프로 그렇다고만 볼 수는 없다고 생각합니다.\n시험을 봐야 시험에 떨어지기도 하고.\n만나야 헤어짐의 아픔을 아는 것이고.\n말을 걸어야 대답을 듣는 것이고.\n이런 노력을 그냥 무조건 하늘이 정해주는 인연에 의지하는 게 맞는 것일까요?\n저는 좀 아닌 것 같습니다.\n이십 대에는 많이 헤어져 봐야 합니다.\n그 말은 많은 사람을 만나려고 노력을 해야 하는 것인데, 여기에 전제 조건이 있습니다.\n나보다 나은 환경에서, 나보다 나은 사람을 찾으려는 노력.\n이것은 정신적으로 무척 피곤할 수 있습니다.\n그렇게 만났다가 헤어져서 마음이 아플 수도 있겠지요.\n하지만 시절인연도 내가 노력하느냐에 따라 달라질 수 있는 것 아닐까요?\n제가 이십 대에 애타게 찾았던 시절인연을 마흔이 넘어서 만나게 된다면 어쩔 것인가요.\n젊고 가능성이 있을 때 마음껏 헤어져 보시기 바랍니다.\n마음껏 헤어지려면, 역설적으로 많이 만나봐야 합니다.\n어쩌면 여러분의 운명을 바꿀 누군가가 커피숍에서, 혹은 길거리 어딘가에서 여러분을 지나가고 있을지도 모를 일입니다.\n항상 안테나를 세우고, 그런 사람을 찾기 위한 노력을 하시기 바랍니다.\n인생을 바꿀 인연의 시작은 항상 그렇게 평범한 것에서 시작됩니다.\n사실 그렇게 보일 뿐, 여러분의 행동이 그것을 만든 것이고, 그 후 여러분의 생각과 현실이 바뀌기 시작할 것입니다.\n눈이 마주치면 말을 거세요.\n사람도 사랑도 그렇게 시절인연이 있다고 합니다.\n하지만 저는 인연도 노력이라는 물을 주면 언제든지 가꿀 수 있다고 생각합니다.\n한 달 한 달 그냥 지나가는 일상 속에, 향후에 여러분의 은인이 되어 줄 수도 있는 사람을 놓치고 있는 것은 아닌지.\n움직이지 않으면 제로가 아니라 마이너스인 것입니다.\n슬픔으로 범벅된 이별도 만남이 있어야 가능한 것입니다.\n소중한 인연을 위해서는 슬픈 이별은 각오해야 할 것입니다.\n하지만 그 과정에서 평생의 인연을 미리 만날 수 있다면, 그것만으로 된 것이 아닐까요.\n가만히 있으면 더운 여름이 지나가고, 가을이 오고, 겨울이 옵니다.\n다가오는 겨울에 슬픈 크리스마스를 보낼지 아닐지 우리는 모릅니다.\n그걸 알면 인생이 아니겠지요.\n하지만 적어도, 이별하려는 노력을 해보시기 바랍니다.\n여러분의 인연은 오늘도 여러분을 기다리고 있을지 모를 일입니다.\n", "reflect": {"q": ["나는 지금, 스쳐 지나가게 두고 있는 사람이 없는가?"], "act": null}}, {"ch": "음악", "no": 3, "unit": "곡", "key": "열정", "title": "열정은 자아입니다", "sub": "열정은 태우고, 냉정한 끈기는 만든다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%97%B4%EC%A0%95_260917.mp4", "dur": 175, "durstr": "2:54", "thumb": "thumbs/열정.jpg", "chapters": [{"t": 18.0, "title": "열정은 자아다"}, {"t": 34.5, "title": "출항도 하기 전에"}, {"t": 51.4, "title": "사람을 태워버린다"}, {"t": 75.5, "title": "차가운 냉정"}, {"t": 97.2, "title": "점 하나씩 찍어간 지도"}, {"t": 115.4, "title": "말 뒤로 남긴 것들"}], "notes": [], "script": "열정은 자아입니다.\n자신을 말하고, 자신을 강조하고, 때론 현실을 무시합니다.\n그토록 많은 사회운동가, 디자이너, 정치인, 활동가들이 그것으로 인해 무너졌습니다.\n당신이 들어보지 못한 이름들이 대부분입니다.\n그들은 출항도 하기 전에 가라앉아버렸기 때문일 것입니다.\n제가 말하는 열정은 단순한 관심이 아닙니다.\n그건 폭발입니다.\n억누를 수 없는 추진력.\n수많은 자칭 구루들이 기회라고 부르며 전파했던 그 에너지 같은 거요.\n그 불꽃은 대개 모호하고 야심찬 목표로 향하며, 목표 이전에 사람을 태워버립니다.\n말 그대로 여러분을 태워버립니다.\n소진시킵니다.\n남는 게 뭐죠?\n이것이 열정의 역설입니다.\n열정가들은 모든 것을 원했고, 그러나 한 걸음도 준비하지 못하기도 합니다.\n열정은 때때로 정신을 흐리게 합니다.\n여러분을 정신 차리게 하는 것은 가끔, 아니 대부분 차가운 냉정 아닐까요?\n열정은 종종 현실 감각을 앗아가거든요.\n하지만 냉정한 끈기는 더 많은 변화를 만든다고 저는 믿습니다.\n열정 없이도 불가능한 것은 많지만, 열정만으로 가능한 일은 없을 겁니다.\n우리의 행보는 긴 여정이고, 점 하나씩 찍어간 노력의 지도여야 하기 때문일 겁니다.\n우리는 오늘도 똑같은 함정에 빠집니다.\n열정가들은 이런 말을 좋아합니다.\n가장 큰 변화를 만든 유일한 사람.\n번뜩이는 영감.\n하지만 그들이 말 뒤로 남긴 것들은 무엇인가요?\n", "reflect": {"q": ["내가 지금 쏟는 열정은 무엇으로 전환되고 있는가 — 실력인가, 소진인가?"], "act": null}}, {"ch": "음악", "no": 4, "unit": "곡", "key": "침묵", "title": "오늘날 우리는 너무 많은 말을 합니다", "sub": "침묵과 고통이 진리에 이르는 길 — 시몬 바일", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EC%B9%A8%EB%AC%B5_260917.mp4", "dur": 375, "durstr": "6:14", "thumb": "thumbs/침묵.jpg", "chapters": [{"t": 12.0, "title": "침묵이 사라진 시대"}, {"t": 49.7, "title": "고통을 살아낸 사람"}, {"t": 73.0, "title": "응시란 곧 기다림"}, {"t": 87.8, "title": "말 이전의 공간"}, {"t": 124.3, "title": "고통은 들어가는 것"}, {"t": 165.4, "title": "능동적 무위"}, {"t": 206.5, "title": "진리를 기다릴 인내"}], "notes": [], "script": "하루에도 수천 개의 알림이 울립니다.\n누군가의 푸념, 누군가의 뉴스, 누군가의 웃음소리가 앱 속에서 비처럼 쏟아집니다.\n그 속에서 침묵은 사라졌습니다.\n침묵은 소외되고, 고통은 회피됩니다.\n아프면 약을 먹고, 외로우면 댓글을 달고, 슬프면 팔로워를 소환합니다.\n그러나 고통은 그렇게 간단히 떠나지 않습니다.\n침묵은 지우려 할수록 더 짙게 그림자를 드리웁니다.\n그렇다면 왜 시몬 바일은 침묵과 고통이 진리에 이르는 길이라고 말했을까요.\n왜 그는 말하기보다 기다림의 존재가 되었을까요.\n그 이유는 분명합니다.\n우리가 진리를 몰라서가 아니라, 진리를 감당할 자세를 잃어버렸기 때문입니다.\n시몬 바일은 생각으로만 고통을 이해하지 않았습니다.\n그녀는 고통을 살아냈습니다.\n노동자의 삶을 택했고, 전쟁 난민의 굶주림 속으로 스스로를 던졌습니다.\n그녀는 머물렀습니다.\n그 누구도 원하지 않는 자리에, 그 누구도 되려 하지 않는 존재로.\n철학이 말로만 존재하지 않기 위해, 철학은 몸에 새겨져야 한다는 신념으로 그녀는 자신을 없앴습니다.\n사유는 사랑이며, 사랑은 응시다.\n그녀는 말합니다.\n응시란 곧 기다림입니다.\n침묵 속에서, 외부를 향해 열린 상태로 존재하는 것입니다.\n그녀는 신을 기다렸습니다.\n그러나 그 신은 나타나지 않았습니다.\n그럼에도 그녀는 침묵을 견뎠고, 그것이 곧 진리에 이르는 길이라는 걸 압니다.\n침묵은 단순히 말하지 않음이 아닙니다.\n그것은 말 이전의 공간입니다.\n고요한 응시의 상태입니다.\n시끄러운 주장도, 복잡한 해석도 버리고, 모든 감각을 비워내야 가능한 공명입니다.\n시몬 바일의 침묵은 자아를 없애는 의식입니다.\n내가 사라질 때, 비로소 타인의 고통이 들어옵니다.\n비트겐슈타인은 말할 수 없는 것은 침묵해야 한다고 했습니다.\n바일은 한 발 더 나아갑니다.\n말할 수 없는 것을 응시하고, 기다리라고 말합니다.\n침묵은 비겁한 도피가 아닙니다.\n그것은 사랑입니다.\n판단하지 않고, 해석하지 않고, 존재 자체를 응시하는 사랑입니다.\n고통은 정면으로 마주해야만 의미가 있습니다.\n고통은 피하는 것이 아니라, 들어가는 것입니다.\n바일에게 고통은 인간의 자아를 무너뜨리는 경험이었습니다.\n신체가 아플 때, 정신은 흐려지고, 의지는 무너집니다.\n그 안에서 인간은 나라는 틀을 벗게 됩니다.\n나는 나로부터 해방되고, 존재만이 남습니다.\n그때 진리가 들어옵니다.\n고통은 그 문을 엽니다.\n단, 그것을 받아들일 때만 가능합니다.\n회피하거나 분석하려 들면, 고통은 닫힙니다.\n그것은 몸과 마음이 동시에 열려야 하는 문입니다.\n거기에 머물 수 있는가?\n하지만 오늘의 침묵은 다릅니다.\n현대의 침묵은 종종 억압의 형태입니다.\n누군가는 침묵을 강요당하고, 누군가는 침묵을 팔아 자신을 감춥니다.\n시몬 바일의 침묵은 그런 침묵이 아닙니다.\n그녀의 침묵은 능동적 무위입니다.\n말하지 않음으로써 더 깊이 듣고, 스스로를 사라지게 하면서 타인의 고통을 받아들이는 길입니다.\n그녀에게 침묵은 내면의 극대화였습니다.\n그러나 오늘날 우리는 오히려 외부의 시선에 내면을 맡깁니다.\n우리가 다시 침묵을 선택해야 하는 이유는 진리를 기다릴 자세를 회복하기 위해서입니다.\n고통은 병이 아닙니다.\n침묵은 실패가 아닙니다.\n그 둘은 인간이 진리에 이를 수 있는 거의 유일한 방법입니다.\n인간은 논리로 진리를 획득하지 않습니다.\n인간은 그 앞에서 비워져야만 합니다.\n현대인은 고통을 무능으로 여기고, 침묵을 무의미로 잘못 읽습니다.\n그러나 가장 고요한 고통 속에, 가장 깊은 진리가 숨어 있습니다.\n당신은 진리를 기다릴 인내를 가졌습니까?\n아니면 여전히 즉각적인 해결만을 좇고 있습니까?\n", "reflect": {"q": ["나는 답이 오지 않는 시간을 견딜 수 있는가?"], "act": null}}, {"ch": "음악", "no": 5, "unit": "곡", "key": "죽지않는다", "title": "사람이 죽을 것 같을 때야말로 죽지는 않는다", "sub": "코로나, 필리핀, 디오씨 블루스 — 대장님의 회고", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%A3%BD%EC%A7%80%EC%95%8A%EB%8A%94%EB%8B%A4_260918.mp4", "dur": 314, "durstr": "5:13", "thumb": "thumbs/죽지않는다.jpg", "chapters": [{"t": 25.0, "title": "모든 것이 멈췄다"}, {"t": 73.0, "title": "친구라는 건 없더라"}, {"t": 93.0, "title": "차 안에서 음악을 듣는다"}, {"t": 125.6, "title": "잡상인도 상인이 아닌가"}, {"t": 151.0, "title": "5000원 벌었으니 희망이 있다"}, {"t": 157.7, "title": "지금의 명동이다"}, {"t": 174.2, "title": "한번 또 울고 집으로"}], "notes": [], "script": "코로나는 누구도 예상치 못한 일이었다.\n모든 공사 프로젝트는 갑자기 다 스톱되었다.\n해외는 도로조차 폐쇄되었다.\n모든 것은 스톱되어도 직원들 월급은 나가야 한다.\n나를 존경하고 따른다던 직원들도 월급 한 달만 밀릴 기미가 보이면 고소를 할 수 있다는 것을 실감한다.\n그들이 이해가지 않는 것은 아니었다.\n그들도 지켜야 할 가족이 있으니까.\n가만히 숨만 쉬어도 인건비로만 한 달에 몇 억이 나간다.\n이제 좀 살만하다 생각했는데 왜 내 인생만 이런지 눈물만 나온다.\n다 같이 힘든 상황 같지만 나름 상황이 좋은 놈도 있고 아닌 놈도 있더라.\n힘들어보니 친구라는 건 없더라.\n같이 힘든 놈들만 힘이 된다.\n그리고 가족뿐이다.\n하지만 가족에게 힘들다는 말을 할 수는 없다.\n어쨌든 아침에는 나가야 한다.\n몇천 원이라도 벌어와야 한다.\n퇴근은 오후 2시인데 집에 갈 수는 없다.\n차 안에서 음악을 듣는다.\n조용필의 꿈, 디오씨의 디오씨 블루스, 듣기만 해도 눈물만 난다.\n그래, 그래도 나만 힘든 게 아니지.\n때론 추울 때도 있지, 때론 울지, 그렇게 살지.\n예전에는 거들떠도 안 보던 슈퍼마켓 아줌마에게 15000원짜리 제품 팔려고 갔다가 가격 실수했다고 퇴짜를 맞았다.\n그냥 안 사면 되지, 사기꾼이라느니 잡상인 취급을 할 일은 무엇인가.\n그냥 가려다가 생각해본다.\n잡상인이라는 것은 무엇인가.\n잡상인도 상인이 아닌가.\n다시 가서 정중히 사과를 드리고 5000원에 드리겠다고 했다.\n줘도 안 사신다고 하신다.\n그래도 사정사정해서 팔았다.\n몇천 페소 벌었다.\n와이프에게 줬다.\n슈퍼들을 지나가는데 예전부터 눈여겨 보던 부지가 있다.\n5000원 벌었으니 희망이 있다.\n나중에 저곳을 꼭 확보하여 사업을 해야지 생각한다.\n지금의 명동이다.\n왜 내 인생만 이럴까 싶지만, 디오씨도 그렇다는데 뭐.\n디오씨도 이 앨범에서 이런 과정을 통해서 희대의 명반을 만들어내지 않았던가.\n힙합 정신이 살아있다면 나도 할 수 있는 것이다.\n라고 다짐해보며 한번 또 울고 집으로 간다.\n", "reflect": {"q": ["내 인생의 오천 원 — 지금 내가 붙잡을 수 있는 가장 작은 희망은 무엇인가?"], "act": null}}, {"ch": "음악", "no": 6, "unit": "곡", "key": "아프지말아요", "title": "아픈 것은 대신해 줄 수 없다", "sub": "신해철 〈단 하나의 약속〉 위에 얹은 낭독 — 대신 아파줄 수 없어서 사랑을 안다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EC%95%84%ED%94%84%EC%A7%80%EB%A7%90%EC%95%84%EC%9A%94_260921.mp4", "dur": 258, "durstr": "4:18", "thumb": "thumbs/아프지말아요.jpg", "chapters": [{"t": 25.0, "title": "가사 — 다신 제발 아프지 말아요"}, {"t": 38.2, "title": "아픈 사람을 사랑하는가"}, {"t": 58.4, "title": "식음을 전폐했다"}, {"t": 72.6, "title": "대신 아파줄 수 없으니까"}, {"t": 88.7, "title": "고통의 형태로 알게 하는 사랑"}, {"t": 110.1, "title": "제발 아프지 말아라"}], "notes": [], "script": "다신 제발 아프지 말아요.\n내 소중한 사람아.\n그것만은 대신 해줄 수도 없어.\n아프지 말아요.\n그거면 돼, 난 너만 있으면 돼.\n이 말의 뜻을 이해하는 사람이 많지 않은 것 같다.\n아픈 사람을 사랑하는가.\n사랑하는 사람이 아픈가.\n사랑은 짓궂게도 잊혀진 듯 살다가\n상대방이 아프면 고개를 들기도 한다.\n사랑은 그렇게 얄밉게 개화하는 것처럼 보이는 듯하다.\n사랑하는 사람이 아팠을 때 나는 식음을 전폐했다.\n신해철의 가사 그대로다.\n아픈 것은 내가 대신 해줄 수 없다는 것이 가장 큰 문제라는 말이다.\n노력으로 되지 않는 일이다.\n그래서 아프지만 말아라, 그것만큼은 대신해 줄 수 없다는 말의 의미를 나는 정확히 이해한다.\n내가 노력해도 대신 아파줄 수 없으니까.\n그제서야 우리는 사랑을 안다.\n너무 늦은 것이 아닌가 싶지만.\n신은 가끔 고통의 형태로 사랑을 알게 하지 않나 싶다.\n아픔 없이는 사랑의 의미도 생각하지 못하는 인간들에게 벌이 아닌 선물을 주는 것이다.\n신의 선물로 아픔을 대신해 줄 수 없는 마음을 알게 된 나는 사랑을 그대로 바로 표현한다.\n내가 노력해서 할 수 있는 일은 그것뿐인 것이다.\n그러니 사랑하는 사람이여, 제발 아프지 말아라.\n그것만큼은 내가 대신해 줄 수 없으니까 말이다.\n", "reflect": {"q": ["내가 사랑하는 사람이 아팠을 때, 나는 무엇을 했고 무엇을 못 했는가?", "\"아프지만 말아라\"라는 말을 나는 누구에게 하고 싶은가 — 그 사람에게 실제로 한 적이 있는가?", "고통이 나에게 알려준 사랑이 있다면, 그건 언제였나?"], "act": "오늘 그 사람에게 \"아프지 마\" 한 줄만 문자로 보내기"}}, {"ch": "음악", "no": 7, "unit": "곡", "key": "새벽의여의도", "title": "새벽의 여의도는 차갑다", "sub": "마야 〈나를 외치다〉 위에 얹은 낭독 — 아무도 없는 새벽에 일어나던 날들은 결국 나로 인해 증명되었다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%83%88%EB%B2%BD%EC%9D%98%EC%97%AC%EC%9D%98%EB%8F%84_260921.mp4", "dur": 272, "durstr": "4:31", "thumb": "thumbs/새벽의여의도.jpg", "chapters": [{"t": 15.0, "title": "새벽 기상은 쉬워지지 않았다"}, {"t": 26.9, "title": "왜 아무도 없는 여의도에"}, {"t": 36.5, "title": "나만 힘든 건가"}, {"t": 47.0, "title": "아니 아니, 그건 내가 아니지"}, {"t": 50.2, "title": "나의 길을 가고 있다고"}, {"t": 62.0, "title": "나로 인해 증명되었다"}, {"t": 69.9, "title": "청춘이었다"}], "notes": [], "script": "수백 번 반복했지만 새벽 기상은 그렇게 쉽게 쉬워지지 않았다.\n특히 겨울에 새벽의 여의도는 내가 평생 가질 수 없을 것 같아서 자주 나를 힘들게 했던 기억이 난다.\n남들 놀고 잘 때 왜 새벽에 아무도 없는 여의도에 서 있어야 할까.\n이렇게 산다면 정말 그 끝에 내가 원하는 결과가 있을까.\n나만 힘든 건가?\n남들과 전혀 다른 트랙을 뛰고 있는 내 인생은 어찌 될까.\n눈 딱 감고 모른 척하며 하루나 이틀 쉬어도 누가 뭐라고 안 할 텐데.\n아니 아니, 그건 내가 아니지.\n불안하지 않았다고 하면 거짓말이겠지만\n적어도 나의 길을 가고 있다고 외칠 수 있는 시간들이었다.\n작아 보이지만 그 작은 발걸음은 절대 지워질 수 없는 것이다.\n누가 알아주든 알아주지 않든,\n아무도 없는 새벽에 일어나던 나의 날들은 결국 나로 인해 증명되었다.\n고요했지만 선명했고\n투박했지만 끈질겼던\n청춘이었다.\n지금도 그렇게 나의 길을 가고 있을 뿐.\n", "reflect": {"q": ["남들과 다른 트랙을 뛰고 있다고 느낀 시간이 있었는가 — 그때 나는 무엇을 반복하고 있었나?", "\"하루 이틀 쉬어도 누가 뭐라고 안 할 텐데\" — 요즘 내가 이 말로 넘기고 있는 일은 무엇인가?", "누가 알아주지 않아도 계속했던 나의 작은 발걸음은 무엇이었나? 그것은 지금 어떻게 증명되고 있나?"], "act": "내일 아침, 평소보다 30분 먼저 일어나 아무도 없는 곳에 10분만 서 있어 보기"}}, {"ch": "음악", "no": 8, "unit": "곡", "key": "사랑", "title": "사랑", "sub": "Kevon 〈Love Will Be Waiting〉 위에 얹은 낭독 — 지루함이 클래식이 되는 것, 그것이 세련된 사랑", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%82%AC%EB%9E%91_260922.mp4", "dur": 254, "durstr": "4:14", "thumb": "thumbs/사랑.jpg", "chapters": [{"t": 8.0, "title": "소유가 아니라는 것"}, {"t": 47.2, "title": "사랑은 때때로 지루합니다"}, {"t": 57.2, "title": "바라봐 주는 것"}, {"t": 73.2, "title": "지루함이 클래식이 되는 것"}, {"t": 80.9, "title": "바다의 깊이"}, {"t": 94.8, "title": "한 곳을 함께 바라보는 눈빛"}, {"t": 112.4, "title": "더 큰 사랑이 또 있었구나"}, {"t": 118.8, "title": "나중에서야 그 깊이를"}], "notes": [], "script": "우리가 이성 간에 사랑을 말할 때, / 사랑은 상대방을 소유하는 것이 아니라는 것을 떠올리게 됩니다.\n아니, 상대방을 소유하겠다는 것은 / 사랑이 아니라 집착일 수도 있다는 것입니다.\n내 방식대로 상대방을 사랑하는 것 역시 / 어쩌면 폭력적인 집착일 수 있습니다.\n우리가 영원히 사랑하겠다는 약속을 말할 때, / 결혼식에서든, 어떤 다짐의 순간에서든,\n영원한 사랑은 / 짜릿함과 자극적으로 끌리는 감정만을 뜻하지는 않는다는 것을 / 생각하게 됩니다.\n사랑은 설레고 가슴 뛰는 것만을 말하지 않습니다.\n사랑은 때때로, 어쩌면 자주, / 너무나 지루합니다.\n그런데 그 지루함 안에서 / 이상하리만큼 편안함을 느끼게 됩니다.\n상대방을 바라봐 주는 것.\n그리고 상대방이 / 나를 바라봐 주고 있다는 것을 느끼는 것.\n그것은 그다지 자극적이지 않고, / 표현이 화려하지도 않습니다.\n하지만 그 지루한 일상 속에서 바라보는 눈빛,\n그 지루함이 / 어느새 클래식이 되는 것,\n그것이 오히려 세련된 사랑일 수도 있다는 생각이 듭니다.\n결혼은, / 그리하여 사랑을 이어가는 일이지만,\n바다의 깊이가 어떠한지 / 우리가 다 알 수 없듯,\n사랑 역시 / 우리가 아직 다 알지 못한 더 큰 깊이가 있음을 / 짐작하며 살아가는 일인지도 모릅니다.\n그러다 어느 순간,\n서로를 마주 보던 눈빛이 / 어느 순간에는 / 한 곳을 함께 바라보는 눈빛으로 바뀌게 됩니다.\n자녀를 같이 바라보게 되고, / 서로 마주보던 눈빛은 / 같은 대상을 향하게 됩니다.\n그리고 손을 잡고 걸어갑니다.\n그때 문득 느끼게 되는 것입니다.\n아, / 더 큰 사랑이 또 있었구나.\n사랑은 지루하고 / 지리해 보일 수도 있습니다.\n하지만 그것은 클래식으로 남고,\n우리는 나중에서야 / 그 깊이를 알게 됩니다.\n사랑이란, / 어쩌면 그런 것인지도 모릅니다.\n", "reflect": {"q": ["내 사랑에서 \"지루한 일상 속 눈빛\"이라 부를 만한 순간은 언제였나?", "나는 상대를 사랑하고 있는가, 소유하려 하고 있는가 — 내 방식대로 사랑하는 것이 상대에겐 집착이었던 적은?", "마주 보던 눈빛이 같은 곳을 바라보게 된 순간이 내 삶에 있었나? 그때 무엇을 느꼈나?"], "act": "오늘 저녁, 말없이 같은 곳을 5분만 함께 바라보기 (TV 말고 창밖이나 아이)"}}, {"ch": "음악", "no": 9, "unit": "곡", "key": "매일", "title": "강한 게 아니라, 강해야 했던 사람", "sub": "스윙스 〈매일〉 위에 얹은 평론 낭독 — 현실에선 다물지만 노래에선 해도 돼, 사장의 피로는 없는 게 아니라 풀 곳이 직원이 아닐 뿐", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EB%A7%A4%EC%9D%BC_261001.mp4", "dur": 269, "durstr": "4:28", "thumb": "thumbs/매일.jpg", "chapters": [{"t": 12.0, "title": "돈이 없는 기분 알아? 나는 알아"}, {"t": 42.3, "title": "한 명 한 명 생각해야 해"}, {"t": 68.6, "title": "발리에 가도 문자를 확인해야 한다"}, {"t": 79.6, "title": "회사 운영이 빡세서일걸, 그건 아냐"}, {"t": 99.4, "title": "그래서 제목이 '매일'"}, {"t": 116.3, "title": "강함은 유지해야 하는 역할"}, {"t": 135.6, "title": "그냥 일해야 한다, 그게 답이다"}, {"t": 160.6, "title": "현실에선 다물지만 노래에선 해도 돼"}, {"t": 171.7, "title": "Everyday's a blessing, 동시에 a lesson"}, {"t": 199.3, "title": "나는 이겨낼 거야 → 우린 이겨낼 거야"}, {"t": 220.1, "title": "Upgrade everyday"}], "notes": [], "script": "<강한 게 아니라, 강해야 했던 사람>\n\n“돈이 없는 기분 알아?\n나는 알아.”\n\n이 노래는 여기서 시작합니다.\n\n가난했던 시절 이야기처럼 보이지만\n조금만 더 들어보면\n성공에 대한 노래가 아닙니다.\n\n상황은 달라졌는데도\n계속 버텨야 하는 사람의 이야기입니다.\n\n돈이 없던 시절에는\n여기서 영영 못 빠져나올 것 같은\n막막함이 있었습니다.\n\n매일 안 될 거라는 말이\n메아리처럼\n머릿속에 남습니다.\n\n돈을 벌고,\n회사를 운영하고,\n책임져야 할 사람들이 생기면\n이제 괜찮아질 것 같잖아요?\n\n그런데 다른 문제가 생깁니다.\n\n“한 명 한 명 생각해야 해.\n이게 내 삶이야.”\n\n예전에는\n나 하나만 버티면 됐습니다.\n\n지금은 아닙니다.\n\n성공하면\n책임이 사라지는 게 아니라\n책임의 크기가 더 커집니다.\n\n그런데 바로 뒤에서는\n\n“난 이제 친구가 없어.\n누구도 못 믿어.”\n\n라고 합니다.\n\n사람을 책임져야 하는데\n정작 나는\n누군가에게 기대기 어려운 상태.\n\n발리에 가도\n문자를 확인해야 합니다.\n\n겉에서 보면\n회사가 있고,\n돈도 벌고,\n여행도 다닙니다.\n\n그런데\n그 사람의 하루가\n가벼워진 건 아닙니다.\n\n이 노래에서 제가\n가장 재미있게 본 문장은\n\n“회사 운영이 빡세서일걸.\n그건 아냐.”\n\n입니다.\n\n힘들다고 말하면서도\n바로 자기 핑계를\n자기가 걷어냅니다.\n\n원인을 완벽하게 정리하고\n다시 움직이는 게 아닙니다.\n\n정리가 안 된 상태에서도\n다음 날을 살아갑니다.\n\n그래서 제목이\n‘매일’인 것 같습니다.\n\n한 번 크게 결심하고\n인생이 바뀌는 이야기가 아니라\n\n매일\n자기 자신과 이야기하고,\n\n매일\n내가 한 선택을 돌아보고,\n\n매일\n또다시 강해져야 하는 이야기입니다.\n\n“더 강해져야 해.”\n\n이 말도\n자신감이라기보다\n의무에 가깝게 들립니다.\n\n“동생들은 날 흉내 내\n멘탈을 잡아.”\n\n누군가는\n내가 버티는 모습을\n자기 기준으로 삼고 있습니다.\n\n그러니까 강함은\n이미 가진 성격이 아니라\n계속 유지해야 하는 역할입니다.\n\n이 노래를 들으면서\n예전에 제가 했던 말이\n같이 떠올랐습니다.\n\n이 외로움에\n특별한 방법이 있는 건 아니다.\n\n그냥 일해야 한다.\n그게 답이다.\n\n정신이 아프면\n약을 먹으면 된다.\n그리고 또 일하는 거다.\n\n징징댈 이유도 없고,\n무엇보다 그럴 수가 없다.\n\n직원들은\n그걸 알아주려고\n거기 있는 사람들이 아니다.\n\n그러면\n누구나 다 사장을 하겠지.\n\n그래서 이 한 줄이\n다시 들립니다.\n\n“현실에선 다물지만\n노래에선 해도 돼.”\n\n사장의 피로는\n없는 게 아닙니다.\n\n풀 곳이\n직원이 아닐 뿐입니다.\n\n그리고 후렴.\n\n“Everyday's a blessing.”\n\n동시에\n\n“Everyday's a lesson.”\n\n좋은 하루만\n축복인 게 아닙니다.\n\n실수한 날도,\n내 선택이 틀렸던 날도\n\n다음 날의 나를\n조금 바꾸는 재료가 됩니다.\n\n그래서 업그레이드는\n좋은 일이 생기는 게 아니라\n\n오늘의 선택을 보고,\n틀린 걸 고치고,\n또 하루를 살아내는 과정입니다.\n\n처음에는\n“나는 이겨낼 거야.”\n였는데\n\n마지막에는\n“우린 이겨낼 거야.”\n가 됩니다.\n\n누구도 못 믿겠다던 사람이\n마지막에는\n‘우리’를 말합니다.\n\n모든 외로움이\n해결된 것은 아닙니다.\n\n그런데\n자기 자신을 버티게 하려던 말이\n\n마지막에는\n다른 사람도 같이 쓸 수 있는 말이 됩니다.\n\n완성된 사람의 이야기가 아니라\n\n피곤하고,\n흔들리고,\n외롭고,\n\n그래도\n다음 날 다시 움직이는 사람.\n\nUpgrade everyday.\n", "reflect": {"q": ["요즘 나의 '그건 아냐'는 무엇인가 — 힘든 이유를 말하다가 스스로 거둬들인 핑계가 있는가?", "나는 피로를 어디에 풀고 있는가 — 그 자리가 직원이나 가까운 사람은 아닌가?", "오늘 하루의 lesson은 무엇이었나 — 틀린 선택 하나를 내일 어떻게 고칠 것인가?"], "act": "오늘 '강해야 해서' 해낸 일 하나와, 내일 다시 할 한 가지를 복기칸에"}}, {"ch": "음악", "no": 10, "unit": "곡", "key": "거리조절", "title": "손절이 아니라 거리 조절", "sub": "이문세 〈옛사랑〉 위에 얹은 낭독 — 관계의 해법은 단절이 아니라 거리 조절이다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EA%B1%B0%EB%A6%AC%EC%A1%B0%EC%A0%88_260927.mp4", "dur": 286, "durstr": "4:45", "thumb": "thumbs/거리조절.jpg", "chapters": [{"t": 12.0, "title": "새벽에 음악을 듣고 이 글을 씁니다"}, {"t": 44.4, "title": "사람들은 우리의 거울입니다"}, {"t": 53.6, "title": "흉터는 기억의 증표일 뿐"}, {"t": 64.8, "title": "관계의 해법은 단절이 아니라 거리 조절"}, {"t": 69.8, "title": "그들의 언어는 독이고 웃음은 비수다"}, {"t": 97.6, "title": "모든 관계에는 온도와 거리가 있다"}, {"t": 119.7, "title": "내가 사랑하는 사람을 더 사랑하기 위해"}, {"t": 142.1, "title": "서서히 그리고 품위 있게 멀어지는 것"}, {"t": 157.8, "title": "독설이 더는 나를 무너뜨리지 못한다면"}, {"t": 185.3, "title": "나는 내가 더 사랑할 수 있는 사람에게 물을 준다"}, {"t": 193.3, "title": "아름다운 엇나감, 아름다운 이별"}, {"t": 221.2, "title": "저는 이 자리에서 그때를 기다리겠습니다"}], "notes": [], "script": "저는 새벽에 일어나면 음악을 듣습니다.\n오늘은 아버지가 좋아하시는 이문세의 〈옛사랑〉을 들었습니다.\n그리고 지금 이 글을 씁니다.\n어느덧 창밖으로 솟아오른 햇살이 보입니다.\n그 빛깔은 제 인생의 단상 같기도 합니다.\n인간은 결국 선택의 존재입니다.\n그 선택은 때로는 차갑고, 때로는 부드럽습니다.\n우리 곁의 사람들은 우리의 거울입니다.\n그 거울이 불편하다면, 잘못된 것은 거울이 아니라 우리의 눈금이겠지요.\n저는 과거에 모든 상처를 흉터로 간직했습니다.\n그러나 이제는 압니다.\n흉터는 기억의 증표일 뿐, 영원히 아파할 이유는 없다는 것을 말입니다.\n관계의 해법은 단절이 아니라, 거리 조절에 있는 것입니다.\n열등감에 사로잡힌 사람들은 늘 남을 깎아내립니다.\n그들의 언어는 독이고, 웃음은 비수입니다.\n그러나 사실 그들도 자기 자신을 괴롭히는 존재일 뿐입니다.\n그래서 차라리 그들을 미워하기보다는 이해할 수밖에 없습니다.\n그들의 내면에는 채워지지 못한 결핍이 있었을 것이기 때문입니다.\n관계의 기술은 복잡합니다.\n때로는 천천히 멀어져야 하고, 때로는 단호하게 경계를 그어야 합니다.\n모든 관계에는 온도와 거리가 있는 것 같습니다.\n그 온도와 거리를 조절하는 것을, 우리는 성숙이라 부르는지도 모릅니다.\n살다 보면 내 마음에 드는 사람만 만날 수는 없습니다.\n모든 사람이 나를 좋아할 수도 없는 일입니다.\n그것은 서로의 성격이 달라서가 아니라, 서로를 알아가기엔 시간이 너무 짧기 때문일 수도 있습니다.\n그러니 우리는 누군가가 밉거나 성격이 맞지 않아서가 아니라,\n내가 사랑하는 사람을 조금 더 사랑하기 위해 관계를 정리하기도 합니다.\n만약 어떤 시점에 누군가가 나의 성장을 방해하는 관계라면 정리해야 합니다.\n그러나 그 과정에서 우리는 존엄성을 잃지 않아야 할 것입니다.\n우리는 누군가가 미워서 멀어지는 것은 아닐 것입니다.\n누군가를 무너뜨리는 것이 아니라, 서서히 그리고 품위 있게 멀어지는 것이 더 현명합니다.\n상처받은 여러분께 말씀드리고 싶습니다.\n여러분의 아픔은 결코 헛되지 않습니다.\n그 아픔은 언젠가 힘이 될 수 있을 것입니다.\n누군가의 독설이 더 이상 여러분을 무너뜨리지 못한다면, 이미 여러분은 강해진 것이겠지요.\n모든 관계는 선택입니다.\n그 선택의 책임은 결국 자기 자신에게 있는 것입니다.\n누구와 시간을 보내고, 누구의 말에 귀를 기울일지는 온전히 나의 몫입니다.\n내일의 나는 오늘보다 조금 더 지혜로우면 좋겠습니다.\n내일의 나는 오늘보다 조금 더 너그러워지길 기도합니다.\n나는 내가 더 사랑할 수 있는 사람에게 물을 줍니다.\n어떤 이는 그가 더 사랑할 수 있는 사람에게 물을 주겠지요.\n그것은 '아름다운 엇나감', '아름다운 이별'일 수 있습니다.\n관계에는 승자도 패자도 없습니다.\n우리는 언젠가 만날 수도, 만나지 않을 수도 있습니다.\n다만 너무 뜨겁지도, 너무 멀지도 않게, 흘러가도록 놓아줄 뿐입니다.\n그것이 성장이고 성숙일 것입니다.\n여러분은 지금, 누군가를 그리워하고 있나요?\n아니면 누군가를 미워하고 있나요?\n그리움도, 미움도, 시간이 지나면 결국 같은 자리에 남습니다.\n그리고 또 모르지요.\n언제, 어디서, 어떤 모습으로 다시 만나게 될는지요.\n저는 이 자리에서 그때를 기다리겠습니다.\n", "reflect": {"q": ["지금 내가 정리할까 말까 망설이는 관계는 무엇인가 — 단절이 필요한가, 거리 조절이 필요한가?", "그 사람이 불편한 것은 그 사람 때문인가, 내 눈금 때문인가?", "나는 누구에게 물을 주고 있는가 — 내가 더 사랑할 수 있는 사람인가?"], "act": "멀어지고 싶은 관계 하나를 골라, 끊는 대신 '어느 정도 거리'로 둘지 한 줄로 적어 복기칸에"}}, {"ch": "음악", "no": 11, "unit": "곡", "key": "세개의시간", "title": "세 개의 시간, 하나의 숨결", "sub": "브라운아이드소울 〈그대의 밤, 나의 아침〉 위에 얹은 낭독 — 아직 만나지 못한 당신에게 미리 쓰는 편지", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%84%B8%EA%B0%9C%EC%9D%98%EC%8B%9C%EA%B0%84_260927.mp4", "dur": 271, "durstr": "4:30", "thumb": "thumbs/세개의시간.jpg", "chapters": [{"t": 34.7, "title": "가을이 오면 늘 같은 음악을 듣는다"}, {"t": 57.3, "title": "왜 가을에만 바람이 느껴질까"}, {"t": 68.3, "title": "늘 곁에 있었지만 이제야 보이는 것"}, {"t": 95.4, "title": "1980년대의 나는 어디에 있었을까"}, {"t": 107.3, "title": "신촌은 내 정서적 고향이니까요"}, {"t": 118.9, "title": "우리는 그때 서로를 알아보지 못했다"}, {"t": 131.4, "title": "만나지 못한 당신이 보고 싶습니다"}, {"t": 142.0, "title": "'아직'을 붙이면 그리움은 설렘이 된다"}, {"t": 158.3, "title": "아직 만나지 않은 당신에게 미리 쓰는 편지"}, {"t": 174.6, "title": "당신이 평안하시다면, 저도 안녕합니다"}, {"t": 178.7, "title": "과거의 나, 현재의 나, 미래의 나"}], "notes": [], "script": "당신이 잘 계신다면 잘되었네요.\n나는 잘 지냅니다.\n매번 가을이 오면 가장 처음에 듣는 음악은 늘 같습니다.\n나얼과 브라운아이드 소울의 노래들.\n지난 가을에도, 그 전 가을에도 그랬듯이 말이죠.\n그 곡들이 가을과 참 잘 어울리는 걸 보면, 내게도 이 가을은 그리움으로 시작되고 있나 봅니다.\n이번 가을에 들은 '같은 기억 속의 너'는 왠지 더 깊숙이 다가오는 듯합니다.\n'가을에 바람이 분다'는 말이 오늘따라 새삼스럽게 느껴집니다.\n여름에도 바람은 있었을 텐데, 왜 가을이 되면 우리는 바람의 존재를 더 느끼게 되는 걸까요.\n어쩌면 가을은, 늘 곁에 있었지만 이제야 보이는 것들에 대한 계절일지도 모르겠습니다.\n바람처럼, 잊힌 감정이나 기억들이 다시금 드러나는 것이죠.\n그리고 그 속에서 나는, 그리움과 설렘을 동시에 느끼고 있습니다.\n그러니까 가을은, 내가 항상 존재했던 바람을 이제야 알아채는 것이 못내 얄미운가 봅니다.\n그래서 이렇게 더 힘차게 자신의 존재를 드러내려는 걸까요.\n가끔은 1980년대의 나를 상상해 보기도 합니다.\n그때 나는 어디에 있었을까요?\n세느강변의 어느 벤치에 앉아 있었을까요, 아니면 템즈강을 거닐던 사람이었을까요?\n어쩌면 서울의 신촌, 홍대의 거리에서 마주쳤을지도 모르겠네요.\n지금은 사라진 그 거리의 에너지가 아직도 생생합니다.\n신촌은 내 정서적 고향이니까요.\n하지만 우리는 그때 서로를 알아보지 못했습니다.\n수없이 많은 시간과 공간에서 스쳐 지나갔겠지요.\n당신은 어떤 모습이었을까요?\n그리고 나는 그때 어떤 사람이었을까요?\n이제는 만나지 못한 그 시간이 그립습니다.\n그 시절을 비껴간 당신들이 문득 떠오릅니다.\n만나지 못한 당신이 보고 싶습니다.\n그러나 이 가을, 어딘가 나처럼 그리움을 품고 있을 누군가가 있을 거라 믿습니다.\n만나지 못한 당신들에게 '아직'이라는 말을 붙이면, 그리움은 설렘으로 변합니다.\n그래서 아직 만나지 않은 당신에게 이렇게 미리 편지를 씁니다.\n우리는 언젠가 어디서 만날 겁니다.\n그때가 되면 우리의 만남이 그렇게 어색하지만은 않을 거예요.\n그때쯤이면 당신은 얼마나 자라 있을까요?\n함께 손을 잡고 박물관을 거니는 모습을 상상해 봅니다.\n그날을 기다리며 설레는 가을을 맞이합니다.\n당신이 평안하시다면, 저도 안녕합니다.\n그리고 문득, 미래가 아닌 현재의 당신을 떠올립니다.\n나는 지금 내 곁에 있는 작은 손과 발을 바라봅니다.\n과거의 나, 현재의 나, 그리고 미래의 나.\n나는 이 작은 아이의 숨결 속에서 하나가 됩니다.\n", "reflect": {"q": ["내가 스쳐 지나갔지만 알아보지 못한 사람은 누구였을까 — 지금 곁에 있는 사람 중에도 있지 않은가?", "나는 지금 누구에게 '아직'이라는 말을 붙일 수 있는가?", "과거의 나와 지금의 나 사이에서, 변하지 않은 것 하나는 무엇인가?"], "act": "아직 만나지 못한 누군가에게 미리 쓰는 편지 한 문단을 복기칸에"}}, {"ch": "음악", "no": 12, "unit": "곡", "key": "내려놓음", "title": "내려놓음", "sub": "Commodores 〈Easy〉 위에 얹은 낭독 — 애씀 없이 살기 위해 얼마나 애썼는지, 그 애씀을 못 보는 사람들에게", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EB%82%B4%EB%A0%A4%EB%86%93%EC%9D%8C_260924.mp4", "dur": 257, "durstr": "4:16", "thumb": "thumbs/내려놓음.jpg", "chapters": [{"t": 18.0, "title": "포기와 내려놓음은 같은 말이 아니다"}, {"t": 28.9, "title": "나는 왜 저렇게 살지 못하지"}, {"t": 40.1, "title": "물 흐르듯 살기 위해 얼마나 애썼는지"}, {"t": 51.1, "title": "힘을 빼는 걸 알기까지"}, {"t": 66.9, "title": "자책은 본인을 좀먹을 뿐"}, {"t": 73.5, "title": "당신의 자책이고 시행착오입니다"}, {"t": 93.4, "title": "자책은 사는 데 도움이 안 되더라"}, {"t": 100.2, "title": "나른함도 인생의 한 부분"}], "notes": [], "script": "포기와 내려놓음은\n같은 말이 아닙니다.\n\n포기는\n수동적이고\n어쩔 수 없음입니다.\n\n내려놓음은\n능동적이고\n애씀 없음입니다.\n\n\n가끔 저를 보며\n\n\"나는 왜 저렇게 살지 못하지?\"\n\n라고 자책하는 분들을 봅니다.\n\n\n하지만\n그분들이 못 보는 것이 있습니다.\n\n\n애씀 없이\n물 흐르듯 살기 위해\n\n얼마나 애썼는지.\n\n\n그 애씀 안에서\n\n얼마나 많이\n멈추어 섰는지.\n\n\n능동적이 되려면\n\n힘을 주는 것보다\n힘을 빼는 것이라는 걸 알기 위해\n\n얼마나 힘을 주고\n살아왔는지.\n\n\n겪어야 할 고통은\n\n경험이 되니\n겪어도 좋은 것입니다.\n\n\n하지만\n\n저처럼 하루를 살지 못한다고\n자책하는 것은\n\n본인을\n좀먹을 뿐입니다.\n\n\n저는\n\n당신의 자책입니다.\n\n\n당신의\n시행착오입니다.\n\n\n제가 먼저\n당신의 자책을 해봤고,\n\n제가 먼저\n당신의 시행착오를 겪어봤으니\n\n\n너무 힘주고,\n\n너무 자책하며\n\n살지는 않으셨으면 합니다.\n\n\n살아보니\n\n자책은\n\n사는 데\n별로 도움이 안 되더라고요.\n\n\n가끔은\n\n힘을 빼고,\n\n\n가끔은\n\n아무것도 하지 않고,\n\n\n가끔은\n\n나른함에 취해보는 것도\n\n\n인생의\n한 부분입니다.\n", "reflect": {"q": ["내가 지금 꽉 쥐고 있는 것은 무엇인가 — 그것은 포기해야 할 것인가, 내려놓아야 할 것인가?", "남의 여유를 보며 자책한 적이 있는가? 그 사람이 거기까지 오는 데 든 애씀을 나는 본 적이 있는가?", "내 자책은 나를 어디로 데려갔는가 — 실제로 무엇이 나아졌는가?"], "act": "오늘 하루 중 30분만, 아무것도 하지 않고 가만히 있어 보기"}}, {"ch": "음악", "no": 13, "unit": "곡", "key": "난여전해", "title": "난 여전해", "sub": "The Quiett 〈Stay Alive〉 비트에 얹은 낭독 — 욕망과 소망과 희망을 내어주고 실망과 절망을 받으면, 열망이 생긴다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EB%82%9C%EC%97%AC%EC%A0%84%ED%95%B4_260929.mp4", "dur": 238, "durstr": "3:58", "thumb": "thumbs/난여전해.jpg", "chapters": [{"t": 6.2, "title": "눈이 와도 난 여전히"}, {"t": 28.4, "title": "난 여전하지, 잘 지내"}, {"t": 56.0, "title": "나는 열정 같은 거 없어"}, {"t": 89.0, "title": "니 일부면 니 거고"}, {"t": 111.2, "title": "욕망·소망·희망을 용광로에"}, {"t": 126.5, "title": "실망과 절망을 받으면 열망이"}, {"t": 163.3, "title": "오늘 안 되면 내일 하지 뭐"}, {"t": 181.7, "title": "그게 나여서 괜찮다고"}, {"t": 210.0, "title": "가져가, 내 혼과 열망"}], "notes": [], "script": "눈이 와도 난 여전히.\n비가 와도 난 여전히.\n\n날이 좋아도 꾸준하고,\n날이 안 좋아도 별 생각 없이 계속하고.\n\n기분이 좋아도 적당히 살아있고,\n기분이 안 좋아도 적당히 살아있고.\n\n눈에 띄지 않게 눈 뜨고 있어서\n애들도 다 적응해서 놀라지도 않아.\n\n니들한테 잘 보이려고 이러는 거 아니니 관계없어.\n\n난 나에게만 잘 보이면 되니까.\n나한테는 무척 관심이 있어.\n\n\n너네는 10년 전에 물어봐.\n\n\"야, 어떻게 지내냐?\"\n\n난 여전하지.\n잘 지내.\n\n\n5년 전에도 물어봐.\n\n\"야, 어떻게 지내냐?\"\n\n난 여전하지.\n잘 지내.\n\n\n3년 전에도 또 물어봐.\n\n\"야, 어떻게 지내냐?\"\n\n난 여전하지.\n잘 지내.\n\n\n1년 전에도 또 물어봐.\n\n\"야, 어떻게 지내냐?\"\n\n난 여전하지.\n잘 지내.\n\n\n난 여전하다고.\n\n난 계속\n적당히 뜨겁다고.\n\n\n나에게 '열정'이라는 건\n\n작은 수다나 농담,\n그냥 쓰레기 숏폼 같은 말인데\n\n왜 자꾸 열정, 열정거려.\n\n\n나는 열정 같은 거 없어.\n\n\n니들이 말하는 열정은\n\n성공포르노한테 잠깐 주는\n잔정 같은 거.\n\n그거 원나잇 아니냐?\n\n\n열정에 잔정 줬다가\n하루 자고 나면\n\n며칠이나 가냐?\n\n\n그게 니 거냐,\n아니면 남의 거냐.\n\n\n성공포르노에게 바친\n네 결정 이후에\n\n니 꼴이 그게 뭐야.\n\n\n그게\n네가 진짜 원하는 게 맞아?\n\n\n리바이스 501을 입어도,\n디젤 자탄을 입어도,\n\n그게 니 일부면 니 거고.\n\n남의 거면\n촌스러운 흑역사.\n\n존나 구린 건\n네가 제일 잘 알지.\n\n상식이지, 뭐.\n\n\n너네는 1년 후에\n또 물어보겠지.\n\n\"야, 어떻게 지내냐?\"\n\n\n난 여전하지.\n\n잘 지낸다고.\n\n\n난 여전하다고.\n\n난 계속\n적당히 뜨겁다고.\n\n\n내가 원하는\n\n욕망,\n소망,\n희망.\n\n그걸 싸그리\n용광로에 집어넣고\n\n그냥 계속 가는 거지.\n\n\n욕망과 소망과 희망은\n\n실망과 절망으로\n금방 티가 나지.\n\n\n그래도 뭐.\n\n계속 가는 거지.\n\n\n욕망,\n소망,\n희망을 내어주고\n\n실망과 절망을 받아.\n\n\n그러면\n\n열망이 생긴다고.\n\n\n실망도 절망도 없이\n\n뭐가 되고,\n안 되고를\n\n니가 나보다 잘 알겠냐.\n\n\n난 매일 살아있는 걸\n\n넌 맨날 보게 될 거고.\n\n\n나에게 열망이라는 건\n\n지구가 멸망할 때까지\n\n내 인생의 전부.\n\n\n그래.\n\n대부분의 날들은\n실망이 거의 전부고,\n\n절망도 일부야.\n\n\n뭐 당연한 거야.\n\n그게 뭐 대수냐고.\n\n\n난 계속 할 거라고.\n\n\n너는 계속 물어볼 거고,\n난 계속 할 거고.\n\n너넨 계속 읽을 거고,\n난 계속 쓸 거고.\n\n\n오늘 안 되면 뭐.\n\n내일 하지 뭐.\n\n\n내일 해서 안 되면\n\n모레도 하지 뭐.\n\n\n근데 오늘은\n\n되게 해야지.\n\n\n뭐 안 죽는다고.\n\n\n너네들은\n보고 있어도 안 믿지.\n\n\n그러든 말든\n\n그건 내 사정이 아니고.\n\n\n난 여전히\n이 자리에 남아있지.\n\n\n안 힘드냐고?\n\n\n존나 힘든데.\n\n그게 나여서\n괜찮다고.\n\n\n난 발명했어.\n\n\n낮과 밤과\n뜸과 저뭄은\n\n경계가 없다는 걸.\n\n\n눈이 와도\n\n눈에 안 띄게\n눈을 뜨고.\n\n\n선명하게\n보고 있다고.\n\n\n끝나기 전엔\n끝이 아니니\n\nStay Alive.\n\n\n근데 넌\n\n도대체 언제\n살아있을 건데?\n\n\n뭘 보는 거야.\n\n\n난 10년 후에도\n이곳에 있을 건데.\n\n\n그때 다시 보라고.\n\n\n실망과 절망은\n\n희망이랑\n같다는 걸.\n\n\n그때 니가 볼 미래는\n\n내가 그곳에 있을 때.\n\n\n나를 다 태우고\n\n내가 피로 새겨놓을 곳에.\n\n\n그 자리에\n남겨놓을 테니.\n\n\n가져가.\n\n\n내 혼과 열망.\n", "reflect": {"q": ["누가 물어도 \"난 여전하지\"라고 답할 수 있는 나의 일은 무엇인가 — 10년째 같은 것이 있는가?", "내가 \"열정\"이라 부르며 잠깐 타올랐다 꺼뜨린 것은 무엇이었나? 그건 내 것이었나, 남의 것이었나?", "지금 내 실망과 절망을 열망으로 바꾸려면, 내가 내어줘야 할 욕망·소망·희망은 무엇인가?"], "act": "오늘부터 1년간 똑같이 반복할 아주 작은 일 하나를 정해서, 오늘 첫 번째로 해보기"}}, {"ch": "음악", "no": 14, "unit": "곡", "key": "불침번", "title": "교대 없는 불침번", "sub": "나플라 〈서울〉 비트에 얹은 낭독 — 내가 따뜻한 차에 타기 전에, 아버지는 먼저 차가운 차에 들어가 있었다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EB%B6%88%EC%B9%A8%EB%B2%88_260927.mp4", "dur": 212, "durstr": "3:32", "thumb": "thumbs/불침번.jpg", "chapters": [{"t": 42.1, "title": "20년 전에는 나 대신 자라"}, {"t": 48.6, "title": "지금은 그들이 나 대신 자라"}, {"t": 56.4, "title": "그들 덕분에 깨어 있는 건데"}, {"t": 65.5, "title": "교대 없는 불침번"}, {"t": 78.5, "title": "아버지가 그랬고 할아버지도 그랬고"}, {"t": 85.0, "title": "20분 전에 먼저 일어나서"}, {"t": 99.3, "title": "먼저 추웠던 것"}, {"t": 107.1, "title": "뭐 매번 그런 식이셨던"}], "notes": [], "script": "20년 전에는\n부모님도, 동생도\n나 대신 자라.\n\n그 시간에 내가 깨어 있었는데.\n\n\n지금은\n부모님, 동생, 장모님, 장인어른,\n와이프, 딸, 직원들은\n\n나 대신 자라.\n\n\n그 시간에 내가 대신 깨어 있는 건데.\n\n\n아니지.\n\n그들 덕분에\n내가 명료하게 깨어 있을 수 있는 건데.\n\n\n아니, 이걸 왜 이제야 알게 된 건데.\n\n\n그러니까 살다 보니\n\n남자 인생은,\n내 인생은\n\n교대 없는 불침번.\n\n\n알고 보니\n남들 다 재우고도 잠들지 못해서\n\n차라리 안 자지 매번.\n\n\n그게 누가 시킨 게 아니라\n\n우리 아버지가 그랬고\n할아버지도 그랬고\n나도 그러니까.\n\n\n이렇게 내 사람들을\n사랑으로 지키는 게 당연.\n\n\n내가 어릴 때\n새벽 차가운 자동차를\n경험하지 못했던 건\n\n\n사실 아버지가\n20분 전에 일어나셔서\n히터를 미리 틀어놓으셨던\n\n\n난 그냥 원래 차가 따뜻한 줄 알았고.\n\n\n내가 따뜻한 차에 타기 전에\n아버지는 먼저 차가운 차에 들어가 있었던 것.\n\n\n먼저 일어나고,\n먼저 내려가고,\n먼저 추웠던 것.\n\n\n근데 그런 말은 한 번도 안 하셨고.\n\n\n뭐 매번\n그런 식이셨던 것이었다는 것.\n", "reflect": {"q": ["지금 나 대신 자고 있는 사람은 누구인가 — 나는 누구의 시간을 대신 깨어 있는가?", "내가 당연하게 누려온 것 중에, 누군가가 먼저 추웠기 때문에 따뜻했던 것은 무엇인가?", "나는 그것을 말로 생색낸 적이 있는가, 아니면 말없이 해온 쪽인가?"], "act": "오늘, 누군가를 위해 말없이 20분 먼저 하는 일 하나 만들기"}}, {"ch": "음악", "no": 15, "unit": "곡", "key": "앞만보고", "title": "앞만 보고 가다보니", "sub": "The Quiett 〈My Last Song〉 위에 얹은 낭독 — 나를 믿지 말고, 내 행동을 따라 해본 당신을 믿으십시오", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%95%9E%EB%A7%8C%EB%B3%B4%EA%B3%A0_260922.mp4", "dur": 285, "durstr": "4:45", "thumb": "thumbs/앞만보고.jpg", "chapters": [{"t": 14.0, "title": "이 끝에 뭐가 있는지는 모릅니다"}, {"t": 31.4, "title": "Special One이 되고 싶었습니다"}, {"t": 83.7, "title": "보여주고 증명하고"}, {"t": 105.4, "title": "시간은 속일 수 없다"}, {"t": 150.7, "title": "교대 없는 불침번"}, {"t": 164.4, "title": "나를 믿지 마십시오"}, {"t": 214.2, "title": "그게 자존감입니다"}], "notes": [], "script": "난 오늘도 10년 전, 20년 전의 나처럼 일을 하고 있는데\n보여주고 증명하고, / 보여주고 증명하고\n근데 만족을 몰라\n내 만족의 기준은 니들이 아니라 / 내 자신에게 있기 때문일지도\n그냥 가다 보면 옆에 생기는 거지 / 가족과 딸, 그리고 직원들\n그런 거 챙기는 게 버겁냐고 묻는다면 / 그딴 걸로 버거울 건 없지\n고생도 고통도 고뇌도 / 그게 불행이 되지 않으면 되는 것이고\n고통 고난 고뇌가 불행이 되지 않는 법은 내가 잘 알고 있지 / 그거 말로 표현하는 거 말고\n좀 촌스러워 보이지만 / 난 내 식대로 그냥 행동으로 보여주는 거\n근데 그게 제일 세련된 거더라고\n내가 한 말은 지켜 / 지킬 때까지 절대 항상 버텨\n그래서 지금 내가 교대 없는 불침번마냥 일하고 있는 건데\n남자로서 그런 역할을 하는 것은 / 고통보다는 명예고 축복이야\n나에게 의존은 하지 말고 / 가끔 의지는 하라고\n강한 연대는 서로의 고통을 나누고 / 약한 연대는 오히려 서로의 기쁨만 나누는 거더라고\n나를 믿으라고 하지 않잖아\n나를 믿지 말고 / 나의 행동, 노력을 보고 / 그 행동을 따라 해보는 당신을 믿으라고\n근데 그때쯤 이미 알 거야 / 뭔가 할 수 있다는 감이 스멀스멀 올라오는데\n그때 느껴지는 거, / 그게 자존감\n쫄지 말고. / 하다 보면 다 길이 있다.\n", "reflect": {"q": ["나는 지금 누구의 말을 믿고 있는가 — 그 사람의 말인가, 그 사람의 행동인가?", "10년 전의 나와 지금의 나는 무엇이 같고 무엇이 달라졌는가? 시간이 남긴 내 행동은 무엇인가?", "\"의지\"와 \"의존\"을 나는 구분하고 있는가 — 지금 내가 의존하고 있는 사람·것은 무엇인가?"], "act": "오늘 하루, 남에게 설명하는 말 하나를 줄이고 그 대신 행동 하나를 먼저 해서 보여주기"}}, {"ch": "음악", "no": 16, "unit": "곡", "key": "소중한것", "title": "소중한 것", "sub": "정말 소중한 것은 늘 같은 자리에 있었다", "src": "https://pub-e30602c3de2646f8999fe70d9efe059f.r2.dev/%EA%B0%95%EC%9D%98%EC%8B%A4/%EB%82%AD%EB%8F%85%EC%98%81%EC%83%81_%EC%86%8C%EC%A4%91%ED%95%9C%EA%B2%83_260916.mp4", "dur": 255, "durstr": "4:15", "thumb": "thumbs/소중한것.jpg", "chapters": [{"t": 34.0, "title": "오래전부터 곁에 있던 것들"}, {"t": 56.6, "title": "밖으로 나가는 젊음"}, {"t": 92.5, "title": "잃고 나서야 보이는 크기"}, {"t": 142.6, "title": "무엇을 지울 수 있는가"}, {"t": 185.3, "title": "돈이 알려주지 않는 것"}], "notes": [], "script": "제 경험상, 삶에서 정말 소중한 것은 돈으로 살 수 있는 것보다 이미 오래전부터 제 곁에 있던 것들이었습니다.\n서태지의 테이크 파이브를 들으면 제가 떠올리는 감각을 이해하기 쉬울 것입니다.\n쉽게 얻어지지 않는 어떤 것은 멀리 있는 것이 아니라 늘 같은 자리에서 기다리고 있었을지도 모른다는 감각 말입니다.\n우리가 젊을 때는 계속 밖으로 나갑니다.\n더 큰 돈, 더 큰 성공, 더 좋은 집, 더 유명한 사람, 더 새로운 경험을 찾아다닙니다.\n그 과정 자체가 나쁘다는 이야기는 아닙니다.\n저 역시 그렇게 살아왔습니다.\n그런데 계속 앞으로 가다 보면 멍해지는 순간이 옵니다.\n그토록 힘들게 얻고 싶었던 것 가운데 상당수는 막상 손에 넣으면 금방 익숙해진다는 것입니다.\n집도 그렇고 차도 그렇고 사업의 숫자도 그렇습니다.\n처음에는 인생을 바꿀 것처럼 보이지만 어느 순간 배경이 됩니다.\n반대로 오래 곁에 있었기 때문에 대수롭지 않게 여기던 것은 잃고 나서야 크기가 보입니다.\n가족과 먹는 저녁, 오래된 친구, 건강하게 걸을 수 있는 몸, 아무 일도 없는 평범한 하루, 제가 좋아하는 책을 읽을 수 있는 시간.\n돈으로 어느 정도 보호할 수는 있지만 돈 자체로 만들 수는 없는 것들입니다.\n그래서 저는 삶의 후반으로 갈수록 자유와 소중함이 묘하게 만난다고 생각합니다.\n돈을 버는 이유는 더 많은 것을 하기 위해서만이 아닙니다.\n하지 않아도 될 것을 줄이기 위해서입니다.\n그리고 그렇게 불필요한 것을 하나씩 걷어내고 나면 마지막에 남는 것이 있습니다.\n그것은 대개 새로 얻은 것이 아닙니다.\n오래전부터 같은 자리에 있었는데 제가 너무 바빠서 제대로 보지 못했던 것입니다.\n젊을 때의 성공은 무언가를 추가하는 일이었습니다.\n나이가 들수록 성공은 오히려 무엇을 지울 수 있는가의 문제가 됩니다.\n불필요한 관계를 지우고, 의미 없는 경쟁을 지우고, 남에게 보이기 위한 소비를 지우고, 하지 않아도 될 일을 지웁니다.\n그러고 나면 삶의 윤곽이 선명해집니다.\n노자가 말했던 비움도 어쩌면 그런 것이었을 것입니다.\n아무것도 갖지 말라는 뜻이 아니라, 제가 정말 필요한 것이 무엇인지 알기 위해 나머지를 덜어내라는 것.\n경제적 자유 역시 마찬가지입니다.\n제가 원하는 모든 것을 살 수 있는 상태가 아니라, 원하지 않는 삶을 살지 않아도 되는 상태.\n그리고 그 자유를 얻고 난 뒤에야 조금 늦게 깨닫습니다.\n정작 가장 소중했던 것은 비싼 것이 아니었습니다.\n쉽지 않게 지켜왔고, 너무 오래 같은 자리에 있어서 오히려 그 가치를 잊고 있었던 것들이었습니다.\n돈은 삶을 넓혀줍니다.\n그러나 무엇을 지킬 것인지는 돈이 알려주지 않습니다.\n그건 결국 제가 알아내야 합니다.\n", "reflect": {"q": ["너무 오래 곁에 있어서, 그 값을 잊고 있는 것은 무엇인가?"], "act": null}}];

const P=JSON.parse(localStorage.getItem('prog2')||'{}');
let F='all';
function save(){localStorage.setItem('prog2',JSON.stringify(P))}
function pct(e){const p=P[e.src];if(!p)return 0;if(p.done)return 100;return Math.min(99,Math.round(p.t/e.dur*100))}
function fmt(t){t=Math.round(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function avCls(ch){return ch==='행동주의자'?'chB':(ch==='음악'?'chMu':'chM')}
function setF(f){F=f;renderHome();
  document.querySelectorAll('.side .sitem[data-f]').forEach(el=>el.classList.toggle('on',el.dataset.f===f));
  window.scrollTo(0,0);}
function card(e){
  const p=pct(e);
  return '<div class="card'+(p===100?' done':'')+'" onclick="openEp(\''+e.key+'\')">'
    +'<div class="th"><img loading="lazy" src="'+e.thumb+'"><span class="doneb">수강 완료</span><span class="dur">'+e.durstr+'</span></div>'
    +'<div class="pb"><i style="width:'+p+'%"></i></div>'
    +'<div class="info"><span class="av '+avCls(e.ch)+'">'+e.ch[0]+'</span><div><b>'+e.no+e.unit+' · '+e.title+'</b><small>'+e.ch+' · '+e.sub+'</small></div></div></div>';
}
function shortsRow(list){
  return '<div class="shorts-row">'+list.map((s,i)=>'<div class="short" onclick="openShort('+SHORTS.indexOf(s)+')">'
    +'<div class="sth"><img loading="lazy" src="'+s.thumb+'"></div><b>'+s.title+'</b><small>'+s.ch+'</small></div>').join('')+'</div>';
}
function renderHome(){
  /* 히어로: 이어서 보기 */
  let hero='';
  const lastKey=localStorage.getItem('last');
  let he=DATA.find(e=>e.key===lastKey&&pct(e)>0&&pct(e)<100)||DATA.find(e=>pct(e)>0&&pct(e)<100)||DATA.find(e=>pct(e)===0);
  if(he&&F==='all'){
    const p=pct(he);
    hero='<div class="hero" onclick="openEp(\''+he.key+'\')">'
      +'<div class="hth"><img src="'+he.thumb+'"><span class="pb"><i style="width:'+p+'%"></i></span></div>'
      +'<div class="hin"><span class="hl">'+(p>0?'이어서 보기':'첫 강의 시작하기')+'</span>'
      +'<b>'+he.no+he.unit+' · '+he.title+'</b><small>'+he.ch+' · '+he.sub+(p>0?' · '+p+'% 수강':'')+'</small>'
      +'<button class="hbtn">▶ '+(p>0?'이어서 재생':'재생')+'</button></div></div>';
  }
  document.getElementById('hero').innerHTML=hero;
  /* 본문 */
  let h='';
  if(F==='shorts'){
    h='<h2 class="sec">Shorts<small>'+SHORTS.length+'편</small></h2>'+shortsRow(SHORTS);
  }else{
    let eps=DATA;
    if(F==='행동주의자'||F==='마케팅주의자'||F==='음악')eps=DATA.filter(e=>e.ch===F);
    const chs=[...new Set(eps.map(e=>e.ch))];
    chs.forEach(c=>{
      const list=eps.filter(e=>e.ch===c);
      h+='<h2 class="sec">'+c+'<small>'+list.length+'강</small></h2><div class="grid">'+list.map(card).join('')+'</div>';
    });
    if(!eps.length)h='<div class="empty" style="padding:60px">해당하는 강의가 없습니다</div>';
    if(F==='all'&&SHORTS.length){h+='<h2 class="sec">Shorts<small>'+SHORTS.length+'편</small></h2>'+shortsRow(SHORTS.slice(0,8));}
  }
  document.getElementById('sections').innerHTML=h;
  const done=DATA.filter(e=>pct(e)===100).length;
  document.getElementById('obar').style.width=(done/DATA.length*100)+'%';
  document.getElementById('otext').textContent='전체 '+DATA.length+'강 중 '+done+'강 수료';
}
/* 쇼츠 모달 */
const sv=document.getElementById('sv');
function openShort(i){document.getElementById('smodal').classList.remove('hide');sv.src=SHORTS[i].src;sv.play().catch(()=>{})}
function closeShort(ev){if(ev&&ev.target.id!=='smodal'&&ev.target.className!=='sx')return;sv.pause();sv.src='';document.getElementById('smodal').classList.add('hide')}
/* 시청 */
const player=document.getElementById('player');
let cur=null,chapEls=[];
function renderOthers(){
  document.getElementById('others').innerHTML=DATA.map(e=>{
    const p=pct(e);
    return '<div class="mini'+(cur&&e.key===cur.key?' cur':'')+'" onclick="openEp(\''+e.key+'\')">'
      +'<div class="mth"><img loading="lazy" src="'+e.thumb+'"><span class="dur">'+e.durstr+'</span><span class="pb"><i style="width:'+p+'%"></i></span></div>'
      +'<div class="mi"><b>'+e.no+e.unit+' · '+e.title+'</b><small>'+e.ch+' · '+e.sub+'</small>'+(p===100?'<span class="dn">✓ 수강 완료</span>':'')+'</div></div>';
  }).join('');
}
function openEp(key,push){
  cur=DATA.find(e=>e.key===key);
  if(!cur)return;
  document.getElementById('home').classList.add('hide');
  document.getElementById('watch').classList.remove('hide');
  player.src=cur.src;
  document.getElementById('vtitle').textContent=cur.no+cur.unit+' · '+cur.title;
  document.getElementById('vpen').textContent=cur.sub;
  document.getElementById('vdesc').textContent=cur.ch+' · '+cur.durstr;
  const pc=document.getElementById('paneC');
  pc.innerHTML=cur.chapters.map(c=>'<div class="chap" data-t="'+c.t+'" onclick="player.currentTime='+c.t+';player.play()"><span class="ct">'+fmt(c.t)+'</span><span class="cn">'+c.title+'</span></div>').join('')||'<div class="empty">챕터 정보가 없습니다</div>';
  chapEls=[...pc.querySelectorAll('.chap')];
  document.getElementById('paneN').innerHTML=cur.notes.length?cur.notes.map(n=>'<img loading="lazy" src="'+n+'">').join(''):'<div class="empty">이 강의는 판서 노트가 아직 없습니다</div>';
  document.getElementById('paneS').textContent=cur.script?cur.script.split(String.fromCharCode(10)).filter(x=>x.trim()).join(String.fromCharCode(10,10)):'강의록이 없습니다';
  const rf=document.getElementById('reflect');
  if(cur.reflect){rf.classList.remove('hide');
    document.getElementById('refQ').innerHTML=cur.reflect.q.map(q=>'<li>'+q+'</li>').join('');
    document.getElementById('refA').innerHTML=cur.reflect.act?'오늘의 작은 행동 <span>— '+cur.reflect.act+'</span>':'';
    document.getElementById('refA').style.display=cur.reflect.act?'':'none';
  }else{rf.classList.add('hide');}
  tab('C');renderOthers();renderMemos();
  const p=P[cur.src];
  player.currentTime=(p&&!p.done&&p.t>3&&p.t<cur.dur-5)?p.t:0;
  player.playbackRate=+(localStorage.getItem('rate')||1);renderSpeed();
  player.play().catch(()=>{});
  localStorage.setItem('last',key);window.scrollTo(0,0);
  if(push!==false)history.pushState({key:key},'','#'+encodeURIComponent(key));
}
function goHome(push){player.pause();document.getElementById('watch').classList.add('hide');document.getElementById('home').classList.remove('hide');renderHome();window.scrollTo(0,0);
  if(push!==false)history.pushState(null,'',location.pathname+location.search);}
window.addEventListener('popstate',e=>{const k=e.state&&e.state.key;if(k)openEp(k,false);else goHome(false)});
function tab(t){['C','N','S'].forEach(x=>{document.getElementById('tab'+x).classList.toggle('on',x===t);document.getElementById('pane'+x).classList.toggle('hide',x!==t)})}
function renderSpeed(){
  document.getElementById('speed').innerHTML=[1,1.25,1.5,2].map(r=>'<button class="'+(player.playbackRate===r?'on':'')+'" onclick="setRate('+r+')">'+r+'x</button>').join('');
}
function setRate(r){player.playbackRate=r;localStorage.setItem('rate',r);renderSpeed()}
/* 복기 */
const M=JSON.parse(localStorage.getItem('memo2')||'{}');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function renderMemos(){
  const list=(M[cur.src]||[]);
  document.getElementById('memoList').innerHTML=list.map((m,i)=>
    '<div class="mitem"><span class="mx" onclick="delMemo('+i+')">✕</span><div class="md">'+m.d+'</div><div class="mt">'+esc(m.t)+'</div></div>').reverse().join('');
  document.getElementById('memoIn').value='';
}
function addMemo(){
  const v=document.getElementById('memoIn').value.trim();
  if(!v||!cur)return;
  const now=new Date();
  const d=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  (M[cur.src]=M[cur.src]||[]).push({d:d,t:v});
  localStorage.setItem('memo2',JSON.stringify(M));renderMemos();
}
function delMemo(i){
  if(!confirm('이 복기를 지울까요?'))return;
  M[cur.src].splice(i,1);localStorage.setItem('memo2',JSON.stringify(M));renderMemos();
}
let tick=0;
player.addEventListener('timeupdate',()=>{
  if(!cur)return;
  chapEls.forEach((el,i)=>el.classList.toggle('cur',+el.dataset.t<=player.currentTime&&(chapEls[i+1]?+chapEls[i+1].dataset.t>player.currentTime:true)));
  if(++tick%8===0){P[cur.src]=Object.assign(P[cur.src]||{},{t:player.currentTime});save();}
});
player.addEventListener('ended',()=>{
  if(!cur)return;
  P[cur.src]={t:0,done:1};save();
  const i=DATA.indexOf(cur);
  if(DATA[i+1])openEp(DATA[i+1].key);else goHome();
});
renderHome();
const h0=decodeURIComponent(location.hash.slice(1));
if(h0&&DATA.find(e=>e.key===h0)){openEp(h0,false);history.replaceState({key:h0},'','#'+encodeURIComponent(h0));}
</script></body></html>
