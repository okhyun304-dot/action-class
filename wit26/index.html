<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>대장님 대화술 · 11월 26일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1ede3; --card:#fffdf8; --ink:#1d2a2e; --sub:#5b6a6e; --line:#e3ddcf;
  --acc:#0b5563; --acc-soft:#dcebee; --acc-ink:#ffffff;
  --tip:#a85a08; --tip-soft:#fcefd9; --warn:#9a3412; --warn-soft:#fae8df;
  --ts:#8a969a; --shadow:0 6px 24px rgba(20,40,45,.10); --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --card:#1a2326; --ink:#e7ecec; --sub:#9fb0b4; --line:#2a3639;
    --acc:#6fc3d1; --acc-soft:#1e3a40; --acc-ink:#0c1a1d;
    --tip:#f0b25f; --tip-soft:#33291a; --warn:#f0997a; --warn-soft:#33201a;
    --ts:#78888c; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --card:#1a2326; --ink:#e7ecec; --sub:#9fb0b4; --line:#2a3639;
  --acc:#6fc3d1; --acc-soft:#1e3a40; --acc-ink:#0c1a1d;
  --tip:#f0b25f; --tip-soft:#33291a; --warn:#f0997a; --warn-soft:#33201a;
  --ts:#78888c; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:var(--fs);line-height:1.75;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.cards-app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

/* 목차 */
#home{overflow-y:auto;height:100%;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
.toplinks{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px 4px}
.toplinks a{font-size:13.5px;font-weight:700;text-decoration:none;color:var(--acc);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px}
.hero{padding:18px 4px 20px}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--acc);font-weight:700}
.hero h1{margin:6px 0 8px;font-size:38px;line-height:1.15;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--sub);font-size:15px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:6px 0 14px;padding:14px 16px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:14px;font-weight:700;text-align:left}
.resume small{display:block;font-weight:400;opacity:.85}
.intro{display:block;width:100%;margin:0 0 14px;padding:11px 14px;background:transparent;border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px;text-align:left}
.tile{display:flex;gap:14px;width:100%;margin:0 0 10px;padding:14px 14px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.tile:active{transform:scale(.99)}
.tile .no{flex:0 0 44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:900;font-size:18px}
.tile .tx{min-width:0;flex:1}
.tile b{display:block;font-size:17px;line-height:1.35}
.tile .s{display:block;color:var(--sub);font-size:13.5px;line-height:1.5;margin-top:2px}
.tile .m{display:block;color:var(--ts);font-size:12.5px;margin-top:6px}
.foot{margin:22px 4px 0;color:var(--sub);font-size:13px;line-height:1.7}

/* 본문 */
#deck{display:none;height:100%;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:5;background:var(--bg)}
.bar .back{border:0;background:transparent;padding:8px 10px;border-radius:10px;font-weight:700;color:var(--acc)}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:15px;text-align:center}
.bar .fs,.bar .lstb{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;font-weight:700}
.bar .fs{width:36px}.bar .lstb{padding:0 12px;font-size:13.5px}
.chnav{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:2px 12px 9px}
.chnav button{height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:700;color:var(--acc);padding:0}
.chnav button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.prog{height:3px;background:var(--line);margin:0 12px;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#stage{flex:1;overflow-y:auto;padding:14px 14px 18px;-webkit-overflow-scrolling:touch}
.page{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 18px 8px;box-shadow:var(--shadow)}
.chhead{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.chhead .no{font-size:13px;letter-spacing:.2em;color:var(--acc);font-weight:900}
.chhead h1{margin:6px 0 10px;font-size:28px;line-height:1.3;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.seg{padding:24px 0 26px;border-bottom:1px solid var(--line);scroll-margin-top:8px}
.seg:last-child{border-bottom:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--acc);color:var(--acc-ink);line-height:1}
.badge.k{background:var(--sub)}
.seg h2{margin:2px 0 14px;font-size:20px;line-height:1.45;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.page p{margin:0 0 .95em}
.page p.em{font-weight:700}
.page h4.lb{margin:22px 0 8px;font-size:12.5px;letter-spacing:.1em;color:var(--acc);font-weight:700}
.page h4.lb:first-child{margin-top:0}
.page ul{margin:0 0 1em;padding-left:1.2em}.page li{margin:0 0 .45em}
.page hr{display:none}
.talk{margin:4px 0 16px;padding:12px 14px;background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:4px 14px 14px 4px}
.talk p{margin:0 0 .4em}
.talk p.spk{margin:.7em 0 0;font-size:12.5px;font-weight:700;color:var(--acc)}
.talk p.spk:first-child{margin-top:0}
.talk p.qt{font-weight:500}
p.qt{font-weight:500}
p.spk{font-size:12.5px;font-weight:700;color:var(--acc);margin:.7em 0 0}
.tbl{overflow-x:auto;margin:10px 0 18px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:700;border-bottom:2px solid var(--line);padding:8px 10px}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
td:first-child{font-weight:700;white-space:nowrap}
.howto{padding:12px 14px;border-radius:12px;background:var(--tip-soft);font-size:14.5px;margin:0 0 16px}
.docsub{color:var(--sub)}
.endnav{display:flex;gap:10px;padding:18px 0 12px}
.endnav button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.endnav .nx{flex:1.7;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);padding:8px 12px;line-height:1.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:720px;max-height:78dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 8px 10px;font-size:15px}
.sheet button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:11px 10px;border:0;border-bottom:1px solid var(--line);background:transparent}
.sheet .k{flex:0 0 auto;font-size:11.5px;color:var(--acc);font-weight:700}
.sheet .tt{flex:1;min-width:0;font-size:14.5px;line-height:1.45}
@media (min-width:760px){ body{font-size:17px} }
/* PC: 기술 장은 방송 | 대장님 두 칸 나란히, 목차 카드는 두 줄 */
@media (min-width:1000px){
  .cards-app{max-width:1180px}
  #home{padding-left:28px;padding-right:28px}
  .hero p{max-width:760px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tiles .tile{margin:0}
  .page,.endnav{max-width:800px;margin-left:auto;margin-right:auto;width:100%}
  .page.tech{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:36px;padding:6px 28px 8px}
  .endnav.tech{max-width:none}
  .page.tech>*{grid-column:1/-1}
  .page.tech>.seg.colL{grid-column:1}
  .page.tech>.seg.colR{grid-column:2}
  .page.tech .me{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px}
  .page.tech .me>.top,.page.tech .me>h2,.page.tech .me>p{grid-column:1/-1}
}
.grp{margin:22px 4px 10px;font-size:13px;letter-spacing:.08em;color:var(--sub);font-weight:700}
.grp small{display:block;letter-spacing:0;font-weight:400;font-size:12.5px;margin-top:2px}
.tile .no.sym{font-size:20px}
.talk p b{color:var(--acc);margin-right:6px;font-size:.86em}
.talk p.pun{font-weight:700}
.page .note{font-size:.92em;color:var(--sub)}
.page .src{font-size:12.5px;color:var(--ts);margin:8px 0 0}
.page .src a,.page .lk a{font-weight:700;text-decoration:none}
.page video{display:block;width:100%;max-height:62vh;background:#000;border-radius:14px;margin:4px 0 6px}
.me label{display:block;font-size:13.5px;font-weight:700;color:var(--sub);margin:0 0 10px}
.me textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;line-height:1.5;padding:8px 10px;resize:vertical}
.copyme{display:block;width:100%;margin:14px 0 0;padding:11px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;color:var(--acc)}
.chnav.g8{grid-template-columns:repeat(8,1fr)}
.reveal{display:block;width:100%;margin:10px 0 14px;padding:14px;border:2px dashed var(--acc);background:transparent;border-radius:14px;color:var(--acc);font-weight:700}
.answer[hidden],.reveal[hidden],.pre-msg[hidden]{display:none}
.talk.ans{background:var(--tip-soft);border-left-color:var(--tip)}
.talk.ans p b{color:var(--tip)}
.page h3.ah{margin:6px 0 8px;font-size:16px;font-weight:900}
.pre{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pre-play{border:0;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:8px 14px;font-weight:700}
.pre-t{font-size:12.5px;color:var(--ts)}
.pre-msg{flex-basis:100%;margin:0!important;font-size:13px;font-weight:700;color:var(--acc)}
.stopmsg{margin:0 0 12px!important;padding:8px 10px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-size:13px;font-weight:700}
.stopmsg[hidden]{display:none}
.tvs+.tvs{margin-top:22px;padding-top:16px;border-top:2px dashed var(--line)}
.page h4.tvh{margin:0 0 10px;font-size:15.5px;font-weight:900;color:var(--acc)}

/* 장 바로가기 — 신문 색인 띠 (11/22 사용자 선택) (한 줄, 휴대폰은 옆으로 밀기 / PC는 줄바꿈) */
.chnav.nvA{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 12px;border-bottom:1px solid var(--line)}
.chnav.nvA::-webkit-scrollbar{display:none}
.nvA button{flex:0 0 auto;height:auto;padding:11px 12px 9px;border:0;border-radius:0;background:transparent;color:var(--sub);font-size:14px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;position:relative}
.nvA button+button::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:1px;background:var(--line)}
.nvA .n{color:var(--acc);font-weight:900;margin-right:6px}
.nvA .nm{display:inline-block;max-width:12em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.chnav.nvA button.on{background:transparent;color:var(--ink);font-weight:900;border-color:transparent;border-bottom-color:var(--acc)}
.nvA .gl{flex:0 0 auto;align-self:center;padding:0 10px 0 18px;font-size:11px;letter-spacing:.14em;color:var(--ts);font-weight:700;white-space:nowrap}
.nvA .gl+button::before{display:none}
@media (min-width:1000px){ .chnav.nvA{flex-wrap:wrap;justify-content:center;overflow:visible;max-width:1180px} }
/* 다글로식 실제 음성 (강의실 BMW 화면과 같은 모양) */
.dg{border:1px solid #2a2e34;border-radius:14px;background:#17191d;margin:8px 0 18px;overflow:hidden}
.dg-top{padding:12px 16px 9px;border-bottom:1px solid #2a2e34;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.dg-q{font-size:15px;font-weight:700;color:#e8eaed}
.dg-s{font-size:12.5px;color:#8f96a0}
.dg-body{max-height:min(520px,62vh);overflow-y:auto;padding:4px 0;position:relative}
.dg-turn{display:grid;grid-template-columns:30px 1fr;gap:0 10px;padding:8px 16px 4px}
.dg-av{width:28px;height:28px;border-radius:50%;position:relative;overflow:hidden;display:block}
.dg-av::before{content:"";position:absolute;left:50%;top:24%;width:36%;height:36%;margin-left:-18%;border-radius:50%;background:#fff;opacity:.92}
.dg-av::after{content:"";position:absolute;left:50%;bottom:-22%;width:76%;height:52%;margin-left:-38%;border-radius:50%;background:#fff;opacity:.92}
.dg-who{display:flex;align-items:baseline;gap:8px}
.dg-who b{font-size:13.5px;color:#e8eaed}
.dg-who time{font-size:12px;color:#8f96a0;font-variant-numeric:tabular-nums}
.dg-tx{font-size:15px;line-height:1.7;color:#cfd3d8;word-break:keep-all}
.dg-tx span{cursor:pointer;border-radius:4px}
.dg-tx span:hover{background:#262a30}
.dg-tx span.on{background:#3d3514;color:#fff}
.dg-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #2a2e34;background:#141619}
.dg-play{width:42px;height:42px;border-radius:50%;border:0;background:#7c5cf0;color:#fff;font-size:15px;flex:none}
.dg-seek{position:relative;flex:1;height:24px;cursor:pointer}
.dg-rail{position:absolute;left:0;right:0;top:10px;height:4px;background:#2a2e34;border-radius:2px}
.dg-fill{position:absolute;left:0;top:10px;height:4px;background:#a78bfa;border-radius:2px;width:0}
.dg-t{font-size:12.5px;color:#8f96a0;font-variant-numeric:tabular-nums;min-width:76px;text-align:right}
.dg-sp{border:1px solid #2a2e34;background:none;border-radius:8px;padding:4px 8px;font-size:12.5px;color:#cfd3d8}
.dg-more{border:0;background:none;color:#8f96a0;font-size:12px;padding:0 16px 10px;display:block;text-align:left;width:100%}
.dg.fold .dg-body{display:none}
.dg-back{display:none;width:100%;border:0;border-top:1px solid #2a2e34;background:#1f1b33;color:#cbbcff;font-size:13px;padding:8px}
.dg.free .dg-back{display:block}
.dg.fold .dg-back{display:none!important}


.dg{margin:8px 0 18px}
</style>
</head>
<body>
<div class="cards-app">
  <section id="home"></section>
  <section id="deck">
    <div class="bar">
      <button class="back" id="back">‹ 목차</button>
      <div class="t" id="ttl"></div>
      <button class="fs" id="fs" aria-label="글자 크기">가</button>
      <button class="lstb" id="lst">목록</button>
    </div>
    <nav class="chnav" id="chnav" aria-label="부 바로가기"></nav>
    <div class="prog"><i id="pg"></i></div>
    <main id="stage"></main>
  </section>
</div>
<div class="sheet" id="sheet"><div class="box" id="sbox"></div></div>
<script>
const W = {"parts": [{"key": "t①", "group": "tech", "no": "①", "title": "소리 비틀기", "sub": "비슷한 소리의 다른 말로 받는다.", "meta": "방송 · 나 (대장님 장면 찾는 중)", "lead": "", "segs": [{"id": "t①-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 배울 점이 있는 사람<\/h4><p>소리 비틀기가 가장 세게 터지는 때는 상대가 앞에서 한 말과 지금 한 말이 겹칠 때입니다. 노빠꾸탁재훈에서 게스트가 이상형을 &#x27;배울 점이 있고 존경할 수 있는 사람&#x27;이라고 모범답안을 냅니다. 탁재훈은 먼저 &quot;이거 내가 30년 전에 다 썼던 멘트를 그대로 쓰네.&quot;로 의심을 깔아 두고, 구체적으로 어떤 스타일이냐고 다시 묻습니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/b59b3ab0bd9b.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/05_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_408.mp4\" data-stop=\"22.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>게스트<\/b>배우분으로 따지자면<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 배우를 좋아하네<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>배우를 좋아하네!<\/p><\/div><p>&#x27;배울 점&#x27;과 &#x27;배우&#x27;가 소리로 겹치는 순간을 놓치지 않았습니다. 앞에서 의심을 깔아 둔 덕에, 이 한마디가 모범답안이 거짓이었다는 증거처럼 들립니다. 혼자서는 그냥 말장난인데, 앞뒤 말을 이어 붙이니 논리가 됩니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c2\" target=\"_blank\" rel=\"noopener\">본편 2장 「소리로 받기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 예상 못 한 질문을 받았을 때<\/h4><p>게스트가 탁재훈이 이상형이라고 말해 온 사이라, 멤버들이 탁재훈에게 &#x27;애기야&#x27; 하고 다정하게 불러 보라고 시킨다(02:51~02:56). 탁재훈은 로맨틱한 대화를 못 한다고 빼고, 멤버가 &#x27;형 스타일 있잖아&#x27;라며 평소 말투를 보여 달라고 한다. 모두가 기대한 건 달콤한 대사 한 줄이다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_3g6g9MUyYZ4_1.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_3g6g9MUyYZ4_1.mp4\" data-stop=\"19.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>탁재훈<\/b>저는 이렇게 이게 로맨틱하게 대화를 잘 못 해 가지고<\/p><p><b>멤버<\/b>형 스타일 있잖아<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 우리 연초에 어디 갈까 — 연초나 끊어<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>내 스타일은 뭐 아 우리 연초에 어디 갈까 연초나 끊어<\/p><p><b>게스트<\/b>너무 매력 있어<\/p><\/div><p>평범하게는 어색하게 &#x27;애기야~&#x27;를 해 주거나 끝까지 거절한다. 탁재훈은 요구는 들어주는 척하면서 &#x27;내 스타일&#x27;이라는 핑계로 무뚝뚝한 남자 캐릭터를 보여 줬고, 그 무뚝뚝함이 동음이의어 말장난으로 포장돼 있어 무례하게 들리지 않는다.<\/p><ul><li>하기 싫은 요구는 &#x27;내 스타일은 이래&#x27;라며 1인 2역 상황극으로 바꿔 들어준다<\/li><li>같은 소리 다른 뜻(연초)을 묻고 답하는 두 줄에 나눠 넣으면 말장난이 대화처럼 들린다<\/li><\/ul><p class=\"note\">써도 될 때 — 상대가 나를 좋게 봐 주는 분위기에서 닭살 대사를 강요받을 때, 상대가 장난을 즐기는 사람일 때.<\/p><p class=\"note\">피할 때 — 상대가 진지하게 고백하거나 서운함을 말한 직후. 이때 잔소리 개그는 거절로 들린다.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 에스파<\/h4><p>에이핑크 멤버가 나온 자리에서 걸그룹 이름이 줄줄이 나오다가, 탁재훈 본인의 프로젝트 그룹 이야기로 넘어갑니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/132d8e575202.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/04_%EC%87%BC%EC%B8%A0TOP5_24.mp4\" data-stop=\"19.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>게스트<\/b>근데 에스파에 들어가면 제가 당하지 않을까요?<\/p><p><b>출연자<\/b>아 괜찮아요.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 스파<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>저는 그냥 스파에 들어가선 반신욕 하는 게 낫죠.<\/p><p><b>출연자<\/b>너도 뭐 하나 런치해봐<\/p><p><b>탁재훈<\/b>런지?<\/p><p><b>출연자<\/b>뭘 런칭할까<\/p><p><b>탁재훈<\/b>렌즈나<\/p><p><b>출연자<\/b>어 렌즈 좋다<\/p><\/div><p>&#x27;에스파에 들어간다&#x27;는 그룹에 합류한다는 뜻인데, 앞 글자 하나를 떼면 &#x27;스파에 들어간다&#x27;, 곧 목욕이 됩니다. 여기서 끝나지 않고 그 새 장면을 사실처럼 이어 갑니다. 반신욕을 하는 사람이 되어 &quot;어때요 제 상체?&quot;까지 갑니다. 단어를 바꾸는 것이 1단, 바꾼 장면 안에서 한 번 더 노는 것이 2단입니다. 같은 쇼츠의 마지막 장면은 소리 사슬입니다. 게스트가 자기 브랜드를 1년 준비해 출시했다는 얘기 끝에 누가 탁재훈에게도 하나 해 보라고 합니다. &#x27;런칭&#x27;을 운동 &#x27;런지&#x27;로 한 번 비틀고, 다시 &#x27;렌즈&#x27;로 소리를 이어 실제로 출시할 법한 물건에 착지합니다. 소리 놀이가 마지막엔 말이 되는 상품이 되니 상대도 &quot;렌즈 좋다&quot;고 받아 줍니다. 소리 비틀기는 엉뚱한 데서 끝나면 썰렁하고, 말이 되는 데서 끝나면 박수를 받습니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c2\" target=\"_blank\" rel=\"noopener\">본편 2장 「소리로 받기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/①\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 2개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t①-real", "badge": "현실 · 대장님", "title": "", "html": "<p>11월 26일 녹음에서는 아직 이 기술을 쓴 장면을 찾지 못했습니다.<\/p><p class=\"note\">다음 만남에서 누가 이 기술을 쓰면 아래 「나」 칸에 적어 두세요. 빈칸이 공부 거리입니다.<\/p>", "cls": "colR"}, {"id": "t①-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk①.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk①.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk①.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk①.said", "상대의 직전 말"], ["sk①.mine", "내가 한 말 / 할 수 있었던 말"], ["sk①.next", "다음에 해 볼 것"]]}, {"key": "t②", "group": "tech", "no": "②", "title": "문자 그대로 받기", "sub": "비유나 말 그대로의 뜻을 사실처럼 받는다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t②-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 까치둥지라고 불렸어요<\/h4><p>노빠꾸탁재훈에는 이 기술의 교과서 같은 장면이 있습니다. 게스트가 머리 상태 때문에 별명이 까치둥지였다고 말합니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/c58410e261d2.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/06_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_1578.mp4\" data-stop=\"6.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>게스트<\/b>그래서 저보고 맨날 까치둥지 같은 거 해서 맨들 까치둥지라고 불렀어요.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 여기 새가 앉은 적이 있어요?<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>아 여기 새가 앉은 적이 있어요?<\/p><\/div><p>별명이라는 비유를 사실로 받아서, 그 둥지에 진짜 새가 앉았냐고 묻습니다. 상대 말 속 단어 하나만 쓰기 때문에 듣는 사람이 따로 생각할 필요가 없습니다. 짧고, 바로 그림이 그려지고, 상대를 깎지도 않습니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c2\" target=\"_blank\" rel=\"noopener\">본편 2장 「소리로 받기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 상대가 불편해할 때<\/h4><p>게스트가 외국에 있는 딸에게서 &#x27;생활비가 부족하다&#x27;는 문자를 받았는데 &#x27;너도 나도&#x27;라고 단칼에 거절했다는 이야기를 꺼낸다. 이어 딸과 문자를 주고받을 때 옆에 있던 탁재훈이 답장 내용을 거들었다고 전한다. 즉 탁재훈의 말은 게스트의 회고 속 인용으로 나온다. 딸은 &#x27;예술가의 삶&#x27;을 이유로, 얼마를 보내 달라는지에는 &#x27;저를 사랑하는 만큼&#x27;이라고 답한 상황이다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_3g6g9MUyYZ4_2.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_3g6g9MUyYZ4_2.mp4\" data-stop=\"8.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>게스트<\/b>무슨 생활을 하길래 하니까 예술가의 삶<\/p><p><b>탁재훈(게스트가 전함)<\/b>예술은 늘 배고픈거다<\/p><p><b>게스트<\/b>얼마를 보낼까 했더니 저를 사랑하는 만큼<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 예술은 늘 배고픈 거다 — 사랑하는 만큼 보내라<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈(게스트가 전함)<\/b>그럼 안 보낼 수도 있다 섭섭해하지 마라<\/p><p><b>멤버<\/b>아버님한테 생활비가 부족한 레미콘 회장님께<\/p><p><b>멤버<\/b>너도 나도<\/p><\/div><p>보통 아버지라면 &#x27;얼마 필요하니?&#x27;로 지갑을 연다. 탁재훈은 딸이 고른 단어를 하나도 바꾸지 않고 의미만 뒤집어 그대로 돌려줬다. 상대의 말만 썼기 때문에 반박하기 어렵고, 냉정한 거절인데도 말장난이라 웃으며 받을 수 있다.<\/p><ul><li>상대가 댄 이유를 그대로 돌려 반대 결론의 근거로 쓴다<\/li><li>&#x27;사랑하는 만큼&#x27; 같은 과장 표현은 글자 그대로 재면 0도 될 수 있다<\/li><li>판에서 한 번 웃긴 대사(&#x27;너도 나도&#x27;)는 다른 사람이 다른 대상에게 다시 쓰며 콜백이 된다<\/li><\/ul><p class=\"note\">써도 될 때 — 가족·친구 사이 가벼운 부탁을 놀이처럼 거절할 때, 상대가 애교 섞인 표현을 먼저 썼을 때.<\/p><p class=\"note\">피할 때 — 상대가 정말 어려운 사정을 털어놓았을 때. 단어 뒤집기 거절은 상처가 된다.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 김부각은 언제 먹어요<\/h4><p>분석좌가 가장 강조하는 건 순서입니다. 보통 사람은 뭐라고 받아칠지부터 찾는데, 탁재훈은 의외로 상대의 말을 충분히 듣고 그걸 재료로 씁니다. 화사가 김부각을 좋아한다는 이야기가 나온 장면이 대표적입니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/4836876df85e.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/03_%EB%B6%84%EC%84%9D%EC%A2%8C_462.mp4\" data-stop=\"6.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>김부각을 어느 때 먹어요 그럼?<\/p><p><b>화사<\/b>진짜 배고플 때 밥이랑 김부각만 먹어도 끝나요<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 손에 있는 꼬깔콘은 언제 먹어요<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>지금 그럼 손에 있는 꼬깔콘은 언제 먹어요?<\/p><\/div><p>해설에 따르면 탁재훈은 화사의 길고 뾰족한 손톱을 이미 보고 있었습니다. 그런데 바로 손톱 얘기를 하지 않았습니다. 먼저 상대 이야기(먹는 얘기)에 맞춘 질문을 하나 던져 레일을 깔고, 상대가 대답한 다음에 그 레일을 틀었습니다. 같은 말이라도 처음부터 손톱을 놀렸다면 그냥 외모 지적이었을 겁니다. 먹는 이야기 위에 얹었기 때문에 손톱이 과자가 됐습니다. 분석좌의 결론은 이 한 문장입니다. &quot;즉 위트의 시작은 신박한 드립이 아니라 경청을 통해 먼저 깔려있는 전제를 파악하는 것이죠.&quot;<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c1\" target=\"_blank\" rel=\"noopener\">본편 1장 「위트는 기술이다」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/②\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 11개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t②-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>&quot;기침은 죽였다고?&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>왜 감기를 걸렸는데 왜 와 가지고, 사람들 감기를 퍼뜨리려고 지금.<\/p><p><b>민브로님<\/b>아 근데 이제 제가 약을 좀 먹고 죽여 가지고.<\/p><p><b>대장님<\/b>누굴 죽였어?<\/p><p><b>민브로님<\/b>제가 기침이 많이 죽었어요.<\/p><p class=\"pun\"><b>대장님<\/b>기침은 죽였다고?<\/p><p><b>오키<\/b>왜 죽였어요?<\/p><\/div><div class=\"dgslot\" data-c=\"n16\"><\/div><p class=\"lk\"><a href=\"#n26-scene-12\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ④ 신사 술집<\/h4><p>염라대왕 앞에서도 먹태라면, 일주일 먹어 봐<\/p><div class=\"talk\"><p><b>오키<\/b>자다가 제가 가는데 가다가 갑자기 차에 치여 죽었어요. 염라대왕이 와 가지고, 너는 가장 생각나는 음식이 뭐냐. 먹태일 것 같아요.<\/p><p class=\"pun\"><b>대장님<\/b>진짜루? 내일부터 먹태만 한 일주일 먹어 봐.<\/p><p><b>민브로님<\/b>쌀밥 없이 먹태만 먹었어요, 그럼 인정.<\/p><\/div><div class=\"dgslot\" data-c=\"n12\"><\/div><p class=\"lk\"><a href=\"#n26-scene-11\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t②-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk②.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk②.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk②.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk②.said", "상대의 직전 말"], ["sk②.mine", "내가 한 말 / 할 수 있었던 말"], ["sk②.next", "다음에 해 볼 것"]]}, {"key": "t③", "group": "tech", "no": "③", "title": "단정하고 한 번 더 묻기", "sub": "말하지 않은 빈칸을 엉뚱하게 단정하고, 세부를 하나 더 묻는다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t③-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 이 장면에서<\/h4><p>지침의 대표 예시가 이 장면입니다. 중국어를 하는 게스트와 얘기하는데 누군가 자기도 중국어를 좀 한다고 끼어듭니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/6fec63e506f0.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/11_%EC%87%BC%EC%B8%A0TOP5_1.mp4\" data-stop=\"2.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>저도 사실 중국어를 조금 할 줄 알거든요<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 중국집에 있었어요? 주방이야 홀이야 / 딜러 때인가요? 어느 매장?<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>아 중국집에 있었어요?<\/p><p><b>탁재훈<\/b>주방?<\/p><p><b>탁재훈<\/b>주방이야 홀이야<\/p><p><b>탁재훈<\/b>느낌이 아예 다른데?<\/p><p><b>탁재훈<\/b>이거는 뭐 딜러 때인가요?<\/p><p><b>탁재훈<\/b>자동차 딜러들 어디 계셨어요?<\/p><p><b>탁재훈<\/b>어느 매장에 계신 거예요?<\/p><\/div><p>중국어를 할 줄 안다는 말에서 빠진 빈칸은 &#x27;어디서 배웠나&#x27;입니다. 탁재훈은 그 빈칸을 가장 생활감 있는 장소, 중국집으로 채웠습니다. 그리고 거기서 멈추지 않고 &quot;주방이야 홀이야&quot;로 한 번 더 구체적으로 물어서 단정을 굳힙니다. 같은 쇼츠에 같은 공식이 하나 더 있습니다. 누군가의 옛날 모습을 보며 다들 느낌이 다르다고 하자 이렇게 받습니다. 쇼츠 분석에서 정리한 공식은 &#x27;단정 + 세부 질문&#x27;입니다. 단정만 하면 그냥 놀림인데, 세부 질문을 하나 더 붙이면 상대가 그 설정 안에서 대답해야 하는 처지가 됩니다. 듣는 사람은 그 순간 머릿속에 중국집 주방과 자동차 매장을 그리게 됩니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c3\" target=\"_blank\" rel=\"noopener\">본편 3장 「빈칸 채우기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 상대가 더 세게 받아칠 때<\/h4><p>남편과의 첫 키스 장소를 묻자 이수지가 한강 양화대교라고 답한다. 밤 11시에 다리 조명이 &#x27;5, 4, 3, 2, 1&#x27; 하고 꺼지는 순간이었다는 낭만적인 이야기다. 진행자 쪽에서 의심하는 듯한 반응이 나오자 이수지가 &#x27;사람 자꾸 의심한다&#x27;고 항의한다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_iUvXyK05VDs_3.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_iUvXyK05VDs_3.mp4\" data-stop=\"21.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>이수지<\/b>그게 11시가 되면 불이 꺼져요.<\/p><p><b>이수지<\/b>5 4 3 2 1 꺼져.<\/p><p><b>화자 불명<\/b>아, 불이 켜졌을 때는 못 하겠어 가지고<\/p><p><b>이수지<\/b>여기 안 되겠네. 사람 자꾸 의심하고 이렇게.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 근데 왜 불이 꺼지면 하는 거야?<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>아니, 그니까 왜 불이 꺼지면 하는 거야?<\/p><p><b>이수지<\/b>그러네. 밝을 때 해도 되는데.<\/p><\/div><p>보통은 &#x27;와 로맨틱하다&#x27;고 맞장구칠 이야기다. 탁재훈은 상대가 항의(&#x27;의심한다&#x27;)하는 순간에 물러서지 않고, 오히려 가장 순진한 질문 형태로 의심을 다시 꺼냈다. 공격 내용을 말하지 않고 &#x27;왜?&#x27;만 물으니 상대 스스로 그 의미를 떠올리게 된다.<\/p><ul><li>공격 내용을 말하지 않고 &#x27;왜 꼭 그랬어?&#x27;만 물으면 상대가 스스로 의미를 떠올린다<\/li><li>상대가 &#x27;의심하지 마&#x27;라고 방어하는 순간이 같은 의심을 한 번 더 꺼낼 타이밍이다<\/li><li>한 번 웃긴 디테일(불 꺼짐)은 그 회차 내내 콜백 재료가 된다<\/li><\/ul><p class=\"note\">써도 될 때 — 상대가 낭만적인 이야기를 하면서도 스스로 웃음을 노리는 사람일 때, 외모 농담을 서로 주고받아 온 사이.<\/p><p class=\"note\">피할 때 — 상대가 진심으로 소중한 추억을 이야기하는 자리, 외모 콤플렉스가 있는 상대.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 할아버지 서퍼<\/h4><p>분석좌의 설명을 다시 빌립니다. 우리가 하는 말은 현실 전체를 담지 못합니다. 밥 먹고 왔다는 한마디에도 누구랑, 어디서, 무엇을, 왜가 다 빠져 있습니다. 그는 이 빈칸을 찾는 도구로 육하원칙을 권합니다. 누가, 언제, 어디서, 무엇을, 어떻게, 왜. 하나의 전제에서 여섯 개의 선로가 나온다는 것입니다. 엄정화가 할아버지 서퍼 이야기를 하는 장면이 그 예입니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/e685743cb93e.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/10_%EB%B6%84%EC%84%9D%EC%A2%8C_546.mp4\" data-stop=\"3.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>엄정화<\/b>할아버지들도 이렇게 서퍼 아침에 이제 보드 들고 가서<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 돌아올 때는 보드만 돌아오는 게<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>돌아올 때는 이 보드만 돌아오는 게<\/p><\/div><p>할아버지가 서핑하러 간다는 말은 그대로 받아들이고, 말하지 않은 &#x27;그다음&#x27;, 곧 돌아올 때를 상상했습니다. 분석좌는 이렇게 짚습니다. &quot;탁재훈은 그 비어있는 반대편을 상상해서 농담을 만든 겁니다&quot; 1장의 배당 장면도 같은 구조입니다. 무엇을 할지(내기)는 정해졌는데 어떻게 할지(배당)가 빠져 있었고, 탁재훈은 그 빈칸을 물었습니다. 빈칸을 다루는 방법은 크게 둘입니다. 내가 채워서 단정하는 것, 그리고 상대에게 채우라고 되묻는 것.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c3\" target=\"_blank\" rel=\"noopener\">본편 3장 「빈칸 채우기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/③\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 8개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t③-real", "badge": "현실 · 대장님", "title": "11월 26일 · ② 감자탕집", "html": "<p>여자친구를 데려오면 &quot;인수인계한다고?&quot;<\/p><div class=\"talk\"><p><b>오키<\/b>제가 가장 원하는 장면이, 제가 여자 데려와서 대장님이랑 같이 있는.<\/p><p><b>대장님<\/b>나랑 같이 있으면 안 되는 거 아냐? 여자친구가 나랑 있으면 어떡해.<\/p><p><b>대장님<\/b>인수인계한다고?<\/p><p><b>오키<\/b>그 장면이 계속 상상을 하긴 해요.<\/p><p class=\"pun\"><b>대장님<\/b>뭘 상상하는 거야. 솔직히 변태네 이거.<\/p><\/div><div class=\"dgslot\" data-c=\"n22\"><\/div><p class=\"lk\"><a href=\"#n26-scene-18\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>", "cls": "colR"}, {"id": "t③-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk③.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk③.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk③.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk③.said", "상대의 직전 말"], ["sk③.mine", "내가 한 말 / 할 수 있었던 말"], ["sk③.next", "다음에 해 볼 것"]]}, {"key": "t④", "group": "tech", "no": "④", "title": "되물어 공 넘기기", "sub": "바로 대답하지 않고 가장 구체적인 부분을 되물어 주도권을 가져온다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t④-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 천억 질문: 나를 살리겠어, 죽이겠어?<\/h4><p>곤란한 양자택일에도 되묻기가 통합니다. 미운 우리 새끼에서 한 멤버가 탁재훈에게 이런 질문을 냅니다. 자기가 죽어야 천억이 생긴다면 자기를 살리겠냐 죽이겠냐는 것입니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/1a8f9cebe930.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/14_%EB%AF%B8%EC%9A%B0%EC%83%882022_667.mp4\" data-stop=\"10.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>그러면 나를 살리겠어, 죽이겠어?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 더 살고 싶어?<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>더 살고 싶어?<\/p><p><b>탁재훈<\/b>가서 또 한 번 할 거야. 확인을 할 거야, 정말 진짜 죽었나.<\/p><p><b>탁재훈<\/b>너 살아 있어봐야 또 빚이야.<\/p><\/div><p>질문한 사람은 &#x27;당연히 살리지&#x27;라는 모범답안을 기대했습니다. 탁재훈은 고르지 않고 &quot;더 살고 싶어?&quot;로 질문을 되돌린 뒤, 한술 더 떠 기대와 정반대 쪽으로 갑니다. 친한 사이여서 성립하는 수위입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c3\" target=\"_blank\" rel=\"noopener\">본편 3장 「빈칸 채우기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 불리한 질문을 받았을 때<\/h4><p>장서희가 탁재훈에 대한 소문으로 &#x27;어린 녀석이랑&#x27;을 꺼내 한 번 찌른 뒤, 사실 예전에 필리핀 가족 여행 가는 비행기 안에서 탁재훈을 본 적이 있다며 &#x27;그때 되게 단란하셨어요&#x27;라고 말한다. 탁재훈의 지나간 가족사를 건드릴 수 있는 말이라, 해명하거나 표정이 굳기 쉬운 지점.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_5TwXUxbFsI4_3.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_5TwXUxbFsI4_3.mp4\" data-stop=\"13.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>장서희<\/b>그때 그때 되게 단란하셨어요.<\/p><p><b>탁재훈<\/b>그러니까 기억이 안 나는데 아는 척 했어요?<\/p><p><b>장서희<\/b>아는 척 못 했죠. 왜냐면 굉장히 단란하게 가셔서 저도 남자친구랑 갔죠.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — &#x27;단란하셨어요&#x27; → &#x27;그 남자랑 헤어졌어요?&#x27;<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>그 남자랑 헤어졌어요?<\/p><p><b>장서희<\/b>아 진작에 헤어졌죠.<\/p><p><b>탁재훈<\/b>아 그게 무슨 진짜 오래된 건데 20년?<\/p><\/div><p>보통은 &#x27;아 그때요…&#x27; 하며 사정을 설명하거나 표정이 굳는다. 어느 쪽이든 자기 아픈 데를 스스로 더 드러내게 된다. 탁재훈은 자기 얘기는 한마디도 하지 않고, 상대 문장 끝의 &#x27;남자친구&#x27;를 집어 &#x27;헤어졌어요?&#x27;로 물었다. 서로의 지난 관계라는 같은 처지로 만들어 균형을 맞췄다.<\/p><ul><li>내 아픈 데를 건드리는 말에는 해명하지 말고, 상대 문장 속 상대 자신의 정보를 찾아 같은 질문으로 돌려준다<\/li><li>첫 반응은 시간 벌기, 두 번째에 공 넘기기<\/li><\/ul><p class=\"note\">써도 될 때 — 상대가 내 사적인 과거를 건드리면서 자기 정보도 함께 흘렸을 때.<\/p><p class=\"note\">피할 때 — 상대의 과거 관계가 실제 상처(사별·이혼 직후 등)일 수 있을 때 — 되묻기가 보복처럼 들린다. 상대가 흘리지 않은 정보를 억지로 캐는 것은 무례.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 시청률 5% 질문<\/h4><p>같은 장면을 원래 방송 쪽 대화록으로 다시 보면 흐름이 더 잘 보입니다. 아는 형님에 전학생으로 들어온 날, 멤버가 &quot;우리 학교&quot; 시청률이 5%를 넘겠냐고 묻습니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/c36e03ff241c.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/02_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_113.mp4\" data-stop=\"15.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>어? 그럼 우리 학교 앞으로 시청률 이제 5% 넘나 안 넘나요?<\/p><p><b>멤버<\/b>넘는다에 걸 거야, 안 넘는 다에 걸까요?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 배당이 어떻게 되는데<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>배당 어떻게 되는데?<\/p><p><b>멤버<\/b>안돼!<\/p><p><b>탁재훈<\/b>난 주로 역배 까는 사람이야.<\/p><\/div><p>예측 질문을 내기판으로 바꾸고, 배당과 역배라는 도박판 말을 자기가 먼저 꺼냅니다. 멤버들의 &quot;안돼!&quot;는 선 근처까지 왔다는 신호입니다. 그런데도 판이 깨지지 않는 이유는, 남이 꺼내기 전에 본인이 먼저 꺼냈기 때문입니다. 마지막 &quot;역배&quot;는 시청률이 안 넘는다는 쪽에 건다는 뜻이라, 은근히 프로그램을 놀리는 말이기도 합니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c1\" target=\"_blank\" rel=\"noopener\">본편 1장 「위트는 기술이다」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/④\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 2개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t④-real", "badge": "현실 · 대장님", "title": "11월 26일 · ④ 귀갓길", "html": "<p>&quot;내가 부러워?&quot;<\/p><div class=\"talk\"><p><b>민브로님<\/b>대장님처럼 되면 되게 부러울 것 같습니다.<\/p><p><b>대장님<\/b>내가 부러워?<\/p><p><b>민브로님<\/b>대장님한테 안 쓰고 가족한테 쓴다고 하면.<\/p><p><b>대장님<\/b>그럼 내가 부러운 게 아니라 내 가족이 부러운 거지.<\/p><p class=\"pun\"><b>대장님<\/b>저기 오키님이나 사장님처럼 이렇게 젊은 게 부럽지. 얼마나 재밌어.<\/p><\/div><div class=\"dgslot\" data-c=\"n30\"><\/div><p class=\"lk\"><a href=\"#n26-scene-26\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>", "cls": "colR"}, {"id": "t④-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk④.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk④.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk④.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk④.said", "상대의 직전 말"], ["sk④.mine", "내가 한 말 / 할 수 있었던 말"], ["sk④.next", "다음에 해 볼 것"]]}, {"key": "t⑤", "group": "tech", "no": "⑤", "title": "설정 올라타기", "sub": "상대 말을 사실로 받아 그 설정의 언어로 말한다. 설정을 직접 만들 수도 있다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑤-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 예전 행복으로 돌아가고 싶지 않아?<\/h4><p>설정은 내가 만들 수도 있습니다. 자숙 복귀 회차에서 멤버가 예전의 행복으로 돌아가고 싶지 않냐고 묻습니다. 감성적인 질문입니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/548d1123906e.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/16_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_676.mp4\" data-stop=\"13.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>다시 돌아가고 싶진 않아?<\/p><p><b>탁재훈<\/b>어디를?<\/p><p><b>멤버<\/b>전의 행복으로.<\/p><p><b>탁재훈<\/b>아니, 돌아가기 쉽지는 않아.<\/p><p><b>탁재훈<\/b>잘못 돌아가서 2년 전으로 돌아가면 안 돼.<\/p><p><b>탁재훈<\/b>타임머신 보면 가끔가다 잘못 내리잖아.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 타임머신 잘못 내려서 서초동<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>그냥 잘못 내려서 서초동에 내리면 안 돼?<\/p><\/div><p>&#x27;돌아간다&#x27;를 타임머신으로 받고, 도착지를 잘못 내리는 사고를 상상해 사건 무렵의 법원 동네를 떠올리게 합니다. 아픈 과거를 본인이 먼저, 그것도 공상과학 설정으로 꺼내 버리니 다른 사람이 더 찌를 틈이 없습니다. 이 장면은 6장의 &#x27;먼저 꺼내기&#x27;와도 이어집니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c4\" target=\"_blank\" rel=\"noopener\">본편 4장 「판 위에 올라타기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 여러 사람이 동시에 대화할 때<\/h4><p>신규진이 &#x27;그때 러브라인 있지 않으셨어요?&#x27;라고 묻자 진행진이 &#x27;질투했어?&#x27;라며 판을 키우고, 정보윤은 신규진이 누군지도 몇 살인지도 모른다며 &#x27;40대는 됐을 거 아니요?&#x27;라고 해 신규진이 크게 당한다. &#x27;최악&#x27;, &#x27;긁혔다 긁혔어&#x27;라는 말과 함께 웃음이 터진 직후.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y__pDsHMbnW4Y_4.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y__pDsHMbnW4Y_4.mp4\" data-stop=\"29.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>정보윤<\/b>40대는 됐을 거 아니요?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — &#x27;나는 몇 살 같아요?&#x27; — 동료 대신 다음 타깃으로 나서기<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>나는 좀 몇 살 된 거 같아요?<\/p><p><b>정보윤<\/b>아 근데 대충 아빠랑 비슷한 나이라고 들었는데<\/p><p><b>정보윤<\/b>52.<\/p><p><b>탁재훈<\/b>아, 오늘 기분 좋네.<\/p><\/div><p>보통 진행자는 동료가 당하면 웃고 넘어가거나 게스트를 말린다. 탁재훈은 같은 질문을 자기에게 던지게 해 &#x27;이번엔 반장 차례&#x27;라는 기대를 만들었다. 게스트가 &#x27;아빠랑 비슷한 나이&#x27;라고까지 말해 더 센 공격이 예상됐는데, 정보윤이 52라고 후하게 답해 예상이 뒤집혔다.<\/p><ul><li>동료가 당하면 같은 질문을 나에게 돌려 다음 타깃으로 나선다 — 동료는 빠지고 판은 이어진다<\/li><li>결과가 좋으면 과장된 기쁨으로, 나쁘면 과장된 상처로 — 어느 쪽이든 반응을 크게<\/li><\/ul><p class=\"note\">써도 될 때 — 동료가 집중 공격을 받아 웃음이 정점일 때, 내가 놀림을 받아 줄 여유가 있을 때.<\/p><p class=\"note\">피할 때 — 내가 그 자리의 상급자라 상대가 솔직하게 답하기 어려울 때(답이 아부가 되어 웃음이 사라진다), 상대가 이미 지친 상태일 때.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 술 잘 되세요?<\/h4><p>노빠꾸탁재훈은 탁재훈이 &#x27;반장&#x27;, 신규진이 &#x27;형사&#x27;로 앉아 게스트를 조사하는 경찰서 설정입니다. 탁재훈은 사적인 얘기를 거의 매번 이 설정의 언어로 받습니다. 게스트가 술이 세다는 얘기 끝에 프로필을 읽다가 곧 생일이라고 덧붙입니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/1b1caf43a78c.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/15_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_1449.mp4\" data-stop=\"6.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>술 잘 되세요?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 저 오늘 약속 있습니다 / 곧 생일이에요<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>저 오늘 약속 있습니다.<\/p><p><b>게스트<\/b>곧 생일이에요.<\/p><p><b>탁재훈<\/b>왜 여기서 얘기를 해요? 생일인 거는.<\/p><p><b>탁재훈<\/b>여기는 저 생일 파티하는 데가 아니에요.<\/p><p><b>탁재훈<\/b>경찰서에요, 경찰서.<\/p><\/div><p>축하하는 게 당연한 순간을 조사실 설정으로 차갑게 자르니 기대가 뒤집힙니다. 앞의 &quot;저 오늘 약속 있습니다&quot;도 같은 원리입니다. 아무도 술 마시러 가자고 하지 않았는데 먼저 핑계를 대고 피해서, 상대가 얼마나 술이 센지를 거꾸로 보여 줍니다. 같은 회차에서 노트를 보여 주기 싫다는 게스트에게 &quot;증거 자료로 제출하시겠어요?&quot;라고 한 것도 설정 올라타기입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c4\" target=\"_blank\" rel=\"noopener\">본편 4장 「판 위에 올라타기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑤\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 5개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t⑤-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>먹태는 &quot;우리 헤어집시다&quot;<\/p><div class=\"talk\"><p><b>민브로님<\/b>먹태는 진짜 2차에 먹고 집에 가고 싶을 때. 먹태는 우리 헤어집시다.<\/p><p><b>대장님<\/b>먹태는? 너무 지금 내가 느끼기에는 어떤 느낌이냐면, 나한테 지금 그런 거야. 한 잔 먹고 가자.<\/p><p class=\"pun\"><b>대장님<\/b>사막에 들어갑시다. 모래에다 막 쳐먹어, 열정적으로.<\/p><p><b>민브로님<\/b>한 잔 먹고 집에 가자.<\/p><\/div><div class=\"dgslot\" data-c=\"n02\"><\/div><p class=\"lk\"><a href=\"#n26-scene-2\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ④ 신사 술집<\/h4><p>&quot;충격을 위해서 좋아하는 사람의 마음을 훼손해도 돼요?&quot;<\/p><div class=\"talk\"><p><b>오키<\/b>이 상황에서 김치찌개 나왔으면 이건 기억이 안 남아요. 저는 2026년에 하나를 뽑으라면 이 장면을 뽑을 것 같아요.<\/p><p><b>대장님<\/b>그러면 충격을 위해서 좋아하는 사람의 마음을 훼손해도 돼요? 본인의 충격을 위해서 내 마음을 아프게 해도 돼요?<\/p><p><b>민브로님<\/b>먹태가 상처를.<\/p><p><b>대장님<\/b>상처지. 왜냐면 내 입장에서는 너무나 좋은 자리에 너무 기분 좋고 해서, 김치찌개 딱 먹으면 나는 정말 20년 만에 너무 좋겠다고 생각했는데.<\/p><p class=\"pun\"><b>대장님<\/b>23시예요. 근데 굳이 이 시간에 나한테 먹태를 먹여야 되겠어?<\/p><\/div><div class=\"dgslot\" data-c=\"n10\"><\/div><p class=\"lk\"><a href=\"#n26-scene-9\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t⑤-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑤.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑤.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑤.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑤.said", "상대의 직전 말"], ["sk⑤.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑤.next", "다음에 해 볼 것"]]}, {"key": "t⑥", "group": "tech", "no": "⑥", "title": "끝까지 부풀리기", "sub": "사실로 받은 뒤 한 단계씩 키운다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑥-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 팔이 길어요<\/h4><p>칭찬도 부풀릴 수 있습니다. 미운 우리 새끼에서 체형 비율을 재는데 팔이 길다는 결과가 나옵니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/4b82ade4513a.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/18_%EB%AF%B8%EC%9A%B0%EC%83%882023_24.mp4\" data-stop=\"5.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>팔이 긴, 길어요 다른 분들보다 많이 길어요<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 저기서 오는 전화도 받을 수 있어요<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>저는 여기서 사실 여기서 저기서 전화가 오잖아요 저것도 받을 수 있어요.<\/p><p><b>출연자<\/b>다리는 평균이에요.<\/p><p><b>탁재훈<\/b>길진 않나요?<\/p><\/div><p>측정 결과 한 줄을 만화 같은 그림으로 키웁니다. 바로 다음에 다리가 평균이라는 말에는 두 번이나 되묻는 집착을 보여 대비를 만듭니다. 칭찬받으면 손사래 치지 않고 비현실적인 능력으로 키워 받는 방법입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c4\" target=\"_blank\" rel=\"noopener\">본편 4장 「판 위에 올라타기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 상대가 너무 진지할 때<\/h4><p>&#x27;UDT가 힘드냐 특전사가 힘드냐&#x27;는 질문에 박군이 해군 특수전과 육군 특전사의 차이를 차분하게 설명하고, &#x27;땅이 힘드냐 바다가 힘드냐의 차이, 둘 다 힘들다&#x27;로 정리한다. 앞서 탁재훈은 36개월 복무, 겨울을 네 번 났다는 이야기를 했다(03:46~04:05). 모두가 두 특수부대의 우열을 가리지 않는 모범 답안으로 마무리하는 분위기다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_GBDRGVhfZEI_2.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_GBDRGVhfZEI_2.mp4\" data-stop=\"37.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>udt가 힘듭니까 특전사가 힘듭니까<\/p><p><b>박군<\/b>땅이 힘드냐 바다가 힘드냐 그 차인 거죠<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 둘이 합친 것보다 제가 더 힘들었습니다<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>근데 둘이 합쳐놓은 거보다 제가 더 힘들었습니다<\/p><p><b>박군(추정)<\/b>충분히 이해합니다<\/p><\/div><p>박군의 답이 너무 모범적이어서 판이 닫히려던 순간이다. 평범한 반응은 &#x27;둘 다 대단하다&#x27;는 맞장구인데, 탁재훈은 일반 보병이 특수부대 둘을 더한 것보다 힘들었다고 말해 듣는 사람 모두가 말이 안 된다는 걸 아는 과장을 했다. 앞서 말한 36개월, 겨울 네 번이 근거처럼 깔려 있어 완전히 허풍만은 아닌 척이 된다.<\/p><ul><li>두 항 비교가 끝나는 순간 제3항으로 나를 넣으면 판이 깨진다<\/li><li>말도 안 되는 과장은 앞서 깔아 둔 작은 사실(36개월) 위에 올려야 산다<\/li><li>상대가 정중하게 받아 주면 그걸로 끝내고 더 밀지 않는다<\/li><\/ul><p class=\"note\">써도 될 때 — 진지한 비교 설명이 막 끝나 분위기가 정리될 때, 나이·연차 차이가 커서 과장이 귀엽게 들리는 관계.<\/p><p class=\"note\">피할 때 — 상대가 실제로 고생을 이야기하며 감정이 올라와 있을 때. 고생 경쟁으로 남의 경험을 깎으면 무례가 된다.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 지각은 못 이겨<\/h4><p>두 번째 기술은 상대 말을 사실로 받은 뒤 한 단계씩 키우는 것입니다. 자숙 복귀 회차의 퀴즈 &#x27;내가 가장 잘하는 것&#x27;에서 멤버들이 지각을 외칩니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/3228150a9b15.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/17_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_1473.mp4\" data-stop=\"7.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>지각!<\/p><p><b>멤버<\/b>지각은 못 이겨.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 지각으로 질 것 같으면 아예 안 나와<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>만약에 지각 얘기해서 내가 질 것 같잖아?<\/p><p><b>탁재훈<\/b>그럼 난 그냥 전혀 안 나와.<\/p><\/div><p>지각왕이라는 공격을 부정하지 않고, 지각 대결에서 지면 결석으로 이기겠다고 한 단계 위로 올립니다. 약점이 오히려 아무도 못 이기는 실력처럼 됩니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c4\" target=\"_blank\" rel=\"noopener\">본편 4장 「판 위에 올라타기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑥\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 8개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t⑥-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>&quot;내 20년을 부정당한 느낌&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>내가 진짜 내 20년을 부정당한 느낌이야. 난 진짜 여기서 김치(찌개)를 먹었으면 내가 20대에 느꼈던 그거를 내가 완성할 수 있었는데. 내 20년만 지워 버렸어.<\/p><p><b>오키<\/b>아 근데 이게 어떻게 보면 새로운 시작일 수도 있는 게.<\/p><p><b>대장님<\/b>전혀! 1도 아니야. 알다시피 내가 먹태를 정말 좋아하거든. 와이프가 진짜, 오빠는 미쳤다, 먹태에 미쳤어.<\/p><p class=\"pun\"><b>대장님<\/b>와이프가 뒷모습 사진 찍은 적이 있어. 왜냐면, 오빠 미친 X이다.<\/p><\/div><div class=\"dgslot\" data-c=\"n07\"><\/div><p class=\"lk\"><a href=\"#n26-scene-6\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ② 감자탕집<\/h4><p>서산 인구는 &quot;17명에다 만 명 붙인 거야&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>내가 봤을 때 14명. 한 명 빼고 13명. 이거 한국인 인구조사야.<\/p><p><b>대장님<\/b>4일마다 가자. 4일마다 가서 안 겹치게. 왜냐면 48명이니까.<\/p><p><b>민브로님<\/b>17만 명.<\/p><p class=\"pun\"><b>대장님<\/b>17명 맞죠. 17명에다 만 명 붙인 거야.<\/p><\/div><div class=\"dgslot\" data-c=\"n23\"><\/div><p class=\"lk\"><a href=\"#n26-scene-19\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t⑥-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑥.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑥.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑥.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑥.said", "상대의 직전 말"], ["sk⑥.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑥.next", "다음에 해 볼 것"]]}, {"key": "t⑦", "group": "tech", "no": "⑦", "title": "틀 깨기", "sub": "질문의 전제를 문제 삼거나, 길게 쌓은 논리에 가장 당연한 한 문장을 댄다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑦-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 서울에서 벌고 제주에서 세금 낸다?<\/h4><p>틀 깨기의 가장 짧은 형태는 길게 쌓은 논리에 가장 당연한 한 문장을 대는 것입니다. 제주도에 집을 두고 서울에서 일하는 탁재훈에게 한 출연자가 예능도 지역 주민 우선 채용을 해야 한다며 길게 논리를 폅니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/3009a8bb585a.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/22_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_2139.mp4\" data-stop=\"24.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>아니, 돈은 서울에서 다 벌고 세금은 제주도에서 낸다? 이거는.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 같은 나라잖아요<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>같은 나라잖아요.<\/p><\/div><p>정교하게 쌓은 &#x27;지역 차별&#x27; 논리가 누구도 반박할 수 없는 사실 하나에 무너집니다. 반박하려 들면 말이 길어지는데, 탁재훈은 다섯 글자로 끝냈습니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">본편 5장 「판을 바꾸기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 예상 못 한 질문을 받았을 때<\/h4><p>장서희가 드라마에서 보여 준 블루스·라틴댄스를 즉석에서 탁재훈과 함께 춘 뒤, 탁재훈이 그녀의 춤 선이 &#x27;살랑살랑&#x27;하다며 &#x27;제비들이 다 달라붙겠네&#x27;라고 한다. 장서희는 &#x27;오빠가 막아주실래요?&#x27;로 탁재훈에게 보호자 역할을 맡기는 로맨스 구도를 만든다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_5TwXUxbFsI4_4.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_5TwXUxbFsI4_4.mp4\" data-stop=\"4.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>탁재훈<\/b>제비들이 뭐 다 달라붙겠네.<\/p><p><b>장서희<\/b>오빠가 막아주실래요?<\/p><p><b>탁재훈<\/b>아 제가 제비를 쫓아내라고요?<\/p><p><b>탁재훈<\/b>아 그래요?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — &#x27;오빠가 막아주실래요?&#x27; → &#x27;제가 사실 제비 우두머리인데&#x27;<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>제가 사실 제비 우두머리인데.<\/p><\/div><p>평범한 답은 &#x27;제가 막아 드려야죠&#x27;(수락)나 &#x27;제가 왜요&#x27;(거절)다. 수락은 느끼하고 거절은 무안하다. 탁재훈은 &#x27;쫓아내라고요?&#x27;로 상대 요청을 그대로 확인해 기대를 키운 뒤 정반대 정체를 밝혀 기대를 깼다. 바람둥이 이미지를 스스로 소재로 쓰는 자기 비하라 상대를 깎지 않는다.<\/p><ul><li>보호해 달라는 요청에 &#x27;사실 내가 그 위협의 대장&#x27;으로 답하는 역할 뒤집기<\/li><li>반전 전에 상대 요청을 그대로 되물어 확인하면 기대가 커져 반전이 세진다<\/li><\/ul><p class=\"note\">써도 될 때 — 상대가 장난스럽게 나를 보호자·연인 역할에 세울 때, 내 이미지(바람둥이·허당 등)가 공공연해 자기 비하가 자연스러울 때.<\/p><p class=\"note\">피할 때 — 상대가 실제로 도움을 청하는 진지한 상황, 자기 비하가 상대를 불안하게 만드는 관계(실제 연인·배우자 앞).<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 솔로지옥?<\/h4><p>대장님의 예처럼 질문의 전제를 문제 삼는 기술입니다. 연애 예능 「솔로지옥」 출연자들과 얘기하던 탁재훈이 프로그램 이름부터 걸고넘어집니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/a4ae69716944.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/21_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_1550.mp4\" data-stop=\"4.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>탁재훈<\/b>솔로 지옥?<\/p><p><b>탁재훈<\/b>왜 솔로가 지옥이야?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 솔로가 얼마나 천국인데<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>솔로가 얼마나 천국인데.<\/p><p><b>탁재훈<\/b>너네 둘이 이야기해 봐, 지금 결혼지옥을 겪고 있잖아.<\/p><\/div><p>&#x27;솔로는 지옥&#x27;이라는 이름의 전제를 돌싱의 처지에서 뒤집고, 뒤집은 틀을 바로 옆 부부에게 &#x27;결혼지옥&#x27;으로 넘깁니다. 당연하게 쓰이는 이름이나 구호가 있으면 그거 반대 아니냐로 시작하는 것, 그게 틀 깨기의 기본형입니다. 다만 이 장면에는 뒷이야기가 있습니다. 뒤집은 틀이 곧 탁재훈 자신에게 되돌아오는데, 그 반례는 7장에서 봅니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">본편 5장 「판을 바꾸기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑦\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 8개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t⑦-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>&quot;사장님은 당연히 좋아하지&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>여기서 지금 이 먹태를 좋아하는 사람이 몇 명이 있을까?<\/p><p><b>오키<\/b>일단 좋아하는 사람 더 한 명 있고, 사장님. 사장님 한 명 있어요.<\/p><p><b>대장님<\/b>사장님이 어딨어? 사장님은 같이 먹는 사람이 아니잖아. 사장님은 다 좋아하죠.<\/p><p><b>민브로님<\/b>대장님이 내시긴, 우리 사 주시는 건데.<\/p><p class=\"pun\"><b>대장님<\/b>아, 이러면 내가 안 사 주지.<\/p><\/div><div class=\"dgslot\" data-c=\"n11\"><\/div><p class=\"lk\"><a href=\"#n26-scene-10\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ④ 신사 술집<\/h4><p>&quot;그거 해서 되면 다 하지&quot;<\/p><div class=\"talk\"><p><b>민브로님<\/b>뜨는 거는 정말 어려워요. 그게 실력이 아니에요. 뒤에서 막 로비하고 그런 게 좀.<\/p><p><b>대장님<\/b>근데 그거 해도 될까 말까?<\/p><p class=\"pun\"><b>대장님<\/b>그거 해서 되면 다 하지! 그거 해도 되면 다 그냥 해 가지고. 안 되니까 안 되는 거지.<\/p><\/div><div class=\"dgslot\" data-c=\"n29\"><\/div><p class=\"lk\"><a href=\"#n26-scene-25\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t⑦-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑦.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑦.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑦.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑦.said", "상대의 직전 말"], ["sk⑦.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑦.next", "다음에 해 볼 것"]]}, {"key": "t⑧", "group": "tech", "no": "⑧", "title": "판 밖 재료", "sub": "주어진 선택지 안에 답이 없으면 밖에서 재료를 가져온다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑧-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 네 글자 여자 아이돌?<\/h4><p>대장님이 말한 호롱불이 이것입니다. 주어진 선택지 안에 답이 없으면 선택지 밖을 봅니다. 미운 우리 새끼의 이구동성 게임에서 &#x27;네 글자 여자 아이돌 그룹&#x27;이 제시어로 나오는데 탁재훈은 아는 이름이 없습니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/ae36a905bd7b.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/23_%EB%AF%B8%EC%9A%B0%EC%83%882023_326.mp4\" data-stop=\"33.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>출연자<\/b>네 글자 여자아이돌그룹 … 아 나는 몰라 형 형 그거 있잖아 오마이줄리아<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 오 마이 줄리아 빨리 틀어<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>오마이 줄리아 빨리 틀어.<\/p><\/div><p>아이돌을 대라는 판에서 자기 옛 히트곡을 들고 와 판을 자기 무대로 바꿉니다. 모르는 걸 숨기려고 애쓰는 대신, 내가 가진 재료로 판을 옮겨 버린 것입니다. 회의에서 모르는 주제가 나왔을 때 써먹기 좋은 구조입니다. 예: 최신 도구 얘기가 나오면, 자기는 엑셀 매크로밖에 모르는데 그거라도 보여 드릴까요 하고 판을 옮기는 식입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">본편 5장 「판을 바꾸기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 여러 사람이 동시에 대화할 때<\/h4><p>이상형이 &#x27;댕댕이상&#x27;이라는 정보윤에게 탁재훈이 &#x27;우리 신형사 강아지상 아닙니까?&#x27;라며 신규진을 들이밀자, 정보윤은 &#x27;잘 모르겠어요. 처음 봐요&#x27;라고 답한다. 신규진은 예전에 그녀와 당구 대결을 했던 사이인데, 정보윤은 그때 그 사람이 지금 여기 있는 사람인 줄 몰랐다고 말한다. 신규진은 무안해지고 게스트는 무례해 보일 수 있는 순간.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y__pDsHMbnW4Y_2.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y__pDsHMbnW4Y_2.mp4\" data-stop=\"12.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>탁재훈<\/b>우리 신형사 강아지상 아닙니까?<\/p><p><b>정보윤<\/b>잘 모르겠어요. 처음 봐요.<\/p><p><b>정보윤<\/b>그때 한번 같이 했잖아요. 근데 같은 사람인지 몰랐어요.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 신규진을 몰라본 게스트 — &#x27;눈에는 다 당구공처럼 보이는구나&#x27;<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>진짜 우리 정보윤 선수 눈에는 다 당구공처럼 보이는구나.<\/p><p><b>정보윤<\/b>아, 잘 관심 없는 건 잘 안 보여 가지고.<\/p><\/div><p>보통은 &#x27;아니 어떻게 몰라봐요!&#x27;로 게스트를 나무라거나 신규진을 위로한다. 전자는 게스트를 무례한 사람으로 만들고, 후자는 웃음을 죽인다. 탁재훈은 게스트의 직업을 렌즈로 가져와 그녀의 실수를 &#x27;선수다움&#x27;으로 해석해 주면서도 신규진 놀리기는 살렸다.<\/p><ul><li>상대의 실수를 그 사람의 직업·특기로 설명해 주면 체면을 살리면서 웃음을 남길 수 있다<\/li><li>여럿이 있을 때는 웃음 대상을 받아 줄 수 있는 사람(동료) 쪽으로 모은다<\/li><\/ul><p class=\"note\">써도 될 때 — 게스트의 실수가 동료를 향했고 그 동료가 놀림을 받아 주는 사이일 때, 게스트의 직업·특기가 분명할 때.<\/p><p class=\"note\">피할 때 — 몰라본 대상이 실제로 상처받을 위치(신입·외부인)일 때, 직업 렌즈가 비하로 들릴 때.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 여러 사람이 동시에 대화할 때<\/h4><p>신규진이 만회하려고 양세찬과 나이를 비교해 묻지만 정보윤은 양세찬이 더 어려 보인다고 답하고, 신규진은 &#x27;나 뱀띠야&#x27;라며 나이 힌트를 준다. 정보윤은 띠가 몇 바퀴 돌았냐고 되묻는다. 회차 내내 신규진이 &#x27;복수하겠다&#x27;던 두 사람의 대결 구도의 마지막 판.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y__pDsHMbnW4Y_5.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y__pDsHMbnW4Y_5.mp4\" data-stop=\"14.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>신규진<\/b>나 뱀띠야<\/p><p><b>정보윤<\/b>그럼 몇 바퀴? 두 바퀴?<\/p><p><b>신규진<\/b>한 바퀴지<\/p><p><b>탁재훈<\/b>돌려까는 거 아주 최고네.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 띠 &#x27;두 바퀴&#x27; — &#x27;쿠션을 돌리다 보니까 두 번을 돌려&#x27;<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>쿠션을 돌리다 보니까 두 번을 돌려.<\/p><p><b>탁재훈<\/b>아 이번에 진짜 이기셨네.<\/p><\/div><p>보통은 &#x27;와 너무하다&#x27;로 리액션만 한다. 탁재훈은 게스트의 직업 언어로 그 순간을 중계해, 게스트의 공격을 &#x27;기술 좋은 샷&#x27;으로 칭찬하는 동시에 신규진이 당한 걸 한 번 더 확인시켰다. 마지막에 판정(&#x27;이번에 진짜 이기셨네&#x27;)까지 내려 회차 처음의 &#x27;승부를 걸었다&#x27;는 대결 구도를 닫았다.<\/p><ul><li>둘이 주고받을 때 끼어들어 이기려 하지 말고, 게스트의 직업 언어로 &#x27;중계&#x27;한다<\/li><li>대결은 승패 선언으로 닫아 주면 다음 화제로 깔끔하게 넘어간다<\/li><\/ul><p class=\"note\">써도 될 때 — 두 사람이 장난 대결 구도에 있을 때 제3자로서 중계·판정할 때. 게스트의 직업·취미 언어를 알 때.<\/p><p class=\"note\">피할 때 — 실제 갈등이 있는 두 사람 사이에서 승패를 선언하면 한쪽을 공개적으로 망신 주게 된다.<\/p><\/div><\/div>", "cls": "colL"}, {"id": "t⑧-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>먹태는 국화꽃<\/p><div class=\"talk\"><p><b>민브로님<\/b>근데 이건 마지막이라고. 지금 마지막.<\/p><p><b>대장님<\/b>그러니까 이걸 먹자는 얘기는 국화꽃 같은 거야. 우리가 국화꽃 선물해 줄 때 기분 나쁘죠 보통. 그때 그거는 우리가 이별이잖아. 국화꽃을 지금 준 거야. 우리 지금 놀고 있는데, 야 여러분 끝냅시다.<\/p><p class=\"pun\"><b>대장님<\/b>꺼지라는 말이거든. 그 꽃말이야.<\/p><\/div><div class=\"dgslot\" data-c=\"n06\"><\/div><p class=\"lk\"><a href=\"#n26-scene-5\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ② 감자탕집<\/h4><p>나를 지루하게 만든 여자는 &quot;미국 같은 거야&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>나를 지루하게 만든 여자들 있잖아. 그 여자들이 좋은 거 아니야? 미국 같은 거야.<\/p><p><b>대장님<\/b>미국이란 든든한 게 있어서 지금 우리가 편안한 거잖아.<\/p><p class=\"pun\"><b>대장님<\/b>막 전시작전권을 줘. 미국 빠지면 어떡해. 난리 나죠.<\/p><\/div><div class=\"dgslot\" data-c=\"n20\"><\/div><p class=\"lk\"><a href=\"#n26-scene-16\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t⑧-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑧.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑧.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑧.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑧.said", "상대의 직전 말"], ["sk⑧.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑧.next", "다음에 해 볼 것"]]}, {"key": "t⑨", "group": "tech", "no": "⑨", "title": "같은 틀로 돌려주기", "sub": "상대가 쓴 문장의 틀을 그대로 써서 되돌려 준다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑨-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 나와 달라 해서 나왔지<\/h4><p>상대가 쓴 문장의 틀을 그대로 써서 되돌려 주는 기술입니다. 노빠꾸탁재훈에서 조사할 게 없으니 가도 된다는데 게스트가 일어나지 않고 생색을 냅니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/27ee2734fe96.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/24_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_2562.mp4\" data-stop=\"12.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>게스트<\/b>하도 나와달라 나와달라고 해서 나왔지.<\/p><p><b>탁재훈<\/b>나와달라나와달라?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 지금은 가 달라 하는데 왜 앉아 있어요? / 뭐 마누랍니까?<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>지금은 제발 가달라 가달라고 하는데 왜 앉아있는 거예요?<\/p><\/div><p>&#x27;나와 달라 해서 나왔다&#x27;는 리듬을 그대로 써서 &#x27;가 달라 하는데 왜 안 가냐&#x27;로 돌려줍니다. 같은 리듬이라 듣는 사람이 바로 알아챕니다. 상대가 생색내며 쓴 문장은 그 자체가 반격의 재료입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">본편 5장 「판을 바꾸기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 칭찬받았을 때<\/h4><p>바비킴 창법을 &#x27;국과수 분석&#x27;처럼 따지며 진행진이 번갈아 모창하던 중, 신규진이 &#x27;반장님 노래 같은 경우는&#x27;이라며 탁재훈에게 화제를 돌린다. 탁재훈이 자기 노래는 &#x27;지르는 거&#x27;라고 낮추자, 회차 내내 놀림만 받던 바비킴이 진지하게 칭찬한다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_QH5A0QCGqbs_3.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_QH5A0QCGqbs_3.mp4\" data-stop=\"5.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>신규진<\/b>어 그러면 반장님 노래 같은 경우는 이제<\/p><p><b>탁재훈<\/b>완전 저는 지르는 거라<\/p><p><b>바비킴<\/b>아니요 노래 잘 하세요<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — &#x27;노래 잘 하세요&#x27;를 &#x27;당신 노래 부르면 기분 좋아요&#x27;로<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>아니 뭐 그런 제가 그런 얘기 듣자고 하는 게 아니라 저는 바비킴 노래를 항상 어디 가면 부르는데 그 노래 부르면 참 기분이 좋아져요.<\/p><p><b>탁재훈<\/b>마지막 히트곡이 뭐죠?<\/p><\/div><p>보통은 &#x27;아이 아니에요&#x27;로 겸손하게 끝내거나 그냥 웃는다. 탁재훈은 칭찬을 낚은 것처럼 보이는 상황을 스스로 짚어 웃음을 만들고, 칭찬을 놀림받던 상대에게 되돌려 회차 내내 깎이던 바비킴의 체면을 세웠다. 이어 &#x27;마지막 히트곡이 뭐죠?&#x27;로 그 노래를 함께 부르는 판으로 연결했다.<\/p><ul><li>칭찬받으면 겸손으로 끝내지 말고, 구체적인 행동으로 칭찬을 돌려준다<\/li><li>놀림이 많았던 상대일수록 칭찬 한 번이 관계를 회복시킨다 — 그리고 바로 함께 할 행동으로 연결한다<\/li><\/ul><p class=\"note\">써도 될 때 — 놀림이 많이 오간 상대가 뜻밖에 칭찬했을 때, 모임 후반에 관계를 다독일 필요가 있을 때.<\/p><p class=\"note\">피할 때 — 역칭찬에 근거가 없어 빈말로 들릴 때 — &#x27;어디 가면 부른다&#x27;처럼 구체적인 행동이 있어야 진심으로 들린다.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 내가 형 재기시켜 줄게<\/h4><p>공격을 돌려줄 때도 같습니다. 자숙 복귀 회차의 퀴즈 &#x27;상민이가 나한테 했던 말&#x27;에서 한 멤버가 이런 오답을 냅니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/c688763896f0.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/25_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_903.mp4\" data-stop=\"15.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>형, 내가 형 재기시켜줄게.<\/p><p><b>멤버<\/b>에이 그런 건 아니지.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 지 몸도 못 추스르면서 나를 재기시켜?<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>쟤도 제대로 지 몸도 못 치더만 나를 무슨 재기를 시켜주냐고.<\/p><\/div><p>&#x27;재기시켜 준다&#x27;는 말에는 &#x27;내가 너보다 위&#x27;라는 전제가 숨어 있습니다. 탁재훈은 그 전제를 찔러, 도와주겠다는 사람이 더 어려운 처지라는 역전을 만듭니다. 질문에 반박하지 않고 질문 속 인물의 처지를 돌려준 것입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c5\" target=\"_blank\" rel=\"noopener\">본편 5장 「판을 바꾸기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑨\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 4개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t⑨-real", "badge": "현실 · 대장님", "title": "11월 26일 · ④ 신사 술집", "html": "<p>&#x27;좋아하는 사람&#x27;을 그대로 돌려주기<\/p><div class=\"talk\"><p><b>오키<\/b>지금 제가 정말 존경하는 대장님이랑, 정말 좋아하는 해량님이랑, 민브로님이 있는데 여기서.<\/p><p><b>대장님<\/b>그리고 좋아하는 사람을 지금 말살시킨 거잖아.<\/p><p class=\"pun\"><b>대장님<\/b>좋아하는 사람이 가장 싫어하는 걸 시켰잖아요. 그러면은 내가 슬프고. 날 좋아한대. 왜 좋아하는 사람을 슬프게 해?<\/p><\/div><div class=\"dgslot\" data-c=\"n09\"><\/div><p class=\"lk\"><a href=\"#n26-scene-8\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>", "cls": "colR"}, {"id": "t⑨-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑨.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑨.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑨.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑨.said", "상대의 직전 말"], ["sk⑨.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑨.next", "다음에 해 볼 것"]]}, {"key": "t⑩", "group": "tech", "no": "⑩", "title": "먼저 인정하고 더 나가기", "sub": "약점을 부정하지 않고 그 전제 안으로 더 들어간다.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑩-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 혹시 자숙고 아이가?<\/h4><p>이 기술을 공부하기에 가장 좋은 재료가 도박 사건 자숙을 마치고 아는 형님에 전학생으로 돌아온 회차입니다. 멤버들은 자숙, 지각, 도박, 이혼을 쉬지 않고 찌르고, 탁재훈은 거의 한 번도 부정하지 않습니다. 입장하자마자 첫 공격이 날아옵니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/7e257b31a31b.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/26_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_55.mp4\" data-stop=\"14.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>혹시 그 자숙고 아이가, 자숙꼬?<\/p><p><b>멤버<\/b>말해봐라!<\/p><p><b>탁재훈<\/b>내가 다니는 학교 어떻게 알았지?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 자숙고에서 3년 꿇고 전학 온 탁재훈이야<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>자숙코에서 3년 꿇고 사고 치고 전학 온 탁재훈이야. 반가워.<\/p><\/div><p>&#x27;자숙고&#x27;라는 놀림을 진짜 학교 이름으로 받아, 유급하고 사고 치고 전학 온 학생의 자기소개로 완성합니다. 공격 재료가 그대로 명함이 되니 더 공격할 거리가 사라집니다. 바로 뒤에는 그 단어를 선배의 조언으로 바꿔 되돌려줍니다. &quot;그리고 너무 잘 될 때일수록 너무 흥분하지 말고&quot; / &quot;더 자숙하라고.&quot; 이어서 함께 전학 온 후배에게 &quot;근데 나는 뭐 사고 쳐서 왔지만 넌 뭐 쳐 서 왔냐?&quot;라고 물어 화살을 옆으로 옮깁니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c6\" target=\"_blank\" rel=\"noopener\">본편 6장 「맞고도 이기기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 상대가 더 세게 받아칠 때<\/h4><p>음악의 신 2 섭외를 두고 탁재훈과 이상민이 &#x27;누가 누구를 넣어 줬나&#x27;로 다투던 중, 탁재훈이 &#x27;이상민이 가까스로 들어왔다&#x27;고 하자 멤버가 &#x27;가까스로 들어왔는데 형은 많이 안 나오던데, 녹화 많이 안 했잖아&#x27;라고 탁재훈을 되찌른다. 자기가 던진 &#x27;가까스로&#x27;가 바로 자기에게 돌아온 상황이다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_KPLVEyZwbho_6.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_KPLVEyZwbho_6.mp4\" data-stop=\"7.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>아니 가까스로 들어왔는데 형 많이 안 나오던데 거기 녹화 녹화 많이 안 했잖아 형<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 너 질문하지 마<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>너 질문하지 마<\/p><p><b>탁재훈(추정)<\/b>어떤 땐 나 웃는 장면만 나올 때도 있어<\/p><p><b>멤버<\/b>오늘은 어떨 거 같아<\/p><\/div><p>되치기를 당하면 보통 &#x27;아니 그건 편집이…&#x27;처럼 해명하다 더 작아진다. 탁재훈은 해명을 포기하고 차단으로 웃음을 한 번 받고, 인정으로 한 번 더 받았다. 다만 이것만으로 주도권을 되찾은 건 아니고, 바로 뒤 &#x27;오늘은 주인공인데 잔챙이 이수근밖에 없다&#x27;(기존 원고 &#x27;잔챙이&#x27; 장면)로 화살을 옮기며 회복한다.<\/p><ul><li>내 말이 되돌아오면 해명하지 말고 짧게 막은 뒤 더 처량하게 인정한다<\/li><li>차단·인정만으로는 수비일 뿐이다. 다음 한 수로 화살을 다른 사람에게 옮겨야 주도권이 돌아온다<\/li><\/ul><p class=\"note\">써도 될 때 — 내 말이 그대로 되돌아와 반박할 말이 없을 때, 상대가 놀리는 강도일 때.<\/p><p class=\"note\">피할 때 — 업무 피드백이나 진지한 지적일 때 &#x27;질문하지 마&#x27;는 그냥 회피다.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 3시간 늦을 줄 알았는데<\/h4><p>인정하되 틀을 바꾸는 방법도 있습니다. 상습 지각으로 유명했던 탁재훈이 그날은 일찍 왔습니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/9cb150a85c8e.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/27_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_181.mp4\" data-stop=\"13.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>멤버<\/b>분명한 3시간 늦게 오겠구나 했는데<\/p><p><b>멤버<\/b>너무 일찍 온 거야<\/p><p><b>멤버<\/b>왜 그래 요새?<\/p><p><b>탁재훈<\/b>요즘 누가 늦게 오니?<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 옛날에는 그게 유행이었어<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>옛날에는 그게 유행이었어<\/p><p><b>멤버<\/b>늦춰오는 거?<\/p><p><b>탁재훈<\/b>내가 유행에 되게 민감하거든.<\/p><\/div><p>지각을 부정하지 않고 &#x27;그 시절 유행&#x27;으로 재분류합니다. 성격 결함이 시대 탓이 되고, 본인은 유행에 민감한 사람으로 오히려 올라갑니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c6\" target=\"_blank\" rel=\"noopener\">본편 6장 「맞고도 이기기」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑩\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 10개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t⑩-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ② 감자탕집<\/h4><p>&quot;세뇌당한 거지&quot; → &quot;가스라이팅&quot;<\/p><div class=\"talk\"><p><b>민브로님<\/b>그렇게 믿을 수가 있을까?<\/p><p><b>대장님<\/b>나한테 세뇌당한 거지. 내가 계속 세뇌를 시킨 거지.<\/p><p><b>민브로님<\/b>요즘 말로는 가스라이팅.<\/p><p class=\"pun\"><b>대장님<\/b>그렇지. 요즘 말론. 넌 나랑 이미 결혼해야겠다. 결론은 내가 내 버렸기 때문에 다른 선택지가 없네.<\/p><\/div><div class=\"dgslot\" data-c=\"n21\"><\/div><p class=\"lk\"><a href=\"#n26-scene-17\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ③ 통닭집<\/h4><p>&quot;나? 지금? 럭셔리가 플로우인데&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>나는 더콰이엇이 럭셔리 플로우라는 말을 지은 게 되게 좋다고 생각해.<\/p><p><b>대장님<\/b>플로우를 이제는 절박하게 못 해. 그냥 자기가 뱉는 게 럭셔리하다.<\/p><p><b>대장님<\/b>나한테 지금 2020년 블로그 왜 안 써 이러면, 나? 지금? 나? 지금 럭셔리가 플로우인데.<\/p><p class=\"pun\"><b>대장님<\/b>옛날처럼 못 해. 나한테 요구하지 말고 내 거 즐겨.<\/p><\/div><div class=\"dgslot\" data-c=\"n27\"><\/div><p class=\"lk\"><a href=\"#n26-scene-23\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t⑩-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑩.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑩.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑩.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑩.said", "상대의 직전 말"], ["sk⑩.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑩.next", "다음에 해 볼 것"]]}, {"key": "t⑪", "group": "tech", "no": "⑪", "title": "온도 조절 · 줄 길이", "sub": "차가우면 데우고 뜨거우면 식힌다. 강아지 줄처럼 너무 짧지도 길지도 않게.", "meta": "방송 · 대장님 녹음 · 나", "lead": "", "segs": [{"id": "t⑪-tv", "badge": "방송 · 탁재훈", "title": "탁재훈 장면 3개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 너무 다크하죠?<\/h4><p>노빠꾸탁재훈에서는 놀린 뒤 상대가 진짜 기죽었을 때 내려오는 장면이 있습니다. 게스트가 자기 분위기가 너무 어둡지 않냐고 걱정합니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/1a26ec8bffc5.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/33_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_871.mp4\" data-stop=\"10.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>게스트<\/b>근데 저 지금 너무 다크하죠<\/p><p><b>탁재훈<\/b>계속하세요 그렇게 조회수 안 나오려면<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 꼴찌일 거 같은데<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>내가 보기엔 지금까지 꼴찌일 거 같은데<\/p><p><b>게스트<\/b>꼴찌라는 말이 좀 슬프다<\/p><p><b>탁재훈<\/b>시행착오라고 생각하셔도 돼요<\/p><p><b>탁재훈<\/b>노빠꾸 대세는 지장이 없으니까 편하게 하세요.<\/p><\/div><p>걱정에 맞장구치는 척 &#x27;꼴찌&#x27;까지 세게 갔다가, 상대가 슬프다고 하자 바로 &#x27;시행착오&#x27;로 내려옵니다. 마지막 말은 위로이면서 &#x27;너 하나로 우리 채널 안 망한다&#x27;는 농담이기도 합니다. 위로 안에 장난을 하나 남겨 분위기를 유지한 것입니다. 줄을 당겼다가 상대가 아파하는 순간 바로 늦춘 셈입니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c7\" target=\"_blank\" rel=\"noopener\">본편 7장 「줄 길이」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 처음 만난 사람과 대화할 때<\/h4><p>장서희가 탁재훈이 젊은 게스트만 좋아해서 자기를 구박할까 봐 걱정했다고 털어놓는다. 탁재훈이 &#x27;그럼 어떻게 했으면 좋겠어요 제가?&#x27;라고 묻자 &#x27;그냥 가만히 있었으면&#x27;, &#x27;아니면 웃겨 주세요&#x27;라고 받아친다. 긴장했느냐는 질문에 &#x27;조금요&#x27;, 이유로 &#x27;말빨을 못 이기니까&#x27;라고 한다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/y_5TwXUxbFsI4_2.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/y_5TwXUxbFsI4_2.mp4\" data-stop=\"4.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>장서희<\/b>그냥 가만히 있었으면 좋겠어요.<\/p><p><b>탁재훈<\/b>아니 가만히 있으면 이게 조사가 이루어지질 않는데 어떻게 가만히 있어요.<\/p><p><b>장서희<\/b>아니면 웃겨주세요 재밌게.<\/p><p><b>탁재훈<\/b>내가 좀 이렇게 일방적으로 나한테 좀 뭐라고 할까봐?<\/p><p><b>장서희<\/b>제가 말빨을 못 이기니까.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — &#x27;말빨을 못 이겨서요&#x27; → &#x27;또박또박 말대꾸도 잘 하시고&#x27;<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>아 그런 건 아니에요. 지금 말씀 잘 하시는 거 같은데요. 또박또박 말대꾸도 잘 하시고.<\/p><\/div><p>긴장한 상대에게 보통 하는 &#x27;편하게 하세요&#x27;는 상대를 정말 약자로 대하는 말이 된다. 탁재훈은 칭찬과 놀림을 한 문장에 섞어 &#x27;당신은 이미 충분히 세다&#x27;는 메시지를 줬다. 위로만 했으면 밋밋하고, 놀림만 했으면 그녀가 걱정한 바로 그 &#x27;구박&#x27;이 됐을 것이다.<\/p><ul><li>긴장했다는 상대에게 &#x27;방금 당신이 한 말&#x27;을 증거로 칭찬 반 놀림 반을 건넨다<\/li><li>칭찬을 먼저, 놀림을 뒤에 — 순서가 바뀌면 구박이 된다<\/li><\/ul><p class=\"note\">써도 될 때 — 상대가 긴장했다며 자기를 낮추지만 실제로는 말을 잘하고 있을 때(증거가 눈앞에 있을 때).<\/p><p class=\"note\">피할 때 — 상대가 정말로 위축되어 말을 못 하는 상황 — 그때 &#x27;말대꾸 잘한다&#x27;는 비꼼으로 들린다.<\/p><\/div><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 3 · 나 때문에 이혼한 거 아닌가<\/h4><p>김보성이 20년 전 탁재훈 결혼식에 5만 원만 냈던 게 마음에 걸렸다며 축의금을 마저 주겠다고 봉투와 선물을 꺼냅니다. 이혼까지 자기 탓 같았다고까지 합니다.<\/p><video controls playsinline preload=\"none\" poster=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/img/c44769088438.jpg\" src=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/영상/31_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_1713.mp4\" data-stop=\"46.7\"><\/video><p class=\"stopmsg\" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.<\/p><div class=\"talk\"><p><b>김보성<\/b>그런데 약간 왠지 나 때문에 내가 5만 원 해서 이혼한 거 아닌가.<\/p><p><b>탁재훈<\/b>형은 책임이 아니에요.<\/p><\/div><button class=\"reveal\">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기<\/button><div class=\"answer\" hidden><h3 class=\"ah\">탁재훈의 답 — 손편지면 나 형 안 볼 거예요<\/h3><div class=\"talk ans\"><p class=\"pun\"><b>탁재훈<\/b>이거 형, 만약에 손편지면 나 형 안 볼 거예요.<\/p><p><b>김보성<\/b>손편지는 아니야.<\/p><p><b>탁재훈<\/b>만약에 형 혹시 여기 결혼에 대한 시 있고 그러면 나 형 진짜 안 볼 거야.<\/p><\/div><p>상대의 진심은 받으면서(&quot;형은 책임이 아니에요&quot;), 너무 짠해질 순간을 앞질러 손편지면 안 본다고 막습니다. 분위기가 무거워지지 않게 온도를 미리 낮춘 것입니다. 할머니의 젊을 때 사진과 늙은 모습을 나란히 보며 숙연해졌을 때도 같은 일을 합니다. &quot;그러니까 부모들한테 잘하라고.&quot; 하고 교훈을 말한 뒤 곧바로 &quot;자식들한테는 그렇게 잘할 필요 없어.&quot; / &quot;나중에 다 몰라, 크면.&quot;을 붙입니다. 반쪽짜리 교훈 하나로 숙연함이 오래가지 않게 스스로 풉니다.<\/p><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/note.html#c7\" target=\"_blank\" rel=\"noopener\">본편 7장 「줄 길이」에서 이 장면 설명 보기 ↗<\/a><\/p><\/div><\/div><p class=\"lk\"><a href=\"https://okhyun304-dot.github.io/tak-jaehoon-wit/#/drill/⑪\" target=\"_blank\" rel=\"noopener\">훈련장에서 이 기술 장면 7개 더 풀어 보기 ↗<\/a><\/p>", "cls": "colL"}, {"id": "t⑪-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>술자리 안에 있지만 밖에 있기 — 취할수록 천천히<\/p><div class=\"talk\"><p><b>대장님<\/b>항상 그 밖에 있어 봐요. 나를 내가 봐. 이 전투도 보시고 자기 자신도 보시고.<\/p><p><b>대장님<\/b>이 자리에서 어떤 모습인지, 나라는 사람이 어떻게 보일지에 대해서. 눈치를 본다는 게 아니라 흐름을 조절할 수 있다는 거고.<\/p><p><b>대장님<\/b>술을 먹을수록 난 좀 더 천천히.<\/p><p class=\"pun\"><b>대장님<\/b>말할 때 어떤 인토네이션, 템포나 이런 거를. 왜냐면 술자리로 가면 가면서 사람들이 말이 빨라져. 격해지죠. 제스처도 빨라져. 그러면 서로가 이해할 시간이 없어.<\/p><\/div><div class=\"dgslot\" data-c=\"n15\"><\/div><p class=\"lk\"><a href=\"#n26-p3-3\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ③ 통닭집<\/h4><p>하던 농담은 끝까지 밀어붙인다<\/p><div class=\"talk\"><p><b>대장님<\/b>갈라고 했다가 지금 안 될 것 같으니까. 안 될 것 같아도 밀어붙여야 되는데.<\/p><p><b>오키<\/b>감 보고 분위기 안 좋으니까 안 하려고요.<\/p><p class=\"pun\"><b>대장님<\/b>안 되지. 할 거면 그냥 끝까지 가야지.<\/p><\/div><div class=\"dgslot\" data-c=\"n32\"><\/div><p class=\"lk\"><a href=\"#n26-p5-1\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div>", "cls": "colR"}, {"id": "t⑪-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"sk⑪.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"sk⑪.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"sk⑪.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["sk⑪.said", "상대의 직전 말"], ["sk⑪.mine", "내가 한 말 / 할 수 있었던 말"], ["sk⑪.next", "다음에 해 볼 것"]]}, {"key": "tA", "group": "own", "no": "A", "title": "콜백", "sub": "한 번 웃은 소재를 다른 화제·다른 장소에서 다시 불러온다.", "meta": "대장님 녹음 · 나", "lead": "", "segs": [{"id": "tA-real", "badge": "현실 · 대장님", "title": "대장님 장면 2개", "html": "<div class=\"tvs\"><h4 class=\"tvh\">장면 1 · 11월 26일 · ④ 신사 술집<\/h4><p>국화꽃이 다시 돌아오다<\/p><div class=\"talk\"><p><b>대장님<\/b>오늘 먹태 시켰을 때는 전혀 아니라는 생각을 한 거야. 왜냐? 이거는 지금 국화를 나한테 주는 거지.<\/p><p><b>민브로님<\/b>헤어지자.<\/p><p><b>대장님<\/b>우리 그냥 끝내자.<\/p><p class=\"pun\"><b>대장님<\/b>나는 앞으로 더 이상 먹태 못 먹을 것 같아. 이런 식이라면.<\/p><\/div><div class=\"dgslot\" data-c=\"n08\"><\/div><p class=\"lk\"><a href=\"#n26-scene-7\">전체 분석에서 이 장면 읽기 ›<\/a><\/p><\/div><div class=\"tvs\"><h4 class=\"tvh\">장면 2 · 11월 26일 · ④ 신사 술집<\/h4><p>목이 막히면 교통사고, 굴전이 막아 줬다<\/p><div class=\"talk\"><p><b>민브로님<\/b>오키님 집은 지하철 30분에 가겠죠. 저는 2시간 반 가야 되니까.<\/p><p
