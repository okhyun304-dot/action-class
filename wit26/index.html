>&quot;아무거나&quot; → &quot;이럴 줄 알았어, 세 개만 얘기해 봐&quot;<\/p><div class=\"talk\"><p><b>대장님<\/b>뭘 먹을래요? 민브로님을 내가 밥을 사 주기로 했으니까.<\/p><p><b>민브로님<\/b>아무거나 괜찮습니다.<\/p><p><b>대장님<\/b>이럴 줄 알았어.<\/p><p><b>대장님<\/b>내가 와이프한테 얘기했거든. 뻔하지.<\/p><p class=\"pun\"><b>대장님<\/b>있는 거 없는 거 상관없이, 본인이 먹고 싶은 거 한 세 개만 얘기해 봐.<\/p><p><b>민브로님<\/b>저는 고기.<\/p><\/div><div class=\"dgslot\" data-c=\"n31\"><\/div><p class=\"lk\"><a href=\"#n26-scene-27\">전체 분석에서 이 장면 읽기 ›<\/a><\/p>"}, {"id": "tD-diff", "badge": "비교", "title": "방송에서 안 보이는 이유", "html": "<p>모든 기술 앞에 오는 판단입니다. 같은 농담을 은호님 앞에서는 안 했을 거라는 말과 이어집니다.<\/p>"}, {"id": "tD-me", "badge": "나", "title": "내 장면으로 옮겨 보기", "cls": "me", "html": "<label>상대의 직전 말<textarea data-k=\"ownD.said\" rows=\"2\"><\/textarea><\/label><label>내가 한 말 / 할 수 있었던 말<textarea data-k=\"ownD.mine\" rows=\"2\"><\/textarea><\/label><label>다음에 해 볼 것<textarea data-k=\"ownD.next\" rows=\"2\"><\/textarea><\/label><p class=\"note\">이 기기에만 저장됩니다. 첫 화면 맨 아래에서 한꺼번에 복사할 수 있습니다.<\/p>"}], "me": [["ownD.said", "상대의 직전 말"], ["ownD.mine", "내가 한 말 / 할 수 있었던 말"], ["ownD.next", "다음에 해 볼 것"]]}, {"key": "q1", "group": "study2", "no": "1", "title": "11월 3일과 무엇이 달랐나", "meta": "정리", "lead": "\n<p class=\"docsub\">2026년 11월 26일 — 메이플자이 산책에서 먹태 논쟁까지<\/p>\n<p class=\"spk\">이번 만남<\/p>\n<p><a href=\"https://okhyun304-dot.github.io/talk-261126/\" target=\"_blank\" rel=\"noopener\">https://okhyun304-dot.github.io/talk-261126/<\/a><\/p>\n<ul><li>날짜: 2026년 11월 26일 오후 3시 ~ 밤 12시 반<\/li><li>참석: 대장님, 오키님, 민브로님, 해량님(뒤에 합류)<\/li><li>구간: ① 메이플자이 단지 산책 · ② 신사동 골목 → 감자탕집 · ③ 옛날 통닭집 · ④ 신사 술집과 귀갓길<\/li><li>받아쓰기는 자동이라 글자와 화자가 섞여 있다. 민브로님과 해량님은 목소리로 구분되지 않아 녹음에는 둘 다 &#x27;민브로님&#x27;으로 나온다.<\/li><li>따옴표 안은 녹음된 말이다. 음성인식이 틀린 글자(국화 껏 → 국화꽃 같은 것)만 고쳐 적었고, 거친 욕은 X로 가렸다.<\/li><\/ul>\n\n\n<p>11월 3일에는 대장님이 혼자 던지는 한마디가 많았다. 카스테라, 엔딩 포즈, 가지처럼 짧게 치고 빠지는 장면이었다.<\/p>\n<p>11월 26일에는 <b>소재 하나로 세 사람이 30분을 논다.<\/b> 오키님이 마지막 안주로 먹태를 시킨 순간부터, 먹태는 이별 선언이 되고, 국화꽃이 되고, 20년의 부정이 되고, 마음의 상처가 된다.<\/p>\n<p>그리고 논쟁이 끝나자 대장님이 <b>그 논쟁을 직접 복기<\/b>했다. 누가 왜 이겼고, 오키님은 어디서 졌는지. 11월 3일에는 없던 장면이다.<\/p>\n<p>그래서 이번 공부는 세 갈래다.<\/p>\n<ul><li><b>먹태 논쟁<\/b>: 한 소재를 끝까지 굴리는 기술 (2부)<\/li><li><b>대장님의 복기<\/b>: 말싸움에서 지지 않는 법, 술자리에서 흐름을 쥐는 법 (3부)<\/li><li><b>하루 종일 흩어진 장면들<\/b>: 산책, 감자탕집, 통닭집에서 나온 한마디들과 대장님이 직접 설명한 대화·코칭 원리 (4부·5부)<\/li><\/ul>\n\n", "segs": []}, {"key": "q2", "group": "study2", "no": "2", "title": "먹태 논쟁 — 메뉴 하나로 30분", "meta": "장면 11개 · 녹음 12곳", "lead": "\n", "segs": [{"id": "n26-scene-1", "badge": "장면 1", "title": "직관 있는 사람이라고 띄워 놓고", "html": "\n<div class=\"dgslot\" data-c=\"n01\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>배가 부른 상태에서 마지막 안주를 고르는 중이었다. 민브로님은 김치찌개와 파전 사이에서 고민했고, 대장님은 결정권을 오키님에게 넘겼다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;옥희님 생각을 한번 펼쳐 보세요. 저는 남의 의견이 아니라 본인의 의견도 있을 것 같아요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;일단 전적으로 옥희님이 얘기하는 거를 들어서 시킬 테니까.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;남의 얘기에 흔들린 사람이 아니야, 자기가.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;저는 이거요.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;먹태, 먹태.&quot;<\/p>\n<\/div><p>조금 뒤, 오키님이 이모님께 주문을 넣자 대장님이 한마디 했다.<\/p>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;아 진짜 최악이다.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>대장님은 먼저 오키님을 &#x27;직관이 있는 사람&#x27;, &#x27;남의 말에 흔들리지 않는 사람&#x27;으로 한껏 띄웠다.<\/p>\n<p>기대가 높을수록 떨어질 때 크게 웃긴다. 오키님이 먹태를 고르자 &quot;최악이다&quot; 한마디로 바로 떨어뜨렸다.<\/p>\n<p>이 장면은 동시에 발언권 분배다. 대장님은 결정을 직접 하지 않고, 가장 말수가 적던 사람에게 넘겼다. 그 결정이 30분짜리 놀이의 시작이 됐다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">발언권 분배 + 띄워 놓고 떨어뜨리기<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>넘겨받은 결정은 그 자리의 판을 바꾼다. 나는 이 결정으로 그날 밤의 주인공이 됐다. 문제는 그다음에 그 판을 어떻게 다뤘는가였다(3부).<\/p>\n\n"}, {"id": "n26-scene-2", "badge": "장면 2", "title": "먹태는 \"우리 헤어집시다\"", "html": "\n<div class=\"dgslot\" data-c=\"n02\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님은 김치찌개에 참치가 들어간 소주 안주를 기대하고 있었다. 그런데 먹태가 오고 있었다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;먹태는 진짜 2차에 먹고 집에 가고 싶을 때. 먹태는 우리 헤어집시다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;먹태는? 너무 지금 내가 느끼기에는 어떤 느낌이냐면, 나한테 지금 그런 거야. 한 잔 먹고 가자.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;사막에 들어갑시다. 모래에다 막 쳐먹어, 열정적으로.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;한 잔 먹고 집에 가자.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>민브로님이 안주에 <b>대사를 붙였다.<\/b> 먹태가 &quot;우리 헤어집시다&quot;라고 말한다는 설정이다.<\/p>\n<p>대장님은 그 설정에 올라타서 &quot;한 잔 먹고 가자&quot;라는 대사를 더했고, 마른안주를 사막과 모래로 키웠다. 민브로님이 다시 &quot;한 잔 먹고 집에 가자&quot;로 받았다.<\/p>\n<p>한 사람이 설정을 만들고, 다른 사람이 그 안에서 대사를 보탰다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p><b>설정 올라타기 + 합동 완성<\/b> (새로 보인 것: 물건에 대사 붙이기)<\/p>\n\n"}, {"id": "n26-scene-3", "badge": "장면 3", "title": "목이 막히면 교통사고, 굴전이 막아 줬다", "html": "\n<div class=\"dgslot\" data-c=\"n03\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>민브로님은 그날 밤 2시간 반을 운전해서 돌아가야 했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;오키님 집은 지하철 30분에 가겠죠. 저는 2시간 반 가야 되니까.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;근데 이제 이런 사람들은 사실 운전하다가 목이 막힐 수 있어. 목 막혀서 먹태가 씹어 올라와. 그럼 이제 교통사고 나는 거야.&quot;<\/p>\n<\/div><p>잠시 뒤 사장님이 서비스로 굴전을 내주셨다. 대장님은 그 교통사고 이야기를 다시 꺼냈다.<\/p>\n<div class=\"dgslot\" data-c=\"n04\"><\/div>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;먹태를 먹어도 적어도 치명적으로 교통사고가 나지 않을 거예요. 다행이다. 근데 본인 때문에 그렇게 될 뻔한 걸 사장님이 막아 주신 거예요.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>마른안주가 목에 걸린다는 작은 사실에서 시작해 질식, 운전, 교통사고까지 한 칸씩 키웠다.<\/p>\n<p>그리고 2분 뒤, 굴전이라는 새 사건이 생기자 같은 이야기를 이어 붙였다. 사장님은 사고를 막아 준 사람이 되고, 오키님은 사고를 낼 뻔한 사람이 된다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">끝까지 부풀리기 + 콜백<\/p>\n\n"}, {"id": "n26-scene-4", "badge": "장면 4", "title": "이모님 속마음 대신 말하기", "html": "\n<div class=\"dgslot\" data-c=\"n05\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;근데 이제 이모님을 봤어요? 김치가 잘 나가지 않을까요?&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;맞아. 그러니까 내가 봤을 때 이모님도 약간 들으실 때 고민하니까, 이거 하는데 제발 제발 먹태는 아니길.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;먹태가 아니길.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>대장님은 주문을 받던 이모님의 속마음을 대사로 만들었다. 그 자리에 없는 사람의 목소리를 빌린 짧은 상황극이다.<\/p>\n<p>재미있는 것은 다음 줄이다. 먹태를 고른 오키님이 부정하지 않고 &quot;먹태가 아니길&quot;을 따라 했다. 놀림을 받은 사람이 그 설정 안으로 같이 들어간 것이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">설정 올라타기(제3자 속마음 대사)<b> · 오키님은 <\/b>먼저 인정하고 더 나가기<\/p>\n\n"}, {"id": "n26-scene-5", "badge": "장면 5", "title": "먹태는 국화꽃", "html": "\n<div class=\"dgslot\" data-c=\"n06\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>먹태가 나왔고, 그날의 마지막 안주였다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;근데 이건 마지막이라고. 지금 마지막.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그러니까 이걸 먹자는 얘기는 국화꽃 같은 거야. 우리가 국화꽃 선물해 줄 때 기분 나쁘죠 보통. 그때 그거는 우리가 이별이잖아. 국화꽃을 지금 준 거야. 우리 지금 놀고 있는데, 야 여러분 끝냅시다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;꺼지라는 말이거든. 그 꽃말이야.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>장면 2의 &#x27;헤어집시다&#x27;를 이번에는 꽃말로 바꿨다. 먹태라는 메뉴에 <b>판 밖의 재료<\/b>인 국화꽃을 붙인 것이다.<\/p>\n<p>메뉴 고르기라는 사소한 일이, 꽃을 건네며 이별을 고하는 장면이 됐다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">판 밖 재료<\/p>\n\n"}, {"id": "n26-scene-6", "badge": "장면 6", "title": "\"내 20년을 부정당한 느낌\"", "html": "\n<div class=\"dgslot\" data-c=\"n07\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 진짜 내 20년을 부정당한 느낌이야. 난 진짜 여기서 김치(찌개)를 먹었으면 내가 20대에 느꼈던 그거를 내가 완성할 수 있었는데. 내 20년만 지워 버렸어.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;아 근데 이게 어떻게 보면 새로운 시작일 수도 있는 게.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;전혀! 1도 아니야. 알다시피 내가 먹태를 정말 좋아하거든. 와이프가 진짜, 오빠는 미쳤다, 먹태에 미쳤어.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;와이프가 뒷모습 사진 찍은 적이 있어. 왜냐면, 오빠 미친 X이다.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>부풀리기가 두 겹이다.<\/p>\n<p>첫째, 김치찌개를 못 먹은 일을 &#x27;20년의 부정&#x27;으로 키웠다.<\/p>\n<p>둘째, 오키님이 &quot;새로운 시작&quot;이라고 반격하자, 이번에는 자기가 먹태를 얼마나 좋아하는지를 키웠다. 아내가 사진을 찍을 정도로 좋아하는 먹태인데도 오늘은 싫다는 것이다. 좋아할수록 배신감이 커진다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">끝까지 부풀리기<\/p>\n<h4 class=\"lb\">내가 배울 점<\/h4>\n<p>&quot;새로운 시작일 수도 있다&quot;는 반박은 논리로는 맞을 수 있다. 하지만 상대가 만든 큰 이야기 안에서 논리로 반박하면, 상대는 이야기를 한 칸 더 키울 재료를 얻는다.<\/p>\n\n"}, {"id": "n26-scene-7", "badge": "장면 7", "title": "국화꽃이 다시 돌아오다", "html": "\n<div class=\"dgslot\" data-c=\"n08\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;오늘 먹태 시켰을 때는 전혀 아니라는 생각을 한 거야. 왜냐? 이거는 지금 국화를 나한테 주는 거지.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;헤어지자.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;우리 그냥 끝내자.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나는 앞으로 더 이상 먹태 못 먹을 것 같아. 이런 식이라면.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>3분 전에 웃음이 터졌던 국화꽃을 다시 꺼냈다. 이번에는 민브로님이 바로 이별 대사로 받았다.<\/p>\n<p>처음에는 대장님 혼자 만든 비유였지만, 두 번째에는 다른 사람이 다음 대사를 알고 있다. 콜백이 되풀이될수록 자리에 있는 사람들의 공동 소재가 된다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">콜백 + 합동 완성<\/p>\n\n"}, {"id": "n26-scene-8", "badge": "장면 8", "title": "'좋아하는 사람'을 그대로 돌려주기", "html": "\n<div class=\"dgslot\" data-c=\"n09\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;지금 제가 정말 존경하는 대장님이랑, 정말 좋아하는 해량님이랑, 민브로님이 있는데 여기서.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그리고 좋아하는 사람을 지금 말살시킨 거잖아.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;좋아하는 사람이 가장 싫어하는 걸 시켰잖아요. 그러면은 내가 슬프고. 날 좋아한대. 왜 좋아하는 사람을 슬프게 해?&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>오키님은 &#x27;좋아하는 사람들이 있는 자리&#x27;라는 말을 방패로 썼다.<\/p>\n<p>대장님은 그 방패를 그대로 집어 들었다. 좋아하는 사람이 있는 자리라면서, 좋아하는 사람이 가장 싫어하는 걸 시켰다는 것이다. 상대가 쓴 단어 그대로 상대를 찌르는 말이 됐다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">같은 틀로 돌려주기<\/p>\n\n"}, {"id": "n26-scene-9", "badge": "장면 9", "title": "\"충격을 위해서 좋아하는 사람의 마음을 훼손해도 돼요?\"", "html": "\n<div class=\"dgslot\" data-c=\"n10\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>오키님은 김치찌개였다면 기억에 남지 않았을 것이고, 먹태라서 2026년의 한 장면이 될 거라고 주장했다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;이 상황에서 김치찌개 나왔으면 이건 기억이 안 남아요. 저는 2026년에 하나를 뽑으라면 이 장면을 뽑을 것 같아요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그러면 충격을 위해서 좋아하는 사람의 마음을 훼손해도 돼요? 본인의 충격을 위해서 내 마음을 아프게 해도 돼요?&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;먹태가 상처를.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;상처지. 왜냐면 내 입장에서는 너무나 좋은 자리에 너무 기분 좋고 해서, 김치찌개 딱 먹으면 나는 정말 20년 만에 너무 좋겠다고 생각했는데.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;23시예요. 근데 굳이 이 시간에 나한테 먹태를 먹여야 되겠어?&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>장난으로 시작한 메뉴 논쟁을 <b>도덕 문제처럼<\/b> 끌고 갔다. &#x27;충격&#x27;과 &#x27;훼손&#x27;이라는 무거운 단어를 먹태 하나에 썼다.<\/p>\n<p>대장님은 끝까지 피해자 역할에서 내려오지 않았다. 뒤에 복기하며 이것을 &quot;기믹&quot;이라고 불렀다. 연기라는 뜻이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">설정 올라타기(피해자 역할 끝까지 하기)<\/p>\n\n"}, {"id": "n26-scene-10", "badge": "장면 10", "title": "\"사장님은 당연히 좋아하지\"", "html": "\n<div class=\"dgslot\" data-c=\"n11\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;여기서 지금 이 먹태를 좋아하는 사람이 몇 명이 있을까?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;일단 좋아하는 사람 더 한 명 있고, 사장님. 사장님 한 명 있어요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;사장님이 어딨어? 사장님은 같이 먹는 사람이 아니잖아. 사장님은 다 좋아하죠.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;대장님이 내시긴, 우리 사 주시는 건데.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;아, 이러면 내가 안 사 주지.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>오키님의 논거(사장님도 좋아한다)를 가장 당연한 사실 한 줄로 무너뜨렸다. 파는 사람은 무엇을 시키든 좋아한다.<\/p>\n<p>민브로님이 &#x27;계산은 대장님이 한다&#x27;를 꺼내자, 대장님은 &quot;안 사 주지&quot;라는 협박으로 마무리했다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">틀 깨기<\/p>\n\n"}, {"id": "n26-scene-11", "badge": "장면 11", "title": "염라대왕 앞에서도 먹태라면, 일주일 먹어 봐", "html": "\n<div class=\"dgslot\" data-c=\"n12\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;자다가 제가 가는데 가다가 갑자기 차에 치여 죽었어요. 염라대왕이 와 가지고, 너는 가장 생각나는 음식이 뭐냐. 먹태일 것 같아요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;진짜루? 내일부터 먹태만 한 일주일 먹어 봐.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;쌀밥 없이 먹태만 먹었어요, 그럼 인정.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>오키님의 과장(죽어서도 먹태)을 대장님은 <b>문자 그대로<\/b> 믿어 줬다. 그렇게 좋아하면 증명해 보라는 것이다.<\/p>\n<p>민브로님이 &#x27;쌀밥 없이&#x27;라는 조건을 보태 시험을 완성했다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">문자 그대로 받기 + 합동 완성<\/p>\n\n"}]}, {"key": "q3", "group": "study2", "no": "3", "title": "논쟁이 끝나고 — 대장님의 복기", "meta": "4꼭지 · 녹음 3곳", "lead": "\n<p>먹태 논쟁이 잦아들자 대장님이 판정을 내렸다. 장난이었지만, 그 장난 안에서 누가 여유 있었고 누가 몰렸는지를 짚었다.<\/p>\n", "segs": [{"id": "n26-p3-1", "badge": "1", "title": "몰리면 프레임을 줌아웃한다 — 바둑판은 넓다", "html": "\n<div class=\"dgslot\" data-c=\"n13\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;문제에서 벗어나는 프레임을 줌아웃할 줄 아는 능력. 내 생각에 민브로님이 훨씬. 그리고 그 중간에서 몰아갔을 때 보면 내 느낌에는 오키님이 약간 발끈하셨죠.&quot;<\/p>\n<p class=\"qt\">&quot;몰아붙였을 때 사실은 거기서 여유 있게 빠져나올 수 있어야 돼. 빠져나오려면 거기서 프레임을 완전히 다르게 잡을 수 있어야 되는데.&quot;<\/p>\n<p class=\"qt\">&quot;술자리에서 어떤 기믹을 한다고 하더라도 느끼는 감정은 또 있거든요. 본인이 수세에 몰리면 본인이 감정적으로 반응하는 거야.&quot;<\/p>\n<p class=\"qt\">&quot;약간 수세 몰리니까 본인 약간 좀 짜증 내는 느낌이 있거든. 그럼 일단 거기서 이미 진 거야.&quot;<\/p>\n<p class=\"qt\">&quot;바둑으로 치면 여기서 싸우고 있더라도 저쪽에다 갑자기 본인이 돌을 둬도 돼. 근데 자꾸 이 돌에서 자기가 이기려고 하는 거야.&quot;<\/p>\n<p class=\"qt\">&quot;사실 바둑판 되게 넓잖아요. 근데 그걸 못 보는 거 같은 느낌? 그러니까 본인이 말이 좀 가팔라지고 빨라지고, 이기기 위한 이김을 하는 거지.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<ul><li>장난 논쟁도 몰리면 감정이 올라온다. 짜증이 보이는 순간 이미 진 것이다.<\/li><li>지금 싸우는 돌 하나(먹태 대 김치찌개)에서 이기려고 하면 판 전체가 안 보인다.<\/li><li>빠져나오는 길은 <b>프레임을 바꾸는 것<\/b>이다. 다른 곳에 돌을 둔다.<\/li><li>몰릴수록 말이 빨라지고 가팔라진다. 그 신호를 스스로 알아차려야 한다.<\/li><\/ul>\n\n"}, {"id": "n26-p3-2", "badge": "2", "title": "이기고 싶으면 그 자리 연장자를 편으로", "html": "\n<div class=\"dgslot\" data-c=\"n14\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;여기서 되게 좋았던 건, 민브로님이 &#x27;대장님이 좋아하는 거를 먹고 싶어 하는 거 아니었냐&#x27;, 연장자 얘기하는데 그게 되게 좋았다. 왜냐면 그거는 프레임을 완전히 끌어내서 여유 있게 지금 가져오는 거잖아.&quot;<\/p>\n<p class=\"qt\">&quot;민브로님이 참치찌개는 더 이상 중요하지 않다, 자기도 먹태를 좋아한다. 나는 그게 되게 좋았던 공격인 것 같아. 참치찌개와 이거의 논쟁을 무의미하게 만들어 버리면서 오히려 더 크게 가는 거잖아. 본질이 뭐라고 얘기를 하면서 나를 끌어들이잖아요.&quot;<\/p>\n<p class=\"qt\">&quot;근데 본인은, 내가 한두 번 도와주려고 했는데 나를 편으로 들이지 않는 거야. 내가 심지어 공격했는데 나를 공격하잖아. 근데 나를 공격해 봤자 무슨 소용 있어.&quot;<\/p>\n<p class=\"qt\">&quot;계속 자기의 그런 이 먹태 안에 꽂혀 가지고 하다 보니까, 나도 없고 다 없고 그냥 이렇게 돼 버린 거지.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<p>민브로님이 한 것은 세 가지다.<\/p>\n<ul><li>상대 주장을 인정했다. &quot;나도 먹태 좋아한다.&quot; 그러자 먹태 대 김치찌개라는 싸움 자체가 의미를 잃었다.<\/li><li>싸움을 더 큰 질문으로 바꿨다. &quot;스승님이 먹고 싶은 걸 먹게 하는 게 본질 아닐까.&quot;<\/li><li>그 질문으로 판정하는 사람(가장 연장자)을 자기 편으로 끌어들였다.<\/li><\/ul>\n<p>오키님은 반대로 했다. 대장님이 던진 말을 도움의 손으로 보지 않고 공격으로 받아 되받아쳤다.<\/p>\n<p><b>대장님의 결론<\/b>: &quot;이 자리에서 이기고 싶어 하면 그 연장자, 제일 연장자를 편으로 만들어야지. 다른 걸로 이기려고 하면 안 돼. 이길 수가 없어요.&quot; (2:11:35)<\/p>\n\n"}, {"id": "n26-p3-3", "badge": "3", "title": "술자리 안에 있지만 밖에 있기 — 취할수록 천천히", "html": "\n<div class=\"dgslot\" data-c=\"n15\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;항상 그 밖에 있어 봐요. 나를 내가 봐. 이 전투도 보시고 자기 자신도 보시고.&quot;<\/p>\n<p class=\"qt\">&quot;이 자리에서 어떤 모습인지, 나라는 사람이 어떻게 보일지에 대해서. 눈치를 본다는 게 아니라 흐름을 조절할 수 있다는 거고.&quot;<\/p>\n<p class=\"qt\">&quot;술을 먹을수록 난 좀 더 천천히.&quot;<\/p>\n<p class=\"qt\">&quot;말할 때 어떤 인토네이션, 템포나 이런 거를. 왜냐면 술자리로 가면 가면서 사람들이 말이 빨라져. 격해지죠. 제스처도 빨라져. 그러면 서로가 이해할 시간이 없어.&quot;<\/p>\n<\/div><p>&quot;술자리를 넘어갈수록 나는 말을 잘 안 하잖아. 말을 안 하고 듣고, 그냥 또 얘기해 주고. 그게 훨씬 더 나은 술자리의 방법이라는 것을.&quot; (2:11:05)<\/p>\n<h4 class=\"lb\">정리<\/h4>\n<ul><li>몸은 자리 안에 있어도, 머리는 자리 밖에서 나와 자리 전체를 본다.<\/li><li>술이 들어갈수록 모두가 빨라진다. 그래서 나는 일부러 템포와 억양을 늦춘다.<\/li><li>시간이 갈수록 말을 줄이고 듣는다.<\/li><\/ul>\n<p>11월 3일 장면 12에서 대장님이 &quot;내가 적절히 끊어 줄 걸 안다는 믿음&quot;을 말했다면, 이번에는 그 조절을 <b>어떻게<\/b> 하는지를 말했다.<\/p>\n\n"}, {"id": "n26-p3-4", "badge": "4", "title": "이 논쟁에서 나는 무엇을 했나", "html": "\n<p>내가 그 자리에서 한 말을 순서대로 놓으면 이렇다.<\/p>\n<div class='tbl'><table><thead><tr><th>시각<\/th><th>내가 한 말<\/th><th>무엇을 하려 했나<\/th><\/tr><\/thead><tbody><tr><td>1:32:10<\/td><td>&quot;예전 같았으면 넘어갔을 것 같은데, 영업을 하다 보니까 설득을 해야 된다는 얘기가 있다 보니까&quot;<\/td><td>설득 연습<\/td><\/tr><tr><td>1:44:22<\/td><td>&quot;어떻게 보면 새로운 시작일 수도 있는 게&quot;<\/td><td>논리로 반박<\/td><\/tr><tr><td>1:47:48<\/td><td>&quot;김치찌개 나왔으면 이건 기억이 안 남아요&quot;<\/td><td>기억에 남는 장면 만들기<\/td><\/tr><tr><td>1:57:29<\/td><td>&quot;그 삶의 스크래치를 드리고 싶었어요. 마음대로 되는 거 없다&quot;<\/td><td>의미 부여<\/td><\/tr><tr><td>1:57:40<\/td><td>&quot;지금 이 포지션에서, 가장 낮은 포지션인데 여기서 김치찌개 시키면 너무 재미가 없어요&quot;<\/td><td>내 자리 설명<\/td><\/tr><tr><td>1:58:30<\/td><td>&quot;제가 이걸 시켰기 때문에 이 대화가 이어진 거예요&quot;<\/td><td>결과로 정당화<\/td><\/tr><\/tbody><\/table><\/div>\n<p>모두 <b>먹태를 고른 내가 옳았다<\/b>는 것을 증명하려는 말이었다. 대장님 말대로 &quot;이 돌에서 이기려고&quot; 한 것이다.<\/p>\n<p>같은 자리에서 민브로님은 먹태 대 김치찌개 싸움을 버리고 &quot;대장님이 먹고 싶은 걸 먹는 게 본질&quot;로 판을 옮겼다.<\/p>\n<h4 class=\"lb\">다음에 해 볼 것<\/h4>\n<ul><li>몰린다고 느끼면 먼저 말의 속도를 늦춘다.<\/li><li>내가 옳다는 증명 대신, 그 자리에서 가장 연장자가 원하는 것을 한 줄로 말한다.<\/li><li>상대의 장난 공격 중에 나를 도와주는 말이 섞여 있는지 듣는다.<\/li><\/ul>\n\n"}]}, {"key": "q4", "group": "study2", "no": "4", "title": "하루 종일 흩어진 위트 장면", "meta": "장면 16개 · 녹음 16곳", "lead": "\n", "segs": [{"id": "n26-scene-12", "badge": "장면 12", "title": "\"기침은 죽였다고?\"", "html": "\n<div class=\"dgslot\" data-c=\"n16\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;왜 감기를 걸렸는데 왜 와 가지고, 사람들 감기를 퍼뜨리려고 지금.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;아 근데 이제 제가 약을 좀 먹고 죽여 가지고.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;누굴 죽였어?&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;제가 기침이 많이 죽었어요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;기침은 죽였다고?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;왜 죽였어요?&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>&#x27;기침을 죽였다&#x27;는 말버릇 같은 표현을, 대장님은 사람을 죽였다는 뜻으로 받았다. 오키님이 &quot;왜 죽였어요?&quot;로 수사관처럼 한 줄 보탰다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">문자 그대로 받기 + 합동 완성<\/p>\n\n"}, {"id": "n26-scene-13", "badge": "장면 13", "title": "서산에서 온 기침은 청정 공기", "html": "\n<div class=\"dgslot\" data-c=\"n17\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;상관없어. 서산에서, 시골에서 온 X이 기침해 왔잖아. 청정 공기를 주는 거야.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;오히려 기침을 많이 해 달라고 해야지.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;기침 한 번 해 주면 거기 서산 공기 옮겨 주는 건데 이거 얼마나 좋아.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>방금 전까지 감기를 탓하더니, 갑자기 설정을 뒤집었다. 시골에서 온 기침은 좋은 공기라는 것이다. 흠이 장점이 되는 설정이 생기자, 오키님이 그 안에서 &quot;기침을 많이 해 달라고 해야지&quot;를 보탰다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">설정 올라타기 + 끝까지 부풀리기<\/p>\n\n"}, {"id": "n26-scene-14", "badge": "장면 14", "title": "\"AI로 생성한 사람 같애\"", "html": "\n<div class=\"dgslot\" data-c=\"n18\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님이 오키님 코트의 어깨와 소매가 맞지 않는다고 짚고 있었다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;네, 어색합니다 이거. 약간 AI 같아, 지금.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;AI로 생성한 사람 같애. 약간 그 AI 몸에다가 옷이 안 맞아. 옷이 막 떠다녀.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;코트 다른 거 사겠습니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;아니 뭐 다른 거를 굳이 사기보다는, 어깨에 맞춰야 된다 이거지.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>놀림을 받던 오키님이 먼저 자기를 AI에 빗댔다. 대장님은 그 비유를 받아 &#x27;옷이 떠다니는 AI 몸&#x27;이라는 장면으로 키웠다.<\/p>\n<p>그리고 오키님이 &quot;다른 거 사겠습니다&quot;라고 하자, 대장님은 바로 진지한 조언으로 돌아왔다. 놀림이 길어지지 않게 끊은 것이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">합동 완성<b> · 오키님은 <\/b>먼저 인정하고 더 나가기<b> · 마지막 줄은 <\/b>온도 조절<\/p>\n\n"}, {"id": "n26-scene-15", "badge": "장면 15", "title": "테슬라는 \"핸드폰 타고 다니는 거\"", "html": "\n<div class=\"dgslot\" data-c=\"n19\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;친구도 보니까, 핸드폰 들고 다니는 거야. 핸드폰 타고 다니는 거야. 진짜 배터리가 30%, 40% 뜨거든?&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;신경 쓰임이 엄청 세.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;우리가 핸드폰 막 10% 나오면 기분 이상하잖아. 근데 내가 그 차를 타고 있잖아.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>전기차의 배터리 걱정을 설명하는 대신, 누구나 겪어 본 &#x27;핸드폰 10%&#x27;의 불안을 가져왔다. 그 핸드폰을 타고 다닌다고 하니 한 줄로 와닿는다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">판 밖 재료<\/p>\n\n"}, {"id": "n26-scene-16", "badge": "장면 16", "title": "나를 지루하게 만든 여자는 \"미국 같은 거야\"", "html": "\n<div class=\"dgslot\" data-c=\"n20\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나를 지루하게 만든 여자들 있잖아. 그 여자들이 좋은 거 아니야? 미국 같은 거야.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;미국이란 든든한 게 있어서 지금 우리가 편안한 거잖아.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;막 전시작전권을 줘. 미국 빠지면 어떡해. 난리 나죠.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>오래 만나 지루해진 연인을 버리면 안 된다는 이야기에, 연애와 전혀 상관없는 안보 문제를 가져왔다. 지루함이 곧 든든함이라는 말을 비유 하나로 한다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">판 밖 재료<\/p>\n\n"}, {"id": "n26-scene-17", "badge": "장면 17", "title": "\"세뇌당한 거지\" → \"가스라이팅\"", "html": "\n<div class=\"dgslot\" data-c=\"n21\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;그렇게 믿을 수가 있을까?&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나한테 세뇌당한 거지. 내가 계속 세뇌를 시킨 거지.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;요즘 말로는 가스라이팅.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그렇지. 요즘 말론. 넌 나랑 이미 결혼해야겠다. 결론은 내가 내 버렸기 때문에 다른 선택지가 없네.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>아내가 어떻게 그렇게 믿었느냐는 질문에, 변명하는 대신 &#x27;세뇌&#x27;라고 먼저 더 세게 인정했다. 민브로님이 더 센 단어(가스라이팅)를 얹자, 그것도 받아서 밀고 나갔다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">먼저 인정하고 더 나가기 + 합동 완성<\/p>\n\n"}, {"id": "n26-scene-18", "badge": "장면 18", "title": "여자친구를 데려오면 \"인수인계한다고?\"", "html": "\n<div class=\"dgslot\" data-c=\"n22\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;제가 가장 원하는 장면이, 제가 여자 데려와서 대장님이랑 같이 있는.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나랑 같이 있으면 안 되는 거 아냐? 여자친구가 나랑 있으면 어떡해.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;인수인계한다고?&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;그 장면이 계속 상상을 하긴 해요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;뭘 상상하는 거야. 솔직히 변태네 이거.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>오키님이 말한 &#x27;같이 있는&#x27;의 빈칸을, 대장님은 일부러 엉뚱하게 채웠다. 여자친구가 대장님과 같이 있는 장면으로. 그리고 &quot;인수인계&quot;라는 회사 용어를 붙이고, 오키님이 진지하게 이어 말하자 &quot;변태&quot;까지 한 칸 더 갔다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">단정하고 한 번 더 묻기 + 끝까지 부풀리기<\/p>\n\n"}, {"id": "n26-scene-19", "badge": "장면 19", "title": "서산 인구는 \"17명에다 만 명 붙인 거야\"", "html": "\n<div class=\"dgslot\" data-c=\"n23\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>서산에서 온 멤버에게 서산에는 헌팅포차가 하나뿐이라는 이야기가 나왔다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 봤을 때 14명. 한 명 빼고 13명. 이거 한국인 인구조사야.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;4일마다 가자. 4일마다 가서 안 겹치게. 왜냐면 48명이니까.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;17만 명.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;17명 맞죠. 17명에다 만 명 붙인 거야.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>&#x27;시골&#x27;이라는 인상을 인구 몇십 명이라는 숫자로 정해 버리고, 그 숫자로 계획(4일마다)까지 세웠다. 실제 인구 17만이라는 반박이 나와도 설정을 놓지 않고 &quot;17명에 만 명을 붙였다&quot;로 받아냈다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p><b>끝까지 부풀리기<\/b>(설정을 반박 안에서 지키기)<\/p>\n\n"}, {"id": "n26-scene-20", "badge": "장면 20", "title": "쫄면은 파괴적이다", "html": "\n<div class=\"dgslot\" data-c=\"n24\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;쫄면은 상당히 파괴적이야. 그래서 어떤 전골 먹을 때 나는 상당히 경계하는 게.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;시간이 속절없이 막 줄어들어요. 이거를 맑게 먹으면 3시간도 먹을 수 있거든요. 근데 떡이랑 당면 투입되잖아? X되는 거야.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;아, 다 빼내는 거구나.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;프로야, 프로. 조절, 컨트롤을 잘하자. 자기만의 컨트롤이 있어야지.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>감자탕에 쫄면을 넣느냐는 사소한 문제를 &#x27;파괴&#x27;, &#x27;경계&#x27;, &#x27;투입&#x27;, &#x27;컨트롤&#x27; 같은 전략 용어로 말했다. 말의 무게와 내용의 가벼움이 어긋나서 웃긴다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">새로 보인 것: 거창하게 말하기<\/p>\n\n"}, {"id": "n26-scene-21", "badge": "장면 21", "title": "\"유니클로가 가끔 실수하는 게 있어\"", "html": "\n<div class=\"dgslot\" data-c=\"n25\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;이쁜데 잘 샀네. 유니클로에서 가끔 이렇게 실수하는 게 있어.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;잘 나오는 게 있어요. 유니클로가 실수한 게 있어.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;98,000원? 아, 감이 진짜 살아 있다 내가.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;할인해서 98,900원.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;와, 감이 살아 있네. 내가 아직까지는 감이 있어.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>&quot;브랜드가 실수했다&quot;는 말 한마디로 옷도 칭찬하고 그 옷을 고른 사람의 눈도 칭찬했다. 가격을 맞힌 뒤에는 과하게 자화자찬해서 웃겼다. (첫 줄은 녹음에서 화자가 섞여 있다.)<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">새로 보인 것: 실수 칭찬<\/p>\n\n"}, {"id": "n26-scene-22", "badge": "장면 22", "title": "뭘 골라도 \"먹을 줄 아네\"", "html": "\n<div class=\"dgslot\" data-c=\"n26\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>바로 앞에서 대장님은 &quot;사업의 세계는 우기면 되는 데도 있다&quot;, &quot;만들어서 설득하는 게 사업&quot;이라고 말했다. 그리고 그 자리에서 시범을 보였다.<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;뭐가 더 맛있어요? 감자탕? 먹을 줄 아네. 이런 거야. 답이 없잖아. 먹을 줄 아네, 역시.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;끓인 게 더 맛있어요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;아, 끓인 거 좋아해? 확실히 과정의 중요성은.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;아, 이런 식으로 그냥.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>정답이 없는 질문에서는 상대가 무엇을 고르든 칭찬하고 거창한 의미를 붙이면 된다. 감자탕을 고르면 &quot;먹을 줄 아네&quot;, 끓인 걸 고르면 &quot;과정의 중요성&quot;. 오키님이 그 원리를 알아챘다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">새로 보인 것: 갖다 붙이기 칭찬<\/p>\n\n"}, {"id": "n26-scene-23", "badge": "장면 23", "title": "\"나? 지금? 럭셔리가 플로우인데\"", "html": "\n<div class=\"dgslot\" data-c=\"n27\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>대장님은 바로 앞에서 2020년에 쓴 자기 블로그 글을 &quot;저 X 왜 이렇게 세게만 하지&quot; 하고 남 이야기하듯 깎아내렸다(55:33).<\/p>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나는 더콰이엇이 럭셔리 플로우라는 말을 지은 게 되게 좋다고 생각해.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;플로우를 이제는 절박하게 못 해. 그냥 자기가 뱉는 게 럭셔리하다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;나한테 지금 2020년 블로그 왜 안 써 이러면, 나? 지금? 나? 지금 럭셔리가 플로우인데.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;옛날처럼 못 해. 나한테 요구하지 말고 내 거 즐겨.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>&quot;옛날처럼 세게 못 쓴다&quot;는 약점을 먼저 인정했다. 그리고 래퍼의 앨범 제목을 가져와 그 약점을 당당한 태도로 바꿨다. 과거의 자신을 3인칭으로 놀린 앞 장면까지 이어서 보면, 자기 약점을 다루는 방법이 두 가지 보인다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p><b>먼저 인정하고 더 나가기 + 판 밖 재료<\/b> (앞 장면: 과거의 나를 남처럼 놀리기)<\/p>\n\n"}, {"id": "n26-scene-24", "badge": "장면 24", "title": "최자에게 호통치기", "html": "\n<div class=\"dgslot\" data-c=\"n28\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;최자가 옛날에 얼마나 잘했는데. 최자 이 XX야, 정신 차려. 야, 정신 차려.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그만 처먹고 이제 랩을 해, 개XX야.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;그 너의 랩 실력이.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;먹는 걸로 묻히면 안 돼, 개XX야. 랩 좀 해!&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>먹방만 하던 시절의 래퍼 이야기를 하다가, 그 사람이 앞에 있는 것처럼 호통을 쳤다. 민브로님이 다음 대사를 보태면서 둘이 한 장면을 만들었다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">설정 올라타기(즉석 상황극) + 합동 완성<\/p>\n\n"}, {"id": "n26-scene-25", "badge": "장면 25", "title": "\"그거 해서 되면 다 하지\"", "html": "\n<div class=\"dgslot\" data-c=\"n29\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;뜨는 거는 정말 어려워요. 그게 실력이 아니에요. 뒤에서 막 로비하고 그런 게 좀.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;근데 그거 해도 될까 말까?&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그거 해서 되면 다 하지! 그거 해도 되면 다 그냥 해 가지고. 안 되니까 안 되는 거지.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>&quot;뜨는 건 로비 덕&quot;이라는 설명을, 가장 뻔한 한 줄로 무너뜨렸다. 그걸로 된다면 누구나 했을 것이다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"spk\">틀 깨기<\/p>\n\n"}, {"id": "n26-scene-26", "badge": "장면 26", "title": "\"내가 부러워?\"", "html": "\n<div class=\"dgslot\" data-c=\"n30\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;대장님처럼 되면 되게 부러울 것 같습니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 부러워?&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;대장님한테 안 쓰고 가족한테 쓴다고 하면.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;그럼 내가 부러운 게 아니라 내 가족이 부러운 거지.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;저기 오키님이나 사장님처럼 이렇게 젊은 게 부럽지. 얼마나 재밌어.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>칭찬을 바로 받지 않고 &quot;내가 부러워?&quot;라고 되물었다. 상대가 이유를 말하자, 그 이유 안에서 전제를 바꿨다. 부러운 건 내가 아니라 내 가족이라는 것이다. 마지막에는 부러움을 젊은 사람들 쪽으로 넘겼다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p><b>되물어 공 넘기기<\/b> (11월 3일 녹음에서는 찾지 못했던 기술)<\/p>\n\n"}, {"id": "n26-scene-27", "badge": "장면 27", "title": "\"아무거나\" → \"이럴 줄 알았어, 세 개만 얘기해 봐\"", "html": "\n<div class=\"dgslot\" data-c=\"n31\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;뭘 먹을래요? 민브로님을 내가 밥을 사 주기로 했으니까.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;아무거나 괜찮습니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;이럴 줄 알았어.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;내가 와이프한테 얘기했거든. 뻔하지.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;있는 거 없는 거 상관없이, 본인이 먹고 싶은 거 한 세 개만 얘기해 봐.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;저는 고기.&quot;<\/p>\n<\/div><h4 class=\"lb\">위트가 만들어진 과정<\/h4>\n<p>대장님은 상대의 습관(결정을 미루는 것)을 미리 읽고 아내에게 예언까지 해 두었다. &quot;이럴 줄 알았어&quot;로 가볍게 웃긴 다음, 질문을 바꿨다. &#x27;뭐 먹을래&#x27;는 답하기 어렵지만 &#x27;세 개만&#x27;은 답할 수 있다. 바로 답이 나왔다.<\/p>\n<h4 class=\"lb\">기술<\/h4>\n<p class=\"em\">상대 읽기 + 질문 바꾸기<\/p>\n\n"}]}, {"key": "q5", "group": "study2", "no": "5", "title": "대장님이 직접 말한 대화·코칭 원리", "meta": "8꼭지 · 녹음 8곳", "lead": "\n", "segs": [{"id": "n26-p5-1", "badge": "1", "title": "하던 농담은 끝까지 밀어붙인다", "html": "\n<div class=\"dgslot\" data-c=\"n32\"><\/div>\n<h4 class=\"lb\">당시 상황<\/h4>\n<p>누군가 &#x27;신사동은 신사라서 안전하다&#x27;는 말장난을 꺼내려다 반응이 없을 것 같아 접었다.<\/p>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;갈라고 했다가 지금 안 될 것 같으니까. 안 될 것 같아도 밀어붙여야 되는데.&quot;<\/p>\n<p class=\"spk\">오키<\/p>\n<p class=\"qt\">&quot;감 보고 분위기 안 좋으니까 안 하려고요.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;안 되지. 할 거면 그냥 끝까지 가야지.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<p>꺼낸 농담을 반쯤 접으면 웃음도 없고 &#x27;이상한 농담을 한 사람&#x27;만 남는다. 뻔한 선택이라도 왜 그걸 하는지 스스로 설득할 수 있으면 끝까지 간다. 11월 3일 7부의 &#x27;조절&#x27;과 짝을 이루는 원리다. 조절은 강도의 문제이고, 한 번 꺼낸 것은 끝까지 책임진다.<\/p>\n\n"}, {"id": "n26-p5-2", "badge": "2", "title": "부탁은 한 시간 다른 이야기를 한 다음에", "html": "\n<div class=\"dgslot\" data-c=\"n33\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;대화를 한 1시간 하고 명분을 쌓은 다음에. 내가 좋은 얘기 많이 해 주고, 고맙다고 하면, 고마우면 나를 도와줘.&quot;<\/p>\n<p class=\"qt\">&quot;나 혼자 하는 게 너무 힘들다, 나도 도와줘 이렇게 얘기해야지. 그럼 도와주기도, 안 도와준다고 말하기도 어렵잖아.&quot;<\/p>\n<p class=\"qt\">&quot;처음부터 연락해서 왜 안 뛰세요 이런 것도 아니고, 1시간 충분히 러닝과는 전혀 관계없는 대화를 하다가 마무리할 때.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<ul><li>부탁하기 전에 그 사람에게 도움이 되는 대화를 충분히 한다.<\/li><li>부탁은 마지막에, 짧게, &#x27;나 혼자 힘들다&#x27;는 말로 한다.<\/li><li>요구(&quot;왜 안 뛰세요&quot;)가 아니라 도움 요청이라서 거절하기 어렵다.<\/li><\/ul>\n\n"}, {"id": "n26-p5-3", "badge": "3", "title": "코칭은 목적을 내려놓고, 실패할 수 없는 판을 짠다", "html": "\n<div class=\"dgslot\" data-c=\"n34\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;내 자신이 나의 에고를 많이 버려야 돼요. 내 에고가 너무 많으면 그게 안 돼요.&quot;<\/p>\n<p class=\"qt\">&quot;초반에 오키님이 되게 못 달렸어요. 나는 못 달린다고 얘기 안 한 게, 애초에 내가 만든 프레임 자체가 슬로우 조깅은 못 달리는 게 없어요. 실패가 없는 게임이에요. 그냥 나가서 달리기만 하면 이겨.&quot;<\/p>\n<p class=\"qt\">&quot;그러면 이 사람이 잘 달릴 수 있으려면 나가는 거 자체로 성공해야 되거든.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<ul><li>목표를 먼저 말하면 상대는 목표에 사로잡혀 오히려 못 한다.<\/li><li>나가기만 하면 이기는 게임을 만들어 준다. 실패할 수 없으니 계속 나간다.<\/li><li>그러려면 가르치는 사람의 에고를 버려야 한다. 말보다 &#x27;해볼 수 있겠다&#x27;는 느낌을 주는 사람이 되는 게 먼저다.<\/li><\/ul>\n\n"}, {"id": "n26-p5-4", "badge": "4", "title": "비판이 도움이 될지 먼저 묻고, 말은 건조하게 기한만", "html": "\n<div class=\"dgslot\" data-c=\"n35\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;내가 그거를 비판해서 도움이 될까? 그걸 생각을 해야 돼. 도움이 안 되면 굳이 내가 그걸 왜 해.&quot;<\/p>\n<p class=\"qt\">&quot;그 답답함은 내 거야. 내 거를 왜 사람한테 전이시키냐고.&quot;<\/p>\n<p class=\"qt\">&quot;말로는 소용이 없어. 그냥 건조하게, 예를 들면 내일부터 참가하세요. 다음 주까지 참가하세요. 한 달 해 보면 알 겁니다. 이렇게 얘기해.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<ul><li>답답함은 내 감정이다. 상대에게 넘길 이유가 없다.<\/li><li>설명하고 설득하는 대신 감정 없이 기한만 준다.<\/li><li>상대가 직접 해 보고 느끼게 한다.<\/li><\/ul>\n\n"}, {"id": "n26-p5-5", "badge": "5", "title": "가장 적극적인 공격은 기다림", "html": "\n<div class=\"dgslot\" data-c=\"n36\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;그 사람이 지금 원래 그런 사람이 아니라 그런 시절을 겪고 있다고 생각해 보면.&quot;<\/p>\n<p class=\"qt\">&quot;제일 적극적인 공격은 기다림이야.&quot;<\/p>\n<p class=\"qt\">&quot;신체적으로는 비개입을 하면서 정신적으로는 혼자서 개입을 하고 있어요.&quot;<\/p>\n<p class=\"qt\">&quot;아무 말도 안 하고 기다려야 돼요.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<p>못 따라오는 사람을 &#x27;그런 사람&#x27;이 아니라 &#x27;그런 시절을 지나는 사람&#x27;으로 읽는다. 겉으로는 말하지 않고, 속으로는 계속 지켜본다.<\/p>\n\n"}, {"id": "n26-p5-6", "badge": "6", "title": "상대의 틀로 말한다 — \"현실이 게임이라고 말해 줘라\"", "html": "\n<div class=\"dgslot\" data-c=\"n37\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;코칭을 할 때, 내가 집요하게 그거부터 물어보거든. 과장은 몇 살이고 어떤 사람이냐, 사장은 뭐고 조직이 어떻고.&quot;<\/p>\n<p class=\"qt\">&quot;이 사람한테 현실은 게임이 아니라고 말하면 안 돼. 이 사람은 사회성은 없는데 디지털 사회성은 있기 때문에. 현실이 게임이라는 것을 말해 주는 게 더 빨라.&quot;<\/p>\n<p class=\"qt\">&quot;잘 되면 나중에 현실 가서 돌아오면 돼요. 알아서 돌아와.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<p>먼저 그 사람이 사는 구도를 집요하게 묻는다. 그리고 내 말이 아니라 그 사람의 말(게임)로 설명한다.<\/p>\n\n"}, {"id": "n26-p5-7", "badge": "7", "title": "자랑을 많이 하는 쪽을 읽는다 — \"강남 사는 사람이 강남 좋다고 얘기 안 하잖아\"", "html": "\n<div class=\"dgslot\" data-c=\"n38\"><\/div>\n<h4 class=\"lb\">대장님의 말<\/h4>\n<div class=\"talk\"><p class=\"qt\">&quot;테슬라를 사서 좋아하는 사람들은 좋아야만 돼서 좋아하는 것도 약간 있는 거 같아.&quot;<\/p>\n<p class=\"qt\">&quot;막 다 샀는데 안 좋아할 수 없잖아. 장점을 자꾸 발견해야 되니까. 강남 사는 사람이 강남 좋다고 얘기 안 하잖아.&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<p>자기 선택을 스스로 정당화해야 하는 사람일수록 말이 많아진다. 누가 무엇을 자주 자랑하는지 들으면 그 사람이 어디서 인정이 부족한지 보인다. 11월 3일의 &#x27;상대 읽기&#x27;와 같은 줄기다.<\/p>\n\n"}, {"id": "n26-p5-8", "badge": "8", "title": "말 꺼낸 사람이 민망해지면 안 된다", "html": "\n<div class=\"dgslot\" data-c=\"n39\"><\/div>\n<h4 class=\"lb\">실제 대화<\/h4>\n<div class=\"talk\"><p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;하우스 오브 카드라는 드라마 있잖아요.&quot;<\/p>\n<p class=\"spk\">민브로님<\/p>\n<p class=\"qt\">&quot;보겠습니다. 죄송합니다.&quot;<\/p>\n<p class=\"spk\">대장님<\/p>\n<p class=\"qt\">&quot;말 꺼낸 사람이 민망해지는 일이 생기면 안 되지 않을까?&quot;<\/p>\n<\/div><h4 class=\"lb\">정리<\/h4>\n<p>아무도 모르는 예시를 꺼내 분위기가 어색해지자, 그 민망함을 직접 말로 꺼내 웃음으로 식혔다. 동시에 원칙이기도 하다. 누가 예시를 꺼내면 머쓱하지 않게 받아 준다.<\/p>\n\n"}]}, {"key": "q6", "group": "study2", "no": "6", "title": "이번에 새로 보인 기술", "meta": "정리", "lead": "\n<p>11월 3일의 기술 지도(①~⑪, A~D)에 없던 것들이다.<\/p>\n<div class='tbl'><table><thead><tr><th>이름<\/th><th>어떻게<\/th><th>장면<\/th><\/tr><\/thead><tbody><tr><td>띄워 놓고 떨어뜨리기<\/td><td>한껏 기대를 올린 뒤 결과가 나오면 한마디로 내린다<\/td><td>장면 1<\/td><\/tr><tr><td>물건에 대사 붙이기<\/td><td>메뉴·물건이 사람처럼 말한다고 정한다 (&quot;먹태는 우리 헤어집시다&quot;)<\/td><td>장면 2·5<\/td><\/tr><tr><td>거창하게 말하기<\/td><td>사소한 일을 전략·전쟁 용어로 말한다<\/td><td>장면 20<\/td><\/tr><tr><td>실수 칭찬<\/td><td>&quot;브랜드가 실수했다&quot;로 물건과 고른 사람을 함께 칭찬한다<\/td><td>장면 21<\/td><\/tr><tr><td>갖다 붙이기 칭찬<\/td><td>정답 없는 질문에서는 뭘 고르든 칭찬하고 의미를 붙인다<\/td><td>장면 22<\/td><\/tr><tr><td>과거의 나를 남처럼 놀리기<\/td><td>옛날의 나를 &#x27;저 X&#x27;이라고 3인칭으로 놀린다<\/td><td>장면 23 앞부분<\/td><\/tr><tr><td>질문 바꾸기<\/td><td>&#x27;아무거나&#x27;가 나오면 &#x27;세 개만&#x27;으로 답하기 쉬운 질문으로 바꾼다<\/td><td>장면 27<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>④ 되물어 공 넘기기<\/b>는 11월 3일에 장면을 찾지 못했던 기술인데, 이번에 귀갓길(장면 26)에서 나왔다.<\/p>\n\n", "segs": []}, {"key": "q7", "group": "study2", "no": "7", "title": "정리 — 두 번의 만남을 겹쳐 보면", "meta": "정리", "lead": "\n<p>11월 3일에 배운 것은 <b>한마디를 던지는 기술<\/b>이었다.<\/p>\n<p>11월 26일에 배운 것은 <b>한 소재를 여럿이 굴리는 기술<\/b>과, <b>그 판에서 지지 않는 태도<\/b>다.<\/p>\n<p>먹태 논쟁에서 대장님과 민브로님은 같은 소재를 국화꽃으로, 이별로, 교통사고로, 도덕 문제로 계속 바꿔 가며 놀았다. 나는 그 안에서 먹태를 고른 내가 옳다는 것을 증명하려 했다.<\/p>\n<p>대장님의 복기는 세 문장으로 줄일 수 있다.<\/p>\n<ul><li>몰려서 짜증이 보이면 이미 진 것이다.<\/li><li>지금 싸우는 돌 말고, 바둑판 다른 곳에 돌을 둬라.<\/li><li>이기고 싶으면 그 자리 연장자를 편으로 만들어라.<\/li><\/ul>\n<p>그리고 그 모든 것의 바탕은, 술자리 안에 있지만 밖에서 나를 보는 여유다.<\/p>\n<h4 class=\"lb\">다음 만남에서 해 볼 것<\/h4>\n<ol><li>누가 소재를 하나 던지면, 반박하지 말고 그 소재에 대사를 하나 붙여 본다.<\/li><li>내가 놀림의 중심이 되면, 증명하지 말고 그 설정 안으로 한 걸음 더 들어간다(&quot;먹태가 아니길&quot;처럼).<\/li><li>술이 들어갈수록 내 말의 속도를 의식적으로 늦춘다.<\/li><\/ol>", "segs": []}], "nclips": 39, "tak": "https://okhyun304-dot.github.io/tak-jaehoon-wit/", "ns": "wit26", "name": "대장님 대화술 · 11월 26일", "home": {"hero": "<div class=\"hero\"><div class=\"kicker\">탁재훈 방송 × 대장님 현실 × 나<\/div><h1>대장님 대화술 · 11월 26일<\/h1><p>메이플자이 산책부터 신사동 감자탕집, 통닭집, 먹태 논쟁까지. 방송 장면, 11월 26일 실제 녹음(39곳), 내 칸이 한 장에 있습니다. 받아쓰기 문장을 누르면 그 부분부터 들립니다.<\/p><\/div>", "groups": [["study2", "11월 26일 만남 · 7부", "먹태 논쟁, 대장님의 복기, 하루 종일 흩어진 장면 27개"], ["tech", "기술별로 나란히", "탁재훈론의 11가지 기술을 방송과 11월 26일 녹음으로 함께 봅니다"], ["own", "여러 사람 자리에서만 보이는 기술", "방송 편집에서는 잘 안 보이는 대장님의 운영 기술"]]}};

  const nx = ci+1 < W.parts.length && W.parts[ci+1].group !== 'intro' ? ci+1 : -1;
  const pv = ci-1 >= 0 && W.parts[ci-1].group !== 'intro' ? ci-1 : -1;
  const prev = pv >= 0 ? `<button data-go="${pv}">‹ ${esc(LB(pv))}</button>` : `<button data-go="home">‹ 목차</button>`;
  const next = nx >= 0 ? `<button class="nx" data-go="${nx}">다음 · ${esc(LB(nx))} ${esc(W.parts[nx].title)} ›</button>` : `<button class="nx" data-go="home">목차로 ›</button>`;
  const tc = p.group === "tech" ? " tech" : "";
  return `<div class="page${tc}">${h}</div><div class="endnav${tc}">${prev}${next}</div>`;
}
function go(ci, opt){
  opt = opt || {};
  document.querySelectorAll('audio').forEach(a=>a.pause());
  CI = ci;
  $('#home').style.display = 'none'; $('#deck').style.display = 'flex';
  const st = $('#stage'); st.innerHTML = pageHTML(ci); dgMount();
  $('#ttl').textContent = (LB(ci)?LB(ci)+' ':'') + W.parts[ci].title;
  const g = W.parts[ci].group;
  $('#chnav').className = 'chnav nv' + NAV;
  let lastG = '';
  $('#chnav').innerHTML = g === 'intro' ? '' : W.parts.map((p,i)=> {
    if (p.group==='intro' || !sameSet(p.group, g)) return '';
    const gl = (lastG && lastG !== p.group) ? `<span class="gl">대장님 기술</span>` : ''; lastG = p.group;
    const nm = ST(p.group) ? p.title.split(' — ')[0].replace(/^한 번 만든 농담을 다시 사용하는 기술$/, '콜백') : p.title;
    return gl + `<button data-go="${i}" class="${i===ci?'on':''}" title="${esc(p.title)}"><span class="n">${esc(LB(i))}</span><span class="nm">${esc(nm)}</span></button>`;
  }).join('');
  const on = $('#chnav .on'); if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
  mountMe();
  let top = 0;
  if (opt.keep){ const s = store.get(NS + '.sc'); if (s && s.split('/')[0]===W.parts[ci].key) top = +s.split('/')[1] || 0; }
  st.scrollTop = top;
  if (opt.to){ const el = document.getElementById(opt.to); if (el) el.scrollIntoView({block:'start'}); }
  store.set(NS + '.key', W.parts[ci].key);
  const hh = '#' + encodeURIComponent(opt.to || W.parts[ci].key);   // 사용자가 누른 이동은 기록에 쌓아서 휴대폰 '뒤로'가 앞 화면으로 가게
  try{ if (opt.nav && location.hash !== hh) history.pushState(null, '', hh); else history.replaceState(null, '', hh); }catch(e){}
  lastH = location.hash;
  document.title = W.parts[ci].title + ' · ' + NAME;
  upd();
}
function toHome(opt){
  opt = opt || {};
  document.querySelectorAll('audio').forEach(a=>a.pause());
  $('#deck').style.display = 'none'; $('#home').style.display = 'block'; renderHome();
  try{ if (opt.nav && location.hash) history.pushState(null, '', location.pathname + location.search); else history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  lastH = location.hash;
  document.title = NAME;
}
function upd(){ const st = $('#stage'), m = st.scrollHeight - st.clientHeight; $('#pg').style.width = (m>0 ? Math.min(100, st.scrollTop/m*100) : 0) + '%'; }
let scT = 0;
$('#stage').addEventListener('scroll', () => { upd(); clearTimeout(scT); scT = setTimeout(() => store.set(NS + '.sc', W.parts[CI].key + '/' + Math.round($('#stage').scrollTop)), 300); }, {passive:true});
function openSheet(){
  const p = W.parts[CI];
  $('#sbox').innerHTML = `<h3>${LB(CI)?esc(LB(CI))+' ':''}${esc(p.title)}</h3>` + p.segs.map(s=>`<button data-to="${s.id}"><span class="k">${esc(s.badge||'')}</span><span class="tt">${esc(s.title||s.badge)}</span></button>`).join('');
  $('#sheet').classList.add('on');
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ const v = g.dataset.go; if (v==='home') toHome({nav: true}); else go(+v, {keep: !!g.dataset.keep, nav: true}); return; }
  const s = e.target.closest('#sbox button[data-to]');
  if (s){ $('#sheet').classList.remove('on'); const el = document.getElementById(s.dataset.to); if (el) el.scrollIntoView({block:'start'}); return; }
  if (e.target.id === 'sheet') $('#sheet').classList.remove('on');
});
$('#back').onclick = () => toHome({nav: true});
$('#lst').onclick = openSheet;
const SIZES = [16, 18, 20];
let si = Math.max(0, SIZES.indexOf(+store.get(NS + '.fs') || 16));
function applySize(){ document.documentElement.style.setProperty('--fs', SIZES[si] + 'px'); }
$('#fs').onclick = () => { si = (si+1) % SIZES.length; store.set(NS + '.fs', SIZES[si]); applySize(); upd(); };
applySize();
/* 정답 보기 · 상대의 말까지 듣기 */
let preA = null;
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv){ const a = rv.nextElementSibling; if (a){ a.hidden = false; dgMount(); } rv.hidden = true; if (preA) preA.pause(); return; }
  const pb = e.target.closest('.pre-play');
  if (!pb) return;
  const box = pb.closest('.pre'), stop = +box.dataset.stop, msg = box.querySelector('.pre-msg');
  document.querySelectorAll('audio').forEach(a => a.pause());
  if (preA && preA._box === box && !preA.paused){ preA.pause(); return; }
  if (preA) preA.pause();
  preA = new Audio(META[box.dataset.c].src); preA._box = box; msg.hidden = true;
  preA.addEventListener('timeupdate', () => { const t = preA.currentTime; box.querySelector('.pre-t').textContent = mmss(t) + ' / ' + mmss(stop); if (t >= stop){ preA.pause(); msg.hidden = false; } });
  preA.addEventListener('pause', () => { pb.textContent = '▶ 상대의 말까지 듣기'; });
  preA.addEventListener('play', () => { pb.textContent = '❚❚ 멈춤'; });
  preA.play();
});
/* data-stop 영상: 상대의 말이 끝난 곳에서 한 번 멈춤 */
document.addEventListener('timeupdate', e => {
  const v = e.target;
  if (!(v instanceof HTMLVideoElement) || !v.dataset.stop || v.dataset.done) return;
  const st = +v.dataset.stop;
  if (v.currentTime >= st && v.currentTime < st + 2){ v.pause(); v.dataset.done = '1'; const m = v.nextElementSibling; if (m && m.classList.contains('stopmsg')) m.hidden = false; }
}, true);
/* 「나」 칸: 이 기기에만 저장 (예전 기술 사전과 같은 키) */
const MK = NS + '.me.';
function mountMe(){
  document.querySelectorAll('.me textarea').forEach(t=>{ t.value = store.get(MK + t.dataset.k) || ''; t.addEventListener('input', ()=> store.set(MK + t.dataset.k, t.value)); });
}
document.addEventListener('click', e => {
  if (e.target.id !== 'copyme') return;
  const out = [];
  W.parts.forEach(p => (p.me || []).forEach(([k, lab]) => { const v = (store.get(MK + k) || '').trim(); if (v) out.push(`[${p.no} ${p.title}] ${lab}: ${v}`); }));
  const msg = $('#copymsg');
  if (!out.length){ msg.textContent = '아직 적은 내용이 없습니다.'; return; }
  const txt = out.join('\n');
  const fb = () => { msg.textContent = '복사가 막혀 있습니다. 아래 글을 직접 복사하세요.'; const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'width:100%;height:160px;margin-top:8px'; msg.after(ta); ta.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=> msg.textContent = '복사했습니다. 메모나 대화창에 붙여 넣으세요.', fb); }catch(x){ fb(); }
});
let lastH = null;
function route(){
  if (location.hash === lastH && lastH !== null) return;
  lastH = location.hash;
  const h = decodeURIComponent(location.hash.slice(1));
  let m = h.match(/^p(\d+)$/);          // 예전 주소 #p3 = 전체 분석 3부
  if (m){ const i = idxOf('p' + m[1]); if (i >= 0) return go(i, {keep: true}); }
  const ki = h ? idxOf(h) : -1;
  if (ki >= 0) return go(ki, {keep: true});
  m = h.match(/^sk(.)$|^own(.)$/);       // 예전 기술 사전 주소
  if (m){ const i = idxOf('t' + (m[1] || m[2])); if (i >= 0) return go(i, {}); }
  if (h){ const i = W.parts.findIndex(p => p.segs.some(s => s.id === h)); if (i >= 0) return go(i, {to: h}); }
  toHome();
}
route();
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
</script>
</body>
